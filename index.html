utuellement orthogonaux peut-on définir au plus ?", "feedback_general_html": "<p>Avec k groupes, on peut définir au plus k − 1 contrastes mutuellement orthogonaux : ensemble, ils découpent exactement la variation inter-groupe. CM04, section Contrastes, « Contrastes orthogonaux ».<\/p>", "options": [{"texte_html": "5", "score": -20.0, "feedback_html": "<p>Avec k groupes, on en définit au plus k − 1.<\/p>"}, {"texte_html": "4", "score": 100.0, "feedback_html": "<p>Exact. k − 1 = 4.<\/p>"}, {"texte_html": "10", "score": -30.0, "feedback_html": "<p>10 est le nombre de paires de groupes.<\/p>"}, {"texte_html": "Autant que l'on veut.", "score": -50.0, "feedback_html": "<p>Des contrastes mutuellement orthogonaux découpent la variation inter-groupe : leur nombre est limité.<\/p>"}]}, {"id": "C-CM4-010", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec des sommes des carrés de type I, de quoi dépend le résultat obtenu pour chaque facteur ?<\/p>", "question_texte": "Avec des sommes des carrés de type I, de quoi dépend le résultat obtenu pour chaque facteur ?", "feedback_general_html": "<p>Le type I attribue au premier facteur toute la variation possible, puis au suivant ce qui reste : l'ordre est essentiel. CM04, section Compléments, « Sommes des carrés ».<\/p>", "options": [{"texte_html": "Du nombre de contrastes demandés.", "score": -30.0, "feedback_html": "<p>Les contrastes n'interviennent pas dans le calcul des sommes des carrés des effets.<\/p>"}, {"texte_html": "De la correction de sphéricité choisie.", "score": -50.0, "feedback_html": "<p>La correction de sphéricité modifie les degrés de liberté, pas les sommes des carrés.<\/p>"}, {"texte_html": "De rien : les trois types de sommes des carrés donnent toujours le même résultat.", "score": -20.0, "feedback_html": "<p>Ils ne donnent le même résultat que pour une ANOVA simple ou un plan équilibré.<\/p>"}, {"texte_html": "De l'ordre dans lequel les facteurs sont entrés dans le modèle.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM5-003", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une ANOVA pour plan croisé (consigne × âge) donne, pour l'effet de la consigne, η² = 0,08 et η²p = 0,11. Comment interpréter η²p ?<\/p>", "question_texte": "Une ANOVA pour plan croisé (consigne × âge) donne, pour l'effet de la consigne, η² = 0,08 et η²p = 0,11. Comment interpréter η²p ?", "feedback_general_html": "<p>η²p rapporte la variation due à l'effet à cette variation plus l'erreur, en retirant les autres effets du dénominateur. η² rapporte l'effet à la variation totale. CM05, section Classique.<\/p>", "options": [{"texte_html": "La consigne explique 11 % de la variance totale de la VD.", "score": -20.0, "feedback_html": "<p>La part de la variance totale, c'est η², soit 8 % ici.<\/p>"}, {"texte_html": "η²p est une estimation non biaisée de la taille d'effet dans la population.", "score": -30.0, "feedback_html": "<p>η²p est biaisé et surestime la taille d'effet ; c'est ω² qui corrige en partie ce biais.<\/p>"}, {"texte_html": "η²p est toujours inférieur à η².", "score": -50.0, "feedback_html": "<p>η²p est supérieur ou égal à η², comme ici (0,11 contre 0,08).<\/p>"}, {"texte_html": "Si l'âge et l'interaction n'avaient aucun effet, la consigne expliquerait environ 11 % des variations de la VD.", "score": 100.0, "feedback_html": "<p>Exact. η²p retire du dénominateur la variation due aux autres effets.<\/p>"}]}, {"id": "C-CM5-004", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Pourquoi le cours recommande-t-il ω² plutôt que η², surtout avec de petits échantillons ?<\/p>", "question_texte": "Pourquoi le cours recommande-t-il ω² plutôt que η², surtout avec de petits échantillons ?", "feedback_general_html": "<p>η² est un estimateur biaisé, d'autant plus que l'échantillon est petit ; ω² réduit ce biais. CM05, section Rigoureux.<\/p>", "options": [{"texte_html": "Parce que η² tend à surestimer la taille d'effet dans la population, et que ω² corrige en partie ce biais.", "score": 100.0, "feedback_html": "<p>Exact. Le biais de η² est d'autant plus fort que l'échantillon est petit.<\/p>"}, {"texte_html": "Parce que ω² est toujours supérieur à η².", "score": -20.0, "feedback_html": "<p>C'est l'inverse : en corrigeant le biais, ω² vaut en général un peu moins que η².<\/p>"}, {"texte_html": "Parce que ω² permet de comparer des tailles d'effet entre plans inter-sujets et intra-sujets.", "score": -30.0, "feedback_html": "<p>La comparaison entre plans relève de η²G.<\/p>"}, {"texte_html": "Parce que ω² ne dépend pas de la taille de l'échantillon et remplace ainsi la valeur p.", "score": -50.0, "feedback_html": "<p>Une taille d'effet ne remplace pas un test : elles répondent à des questions différentes.<\/p>"}]}, {"id": "S-009", "type": "serie", "categorie": "interpretation", "cm": [1, 5], "etude": {"titre": "Comprendre grâce au contexte (ANOVA simple)"}, "etude_html": "<h4>Comprendre grâce au contexte (ANOVA simple)<\/h4><p>Bransford et Johnson (1972) faisaient écouter un texte volontairement obscur, qui décrit une lessive sans jamais la nommer. Selon le groupe, le thème du texte était donné avant l'écoute, après l'écoute, ou jamais. Les participants rappelaient ensuite le plus d'idées possible.<\/p><p>Les résultats ci-dessous portent sur des données simulées : 54 participants répartis en trois groupes de 18 (<em>Sans<\/em>, <em>Après<\/em>, <em>Avant<\/em>). La VD <em>Rappel<\/em> est le nombre d'idées rappelées.<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Bransford, J. D., &amp; Johnson, M. K. (1972). Contextual prerequisites for understanding: Some investigations of comprehension and recall. <em>Journal of Verbal Learning and Verbal Behavior, 11<\/em>(6), 717–726. https://doi.org/10.1016/S0022-5371(72)80006-9<\/p><p style=\"margin-bottom:2px\"><strong>One-Way ANOVA · ANOVA - Rappel<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Contexte<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">97.815<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">48.907<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">16.67<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.395<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Residuals<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">149.611<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">51<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2.934<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Homogeneity of Variances Test (Levene&#x27;s)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df1<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df2<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Rappel<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.284<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">51<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.754<\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Normality Test (Shapiro-Wilk)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Statistic<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Rappel<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.973<\/td><td ns<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Avant<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−2.500<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.571<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">51<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−4.379<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Après<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Avant<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−3.111<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.571<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">51<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−5.449<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><\/table><\/div>", "questions": [{"id": "S-009-q1", "difficulte": 1, "question_html": "<p>Que conclure du test de Levene ?<\/p>", "question_texte": "Que conclure du test de Levene ?", "feedback_general_html": "<p>p = .754 &gt; .05 : on ne rejette pas l'égalité des variances. CM01, section Conditions.<\/p>", "options": [{"texte_html": "Les variances sont hétérogènes : il faut appliquer la correction de Welch.", "score": -20.0, "feedback_html": "<p>p = .754 &gt; .05 : l'égalité des variances n'est pas rejetée.<\/p>"}, {"texte_html": "Le test ne remet pas en cause l'homogénéité des variances : la correction de Welch n'est pas nécessaire.", "score": 100.0, "feedback_html": "<p>Exact. p = .754 &gt; .05.<\/p>"}, {"texte_html": "Les résidus ne suivent pas une loi normale.", "score": -30.0, "feedback_html": "<p>La normalité se lit dans le test de Shapiro-Wilk, pas dans celui de Levene.<\/p>"}, {"texte_html": "Le moment où le thème est donné a un effet significatif sur le rappel.", "score": -50.0, "feedback_html": "<p>Le test de Levene ne teste pas l'effet du facteur, mais l'égalité des variances.<\/p>"}]}, {"id": "S-009-q2", "difficulte": 1, "question_html": "<p>Quelle conclusion tirer du tableau ANOVA ?<\/p>", "question_texte": "Quelle conclusion tirer du tableau ANOVA ?", "feedback_general_html": "<p>F(2, 51) = 16.67, p &lt; .001 : on rejette H0. Le F ne dit pas quels groupes diffèrent. CM01, section Philosophie.<\/p>", "options": [{"texte_html": "Les trois groupes ont des moyennes de rappel identiques.", "score": -50.0, "feedback_html": "<p>p &lt; .001 : on rejette justement l'égalité des moyennes.<\/p>"}, {"texte_html": "Le contexte n'a pas d'effet, puisque η² est inférieur à 0,5.", "score": -30.0, "feedback_html": "<p>La significativité se lit sur p, pas sur la valeur de η².<\/p>"}, {"texte_html": "Les moyennes de rappel ne sont pas toutes égales : le contexte a un effet significatif.", "score": 100.0, "feedback_html": "<p>Exact. F(2, 51) = 16.67, p &lt; .001.<\/p>"}, {"texte_html": "Les trois groupes diffèrent tous deux à deux.", "score": -20.0, "feedback_html": "<p>Le F ne dit pas quels groupes diffèrent : il faut regarder les comparaisons post-hoc.<\/p>"}]}, {"id": "S-009-q3", "difficulte": 2, "question_html": "<p>Comment interpréter η² = 0.395 ?<\/p><p><em>Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Comment interpréter η² = 0.395 ?\n\n*Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>η² est la part de variance expliquée par le facteur. Avec les repères de Cohen (0,01 ; 0,06 ; 0,14), 0,395 est un grand effet. CM01, section Compléments ; CM05.<\/p>", "options": [{"texte_html": "Le contexte explique environ 40 % des variations du rappel, ce qui est un effet grand selon les repères de Cohen.", "score": 100.0, "feedback_html": "<p>Exact. η² est la part de variance expliquée par le facteur, et 0,395 dépasse largement 0,14.<\/p>"}, {"texte_html": "39,5 % des participants ont été influencés par le contexte.", "score": -30.0, "feedback_html": "<p>η² porte sur une part de variance, pas sur une proportion de participants.<\/p>"}, {"texte_html": "La probabilité que l'hypothèse nulle soit vraie est de 39,5 %.", "score": -50.0, "feedback_html": "<p>η² n'est pas une probabilité ; et la valeur p elle-même n'est pas la probabilité de H0.<\/p>"}, {"texte_html": "L'effet est moyen, puisque η² est inférieur à 0,5.", "score": -20.0, "feedback_html": "<p>Le repère d'un grand effet est 0,14, pas 0,5.<\/p>"}]}, {"id": "S-009-q4", "difficulte": 2, "question_html": "<p>Que montrent les comparaisons post-hoc ?<\/p>", "question_texte": "Que montrent les comparaisons post-hoc ?", "feedback_general_html": "<p>Les comparaisons avec <em>Avant<\/em> sont significatives et négatives : <em>Avant<\/em> a la moyenne la plus élevée. <em>Sans<\/em> et <em>Après<\/em> ne diffèrent pas (p = .537). CM01, section Compléments.<\/p>", "options": [{"texte_html": "Les trois groupes diffèrent tous deux à deux.", "score": -30.0, "feedback_html": "<p><em>Sans<\/em> et <em>Après<\/em> ne diffèrent pas : p = .537.<\/p>"}, {"texte_html": "Seul le groupe <em>Sans<\/em> diffère des deux autres.", "score": -50.0, "feedback_html": "<p><em>Sans<\/em> ne diffère pas d'<em>Après<\/em> (p = .537) ; c'est <em>Avant<\/em> qui se distingue.<\/p>"}, {"texte_html": "Aucune différence n'est significative après correction.", "score": -20.0, "feedback_html": "<p>Les deux comparaisons avec <em>Avant<\/em> restent significatives (p &lt; .001).<\/p>"}, {"texte_html": "Le groupe <em>Avant<\/em> rappelle plus d'idées que les deux autres, qui ne diffèrent pas significativement entre eux.", "score": 100.0, "feedback_html": "<p>Exact. Différences négatives avec <em>Avant<\/em> (−2.500 et −3.111), p &lt; .001 ; <em>Sans<\/em> – <em>Après<\/em> : p = .537.<\/p>"}]}]}, {"id": "S-010", "type": "serie", "categorie": "interpretation", "cm": [2, 4, 5], "etude": {"titre": "Chercher dans la mémoire (mesures répétées)"}, "etude_html": "<h4>Chercher dans la mémoire (mesures répétées)<\/h4><p>Sternberg (1966) présentait une courte liste de chiffres à mémoriser (de 1 à 6 éléments), puis un chiffre test. Les participants indiquaient le plus vite possible si ce chiffre figurait dans la liste. Le temps de réponse augmentait avec la taille de la liste.<\/p><p>Les résultats ci-dessous portent sur des données simulées : 14 participants passent quatre tailles de liste (1, 2, 4 et 6 éléments). Le facteur intra-sujet s'appelle <em>Taille<\/em> ; la VD est le temps de réponse moyen, en millisecondes.<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Sternberg, S. (1966). High-speed scanning in human memory. <em>Science, 153<\/em>(3736), 652–654. https://doi.org/10.1126/science.153.3736.652<\/p><p style=\"margin-bottom:2px\"><strong>Repeated Measures ANOVA · Within Subjects Effects<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Sphericity Correction<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:
