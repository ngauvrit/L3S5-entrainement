px 7px;white-space:nowrap;text-align:right\">127.068<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3.344<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> Type 3 Sums of Squares<\/p><p style=\"margin-bottom:2px\"><strong>Between Subjects Effects<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²G<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Groupe<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">37.675<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">37.675<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">7.44<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.010<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.105<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Residual<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">192.400<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.063<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> Type 3 Sums of Squares<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Assumptions<\/p><p style=\"margin-bottom:2px\"><strong>Homogeneity of Variances Test (Levene&#x27;s)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df1<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df2<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.908<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.347<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.975<\/td><\/tr><\/table><\/div><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Post Hoc Tests<\/p><p style=\"margin-bottom:2px\"><strong>Post Hoc Comparisons - Tâche ✻ Groupe<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Tâche<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Groupe<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Tâche<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Groupe<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Difference<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">SE<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">t<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p holm<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Téléphone<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Téléphone<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−4.52<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.51<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">19<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−8.83<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Téléphone<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Radio<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−0.41<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.57<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−0.72<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.476<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Téléphone<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Radio<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−1.36<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.65<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−2.10<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.127<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Téléphone<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Radio<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.10<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.65<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.32<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Téléphone<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Radio<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3.15<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.72<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">38<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.39<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Simple<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Radio<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Double<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Radio<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−0.95<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.64<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">19<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−1.49<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.306<\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Feux rouges manqués selon la tâche et le groupe (moyennes et IC à 95 %)<\/strong><\/p><p><img src=\"images/ent_strayer_interaction.png\" alt=\"Feux rouges manqués selon la tâche et le groupe (moyennes et IC à 95 %)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-019-q1", "difficulte": 1, "question_html": "<p>De quel type de plan s'agit-il ?<\/p>", "question_texte": "De quel type de plan s'agit-il ?", "feedback_general_html": "<p>Chaque participant appartient à un seul groupe, mais passe les deux tâches : le plan combine un facteur inter-sujets et un facteur intra-sujet. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Un plan croisé, avec deux facteurs inter-sujets.", "score": -20.0, "feedback_html": "<p>Chaque participant passe les deux tâches : <em>Tâche<\/em> est intra-sujet.<\/p>"}, {"texte_html": "Un plan à mesures répétées, avec deux facteurs intra-sujets.", "score": -30.0, "feedback_html": "<p>Chaque participant n'appartient qu'à un groupe : <em>Groupe<\/em> est inter-sujets.<\/p>"}, {"texte_html": "Un plan simple, à quatre groupes.", "score": -50.0, "feedback_html": "<p>Il y a deux facteurs, dont l'un intra-sujet.<\/p>"}, {"texte_html": "Un plan mixte : <em>Groupe<\/em> est inter-sujets, <em>Tâche<\/em> est intra-sujet.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "S-019-q2", "difficulte": 1, "question_html": "<p>Que montre le tableau du test de Levene ?<\/p>", "question_texte": "Que montre le tableau du test de Levene ?", "feedback_general_html": "<p>Dans un plan mixte, l'homogénéité des variances porte sur le facteur inter-sujets ; Jamovi la teste pour chaque tâche (p = .347 et p = .975). CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "La sphéricité est respectée.", "score": -30.0, "feedback_html": "<p>La sphéricité relève du test de Mauchly ; ici, elle ne se pose d'ailleurs pas, avec deux tâches.<\/p>"}, {"texte_html": "Les variances diffèrent entre la tâche simple et la tâche double.", "score": -20.0, "feedback_html": "<p>Le test compare les deux groupes pour chaque tâche, pas les tâches entre elles.<\/p>"}, {"texte_html": "Pour chacune des deux tâches, les variances des deux groupes ne diffèrent pas significativement.", "score": 100.0, "feedback_html": "<p>Exact. p = .347 et p = .975.<\/p>"}, {"texte_html": "Le groupe a un effet significatif sur les feux manqués.", "score": -50.0, "feedback_html": "<p>Le test de Levene ne porte pas sur l'effet du groupe.<\/p>"}]}, {"id": "S-019-q3", "difficulte": 2, "question_html": "<p>Quel résultat indique que la double tâche perturbe davantage les conducteurs qui téléphonent que ceux qui écoutent la radio ?<\/p>", "question_texte": "Quel résultat indique que la double tâche perturbe davantage les conducteurs qui téléphonent que ceux qui écoutent la radio ?", "feedback_general_html": "<p>Un effet de la tâche qui diffère selon le groupe, c'est une interaction (p &lt; .001). CM03, sections Factoriel et Plans mixtes.<\/p>", "options": [{"texte_html": "L'interaction <em>Tâche ✻ Groupe<\/em>, significative.", "score": 100.0, "feedback_html": "<p>Exact. p &lt; .001.<\/p>"}, {"texte_html": "L'effet principal de la tâche, significatif.", "score": -20.0, "feedback_html": "<p>Il décrit l'effet moyen de la double tâche, tous groupes confondus.<\/p>"}, {"texte_html": "L'effet principal du groupe, significatif.", "score": -30.0, "feedback_html": "<p>Il moyenne les deux tâches ; il ne dit pas si l'effet de la tâche diffère selon le groupe.<\/p>"}, {"texte_html": "Le test de Levene, non significatif.", "score": -50.0, "feedback_html": "<p>Il porte sur une condition d'application.<\/p>"}]}, {"id": "S-019-q4", "difficulte": 2, "question_html": "<p>Comment qualifier la taille de l'effet d'interaction (η²G = 0.166) ?<\/p><p><em>Rappel : seuils de Bakeman (2005) pour η²G : 0,02 petit, 0,13 moyen, 0,26 grand.<\/em><\/p>", "question_texte": "Comment qualifier la taille de l'effet d'interaction (η²G = 0.166) ?\n\n*Rappel : seuils de Bakeman (2005) pour η²G : 0,02 petit, 0,13 moyen, 0,26 grand.*", "feedback_general_html": "<p>0.166 dépasse le seuil d'un effet moyen sans atteindre celui d'un grand effet. CM02, section Compléments, « La taille d'effet ».<\/p>", "options": [{"texte_html": "Petit.", "score": -20.0, "feedback_html": "<p>0.166 dépasse le seuil d'un effet moyen (0,13).<\/p>"}, {"texte_html": "Moyen : η²G se situe entre 0,13 et 0,26.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Grand, puisque p &lt; .001.", "score": -30.0, "feedback_html": "<p>La valeur p ne dit rien de la taille d'un effet.<\/p>"}, {"texte_html": "Nul, puisque η²G est inférieur à 0,26.", "score": -50.0, "feedback_html": "<p>Être sous le seuil d'un grand effet ne rend pas l'effet nul.<\/p>"}]}, {"id": "S-019-q5", "difficulte": 3, "question_html": "<p>L'effet principal du groupe est significatif (p = .010). Peut-on en conclure que les conducteurs qui téléphonent manquent plus de feux rouges que ceux qui écoutent la radio, quelle que soit la tâche ?<\/p>", "question_texte": "L'effet principal du groupe est significatif (p = .010). Peut-on en conclure que les conducteurs qui téléphonent manquent plus de feux rouges que ceux qui écoutent la radio, quelle que soit la tâche ?", "feedback_general_html": "<p>L'interaction étant significative, on interprète les effets simples avant l'effet principal. Les comparaisons post-hoc montrent que les groupes ne diffèrent qu'en tâche double. CM03, section Compléments, « Complément sur l'interaction ».<\/p>", "options": [{"texte_html": "Oui, car un effet principal porte sur toutes les situations.", "score": -30.0, "feedback_html": "<p>Un effet principal est une moyenne sur l'autre facteur ; il ne vaut pas pour chaque situation.<\/p>"}, {"texte_html": "Oui, car l'interaction est elle aussi significative.", "score": -50.0, "feedback_html": "<p>L'interaction signifie justement que l'effet du groupe n'est pas le même dans les deux tâches.<\/p>"}, {"texte_html": "Non, car η²G du groupe est trop faible pour être interprété.", "score": -20.0, "feedback_html": "<p>La réponse est non, mais pas pour cette raison : c'est l'interaction qui empêche de généraliser.<\/p>"}, {"texte_html": "Non : en tâche simple, la différence entre les deux groupes n'est pas significative (p corrigée = .476) ; l'effet principal fait la moyenne des deux tâches.", "score": 100.0, "feedback_html": "<p>Exact. Les groupes ne diffèrent qu'en tâche double (p corrigée &lt; .001).<\/p>"}]}, {"id": "S-019-q6", "difficulte": 2, "question_html": "<p>Dans le groupe <em>Radio<\/em>, la différence entre tâche simple et tâche double n'est pas significative (p corrigée = .306). Que peut-on en conclure ?<\/p>", "question_texte": "Dans le groupe *Radio*, la différence entre tâche simple et tâche double n'est pas significative (p corrigée = .306). Que peut-on en conclure ?", "feedback_general_html": "<p>Un résultat non significatif ne prouve pas l'absence d'effet : il peut venir d'un manque de puissance, ici avec 20 participants par groupe. CM01, section Conditions, « Interprétation » et « Rappel ».<\/p>", "options": [{"texte_html": "Écouter la radio n'a aucun effet sur la conduite.", "score": -20.0, "feedback_html": "<p>Un résultat non significatif ne prouve pas l'absence d'effet.<\/p>"}, {"texte_html": "Écouter la radio améliore la conduite.", "score": -50.0, "feedback_html": "<p>La moyenne augmente légèrement (de 3.19 % à 4.14 %), et non l'inverse.<\/p>"}, {"texte_html": "On ne peut pas conclure que l'écoute de la radio augmente les feux manqués, sans pouvoir affirmer pour autant que son effet est nul.", "score": 100.0, "feedback_html": "<p>Exact. Le résultat peut venir d'un manque de puissance.<\/p>"}, {"texte_html": "Ce résultat n'est pas valable, puisque les variances sont homogènes.", "score": -30.0, "feedback_html": "<p>Des variances homogènes sont au contraire une condition remplie.<\/p>"}]}, {"id": "S-019-q7", "difficulte": 2, "question_html": "<p>Dans la fenêtre <em>Repeated Measures ANOVA<\/em> de Jamovi, où demande-t-on le test de Levene ?<\/p>", "question_texte": "Dans la fenêtre *Repeated Measures ANOVA* de Jamovi, où demande-t-on le test de Levene ?", "feedback_general_html": "<p>La section <em>Assumption Checks<\/em> regroupe les vérifications des conditions : test de sphéricité, corrections et test d'égalité des variances. CM02, section Formalisation, « Jamovi ».<\/p>", "options": [{"texte_html": "Dans la section <em>Post Hoc Tests<\/em>.", "score": -30.0, "feedback_html": "<p><em>Post Hoc Tests<\/em> sert aux comparaisons des moyennes.<\/p>"}, {"texte_html": "Dans la section <em>Assumption Checks<\/em>, en cochant le test d'égalité des variances.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Dans la section <em>Estimated Marginal Means<\/em>.", "score": -20.0, "feedback_html": "<p><em>Estimated Marginal Means<\/em> sert à tracer le graphique des moyennes.<\/p>"}, {"texte_html": "Nulle part : ce test n'est pas disponible pour une ANOVA à mesures répétées.", "score": -50.0, "feedback_html": "<p>Il est disponible, et utile dès qu'il y a un facteur inter-sujets.<\/p>"}]}]}, {"id": "S-021", "type": "serie", "categorie": "interpretation", "cm": [1, 5], "etude": {"titre": "Imiter un modèle agressif (ANOVA simple)"}, "etude_html": "<h4>Imiter un modèle agressif (ANOVA simple)<\/h4><p>Bandura, Ross et Ross (1961) répartissaient 72 enfants d'école maternelle en trois conditions de 24. Dans la condition <em>Agressif<\/em>, l'enfant voyait un adulte frapper et insulter une grande poupée gonflable (la poupée « Bobo ») ; dans la condition <em>Non agressif<\/em>, l'adulte jouait calmement avec d'autres jouets ; dans la condition <em>Sans modèle<\/em>, l'enfant ne voyait aucun adulte. L'enfant était ensuite laissé seul dans une pièce avec des jouets, dont la poupée, et des observateurs comptaient ses comportements agressifs.<\/p><p>Les résultats ci-dessous portent sur des données simulées : 24 enfants par condition (facteur <em>Modèle<\/em>). La VD <em>Agression<\/em> est le nombre de comportements agressifs observés pendant 20 minutes. L'analyse a été faite avec Analyses → ANOVA → ANOVA, avec des comparaisons post-hoc de Tukey.<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Bandura, A., Ross, D., &amp; Ross, S. A. (1961). Transmission of aggression through imitation of aggressive models. <em>Journal of Abnormal and Social Psychology, 63<\/em>(3), 575–582. https://doi.org/10.1037/h0045925<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">ANOVA<\/p><p style=\"margin-bottom:2px\"><strong>ANOVA - Agression<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Modèle<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">660.111<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">330.056<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">12.94<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.273<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Residuals<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1759.875<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">69<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">25.505<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> Type 3 Sums of Squares<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Assumption Checks<\/p><p style=\"margin-bottom:2px\"><strong>Homogeneity of Variances Test (Levene&#x27;s)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df1<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df2<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">1.034<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">69<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.361<\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Normality Test (Shapiro-Wilk)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Statistic<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">0.970<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.080<\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> A low p-value suggests a violation of the assumption of normality<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Post Hoc Tests<\/p><p style=\"margin-bottom:2px\"><strong>Post Hoc Comparisons - Modèle<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Modèle<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Modèle<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Difference<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">SE<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">t<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p tukey<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Agressif<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Non agressif<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.250<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.458<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">69<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.287<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Agressif<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Sans modèle<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.583<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.458<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">69<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.516<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Non agressif<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">−<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Sans modèle<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.333<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.458<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">69<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.229<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.972<\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> Comparisons are based on estimated marginal means<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Estimated Marginal Means<\/p><p style=\"margin-bottom:2px\"><strong>Estimated Marginal Means - Modèle<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Modèle<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">SE<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Lower<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Upper<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Agressif<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">12.792<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.031<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">10.735<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">14.848<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Non agressif<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.542<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.031<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.485<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">8.598<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Sans modèle<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.208<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.031<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.152<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">8.265<\/td><\/tr><\/table><\/div>", "questions": [{"id": "S-021-q1", "difficulte": 1, "question_html": "<p>Que concluent les deux tests de la rubrique <em>Assumption Checks<\/em> ?<\/p>", "question_texte": "Que concluent les deux tests de la rubrique *Assumption Checks* ?", "feedback_general_html": "<p>Levene : p = .361 ; Shapiro-Wilk : p = .080. Les deux tests ne remettent pas en cause les conditions d'application. CM01, section Conditions.<\/p>", "options": [{"texte_html": "Ni l'homogénéité des variances (p = .361) ni la normalité (p = .080) ne sont remises en cause.", "score": 100.0, "feedback_html": "<p>Exact. Les deux p sont supérieures à .05.<\/p>"}, {"texte_html": "La normalité est rejetée, puisque p = .080 est proche de .05.", "score": -20.0, "feedback_html": "<p>p = .080 &gt; .05 : on ne rejette pas la normalité, même si la valeur est proche du seuil.<\/p>"}, {"texte_html": "Les variances sont hétérogènes : il faut lire une ligne de Welch.", "score": -30.0, "feedback_html": "<p>Le test de Levene donne p = .361 : l'homogénéité n'est pas rejetée.<\/p>"}, {"texte_html": "Le type de modèle a un effet significatif sur l'agression.", "score": -50.0, "feedback_html": "<p>Ces tests vérifient des conditions d'application ; l'effet se lit dans le tableau ANOVA.<\/p>"}]}, {"id": "S-021-q2", "difficulte": 1, "question_html": "<p>Que conclure du tableau <em>ANOVA - Agression<\/em> ?<\/p>", "question_texte": "Que conclure du tableau *ANOVA - Agression* ?", "feedback_general_html": "<p>F = 12.94, p &lt; .001 : on rejette l'égalité des moyennes. Un F significatif ne dit pas quels groupes diffèrent. CM01, section Philosophie.<\/p>", "options": [{"texte_html": "Chaque enfant ayant vu le modèle agressif est plus agressif que les autres.", "score": -30.0, "feedback_html": "<p>L'ANOVA porte sur des moyennes, pas sur chaque enfant.<\/p>"}, {"texte_html": "Les trois conditions donnent le même nombre moyen de comportements agressifs.", "score": -50.0, "feedback_html": "<p>p &lt; .001 : on rejette justement l'égalité des moyennes.<\/p>"}, {"texte_html": "Le nombre moyen de comportements agressifs n'est pas le même dans les trois conditions.", "score": 100.0, "feedback_html": "<p>Exact. F = 12.94, p &lt; .001.<\/p>"}, {"texte_html": "Les trois conditions diffèrent toutes deux à deux.", "score": -20.0, "feedback_html": "<p>Le F ne dit pas quelles conditions diffèrent : il faut les comparaisons post-hoc.<\/p>"}]}, {"id": "S-021-q3", "difficulte": 2, "question_html": "<p>Comment interpréter η² = 0.273 ?<\/p><p><em>Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Comment interpréter η² = 0.273 ?\n\n*Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>η² = SC effet / SC totale = 660.111 / (660.111 + 1759.875) ≈ 0.273 : un grand effet selon Cohen (1988). CM01, section Compléments ; CM05.<\/p>", "options": [{"texte_html": "Il y a 27,3 % de chances que l'effet soit dû au hasard.", "score": -50.0, "feedback_html": "<p>η² n'est pas une probabilité.<\/p>"}, {"texte_html": "L'effet est petit, puisque η² est inférieur à 0,5.", "score": -20.0, "feedback_html": "<p>Le repère d'un grand effet est 0,14, pas 0,5.<\/p>"}, {"texte_html": "27 % des enfants ont imité le modèle.", "score": -30.0, "feedback_html": "<p>η² est une part de variation, pas une proportion d'enfants.<\/p>"}, {"texte_html": "Le type de modèle explique environ 27 % des variations du nombre de comportements agressifs : c'est un grand effet.", "score": 100.0, "feedback_html": "<p>Exact. 0,273 dépasse le repère d'un grand effet (0,14).<\/p>"}]}, {"id": "S-021-q4", "difficulte": 2, "question_html": "<p>Que montrent les comparaisons post-hoc ?<\/p>", "question_texte": "Que montrent les comparaisons post-hoc ?", "feedback_general_html": "<p>Les différences <em>Agressif<\/em> – <em>Non agressif<\/em> (6.250) et <em>Agressif<\/em> – <em>Sans modèle<\/em> (6.583) sont positives et significatives ; <em>Non agressif<\/em> – <em>Sans modèle<\/em> (0.333) ne l'est pas (p = .972). CM01, section Compléments.<\/p>", "options": [{"texte_html": "Les trois conditions diffèrent toutes deux à deux.", "score": -20.0, "feedback_html": "<p><em>Non agressif<\/em> et <em>Sans modèle<\/em> ne diffèrent pas : p = .972.<\/p>"}, {"texte_html": "Seules les conditions <em>Non agressif<\/em> et <em>Sans modèle<\/em> diffèrent.", "score": -50.0, "feedback_html": "<p>C'est la seule comparaison non significative (p = .972).<\/p>"}, {"texte_html": "Aucune différence n'est significative après correction.", "score": -30.0, "feedback_html": "<p>Les deux comparaisons avec <em>Agressif<\/em> restent significatives (p &lt; .001).<\/p>"}, {"texte_html": "Les enfants de la condition <em>Agressif<\/em> sont plus agressifs que ceux des deux autres conditions, qui ne diffèrent pas entre elles.", "score": 100.0, "feedback_html": "<p>Exact. Les deux comparaisons avec <em>Agressif<\/em> ont p &lt; .001 ; <em>Non agressif<\/em> – <em>Sans modèle<\/em> : p = .972.<\/p>"}]}, {"id": "S-021-q5", "difficulte": 2, "question_html": "<p>Pourquoi la correction de Tukey est-elle un bon choix pour ces comparaisons ?<\/p>", "question_texte": "Pourquoi la correction de Tukey est-elle un bon choix pour ces comparaisons ?", "feedback_general_html": "<p>Tukey (HSD) compare toutes les paires et est recommandé quand les variances sont homogènes (ici, Levene : p = .361). CM01, section Compléments, « Comparaisons post-hoc ».<\/p>", "options": [{"texte_html": "Parce que le test de Shapiro-Wilk est presque significatif.", "score": -50.0, "feedback_html": "<p>Le choix de la correction ne dépend pas du test de normalité.<\/p>"}, {"texte_html": "Parce que c'est la seule correction disponible dans Jamovi.", "score": -20.0, "feedback_html": "<p>Jamovi propose aussi Bonferroni, Holm, Scheffé…<\/p>"}, {"texte_html": "Parce qu'on compare toutes les paires sans hypothèse a priori, et que les variances sont homogènes.", "score": 100.0, "feedback_html": "<p>Exact. Tukey est recommandé dans ce cas.<\/p>"}, {"texte_html": "Parce que c'est la correction recommandée pour les mesures répétées.", "score": -30.0, "feedback_html": "<p>Tukey n'est justement pas adapté aux mesures répétées ; ici, les groupes sont indépendants.<\/p>"}]}, {"id": "S-021-q6", "difficulte": 3, "question_html": "<p>Avant l'étude, les chercheurs prévoyaient seulement que l'enfant serait plus agressif après avoir vu un modèle agressif qu'après les deux autres conditions réunies. Avec les niveaux rangés dans l'ordre <em>Agressif<\/em>, <em>Non agressif<\/em>, <em>Sans modèle<\/em>, quelle analyse aurait traduit directement cette hypothèse ?<\/p>", "question_texte": "Avant l'étude, les chercheurs prévoyaient seulement que l'enfant serait plus agressif après avoir vu un modèle agressif qu'après les deux autres conditions réunies. Avec les niveaux rangés dans l'ordre *Agressif*, *Non agressif*, *Sans modèle*, quelle analyse aurait traduit directement cette hypothèse ?", "feedback_general_html": "<p>Opposer <em>Agressif<\/em> à la moyenne des deux autres conditions correspond à c = (2, −1, −1), le premier contraste <em>Helmert<\/em> avec cet ordre de niveaux. CM04, sections Contrastes et Exemples de contrastes.<\/p>", "options": [{"texte_html": "Un contraste <em>polynomial<\/em>.", "score": -50.0, "feedback_html": "<p>Les conditions ne sont pas des niveaux ordonnés et régulièrement espacés.<\/p>"}, {"texte_html": "Les comparaisons post-hoc de Tukey, déjà réalisées.", "score": -30.0, "feedback_html": "<p>Elles explorent toutes les paires ; une hypothèse a priori se teste plus directement par un contraste.<\/p>"}, {"texte_html": "Le contraste de coefficients (1, −1, 0).", "score": -20.0, "feedback_html": "<p>Il ne compare <em>Agressif<\/em> qu'à <em>Non agressif<\/em>, sans <em>Sans modèle<\/em>.<\/p>"}, {"texte_html": "Le contraste de coefficients (2, −1, −1).", "score": 100.0, "feedback_html": "<p>Exact. C'est ce que teste aussi le premier contraste <em>Helmert<\/em> de Jamovi.<\/p>"}]}]}, {"id": "S-023", "type": "serie", "categorie": "interpretation", "cm": [2, 5], "etude": {"titre": "L'effet Stroop (mesures répétées)"}, "etude_html": "<h4>L&#x27;effet Stroop (mesures répétées)<\/h4><p>Stroop (1935) montrait que nommer la couleur de l'encre d'un mot de couleur est plus lent quand le mot désigne une autre couleur (le mot ROUGE écrit en bleu) que lorsqu'il s'agit de simples carrés de couleur. On compare souvent trois conditions : <em>Congruent<\/em> (le mot ROUGE écrit en rouge), <em>Neutre<\/em> (une suite de X en couleur) et <em>Incongruent<\/em> (le mot ROUGE écrit en bleu).<\/p><p>Les résultats ci-dessous portent sur des données simulées, inspirées de l'étude citée : 20 participants passent les trois conditions (facteur intra-sujet <em>Condition<\/em>). La VD est le temps moyen pour nommer la couleur, en millisecondes. L'analyse a été faite avec Analyses → ANOVA → Repeated Measures ANOVA, avec des comparaisons post-hoc corrigées par la méthode de Holm.<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Stroop, J. R. (1935). Studies of interference in serial verbal reactions. <em>Journal of Experimental Psychology, 18<\/em>(6), 643–662. https://doi.org/10.1037/h0054651<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Repeated Measures ANOVA<\/p><p style=\"margin-bottom:2px\"><strong>Within Subjects Effects<\/strong><\/p><div style=\"overflow-x:auto\">< ign:right\">583.302<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">645.698<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Neutre<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">639.600<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">15.005<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">608.195<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">671.005<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Incongruent<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">736.250<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">17.079<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">700.504<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">771.996<\/td><\/tr><\/table><\/div>", "questions": [{"id": "S-023-q1", "difficulte": 1, "question_html": "<p>Que conclure du test de Mauchly ?<\/p>", "question_texte": "Que conclure du test de Mauchly ?", "feedback_general_html": "<p>p = .036 &lt; .05 : on rejette la sphéricité et on corrige les degrés de liberté par ε. CM02, section Formalisation, « Tester la sphéricité ».<\/p>", "options": [{"texte_html": "La sphéricité est rejetée (p = .036) : il faut lire une ligne corrigée.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "La sphéricité est respectée : on lit la ligne <em>None<\/em>.", "score": -20.0, "feedback_html": "<p>p = .036 &lt; .05 : la sphéricité est rejetée.<\/p>"}, {"texte_html": "La condition n'a pas d'effet sur le temps de réponse.", "score": -50.0, "feedback_html": "<p>Le test de Mauchly vérifie une condition ; il ne teste pas l'effet.<\/p>"}, {"texte_html": "Les variances des trois conditions sont égales.", "score": -30.0, "feedback_html": "<p>Le test porte sur les variances des différences entre conditions, pas sur les variances des conditions.<\/p>"}]}, {"id": "S-023-q2", "difficulte": 2, "question_html": "<p>Selon la règle vue en cours, quelle ligne du tableau <em>Within Subjects Effects<\/em> faut-il retenir ?<\/p>", "question_texte": "Selon la règle vue en cours, quelle ligne du tableau *Within Subjects Effects* faut-il retenir ?", "feedback_general_html": "<p>On estime d'abord ε par Greenhouse-Geisser (0.764) ; comme il atteint 0,75, on préfère la correction de Huynh-Feldt. CM02, section Formalisation, « Choisir une correction ».<\/p>", "options": [{"texte_html": "<em>None<\/em>, parce que F est très grand.", "score": -50.0, "feedback_html": "<p>La sphéricité étant rejetée, on lit une ligne corrigée, quelle que soit la valeur de F.<\/p>"}, {"texte_html": "<em>Huynh-Feldt<\/em>, parce que ε de Greenhouse-Geisser vaut 0.764, soit au moins 0,75.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "<em>Huynh-Feldt<\/em>, parce que son ε (0.817) est supérieur à 0,75.", "score": -30.0, "feedback_html": "<p>La bonne ligne, mais pas la bonne raison : la règle porte sur ε de Greenhouse-Geisser.<\/p>"}, {"texte_html": "<em>Greenhouse-Geisser<\/em>, parce que c'est toujours la plus prudente.", "score": -20.0, "feedback_html": "<p>Elle est la plus prudente, mais la règle la réserve aux cas où ε de Greenhouse-Geisser est inférieur à 0,75.<\/p>"}]}, {"id": "S-023-q3", "difficulte": 1, "question_html": "<p>Après correction, que conclure de l'ANOVA ?<\/p>", "question_texte": "Après correction, que conclure de l'ANOVA ?", "feedback_general_html": "<p>Avec la correction de Huynh-Feldt, p &lt; .001 : on rejette l'égalité des moyennes. F et les sommes des carrés ne changent pas d'une ligne à l'autre. CM02, section Formalisation.<\/p>", "options": [{"texte_html": "Les trois conditions diffèrent toutes deux à deux.", "score": -20.0, "feedback_html": "<p>Le F seul ne le dit pas : il faut les comparaisons post-hoc.<\/p>"}, {"texte_html": "La correction a modifié la valeur de F.", "score": -50.0, "feedback_html": "<p>F (78.33) est identique sur les trois lignes ; seuls les degrés de liberté changent.<\/p>"}, {"texte_html": "L'effet n'est plus significatif après correction.", "score": -30.0, "feedback_html": "<p>Les trois lignes donnent p &lt; .001.<\/p>"}, {"texte_html": "Le temps moyen pour nommer la couleur n'est pas le même dans les trois conditions.", "score": 100.0, "feedback_html": "<p>Exact. p &lt; .001 sur la ligne Huynh-Feldt.<\/p>"}]}, {"id": "S-023-q4", "difficulte": 2, "question_html": "<p>Que montrent les comparaisons post-hoc ?<\/p>", "question_texte": "Que montrent les comparaisons post-hoc ?", "feedback_general_html": "<p>Les différences sont toutes négatives et significatives (Holm) : <em>Congruent<\/em> (614.5 ms) &lt; <em>Neutre<\/em> (639.6 ms) &lt; <em>Incongruent<\/em> (736.3 ms). CM02, section Compléments.<\/p>", "options": [{"texte_html": "Seule la condition <em>Incongruent<\/em> diffère des deux autres.", "score": -20.0, "feedback_html": "<p><em>Congruent<\/em> et <em>Neutre<\/em> diffèrent aussi (p = .002).<\/p>"}, {"texte_html": "Les trois conditions diffèrent toutes deux à deux : le temps augmente de <em>Congruent<\/em> à <em>Neutre<\/em>, puis à <em>Incongruent<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Les trois p corrigées sont inférieures à .05 (.002, &lt; .001, &lt; .001).<\/p>"}, {"texte_html": "Les mots congruents ralentissent la dénomination par rapport à la condition neutre.", "score": -30.0, "feedback_html": "<p>La différence <em>Congruent<\/em> – <em>Neutre<\/em> est négative (−25.100) : la condition congruente est la plus rapide.<\/p>"}, {"texte_html": "Aucune différence ne reste significative après correction.", "score": -50.0, "feedback_html": "<p>Les trois comparaisons restent significatives.<\/p>"}]}, {"id": "S-023-q5", "difficulte": 2, "question_html": "<p>Comment qualifier la taille de l'effet de la condition ?<\/p><p><em>Rappel : seuils de Bakeman (2005) pour η²G : 0,02 petit, 0,13 moyen, 0,26 grand.<\/em><\/p>", "question_texte": "Comment qualifier la taille de l'effet de la condition ?\n\n*Rappel : seuils de Bakeman (2005) pour η²G : 0,02 petit, 0,13 moyen, 0,26 grand.*", "feedback_general_html": "<p>η²G = 0.371 &gt; 0,26 : grand effet selon Bakeman (2005). η²p, beaucoup plus élevé, ne se compare pas aux mêmes seuils. CM02, section Compléments ; CM05.<\/p>", "options": [{"texte_html": "Énorme, puisque η²p = 0.805.", "score": -30.0, "feedback_html": "<p>Les seuils de Bakeman s'appliquent à η²G ; η²p est gonflé par le retrait des différences entre participants.<\/p>"}, {"texte_html": "Moyen : η²G est compris entre 0,13 et 0,5.", "score": -20.0, "feedback_html": "<p>Le seuil d'un grand effet est 0,26.<\/p>"}, {"texte_html": "Grand : η²G = 0.371 dépasse 0,26.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Impossible à dire, car la sphéricité est violée.", "score": -50.0, "feedback_html": "<p>Les corrections de sphéricité ne modifient pas les tailles d'effet.<\/p>"}]}, {"id": "S-023-q6", "difficulte": 3, "question_html": "<p>Dans le tableau <em>Between Subjects Effects<\/em>, la ligne <em>Residual<\/em> a une somme des carrés de 240727. Que représente-t-elle ?<\/p>", "question_texte": "Dans le tableau *Between Subjects Effects*, la ligne *Residual* a une somme des carrés de 240727. Que représente-t-elle ?", "feedback_general_html": "<p>Sans facteur inter-sujets, le tableau <em>Between Subjects Effects<\/em> ne contient que la variation entre participants. Retirée du terme d'erreur, elle fait gagner de la puissance. CM02, section Équiprobabilité, « A retenir ».<\/p>", "options": [{"texte_html": "L'effet de la condition.", "score": -30.0, "feedback_html": "<p>L'effet de la condition est dans <em>Within Subjects Effects<\/em> (165295).<\/p>"}, {"texte_html": "Une erreur de saisie, puisqu'il n'y a pas de facteur inter-sujets.", "score": -50.0, "feedback_html": "<p>Même sans facteur inter-sujets, Jamovi affiche la variation entre participants.<\/p>"}, {"texte_html": "L'erreur utilisée pour tester l'effet de la condition.", "score": -20.0, "feedback_html": "<p>L'erreur du test est le <em>Residual<\/em> de <em>Within Subjects Effects<\/em> (40093).<\/p>"}, {"texte_html": "Les différences stables entre participants (certains sont plus rapides que d'autres dans toutes les conditions).", "score": 100.0, "feedback_html": "<p>Exact. C'est la variation que η²p laisse de côté et que η²G garde au dénominateur.<\/p>"}]}]}, {"id": "S-025", "type": "serie", "categorie": "interpretation", "cm": [3, 5], "etude": {"titre": "La facilité à se souvenir (plan croisé)"}, "etude_html": "<h4>La facilité à se souvenir (plan croisé)<\/h4><p>Dans leur première expérience, Schwarz et al. (1991) demandaient à des étudiantes de décrire 6 ou 12 situations où elles s'étaient montrées assertives (sûres d'elles), ou au contraire non assertives. Trouver 12 exemples est difficile. Les participantes évaluaient ensuite leur propre assertivité. Celles qui avaient dû trouver 12 exemples d'assertivité se jugeaient moins assertives que celles qui n'en avaient trouvé que 6 : c'est la facilité de récupération, et non le nombre d'exemples, qui guidait leur jugement.<\/p><p>Les résultats ci-dessous portent sur des données simulées : 80 participantes, 20 par condition. Les facteurs inter-sujets sont <em>Exemples<\/em> (<em>6<\/em>, <em>12<\/em>) et <em>Type<\/em> (<em>Assertifs<\/em>, <em>Non assertifs<\/em>). La VD <em>Assertivité<\/em> va de 1 (pas du tout assertive) à 10 (très assertive).<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Schwarz, N., Bless, H., Strack, F., Klumpp, G., Rittenauer-Schatka, H., &amp; Simons, A. (1991). Ease of retrieval as information: Another look at the availability heuristic. <em>Journal of Personality and Social Psychology, 61<\/em>(2), 195–202. https://doi.org/10.1037/0022-3514.61.2.195<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">ANOVA<\/p><p style=\"margin-bottom:2px\"><strong>ANOVA - Assertivité<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">ω²<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Exemples<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.513<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.513<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2.06<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.155<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.021<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.026<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.011<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Type<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.512<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.512<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2.52<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.117<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.026<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.032<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.016<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Exemples ✻ Type<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">35.113<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">35.113<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">16.05<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.166<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.174<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.154<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Residuals<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">166.250<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">76<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2.188<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> Type 3 Sums of Squares<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Assumption Checks<\/p><p style=\"margin-bottom:2px\"><strong>Homogeneity of Variances Test (Levene&#x27;s)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df1<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df2<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">0.225<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">76<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.879<\/td><\/tr><\/table><\/div><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Estimated Marginal Means<\/p><p style=\"margin-bottom:2px\"><strong>Exemples ✻ Type<\/strong><\/p><p><img src=\"images/nv_schwarz_interaction.png\" alt=\"Exemples ✻ Type\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p><p style=\"margin-bottom:2px\"><strong>Estimated Marginal Means - Exemples ✻ Type<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Exemples<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Type<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">SE<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Lower<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Upper<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">6<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Assertifs<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.950<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.331<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.291<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">7.609<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">6<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Non assertifs<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.100<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.331<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.441<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.759<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">12<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Assertifs<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.150<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.331<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.491<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.809<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">12<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Non assertifs<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.950<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.331<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.291<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.609<\/td><\/tr><\/table><\/div>", "questions": [{"id": "S-025-q1", "difficulte": 1, "question_html": "<p>Quels effets sont significatifs au seuil de 5 % ?<\/p>", "question_texte": "Quels effets sont significatifs au seuil de 5 % ?", "feedback_general_html": "<p>Seule l'interaction est significative (p &lt; .001). CM03, section Factoriel.<\/p>", "options": [{"texte_html": "Aucun effet n'est significatif.", "score": -50.0, "feedback_html": "<p>L'interaction a p &lt; .001.<\/p>"}, {"texte_html": "Les deux effets principaux et l'interaction.", "score": -30.0, "feedback_html": "<p>Les effets principaux ne sont pas significatifs (p = .155 et p = .117).<\/p>"}, {"texte_html": "Seulement l'effet principal du type d'exemples.", "score": -20.0, "feedback_html": "<p><em>Type<\/em> : p = .117 &gt; .05 ; c'est l'interaction qui est significative.<\/p>"}, {"texte_html": "Seulement l'interaction <em>Exemples ✻ Type<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Interaction : p &lt; .001 ; <em>Exemples<\/em> : p = .155 ; <em>Type<\/em> : p = .117.<\/p>"}]}, {"id": "S-025-q2", "difficulte": 2, "question_html": "<p>D'après le tableau des moyennes marginales et le graphique, comment décrire l'interaction ?<\/p>", "question_texte": "D'après le tableau des moyennes marginales et le graphique, comment décrire l'interaction ?", "feedback_general_html": "<p>Les courbes se croisent : l'effet du type d'exemples s'inverse selon leur nombre. Ce n'est pas le contenu rappelé, mais la facilité du rappel, qui guide le jugement. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Le nombre d'exemples n'a d'effet dans aucune condition, puisque son effet principal n'est pas significatif.", "score": -20.0, "feedback_html": "<p>L'effet du nombre d'exemples existe, mais dans des sens opposés selon le type : il se compense en moyenne.<\/p>"}, {"texte_html": "Plus on cite d'exemples d'assertivité, plus on se juge assertive.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : 6,95 avec 6 exemples, 5,15 avec 12.<\/p>"}, {"texte_html": "Après 6 exemples d'assertivité, les participantes se jugent plus assertives qu'après 6 exemples de non-assertivité ; avec 12 exemples, c'est l'inverse.", "score": 100.0, "feedback_html": "<p>Exact. 6,95 contre 5,10 avec 6 exemples ; 5,15 contre 5,95 avec 12.<\/p>"}, {"texte_html": "Les participantes se jugent toujours plus assertives après des exemples assertifs.", "score": -50.0, "feedback_html": "<p>Avec 12 exemples, c'est l'inverse (5,15 contre 5,95).<\/p>"}]}, {"id": "S-025-q3", "difficulte": 3, "question_html": "<p>Pourquoi aucun effet principal n'est-il significatif, alors que l'interaction l'est fortement ?<\/p>", "question_texte": "Pourquoi aucun effet principal n'est-il significatif, alors que l'interaction l'est fortement ?", "feedback_general_html": "<p>Dans une interaction croisée, l'effet d'un facteur change de sens selon l'autre facteur : les effets principaux, qui font la moyenne, peuvent être nuls. CM03, sections Factoriel et Compléments.<\/p>", "options": [{"texte_html": "Parce que les effets de chaque facteur vont dans des sens opposés selon le niveau de l'autre, et se compensent quand on fait la moyenne.", "score": 100.0, "feedback_html": "<p>Exact. Un effet principal moyenne sur l'autre facteur.<\/p>"}, {"texte_html": "Parce que les variances ne sont pas homogènes.", "score": -50.0, "feedback_html": "<p>Le test de Levene donne p = .879 : les variances sont homogènes.<\/p>"}, {"texte_html": "Parce que l'interaction absorbe toute la variation des effets principaux.", "score": -30.0, "feedback_html": "<p>Les sommes des carrés de chaque effet sont distinctes ; c'est la forme croisée des moyennes qui explique le résultat.<\/p>"}, {"texte_html": "Parce que l'échantillon est trop petit pour détecter les effets principaux.", "score": -20.0, "feedback_html": "<p>Le même échantillon détecte très bien l'interaction ; ce sont les moyennes qui se compensent.<\/p>"}]}, {"id": "S-025-q4", "difficulte": 2, "question_html": "<p>Comment qualifier la taille de l'effet d'interaction (η²p = 0.174) ?<\/p><p><em>Rappel : repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Comment qualifier la taille de l'effet d'interaction (η²p = 0.174) ?\n\n*Rappel : repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>η²p = 0.174 &gt; 0,14 : grand effet selon Cohen (1988). CM05, section Classique.<\/p>", "options": [{"texte_html": "Grand, puisque η²p dépasse 0,14.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Moyen, puisque η²p est compris entre 0,06 et 0,20.", "score": -20.0, "feedback_html": "<p>Le repère d'un grand effet est 0,14.<\/p>"}, {"texte_html": "Petit, puisque η² ne vaut que 0.166.", "score": -30.0, "feedback_html": "<p>0.166 dépasse aussi le repère d'un grand effet.<\/p>"}, {"texte_html": "Nul, puisque les effets principaux ne sont pas significatifs.", "score": -50.0, "feedback_html": "<p>La taille de l'interaction ne dépend pas des effets principaux.<\/p>"}]}, {"id": "S-025-q5", "difficulte": 2, "question_html": "<p>Pour l'interaction, pourquoi ω² (0.154) est-il un peu plus petit que η² (0.166) ?<\/p>", "question_texte": "Pour l'interaction, pourquoi ω² (0.154) est-il un peu plus petit que η² (0.166) ?", "feedback_general_html": "<p>η² est biaisé et surestime la taille d'effet ; ω² corrige en partie ce biais et vaut donc un peu moins. CM05, section Rigoureux, « Omega ».<\/p>", "options": [{"texte_html": "Parce que ω² retire les autres effets du dénominateur.", "score": -20.0, "feedback_html": "<p>C'est ce que fait η²p ; ω² corrige le biais de η².<\/p>"}, {"texte_html": "Parce que ω² est calculé sur les moyennes marginales.", "score": -30.0, "feedback_html": "<p>Les deux indices sont calculés à partir des sommes des carrés.<\/p>"}, {"texte_html": "Parce que ω² corrige en partie la tendance de η² à surestimer la taille d'effet.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Parce que l'effet est plus faible chez les participantes assertives.", "score": -50.0, "feedback_html": "<p>Les deux indices portent sur le même effet ; ils diffèrent par leur calcul.<\/p>"}]}, {"id": "S-025-q6", "difficulte": 1, "question_html": "<p>Que conclure du test de Levene ?<\/p>", "question_texte": "Que conclure du test de Levene ?", "feedback_general_html": "<p>Dans un plan croisé, le test de Levene compare les variances des groupes formés par le croisement des facteurs (ici quatre) : p = .879. CM03, section Compléments, « Conditions d'application ».<\/p>", "options": [{"texte_html": "L'homogénéité des variances entre les quatre groupes n'est pas remise en cause (p = .879).", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Il faut vérifier la sphéricité.", "score": -30.0, "feedback_html": "<p>Il n'y a pas de facteur intra-sujet : la sphéricité ne se pose pas.<\/p>"}, {"texte_html": "Les variances sont différentes entre les quatre groupes.", "score": -20.0, "feedback_html": "<p>p = .879 &gt; .05 : on ne rejette pas l'égalité des variances.<\/p>"}, {"texte_html": "L'interaction n'est pas significative.", "score": -50.0, "feedback_html": "<p>Le test de Levene ne porte pas sur les effets.<\/p>"}]}]}, {"id": "S-027", "type": "serie", "categorie": "interpretation", "cm": [2, 3, 6], "etude": {"titre": "Le sommeil consolide un apprentissage moteur (ANOVA mixte)"}, "etude_html": "<h4>Le sommeil consolide un apprentissage moteur (ANOVA mixte)<\/h4><p>Walker et al. (2002) faisaient apprendre à des participants une séquence de frappe au clavier, puis mesuraient leur vitesse 12 heures et 24 heures plus tard. Le groupe entraîné le matin restait éveillé pendant les 12 premières heures, puis dormait ; le groupe entraîné le soir dormait d'abord. La performance progressait après une nuit de sommeil, mais pas après une journée d'éveil.<\/p><p>Les résultats ci-dessous portent sur des données simulées, inspirées de l'étude citée : 15 participants par groupe (facteur inter-sujets <em>Groupe<\/em> : <em>Matin<\/em>, <em>Soir<\/em>), mesurés trois fois (facteur intra-sujet <em>Session<\/em> : <em>Entraînement<\/em>, <em>12 h<\/em>, <em>24 h<\/em>). La VD <em>Vitesse<\/em> est le nombre de séquences correctes tapées en 30 secondes.<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Walker, M. P., Brakefield, T., Morgan, A., Hobson, J. A., &amp; Stickgold, R. (2002). Practice with sleep makes perfect: Sleep-dependent motor skill learning. <em>Neuron, 35<\/em>(1), 205–211. https://doi.org/10.1016/S0896-6273(02)00746-8<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Repeated Measures ANOVA<\/p><p style=\"margin-bottom:2px\"><strong>Within Subjects Effects<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²G<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Session<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">232.740<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">116.370<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">87.71<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.299<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Session ✻ Groupe<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">41.774<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">2<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">20.887<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">15.74<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.071<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Residual<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">74.299<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">56<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.327<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"font-size:0.85em;color:#555;margin-top:2px\"><em>Note.<\/em> Type 3 Sums of Squares<\/p><p style=\"margin-bottom:2px\"><strong>Between Subjects Effects<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333 2px;color:#3E6DA9;font-size:1.15em\">Assumptions<\/p><p style=\"margin-bottom:2px\"><strong>Tests of Sphericity<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mauchly&#x27;s W<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Greenhouse-Geisser ε<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Huynh-Feldt ε<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Session<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.960<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.579<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.962<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.000<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Session ✻ Groupe<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.960<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.579<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.962<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.000<\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Homogeneity of Variances Test (Levene&#x27;s)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df1<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df2<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Entraînement<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.074<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">28<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.788<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">12 h<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3.716<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">28<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.064<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">24 h<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.173<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">28<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.680<\/td><\/tr><\/table><\/div><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Estimated Marginal Means<\/p><p style=\"margin-bottom:2px\"><strong>Session ✻ Groupe<\/strong><\/p><p><img src=\"images/nv_walker_interaction.png\" alt=\"Session ✻ Groupe\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p><p style=\"margin-bottom:2px\"><strong>Estimated Marginal Means - Session ✻ Groupe<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Session<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Groupe<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">SE<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Lower<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Upper<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Entraînement<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Matin<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">13.980<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.705<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">12.535<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">15.425<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Entraînement<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Soir<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">13.613<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.705<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">12.168<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">15.058<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">12 h<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Matin<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">14.607<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.667<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">13.239<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">15.974<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">12 h<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Soir<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">17.160<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.667<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">15.793<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">18.527<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">24 h<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Matin<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">17.887<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.595<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">16.668<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">19.106<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">24 h<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Soir<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">17.580<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.595<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">16.361<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">18.799<\/td><\/tr><\/table><\/div>", "questions": [{"id": "S-027-q1", "difficulte": 1, "question_html": "<p>Que concluent les tests de sphéricité et d'homogénéité des variances ?<\/p>", "question_texte": "Que concluent les tests de sphéricité et d'homogénéité des variances ?", "feedback_general_html": "<p>Mauchly : p = .579 (ε de Greenhouse-Geisser = 0.962) ; Levene : p &gt; .05
