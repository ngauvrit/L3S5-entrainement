<script id="donnees" type="application/json">[{"id": "S-002", "type": "serie", "categorie": "choix", "cm": [1, 2, 3, 6], "etude": {"titre": "Se tester pour retenir (plan mixte)"}, "etude_html": "<h4>Se tester pour retenir (plan mixte)<\/h4><p>Dans leur première expérience, Roediger et Karpicke (2006) faisaient lire à 120 étudiants deux courts textes scientifiques. Chaque étudiant lisait d'abord les deux textes. Ensuite, pour l'un des deux textes, il disposait d'un second temps de lecture (condition <em>Relecture<\/em>) ; pour l'autre, il devait écrire de mémoire tout ce dont il se souvenait, sans revoir le texte ni recevoir de correction (condition <em>Test<\/em>). Chaque étudiant passait donc par les deux conditions, une par texte. Le test final, qui portait sur les deux textes, avait lieu 5 minutes, 2 jours ou 1 semaine plus tard, selon le groupe auquel l'étudiant avait été affecté (40 étudiants par groupe). La VD était la proportion des idées de chaque texte rappelées au test final.<\/p><p style=\"font-size:0.85em;color:#555\">Roediger, H. L., III, &amp; Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. <em>Psychological Science, 17<\/em>(3), 249–255. https://doi.org/10.1111/j.1467-9280.2006.01693.x<\/p>", "questions": [{"id": "S-002-q1", "difficulte": 1, "question_html": "<p>Quelle est la VD de cette étude ?<\/p>", "question_texte": "Quelle est la VD de cette étude ?", "feedback_general_html": "<p>La VD est la seule variable mesurée : la proportion d'idées rappelées. Le délai et la condition d'apprentissage sont les deux VI. CM01.<\/p>", "options": [{"texte_html": "Le délai avant le test final.", "score": -20.0, "feedback_html": "<p>Le délai est manipulé par les chercheurs : c'est l'une des deux VI.<\/p>"}, {"texte_html": "La condition d'apprentissage, relecture ou test.", "score": -30.0, "feedback_html": "<p>La condition d'apprentissage est manipulée : c'est l'autre VI.<\/p>"}, {"texte_html": "Le nombre de textes lus.", "score": -50.0, "feedback_html": "<p>Chaque étudiant lit deux textes : ce nombre est fixé, ce n'est pas une variable mesurée.<\/p>"}, {"texte_html": "La proportion d'idées rappelées au test final.", "score": 100.0, "feedback_html": "<p>Exact. C'est la seule variable mesurée.<\/p>"}]}, {"id": "S-002-q2", "difficulte": 2, "question_html": "<p>Comment se présentent les deux facteurs de cette étude ?<\/p>", "question_texte": "Comment se présentent les deux facteurs de cette étude ?", "feedback_general_html": "<p>Chaque étudiant connaît les deux conditions d'apprentissage (un texte relu, un texte testé) mais un seul délai. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Les deux sont intra-sujets.", "score": -30.0, "feedback_html": "<p>Chaque étudiant connaît bien les deux conditions d'apprentissage, mais un seul délai.<\/p>"}, {"texte_html": "Les deux sont inter-sujets.", "score": -20.0, "feedback_html": "<p>Le délai est bien inter-sujets, mais chaque étudiant passe par les deux conditions d'apprentissage.<\/p>"}, {"texte_html": "La condition d'apprentissage est intra-sujet, le délai est inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Un texte relu et un texte testé pour chaque étudiant, mais un seul délai.<\/p>"}, {"texte_html": "La condition d'apprentissage est inter-sujets, le délai est intra-sujet.", "score": -50.0, "feedback_html": "<p>C'est exactement l'inverse : chaque étudiant connaît les deux conditions d'apprentissage et un seul délai.<\/p>"}]}, {"id": "S-002-q3", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour cette étude ?<\/p>", "question_texte": "Quelle analyse convient pour cette étude ?", "feedback_general_html": "<p>Un facteur inter-sujets et un facteur intra-sujet : c'est un plan mixte. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une ANOVA mixte.", "score": 100.0, "feedback_html": "<p>Exact. Un facteur inter-sujets (délai) et un facteur intra-sujet (condition d'apprentissage).<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé avec deux facteurs inter-sujets.", "score": -20.0, "feedback_html": "<p>Les deux scores d'un même étudiant (texte relu, texte testé) ne sont pas indépendants : la condition d'apprentissage est intra-sujet.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées avec un facteur à six modalités.", "score": -30.0, "feedback_html": "<p>Cela supposerait que chaque étudiant passe par les six combinaisons. Or le délai est inter-sujets.<\/p>"}, {"texte_html": "Une ANOVA simple sur le délai.", "score": -50.0, "feedback_html": "<p>Elle laisserait de côté la condition d'apprentissage, qui est au cœur de l'hypothèse.<\/p>"}]}, {"id": "S-002-q4", "difficulte": 2, "question_html": "<p>Comment organiser les données pour les analyser dans Jamovi ?<\/p>", "question_texte": "Comment organiser les données pour les analyser dans Jamovi ?", "feedback_general_html": "<p>Jamovi demande le format large : une ligne par participant, une colonne par mesure répétée, et le facteur inter-sujets dans sa propre colonne. CM02, section Équiprobabilité, « Formats » ; CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une ligne par texte, avec une colonne pour chaque étudiant.", "score": -50.0, "feedback_html": "<p>Dans Jamovi, chaque ligne est un participant, jamais une condition ou un item.<\/p>"}, {"texte_html": "Une ligne par étudiant, avec deux colonnes de rappel (<em>Relecture<\/em>, <em>Test<\/em>) et une colonne indiquant le délai.", "score": 100.0, "feedback_html": "<p>Exact. Format large : une colonne par mesure répétée, et le facteur inter-sujets dans sa propre colonne.<\/p>"}, {"texte_html": "Une ligne par délai, avec une colonne par étudiant.", "score": -30.0, "feedback_html": "<p>Chaque ligne doit être un participant, avec ses mesures en colonnes.<\/p>"}, {"texte_html": "Une ligne par étudiant, avec six colonnes de rappel, une par combinaison de condition et de délai.", "score": -20.0, "feedback_html": "<p>Une ligne par étudiant, c'est juste, mais chaque étudiant n'a été testé qu'à un délai : il n'a que deux mesures.<\/p>"}]}, {"id": "S-002-q5", "difficulte": 2, "question_html": "<p>Les chercheurs prédisent que l'avantage du test sur la relecture dépend du délai : absent, voire inversé, à 5 minutes, il apparaîtrait après quelques jours. Quel effet faut-il examiner ?<\/p>", "question_texte": "Les chercheurs prédisent que l'avantage du test sur la relecture dépend du délai : absent, voire inversé, à 5 minutes, il apparaîtrait après quelques jours. Quel effet faut-il examiner ?", "feedback_general_html": "<p>L'hypothèse dit que l'effet de la condition d'apprentissage dépend du délai : c'est une interaction. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal de la condition d'apprentissage.", "score": -20.0, "feedback_html": "<p>L'effet principal moyenne sur les trois délais : il ne dit pas si l'avantage du test change selon le délai.<\/p>"}, {"texte_html": "L'effet principal du délai.", "score": -50.0, "feedback_html": "<p>L'effet du délai moyenne sur les deux conditions d'apprentissage : il ne compare pas test et relecture.<\/p>"}, {"texte_html": "L'effet simple du délai dans la condition <em>Test<\/em>.", "score": -30.0, "feedback_html": "<p>Cet effet simple ne regarde qu'une condition d'apprentissage ; il ne compare pas test et relecture.<\/p>"}, {"texte_html": "L'interaction entre la condition d'apprentissage et le délai.", "score": 100.0, "feedback_html": "<p>Exact. L'hypothèse dit que l'effet d'un facteur dépend de l'autre : c'est une interaction.<\/p>"}]}, {"id": "S-002-q6", "difficulte": 3, "question_html": "<p>Quelles vérifications propres à ce plan faut-il prévoir ?<\/p>", "question_texte": "Quelles vérifications propres à ce plan faut-il prévoir ?", "feedback_general_html": "<p>Dans un plan mixte, les conditions des deux types de plans se cumulent, mais la sphéricité n'a de sens qu'avec au moins trois modalités intra-sujet. CM03, section Plans mixtes ; CM06, section Désinformation.<\/p>", "options": [{"texte_html": "La sphéricité pour la condition d'apprentissage, et l'homogénéité des variances pour le délai.", "score": -20.0, "feedback_html": "<p>L'homogénéité des variances pour le délai, oui. Mais la sphéricité n'a de sens qu'avec au moins trois modalités intra-sujet ; ici il n'y en a que deux.<\/p>"}, {"texte_html": "L'homogénéité des variances pour le délai ; la sphéricité ne se pose pas, puisque le facteur intra-sujet n'a que deux modalités.", "score": 100.0, "feedback_html": "<p>Exact. Avec deux modalités, il n'y a qu'une différence entre conditions : la sphéricité est automatiquement respectée.<\/p>"}, {"texte_html": "Seulement la sphéricité.", "score": -30.0, "feedback_html": "<p>La sphéricité ne se pose pas avec deux modalités, et le facteur inter-sujets demande de vérifier l'homogénéité des variances.<\/p>"}, {"texte_html": "Aucune, puisque l'ANOVA est robuste.", "score": -50.0, "feedback_html": "<p>La robustesse de l'ANOVA ne dispense pas de vérifier les conditions.<\/p>"}]}, {"id": "S-002-q7", "difficulte": 2, "question_html": "<p>Les résultats montrent qu'après 5 minutes la relecture donne un meilleur rappel, mais qu'après 2 jours et 1 semaine c'est le test. L'interaction est significative, ainsi que l'effet principal de la condition d'apprentissage. Comment procéder ?<\/p>", "question_texte": "Les résultats montrent qu'après 5 minutes la relecture donne un meilleur rappel, mais qu'après 2 jours et 1 semaine c'est le test. L'interaction est significative, ainsi que l'effet principal de la condition d'apprentissage. Comment procéder ?", "feedback_general_html": "<p>Quand l'interaction est significative, on interprète les effets simples avant les effets principaux. CM03, section Compléments.<\/p>", "options": [{"texte_html": "Interpréter d'abord les effets simples de la condition d'apprentissage à chaque délai, car l'effet principal peut être trompeur.", "score": 100.0, "feedback_html": "<p>Exact. L'effet principal moyenne des effets de sens opposés selon le délai.<\/p>"}, {"texte_html": "Conclure que le test est toujours plus efficace que la relecture, puisque l'effet principal est significatif.", "score": -20.0, "feedback_html": "<p>À 5 minutes, c'est la relecture qui l'emporte : l'effet principal ne peut pas être généralisé.<\/p>"}, {"texte_html": "Retirer l'interaction du modèle pour simplifier l'interprétation.", "score": -30.0, "feedback_html": "<p>On ne retire une interaction que si elle n'est pas significative.<\/p>"}, {"texte_html": "Ignorer le délai, qui n'est pas l'objet principal de l'étude.", "score": -50.0, "feedback_html": "<p>Le délai est au cœur de l'hypothèse : c'est lui qui renverse l'effet de la condition d'apprentissage.<\/p>"}]}]}, {"id": "S-005", "type": "serie", "categorie": "choix", "cm": [1, 4], "etude": {"titre": "Les verbes et la vitesse (plan simple)"}, "etude_html": "<h4>Les verbes et la vitesse (plan simple)<\/h4><p>Loftus et Palmer (1974) ont montré à 45 étudiants des films d'accidents de voiture. Les étudiants, répartis au hasard en cinq groupes de 9, devaient ensuite estimer la vitesse des voitures au moment du choc. Seul le verbe de la question changeait d'un groupe à l'autre : « À quelle vitesse allaient les voitures quand elles se sont <em>contacted<\/em> (touchées) / <em>hit<\/em> (heurtées) / <em>bumped<\/em> (cognées) / <em>collided<\/em> (percutées) / <em>smashed<\/em> (fracassées) ? » Ces verbes sont rangés ici du moins violent au plus violent.<\/p><p style=\"font-size:0.85em;color:#555\">Loftus, E. F., &amp; Palmer, J. C. (1974). Reconstruction of automobile destruction: An example of the interaction between language and memory. <em>Journal of Verbal Learning and Verbal Behavior, 13<\/em>(5), 585–589. https://doi.org/10.1016/S0022-5371(74)80011-3<\/p>", "questions": [{"id": "S-005-q1", "difficulte": 1, "question_html": "<p>Quelle est la VD de cette étude, et de quel type est-elle ?<\/p>", "question_texte": "Quelle est la VD de cette étude, et de quel type est-elle ?", "feedback_general_html": "<p>La VD est ce que l'on mesure : la vitesse estimée, numérique. Le verbe est la VI, catégorielle. CM01, section Placebo.<\/p>", "options": [{"texte_html": "Le verbe utilisé dans la question ; une variable catégorielle.", "score": -20.0, "feedback_html": "<p>Le verbe est manipulé par les chercheurs : c'est la VI.<\/p>"}, {"texte_html": "La vitesse estimée par les participants ; une variable numérique.", "score": 100.0, "feedback_html": "<p>Exact. C'est ce que l'on mesure chez chaque participant.<\/p>"}, {"texte_html": "La vitesse réelle des voitures ; une variable numérique.", "score": -30.0, "feedback_html": "<p>La vitesse réelle est la même pour tous : ce n'est pas elle qu'on mesure.<\/p>"}, {"texte_html": "Le groupe des participants ; une variable numérique à cinq modalités.", "score": -50.0, "feedback_html": "<p>Le groupe correspond à la VI ; et une variable à modalités est catégorielle, pas numérique.<\/p>"}]}, {"id": "S-005-q2", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour tester l'effet du verbe sur la vitesse estimée ?<\/p>", "question_texte": "Quelle analyse convient pour tester l'effet du verbe sur la vitesse estimée ?", "feedback_general_html": "<p>Une VD numérique, une VI catégorielle, des groupes indépendants : c'est le cas de l'ANOVA simple. CM01.<\/p>", "options": [{"texte_html": "Une série de dix tests de Student, un pour chaque paire de verbes.", "score": -20.0, "feedback_html": "<p>Dix tests gonfleraient le risque d'erreur de type I ; l'ANOVA teste tout en une fois.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées.", "score": -30.0, "feedback_html": "<p>Chaque participant ne passe qu'une condition : les groupes sont indépendants.<\/p>"}, {"texte_html": "Une ANOVA simple, avec un facteur inter-sujets à cinq modalités.", "score": 100.0, "feedback_html": "<p>Exact. VD numérique, VI catégorielle, groupes indépendants.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé 5 × 9.", "score": -50.0, "feedback_html": "<p>Les 9 participants par groupe ne forment pas un facteur.<\/p>"}]}, {"id": "S-005-q3", "difficulte": 2, "question_html": "<p>Supposons que les chercheurs n'aient formulé aucune hypothèse précise. L'ANOVA est significative et le test de Levene ne l'est pas. Ils veulent maintenant savoir quels verbes diffèrent entre eux. Que faire ?<\/p>", "question_texte": "Supposons que les chercheurs n'aient formulé aucune hypothèse précise. L'ANOVA est significative et le test de Levene ne l'est pas. Ils veulent maintenant savoir quels verbes diffèrent entre eux. Que faire ?", "feedback_general_html": "<p>Sans hypothèse a priori, on compare toutes les paires en contrôlant le risque total ; Tukey est recommandé quand les variances sont homogènes. CM01, section Compléments.<\/p>", "options": [{"texte_html": "Dix tests de Student sans correction, puisque l'ANOVA est déjà significative.", "score": -30.0, "feedback_html": "<p>Sans correction, dix tests gonfleraient le risque d'erreur de type I, même après un F significatif.<\/p>"}, {"texte_html": "Un contraste polynomial, puisque les verbes sont ordonnés.", "score": -20.0, "feedback_html": "<p>Un contraste polynomial traduit une hypothèse a priori sur la forme de la tendance ; il ne compare pas les paires.<\/p>"}, {"texte_html": "La correction de Welch, puis des tests de Student.", "score": -50.0, "feedback_html": "<p>Welch ne se justifie qu'en cas de variances hétérogènes, ce que le test de Levene n'indique pas ici.<\/p>"}, {"texte_html": "Des comparaisons post-hoc de toutes les paires, avec la correction de Tukey.", "score": 100.0, "feedback_html": "<p>Exact. Tukey est recommandé quand les variances sont homogènes.<\/p>"}]}, {"id": "S-005-q4", "difficulte": 1, "question_html": "<p>Avant l'analyse, les chercheurs décident de comparer chaque verbe au verbe le plus neutre, <em>contacted<\/em>. Dans Jamovi, quel type de contraste choisir, et quel niveau placer en premier ?<\/p>", "question_texte": "Avant l'analyse, les chercheurs décident de comparer chaque verbe au verbe le plus neutre, *contacted*. Dans Jamovi, quel type de contraste choisir, et quel niveau placer en premier ?", "feedback_general_html": "<p>Le contraste <em>simple<\/em> compare chaque niveau au premier, qui doit donc être la référence, <em>contacted<\/em>. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "Le contraste <em>simple<\/em>, avec <em>contacted<\/em> en premier niveau.", "score": 100.0, "feedback_html": "<p>Exact. <em>simple<\/em> compare chaque niveau au premier, qui sert de référence.<\/p>"}, {"texte_html": "Le contraste <em>simple<\/em>, avec <em>smashed<\/em> en premier niveau.", "score": -20.0, "feedback_html": "<p>Le bon contraste, mais la référence serait le mauvais verbe.<\/p>"}, {"texte_html": "Le contraste <em>Helmert<\/em>, avec <em>contacted<\/em> en premier niveau.", "score": -30.0, "feedback_html": "<p><em>Helmert<\/em> compare chaque niveau à la moyenne des suivants, pas à une référence.<\/p>"}, {"texte_html": "Le contraste <em>polynomial<\/em>, avec <em>contacted<\/em> en premier niveau.", "score": -50.0, "feedback_html": "<p><em>polynomial<\/em> teste la forme d'une tendance, pas des comparaisons à une référence.<\/p>"}]}]}, {"id": "S-006", "type": "serie", "categorie": "choix", "cm": [2, 4], "etude": {"titre": "La rotation mentale (mesures répétées)"}, "etude_html": "<h4>La rotation mentale (mesures répétées)<\/h4><p>Shepard et Metzler (1971) présentaient des paires de dessins d'objets en cubes. Dans chaque paire, le second objet était tourné d'un certain angle, de 0° à 180°, par rapport au premier. Les participants devaient dire le plus vite possible si les deux objets étaient identiques. Chaque participant passait tous les angles, et le temps de réponse augmentait avec l'angle.<\/p><p>Pour l'exercice, on imagine une réplication avec 12 participants et quatre angles (0°, 60°, 120°, 180°). Pour chaque participant et chaque angle, on relève le temps de réponse moyen, en secondes.<\/p><p style=\"font-size:0.85em;color:#555\">Shepard, R. N., &amp; Metzler, J. (1971). Mental rotation of three-dimensional objects. <em>Science, 171<\/em>(3972), 701–703. https://doi.org/10.1126/science.171.3972.701<\/p>", "questions": [{"id": "S-006-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour tester l'effet de l'angle sur le temps de réponse ?<\/p>", "question_texte": "Quelle analyse convient pour tester l'effet de l'angle sur le temps de réponse ?", "feedback_general_html": "<p>Les mêmes participants passent les quatre angles : l'angle est un facteur intra-sujet. CM02.<\/p>", "options": [{"texte_html": "Une ANOVA simple à quatre groupes.", "score": -20.0, "feedback_html": "<p>Une ANOVA simple supposerait des groupes indépendants ; ici, les mêmes participants passent les quatre angles.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé 12 × 4.", "score": -50.0, "feedback_html": "<p>Les participants ne constituent pas un facteur croisé.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées, avec un facteur intra-sujet à quatre modalités.", "score": 100.0, "feedback_html": "<p>Exact. L'angle est un facteur intra-sujet.<\/p>"}, {"texte_html": "Une ANOVA mixte, avec l'angle comme facteur inter-sujets.", "score": -30.0, "feedback_html": "<p>Il n'y a aucun facteur inter-sujets ici, et l'angle est intra-sujet.<\/p>"}]}, {"id": "S-006-q2", "difficulte": 2, "question_html": "<p>Pour l'analyse dans Jamovi, les données sont saisies au format large. Comment se présente le tableau ?<\/p>", "question_texte": "Pour l'analyse dans Jamovi, les données sont saisies au format large. Comment se présente le tableau ?", "feedback_general_html": "<p>Au format large, chaque ligne est un participant et chaque mesure répétée a sa colonne. Le format long a une ligne par mesure, avec l'identifiant du participant. CM02, section Équiprobabilité, « Formats ».<\/p>", "options": [{"texte_html": "48 lignes et 2 colonnes : l'angle et le temps.", "score": -30.0, "feedback_html": "<p>Ce serait un format long, et il oublie l'identifiant du participant.<\/p>"}, {"texte_html": "12 lignes et 4 colonnes de temps, une par angle.", "score": 100.0, "feedback_html": "<p>Exact. Une ligne par participant, une colonne par mesure répétée.<\/p>"}, {"texte_html": "4 lignes et 12 colonnes, une par participant.", "score": -50.0, "feedback_html": "<p>Lignes et colonnes sont inversées : chaque ligne doit être un participant.<\/p>"}, {"texte_html": "48 lignes et 3 colonnes : le participant, l'angle et le temps.", "score": -20.0, "feedback_html": "<p>C'est le format long, pas le format large demandé.<\/p>"}]}, {"id": "S-006-q3", "difficulte": 2, "question_html": "<p>Avant l'analyse, les chercheurs font l'hypothèse que le temps de réponse augmente linéairement avec l'angle. Quel type de contraste correspond à cette hypothèse ?<\/p>", "question_texte": "Avant l'analyse, les chercheurs font l'hypothèse que le temps de réponse augmente linéairement avec l'angle. Quel type de contraste correspond à cette hypothèse ?", "feedback_general_html": "<p>Pour des niveaux ordonnés et régulièrement espacés, le contraste polynomial teste la tendance linéaire, puis quadratique. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "Un contraste <em>simple<\/em>, qui compare chaque angle à 0°.", "score": -30.0, "feedback_html": "<p>Il dirait si chaque angle diffère de 0°, pas si l'augmentation est régulière.<\/p>"}, {"texte_html": "Un contraste <em>repeated<\/em>, qui compare chaque angle au suivant.", "score": -20.0, "feedback_html": "<p>Il compare les angles voisins, sans tester une tendance en ligne droite.<\/p>"}, {"texte_html": "Un contraste <em>Helmert<\/em>, qui compare chaque angle à la moyenne des suivants.", "score": -50.0, "feedback_html": "<p>Il ne teste pas la forme de la relation entre angle et temps.<\/p>"}, {"texte_html": "Un contraste <em>polynomial<\/em>, dont la composante linéaire teste une tendance en ligne droite.", "score": 100.0, "feedback_html": "<p>Exact. Les angles sont ordonnés et régulièrement espacés.<\/p>"}]}, {"id": "S-006-q4", "difficulte": 1, "question_html": "<p>Supposons maintenant qu'aucune hypothèse n'ait été formulée à l'avance. Après un F significatif, on souhaite comparer les angles deux à deux. Quelle correction le cours recommande-t-il pour ce plan ?<\/p>", "question_texte": "Supposons maintenant qu'aucune hypothèse n'ait été formulée à l'avance. Après un F significatif, on souhaite comparer les angles deux à deux. Quelle correction le cours recommande-t-il pour ce plan ?", "feedback_general_html": "<p>Pour un plan à mesures répétées, Holm reste rigoureux tout en étant plus puissant que Bonferroni ; Tukey n'est pas adapté. CM02, section Compléments.<\/p>", "options": [{"texte_html": "La correction de Holm.", "score": 100.0, "feedback_html": "<p>Exact. Rigoureuse et plus puissante que Bonferroni.<\/p>"}, {"texte_html": "La correction de Tukey.", "score": -20.0, "feedback_html": "<p>Tukey n'est pas adapté aux mesures répétées.<\/p>"}, {"texte_html": "Aucune correction, puisque les mesures viennent des mêmes participants.", "score": -50.0, "feedback_html": "<p>Six comparaisons sans correction gonfleraient le risque d'erreur de type I.<\/p>"}, {"texte_html": "La correction de Bonferroni, parce qu'elle est la plus puissante.", "score": -30.0, "feedback_html": "<p>Bonferroni est au contraire la moins puissante ; Holm la surpasse.<\/p>"}]}]}, {"id": "S-007", "type": "serie", "categorie": "choix", "cm": [3, 4], "etude": {"titre": "La menace du stéréotype (plan croisé)"}, "etude_html": "<h4>La menace du stéréotype (plan croisé)<\/h4><p>Dans leur première étude, Steele et Aronson (1995) ont fait passer un test verbal difficile à 114 étudiants noirs ou blancs de l'université Stanford. La présentation du test, attribuée au hasard, prenait trois formes : test diagnostique des capacités intellectuelles, simple exercice de résolution de problèmes sans valeur diagnostique, ou exercice non diagnostique présenté comme un défi. La VD était la performance au test.<\/p><p>Les chercheurs faisaient l'hypothèse que la présentation diagnostique ferait baisser la performance des étudiants noirs, en activant un stéréotype négatif sur leur groupe, mais pas celle des étudiants blancs.<\/p><p style=\"font-size:0.85em;color:#555\">Steele, C. M., &amp; Aronson, J. (1995). Stereotype threat and the intellectual test performance of African Americans. <em>Journal of Personality and Social Psychology, 69<\/em>(5), 797–811. https://doi.org/10.1037/0022-3514.69.5.797<\/p>", "questions": [{"id": "S-007-q1", "difficulte": 1, "question_html": "<p>De quel plan s'agit-il ?<\/p>", "question_texte": "De quel plan s'agit-il ?", "feedback_general_html": "<p>Deux facteurs catégoriels inter-sujets sont croisés : le groupe des étudiants (2) et la présentation du test (3). CM03, section Factoriel.<\/p>", "options": [{"texte_html": "Un plan à mesures répétées à deux facteurs.", "score": -50.0, "feedback_html": "<p>Chaque participant n'appartient qu'à une cellule : aucun facteur n'est intra-sujet.<\/p>"}, {"texte_html": "Un plan croisé 2 × 3, avec deux facteurs inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Groupe (2 modalités) × présentation (3 modalités), une seule cellule par participant.<\/p>"}, {"texte_html": "Un plan mixte 2 × 3.", "score": -30.0, "feedback_html": "<p>Un plan mixte demande un facteur intra-sujet ; ici, chaque participant ne voit qu'une présentation.<\/p>"}, {"texte_html": "Un plan simple à trois groupes.", "score": -20.0, "feedback_html": "<p>Il ignorerait le groupe des étudiants, qui est au cœur de l'hypothèse.<\/p>"}]}, {"id": "S-007-q2", "difficulte": 1, "question_html": "<p>Quel effet faut-il examiner pour tester l'hypothèse des chercheurs ?<\/p>", "question_texte": "Quel effet faut-il examiner pour tester l'hypothèse des chercheurs ?", "feedback_general_html": "<p>L'hypothèse dit que l'effet de la présentation dépend du groupe : c'est la définition d'une interaction. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal de la présentation du test.", "score": -30.0, "feedback_html": "<p>Il moyenne sur les deux groupes d'étudiants ; or l'hypothèse dit que l'effet dépend du groupe.<\/p>"}, {"texte_html": "L'effet principal du groupe des étudiants.", "score": -50.0, "feedback_html": "<p>Il moyenne sur les trois présentations et ne dit rien de leur effet.<\/p>"}, {"texte_html": "L'effet simple de la présentation chez les étudiants blancs.", "score": -20.0, "feedback_html": "<p>Il ne teste qu'une moitié de l'hypothèse.<\/p>"}, {"texte_html": "L'interaction entre le groupe des étudiants et la présentation du test.", "score": 100.0, "feedback_html": "<p>Exact. L'effet de la présentation dépendrait du groupe.<\/p>"}]}, {"id": "S-007-q3", "difficulte": 1, "question_html": "<p>Supposons que les résultats confirment l'hypothèse des chercheurs. On trace le graphique des moyennes, avec la présentation du test en abscisse et une courbe par groupe d'étudiants. À quoi faut-il s'attendre ?<\/p>", "question_texte": "Supposons que les résultats confirment l'hypothèse des chercheurs. On trace le graphique des moyennes, avec la présentation du test en abscisse et une courbe par groupe d'étudiants. À quoi faut-il s'attendre ?", "feedback_general_html": "<p>Une interaction se lit sur le graphique des moyennes : des courbes non parallèles. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Deux courbes non parallèles.", "score": 100.0, "feedback_html": "<p>Exact. Si l'effet de la présentation diffère selon le groupe, les courbes ne sont pas parallèles.<\/p>"}, {"texte_html": "Deux courbes parallèles et nettement écartées.", "score": -20.0, "feedback_html": "<p>Ce serait un effet principal du groupe, sans interaction.<\/p>"}, {"texte_html": "Deux courbes confondues.", "score": -30.0, "feedback_html": "<p>Ce serait l'absence d'effet du groupe.<\/p>"}, {"texte_html": "Deux courbes horizontales.", "score": -50.0, "feedback_html": "<p>Ce serait l'absence d'effet de la présentation.<\/p>"}]}, {"id": "S-007-q4", "difficulte": 2, "question_html": "<p>Les six cellules n'ont pas le même effectif, et l'interaction est l'objet principal de l'étude. Quel type de sommes des carrés choisir ?<\/p>", "question_texte": "Les six cellules n'ont pas le même effectif, et l'interaction est l'objet principal de l'étude. Quel type de sommes des carrés choisir ?", "feedback_general_html": "<p>Le type III est la référence pour tester une interaction dans un plan déséquilibré, et le réglage par défaut de Jamovi. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Le type I, car l'ordre des facteurs reflète leur importance théorique.", "score": -30.0, "feedback_html": "<p>Le type I dépend de l'ordre des facteurs, sans justification ici.<\/p>"}, {"texte_html": "Le type II, car il est le plus puissant pour les effets principaux.", "score": -20.0, "feedback_html": "<p>Le type II suppose une interaction négligeable, alors qu'elle est ici l'objet de l'étude.<\/p>"}, {"texte_html": "Le type III.", "score": 100.0, "feedback_html": "<p>Exact. C'est la référence pour tester une interaction, et le réglage par défaut de Jamovi.<\/p>"}, {"texte_html": "Peu importe : les trois types donnent les mêmes résultats dans un plan croisé.", "score": -50.0, "feedback_html": "<p>Avec des effectifs inégaux, les trois types diffèrent.<\/p>"}]}]}, {"id": "S-008", "type": "serie", "categorie": "choix", "cm": [2, 3, 6], "etude": {"titre": "Croire que l'intelligence se développe (plan mixte)"}, "etude_html": "<h4>Croire que l&#x27;intelligence se développe (plan mixte)<\/h4><p>Dans leur deuxième étude, Blackwell, Trzesniewski et Dweck (2007) ont suivi 91 élèves américains de 7th grade (environ 12 ans) dont les notes de mathématiques déclinaient. Tous ont suivi un atelier de huit séances sur les méthodes de travail. Pour 48 d'entre eux (groupe expérimental), l'atelier enseignait aussi que l'intelligence se développe par l'apprentissage ; les 43 autres (groupe contrôle) recevaient à la place une séance sur la mémoire.<\/p><p>Pour l'exercice, on retient trois relevés des notes de mathématiques : avant l'atelier, à la fin du premier semestre et à la fin de l'année.<\/p><p style=\"font-size:0.85em;color:#555\">Blackwell, L. S., Trzesniewski, K. H., &amp; Dweck, C. S. (2007). Implicit theories of intelligence predict achievement across an adolescent transition: A longitudinal study and an intervention. <em>Child Development, 78<\/em>(1), 246–263. https://doi.org/10.1111/j.1467-8624.2007.00995.x<\/p>", "questions": [{"id": "S-008-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour étudier l'évolution des notes dans les deux groupes ?<\/p>", "question_texte": "Quelle analyse convient pour étudier l'évolution des notes dans les deux groupes ?", "feedback_general_html": "<p>Les élèves appartiennent à un seul groupe (inter-sujets) mais sont notés trois fois (intra-sujet) : c'est un plan mixte. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une ANOVA pour plan croisé 2 × 3, avec deux facteurs inter-sujets.", "score": -20.0, "feedback_html": "<p>Elle ignore que les trois relevés portent sur les mêmes élèves.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées, avec un facteur à six modalités.", "score": -30.0, "feedback_html": "<p>Elle ignore que le groupe est inter-sujets : chaque élève n'est que dans un groupe.<\/p>"}, {"texte_html": "Une ANOVA simple comparant les deux groupes sur la moyenne des trois relevés.", "score": -50.0, "feedback_html": "<p>Elle supprime l'évolution dans le temps, qui est la question posée.<\/p>"}, {"texte_html": "Une ANOVA mixte, avec le groupe comme facteur inter-sujets et le moment du relevé comme facteur intra-sujet.", "score": 100.0, "feedback_html": "<p>Exact. Un seul groupe par élève, trois relevés par élève.<\/p>"}]}, {"id": "S-008-q2", "difficulte": 2, "question_html": "<p>Quel résultat indiquerait que le groupe expérimental a de meilleures notes à tous les relevés, y compris avant l'atelier, sans que leur évolution diffère de celle du groupe contrôle ?<\/p>", "question_texte": "Quel résultat indiquerait que le groupe expérimental a de meilleures notes à tous les relevés, y compris avant l'atelier, sans que leur évolution diffère de celle du groupe contrôle ?", "feedback_general_html": "<p>Un écart constant entre les groupes se traduit par un effet principal du groupe ; l'absence de différence d'évolution, par une interaction non significative. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une interaction groupe × temps significative et un effet principal du groupe non significatif.", "score": -50.0, "feedback_html": "<p>Une interaction significative signalerait au contraire des évolutions différentes.<\/p>"}, {"texte_html": "Un effet principal du groupe significatif et une interaction groupe × temps non significative.", "score": 100.0, "feedback_html": "<p>Exact. Écart constant entre groupes : effet du groupe ; même évolution : pas d'interaction.<\/p>"}, {"texte_html": "Un effet principal du temps significatif, sans autre effet significatif.", "score": -20.0, "feedback_html": "<p>Cela décrirait une évolution commune aux deux groupes, sans écart entre eux.<\/p>"}, {"texte_html": "Un test de Mauchly significatif.", "score": -30.0, "feedback_html": "<p>Le test de Mauchly porte sur une condition d'application, pas sur les effets.<\/p>"}]}, {"id": "S-008-q3", "difficulte": 2, "question_html": "<p>Quelles conditions d'application propres à ce plan faut-il vérifier, en plus de l'indépendance et de la normalité ?<\/p>", "question_texte": "Quelles conditions d'application propres à ce plan faut-il vérifier, en plus de l'indépendance et de la normalité ?", "feedback_general_html": "<p>Dans un plan mixte, les conditions se cumulent : homogénéité des variances (Levene) pour la partie inter-sujets, sphéricité (Mauchly) pour la partie intra-sujet. CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "Seulement la sphéricité, car le temps est un facteur intra-sujet.", "score": -20.0, "feedback_html": "<p>Il faut aussi l'homogénéité des variances pour le facteur inter-sujets.<\/p>"}, {"texte_html": "Seulement l'homogénéité des variances, car le groupe est un facteur inter-sujets.", "score": -30.0, "feedback_html": "<p>Il faut aussi la sphéricité : le temps a trois modalités intra-sujet.<\/p>"}, {"texte_html": "L'homogénéité des variances pour le facteur groupe, et la sphéricité pour le facteur temps.", "score": 100.0, "feedback_html": "<p>Exact. Dans un plan mixte, les conditions se cumulent.<\/p>"}, {"texte_html": "Aucune, car l'ANOVA mixte est robuste.", "score": -50.0, "feedback_html": "<p>La robustesse de l'ANOVA ne dispense pas de vérifier les conditions.<\/p>"}]}, {"id": "S-008-q4", "difficulte": 3, "question_html": "<p>Si l'on n'avait retenu que deux relevés (avant et après l'atelier), que deviendrait la condition de sphéricité ?<\/p>", "question_texte": "Si l'on n'avait retenu que deux relevés (avant et après l'atelier), que deviendrait la condition de sphéricité ?", "feedback_general_html": "<p>La sphéricité compare les variances des différences entre paires de conditions. Avec deux modalités, il n'y a qu'une paire. CM02, section Formalisation ; CM06, section Désinformation.<\/p>", "options": [{"texte_html": "Elle n'aurait pas à être vérifiée : avec deux modalités, il n'existe qu'une seule différence entre conditions.", "score": 100.0, "feedback_html": "<p>Exact. Avec une seule paire de conditions, il n'y a rien à comparer.<\/p>"}, {"texte_html": "Il faudrait appliquer systématiquement la correction de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>Avec deux modalités, ε vaut toujours 1 : la correction ne changerait rien.<\/p>"}, {"texte_html": "Elle se vérifierait avec le test de Levene.", "score": -50.0, "feedback_html": "<p>Le test de Levene porte sur l'homogénéité des variances entre groupes, pas sur la sphéricité.<\/p>"}, {"texte_html": "Elle serait plus difficile à satisfaire qu'avec trois relevés.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : avec deux modalités, elle est toujours satisfaite.<\/p>"}]}]}, {"id": "S-013", "type": "serie", "categorie": "choix", "cm": [2, 3, 6], "etude": {"titre": "Apprendre sous l'eau (mesures répétées à deux facteurs)"}, "etude_html": "<h4>Apprendre sous l&#x27;eau (mesures répétées à deux facteurs)<\/h4><p>Godden et Baddeley (1975) faisaient apprendre des listes de 36 mots à 18 plongeurs, soit sur la plage, soit sous l'eau. Le rappel avait lieu ensuite soit dans le même environnement, soit dans l'autre. Chaque plongeur passait les quatre combinaisons (apprentissage sur terre ou sous l'eau × rappel sur terre ou sous l'eau), avec une liste différente à chaque fois. La VD était le nombre de mots rappelés. Les mots étaient mieux rappelés dans l'environnement où ils avaient été appris.<\/p><p>Dans le fichier de données, chaque plongeur occupe une ligne, et quatre colonnes contiennent ses scores : <em>Terre_Terre<\/em>, <em>Terre_Eau<\/em>, <em>Eau_Terre<\/em> et <em>Eau_Eau<\/em> (environnement d'apprentissage, puis de rappel).<\/p><p style=\"font-size:0.85em;color:#555\">Godden, D. R., &amp; Baddeley, A. D. (1975). Context-dependent memory in two natural environments: On land and underwater. <em>British Journal of Psychology, 66<\/em>(3), 325–331. https://doi.org/10.1111/j.2044-8295.1975.tb01468.x<\/p>", "questions": [{"id": "S-013-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour cette étude ?<\/p>", "question_texte": "Quelle analyse convient pour cette étude ?", "feedback_general_html": "<p>Les deux facteurs (environnement d'apprentissage, environnement de rappel) varient chez chaque plongeur : ils sont tous deux intra-sujets. CM02 ; CM06, section Désinformation.<\/p>", "options": [{"texte_html": "Une ANOVA mixte.", "score": -20.0, "feedback_html": "<p>Il n'y a aucun facteur inter-sujets : tous les plongeurs passent toutes les conditions.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées, avec deux facteurs intra-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Les deux environnements varient chez chaque plongeur.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé, avec deux facteurs inter-sujets.", "score": -30.0, "feedback_html": "<p>Les deux facteurs sont intra-sujets, pas inter-sujets.<\/p>"}, {"texte_html": "Une ANOVA simple à quatre groupes.", "score": -50.0, "feedback_html": "<p>Les quatre scores d'un plongeur ne sont pas indépendants, et deux facteurs sont croisés.<\/p>"}]}, {"id": "S-013-q2", "difficulte": 2, "question_html": "<p>Dans Jamovi (Analyses → ANOVA → Repeated Measures ANOVA), comment remplir la zone <em>Repeated Measures Factors<\/em> (facteurs de mesures répétées) ?<\/p>", "question_texte": "Dans Jamovi (Analyses → ANOVA → Repeated Measures ANOVA), comment remplir la zone *Repeated Measures Factors* (facteurs de mesures répétées) ?", "feedback_general_html": "<p>On déclare dans <em>Repeated Measures Factors<\/em> les facteurs intra-sujets et leurs modalités ; les colonnes de scores vont dans <em>Repeated Measures Cells<\/em>. CM06, section Désinformation, « Jamovi ».<\/p>", "options": [{"texte_html": "Créer deux facteurs, <em>Apprentissage<\/em> et <em>Rappel<\/em>, ayant chacun deux modalités : <em>Terre<\/em> et <em>Eau<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. On y déclare les facteurs intra-sujets et leurs modalités.<\/p>"}, {"texte_html": "Créer un seul facteur à quatre modalités.", "score": -20.0, "feedback_html": "<p>Un seul facteur à quatre modalités ne permettrait pas de tester l'interaction.<\/p>"}, {"texte_html": "Créer un facteur <em>Plongeur<\/em> ayant 18 modalités.", "score": -50.0, "feedback_html": "<p>Les participants ne sont pas un facteur à déclarer.<\/p>"}, {"texte_html": "Y glisser les quatre colonnes de scores.", "score": -30.0, "feedback_html": "<p>Les colonnes de scores se placent ensuite dans <em>Repeated Measures Cells<\/em>.<\/p>"}]}, {"id": "S-013-q3", "difficulte": 2, "question_html": "<p>Quel est l'avantage statistique de faire passer les quatre conditions à chaque plongeur, plutôt que de constituer quatre groupes indépendants de plongeurs ?<\/p>", "question_texte": "Quel est l'avantage statistique de faire passer les quatre conditions à chaque plongeur, plutôt que de constituer quatre groupes indépendants de plongeurs ?", "feedback_general_html": "<p>Chaque plongeur sert de point de comparaison à lui-même : la variabilité due aux différences individuelles ne gonfle plus le bruit. CM02, section Équiprobabilité, « A retenir ».<\/p>", "options": [{"texte_html": "Il n'y a plus aucune condition d'application à vérifier.", "score": -30.0, "feedback_html": "<p>Les conditions d'application restent à vérifier.<\/p>"}, {"texte_html": "On peut appliquer la correction de Welch.", "score": -50.0, "feedback_html": "<p>Welch concerne des groupes indépendants.<\/p>"}, {"texte_html": "Le nombre de participants est multiplié par quatre.", "score": -20.0, "feedback_html": "<p>Le nombre de participants ne change pas, seulement le nombre de mesures.<\/p>"}, {"texte_html": "La puissance augmente : les différences stables entre plongeurs (leur mémoire, par exemple) sont retirées du terme d'erreur.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "S-013-q4", "difficulte": 1, "question_html": "<p>Que faut-il placer dans la zone <em>Between Subject Factors<\/em> (facteurs inter-sujets) ?<\/p>", "question_texte": "Que faut-il placer dans la zone *Between Subject Factors* (facteurs inter-sujets) ?", "feedback_general_html": "<p>Tous les plongeurs passent toutes les conditions ; il n'y a pas de groupes indépendants. CM06, section Désinformation, « Jamovi ».<\/p>", "options": [{"texte_html": "<em>Apprentissage<\/em>", "score": -20.0, "feedback_html": "<p><em>Apprentissage<\/em> est un facteur intra-sujet.<\/p>"}, {"texte_html": "<em>Rappel<\/em>", "score": -30.0, "feedback_html": "<p><em>Rappel<\/em> est un facteur intra-sujet.<\/p>"}, {"texte_html": "Rien : l'étude n'a pas de facteur inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Tous les plongeurs passent toutes les conditions.<\/p>"}, {"texte_html": "Les quatre colonnes de scores.", "score": -50.0, "feedback_html": "<p>Les colonnes de scores vont dans <em>Repeated Measures Cells<\/em>.<\/p>"}]}, {"id": "S-013-q5", "difficulte": 2, "question_html": "<p>Les chercheurs prédisent que le rappel est meilleur quand l'environnement de rappel est le même que celui de l'apprentissage. Quel effet teste cette hypothèse ?<\/p>", "question_texte": "Les chercheurs prédisent que le rappel est meilleur quand l'environnement de rappel est le même que celui de l'apprentissage. Quel effet teste cette hypothèse ?", "feedback_general_html": "<p>L'hypothèse dit que l'effet de l'environnement de rappel dépend de l'environnement d'apprentissage : c'est une interaction. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal de l'environnement d'apprentissage.", "score": -30.0, "feedback_html": "<p>Il moyenne sur les deux environnements de rappel.<\/p>"}, {"texte_html": "L'interaction entre l'environnement d'apprentissage et l'environnement de rappel.", "score": 100.0, "feedback_html": "<p>Exact. L'effet de l'un dépend de l'autre.<\/p>"}, {"texte_html": "L'effet principal de l'environnement de rappel.", "score": -50.0, "feedback_html": "<p>Il moyenne sur les deux environnements d'apprentissage.<\/p>"}, {"texte_html": "L'effet simple de l'environnement de rappel pour un apprentissage sur terre.", "score": -20.0, "feedback_html": "<p>Il n'examine qu'une moitié de l'hypothèse.<\/p>"}]}, {"id": "S-013-q6", "difficulte": 2, "question_html": "<p>Faut-il vérifier la sphéricité dans cette analyse ?<\/p>", "question_texte": "Faut-il vérifier la sphéricité dans cette analyse ?", "feedback_general_html": "<p>Avec deux modalités, il n'existe qu'une seule différence entre conditions : la sphéricité est forcément respectée. CM06, section Désinformation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Non : chaque facteur intra-sujet n'a que deux modalités.", "score": 100.0, "feedback_html": "<p>Exact. Avec deux modalités, il n'existe qu'une seule différence entre conditions.<\/p>"}, {"texte_html": "Oui, car il y a quatre mesures par plongeur.", "score": -20.0, "feedback_html": "<p>La sphéricité se juge facteur par facteur : chacun n'a que deux modalités.<\/p>"}, {"texte_html": "Oui, avec le test de Levene.", "score": -30.0, "feedback_html": "<p>Levene teste l'homogénéité des variances entre groupes indépendants.<\/p>"}, {"texte_html": "Non, car l'échantillon est petit.", "score": -50.0, "feedback_html": "<p>Un petit échantillon n'est jamais une raison de ne pas vérifier.<\/p>"}]}, {"id": "S-013-q7", "difficulte": 3, "question_html": "<p>Supposons que l'analyse montre une interaction significative, sans aucun effet principal significatif. Que conclure ?<\/p>", "question_texte": "Supposons que l'analyse montre une interaction significative, sans aucun effet principal significatif. Que conclure ?", "feedback_general_html": "<p>Sans effet principal, aucun environnement ne donne en moyenne un meilleur rappel ; l'interaction montre que le rappel dépend de la correspondance entre les deux contextes. CM03, sections Factoriel et Compléments.<\/p>", "options": [{"texte_html": "L'environnement n'a aucun effet sur la mémoire.", "score": -30.0, "feedback_html": "<p>Ce serait ignorer l'interaction, qui est significative.<\/p>"}, {"texte_html": "On apprend mieux sous l'eau que sur terre.", "score": -50.0, "feedback_html": "<p>Ce serait un effet principal de l'apprentissage, qui n'est pas significatif.<\/p>"}, {"texte_html": "Il faut retirer l'interaction du modèle, puisque les effets principaux ne sont pas significatifs.", "score": -20.0, "feedback_html": "<p>On ne retire une interaction que si elle n'est pas significative.<\/p>"}, {"texte_html": "Aucun environnement n'est meilleur en soi : c'est la correspondance entre l'environnement d'apprentissage et celui du rappel qui compte.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}]}, {"id": "S-016", "type": "serie", "categorie": "choix", "cm": [1, 4], "etude": {"titre": "Le prix de l'entrée dans un groupe (plan simple, contrastes)"}, "etude_html": "<h4>Le prix de l&#x27;entrée dans un groupe (plan simple, contrastes)<\/h4><p>Aronson et Mills (1959) recrutaient des étudiantes volontaires pour participer à un groupe de discussion sur la psychologie de la sexualité. Avant d'y être admises, elles passaient une « épreuve d'entrée » qui variait selon la condition. Dans la condition <em>Sévère<\/em>, elles lisaient à voix haute une liste de mots obscènes et deux passages de romans décrivant des scènes sexuelles. Dans la condition <em>Légère<\/em>, elles lisaient à voix haute des mots en lien avec la sexualité, mais non obscènes. Dans la condition <em>Contrôle<\/em>, elles étaient admises sans épreuve. Toutes écoutaient ensuite le même enregistrement d'une discussion du groupe, volontairement ennuyeuse, puis évaluaient l'intérêt de la discussion et de ses membres. Les participantes de la condition <em>Sévère<\/em> jugeaient le groupe plus attrayant que les autres.<\/p><p>Pour l'exercice, on suppose 21 participantes par condition. Dans le fichier de données, la variable <em>Attrait<\/em> contient l'évaluation du groupe (plus elle est élevée, plus le groupe est jugé attrayant) et la variable <em>Initiation<\/em> indique la condition, avec les modalités rangées dans l'ordre <em>Contrôle<\/em>, <em>Légère<\/em>, <em>Sévère<\/em>. Avant l'étude, les chercheurs avaient formulé deux hypothèses : (1) une épreuve légère suffit à augmenter l'attrait par rapport à l'absence d'épreuve ; (2) l'épreuve sévère augmente l'attrait par rapport aux deux autres conditions réunies.<\/p><p style=\"font-size:0.85em;color:#555\">Aronson, E., &amp; Mills, J. (1959). The effect of severity of initiation on liking for a group. <em>Journal of Abnormal and Social Psychology, 59<\/em>(2), 177–181. https://doi.org/10.1037/h0047195<\/p>", "questions": [{"id": "S-016-q1", "difficulte": 1, "question_html": "<p>Quelle est la VI de cette étude ?<\/p>", "question_texte": "Quelle est la VI de cette étude ?", "feedback_general_html": "<p>La VI est la variable manipulée par les chercheurs : le type d'épreuve, à trois modalités. L'attrait est la VD. CM01, section Placebo, « Situation statistique ».<\/p>", "options": [{"texte_html": "Le type d'épreuve d'entrée (<em>Contrôle<\/em>, <em>Légère<\/em>, <em>Sévère<\/em>).", "score": 100.0, "feedback_html": "<p>Exact. C'est la variable manipulée, catégorielle à trois modalités.<\/p>"}, {"texte_html": "L'attrait du groupe de discussion.", "score": -20.0, "feedback_html": "<p>L'attrait est mesuré : c'est la VD.<\/p>"}, {"texte_html": "Le contenu de l'enregistrement.", "score": -30.0, "feedback_html": "<p>L'enregistrement est le même pour toutes : ce n'est pas une variable.<\/p>"}, {"texte_html": "Le nombre de participantes par condition.", "score": -50.0, "feedback_html": "<p>L'effectif décrit l'échantillon ; ce n'est pas une variable.<\/p>"}]}, {"id": "S-016-q2", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour tester l'effet du type d'épreuve sur l'attrait ?<\/p>", "question_texte": "Quelle analyse convient pour tester l'effet du type d'épreuve sur l'attrait ?", "feedback_general_html": "<p>Une VD numérique et un facteur inter-sujets à trois modalités : c'est le cas de l'ANOVA simple. CM01.<\/p>", "options": [{"texte_html": "Une ANOVA pour plan à mesures répétées.", "score": -30.0, "feedback_html": "<p>Chaque participante ne passe qu'une condition.<\/p>"}, {"texte_html": "Trois tests de Student, sans correction.", "score": -20.0, "feedback_html": "<p>Des tests sans correction augmenteraient le risque d'erreur de type I.<\/p>"}, {"texte_html": "Une ANOVA simple.", "score": 100.0, "feedback_html": "<p>Exact. Une VD numérique et un facteur inter-sujets à trois modalités.<\/p>"}, {"texte_html": "Une ANOVA mixte.", "score": -50.0, "feedback_html": "<p>Il n'y a qu'un facteur, inter-sujets.<\/p>"}]}, {"id": "S-016-q3", "difficulte": 3, "question_html": "<p>Les modalités étant rangées dans l'ordre <em>Contrôle<\/em>, <em>Légère<\/em>, <em>Sévère<\/em>, quel type de contraste prédéfini de Jamovi correspond exactement aux deux hypothèses des chercheurs ?<\/p>", "question_texte": "Les modalités étant rangées dans l'ordre *Contrôle*, *Légère*, *Sévère*, quel type de contraste prédéfini de Jamovi correspond exactement aux deux hypothèses des chercheurs ?", "feedback_general_html": "<p><em>difference<\/em> compare chaque niveau, sauf le premier, à la moyenne des niveaux qui le précèdent. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "<em>simple<\/em>", "score": -20.0, "feedback_html": "<p><em>simple<\/em> comparerait <em>Légère<\/em> et <em>Sévère<\/em> chacune à <em>Contrôle<\/em> : la seconde comparaison ne correspond pas à l'hypothèse 2.<\/p>"}, {"texte_html": "<em>repeated<\/em>", "score": -30.0, "feedback_html": "<p><em>repeated<\/em> comparerait <em>Sévère<\/em> à <em>Légère<\/em> seulement, pas à la moyenne des deux autres.<\/p>"}, {"texte_html": "<em>polynomial<\/em>", "score": -50.0, "feedback_html": "<p><em>polynomial<\/em> teste des tendances, pas ces comparaisons.<\/p>"}, {"texte_html": "<em>difference<\/em>", "score": 100.0, "feedback_html": "<p>Exact. <em>Légère<\/em> contre <em>Contrôle<\/em>, puis <em>Sévère<\/em> contre la moyenne de <em>Contrôle<\/em> et <em>Légère<\/em>.<\/p>"}]}, {"id": "S-016-q4", "difficulte": 2, "question_html": "<p>Les deux contrastes s'écrivent c1 = (1, −1, 0) et c2 = (1, 1, −2). Les groupes ont le même effectif. Que peut-on en dire ?<\/p>", "question_texte": "Les deux contrastes s'écrivent c1 = (1, −1, 0) et c2 = (1, 1, −2). Les groupes ont le même effectif. Que peut-on en dire ?", "feedback_general_html": "<p>1 × 1 + (−1) × 1 + 0 × (−2) = 0 : les deux contrastes sont orthogonaux et portent des informations indépendantes. CM04, section Contrastes, « Contrastes orthogonaux ».<\/p>", "options": [{"texte_html": "Ils ne sont pas orthogonaux, car leurs coefficients sont différents.", "score": -30.0, "feedback_html": "<p>Des coefficients différents n'empêchent pas l'orthogonalité : c'est la somme des produits qui compte.<\/p>"}, {"texte_html": "Ils sont orthogonaux, car la somme des produits de leurs coefficients est nulle.", "score": 100.0, "feedback_html": "<p>Exact. 1 × 1 + (−1) × 1 + 0 × (−2) = 0.<\/p>"}, {"texte_html": "Ce ne sont pas des contrastes, car leurs coefficients ne sont pas tous positifs.", "score": -50.0, "feedback_html": "<p>Un contraste a forcément des coefficients positifs et négatifs, de somme nulle.<\/p>"}, {"texte_html": "Ils sont orthogonaux, car chacun comporte trois coefficients.", "score": -20.0, "feedback_html": "<p>La conclusion est juste, mais pas la raison : c'est la somme des produits des coefficients qui doit être nulle.<\/p>"}]}, {"id": "S-016-q5", "difficulte": 2, "question_html": "<p>Quelle est l'hypothèse nulle testée par le contraste c2 = (1, 1, −2) ?<\/p>", "question_texte": "Quelle est l'hypothèse nulle testée par le contraste c2 = (1, 1, −2) ?", "feedback_general_html": "<p>Le contraste vaut 0 si et seulement si 2 × moyenne(<em>Sévère<\/em>) = moyenne(<em>Contrôle<\/em>) + moyenne(<em>Légère<\/em>). CM04, section Contrastes, « Exemple 2 ».<\/p>", "options": [{"texte_html": "La moyenne de la condition <em>Sévère<\/em> est égale à la moyenne des moyennes des conditions <em>Contrôle<\/em> et <em>Légère<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Le contraste vaut 0 si et seulement si 2 × moyenne(<em>Sévère<\/em>) = moyenne(<em>Contrôle<\/em>) + moyenne(<em>Légère<\/em>).<\/p>"}, {"texte_html": "Les trois moyennes sont égales.", "score": -30.0, "feedback_html": "<p>C'est l'hypothèse nulle de l'ANOVA globale.<\/p>"}, {"texte_html": "La moyenne de la condition <em>Sévère<\/em> est supérieure à celle des deux autres.", "score": -20.0, "feedback_html": "<p>C'est l'hypothèse des chercheurs, pas l'hypothèse nulle.<\/p>"}, {"texte_html": "La moyenne de la condition <em>Sévère<\/em> vaut le double de celle de la condition <em>Contrôle<\/em>.", "score": -50.0, "feedback_html": "<p>Le coefficient −2 sert à équilibrer la somme ; il ne compare pas <em>Sévère<\/em> au double de <em>Contrôle<\/em>.<\/p>"}]}, {"id": "S-016-q6", "difficulte": 1, "question_html": "<p>Dans Jamovi (Analyses → ANOVA → ANOVA), où choisit-on ce contraste ?<\/p>", "question_texte": "Dans Jamovi (Analyses → ANOVA → ANOVA), où choisit-on ce contraste ?", "feedback_general_html": "<p>La section <em>Contrasts<\/em> propose les contrastes prédéfinis (<em>deviation<\/em>, <em>simple<\/em>, <em>difference<\/em>, <em>Helmert<\/em>, <em>repeated<\/em>, <em>polynomial<\/em>) pour chaque facteur. CM04, section Contrastes, « Avec Jamovi ».<\/p>", "options": [{"texte_html": "Dans la section <em>Post Hoc Tests<\/em>.", "score": -20.0, "feedback_html": "<p><em>Post Hoc Tests<\/em> sert aux comparaisons non planifiées.<\/p>"}, {"texte_html": "Dans la section <em>Assumption Checks<\/em>.", "score": -50.0, "feedback_html": "<p><em>Assumption Checks<\/em> sert aux conditions d'application.<\/p>"}, {"texte_html": "Dans la section <em>Contrasts<\/em>, en choisissant le type de contraste pour le facteur <em>Initiation<\/em>.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Dans la section <em>Model<\/em>, en ajoutant un terme au modèle.", "score": -30.0, "feedback_html": "<p><em>Model<\/em> définit les effets du modèle, pas les contrastes.<\/p>"}]}, {"id": "S-016-q7", "difficulte": 2, "question_html": "<p>Un collègue propose plutôt de comparer toutes les paires de conditions par des tests post-hoc avec la correction de Tukey. Pourquoi les contrastes sont-ils préférables ici ?<\/p>", "question_texte": "Un collègue propose plutôt de comparer toutes les paires de conditions par des tests post-hoc avec la correction de Tukey. Pourquoi les contrastes sont-ils préférables ici ?", "feedback_general_html": "<p>Quand une prédiction est formulée à l'avance, le contraste planifié est plus ciblé et plus puissant que des comparaisons de toutes les paires. CM04, section Contrastes, « Attention ».<\/p>", "options": [{"texte_html": "Parce que la correction de Tukey n'est pas disponible dans Jamovi.", "score": -50.0, "feedback_html": "<p>Tukey est bien disponible dans Jamovi.<\/p>"}, {"texte_html": "Parce que les tests post-hoc exigent des groupes d'effectifs inégaux.", "score": -30.0, "feedback_html": "<p>Les tests post-hoc n'exigent rien de tel.<\/p>"}, {"texte_html": "Parce que les contrastes n'ont aucune condition d'application.", "score": -20.0, "feedback_html": "<p>Les contrastes reposent sur les mêmes conditions d'application que l'ANOVA.<\/p>"}, {"texte_html": "Parce que les hypothèses ont été formulées avant l'analyse : les contrastes les testent directement, avec plus de puissance.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}]}, {"id": "S-017", "type": "serie", "categorie": "choix", "cm": [1, 3, 4], "etude": {"titre": "Juger une élève d'après son milieu (plan croisé)"}, "etude_html": "<h4>Juger une élève d&#x27;après son milieu (plan croisé)<\/h4><p>Darley et Gross (1983) présentaient à des étudiants une vidéo d'environ 6 minutes montrant Hannah, une fillette en classe de CM1. Selon la condition, la vidéo et une fiche suggéraient un milieu social <em>Favorisé<\/em> (quartier résidentiel, parents diplômés de l'université) ou <em>Défavorisé<\/em> (quartier urbain dégradé, parents sans études supérieures). Ensuite, la moitié des participants de chaque condition regardaient une seconde vidéo de 12 minutes, où Hannah répondait à des problèmes scolaires de difficulté variée, avec une performance volontairement ambiguë ; l'autre moitié ne voyait pas cette seconde vidéo. Tous estimaient enfin le niveau scolaire d'Hannah. Sans la seconde vidéo, les deux conditions donnaient des estimations proches ; avec elle, les participants qui croyaient Hannah issue d'un milieu favorisé la jugeaient au-dessus de son niveau, et les autres en dessous.<\/p><p>Pour l'exercice, on suppose 15 participants par combinaison de conditions. Dans le fichier de données, la variable <em>Niveau<\/em> contient le niveau scolaire estimé, la variable <em>Milieu<\/em> le milieu présenté (<em>Favorisé<\/em>, <em>Défavorisé<\/em>), et la variable <em>Performance<\/em> indique si la seconde vidéo a été vue (<em>Vue<\/em>, <em>Non vue<\/em>).<\/p><p style=\"font-size:0.85em;color:#555\">Darley, J. M., &amp; Gross, P. H. (1983). A hypothesis-confirming bias in labeling effects. <em>Journal of Personality and Social Psychology, 44<\/em>(1), 20–33. https://doi.org/10.1037/0022-3514.44.1.20<\/p>", "questions": [{"id": "S-017-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour cette étude ?<\/p>", "question_texte": "Quelle analyse convient pour cette étude ?", "feedback_general_html": "<p>Deux facteurs (<em>Milieu<\/em>, <em>Performance<\/em>), chacun à deux modalités ; chaque participant ne connaît qu'une combinaison : plan croisé 2 × 2 à groupes indépendants. CM03, section Factoriel.<\/p>", "options": [{"texte_html": "Une ANOVA mixte.", "score": -30.0, "feedback_html": "<p>Aucun facteur n'est intra-sujet : chaque participant ne connaît qu'une combinaison.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé, avec deux facteurs inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. 2 × 2 = 4 groupes indépendants.<\/p>"}, {"texte_html": "Une ANOVA simple à deux groupes.", "score": -20.0, "feedback_html": "<p>Elle ignorerait l'un des deux facteurs.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées.", "score": -50.0, "feedback_html": "<p>Aucun facteur n'est intra-sujet.<\/p>"}]}, {"id": "S-017-q2", "difficulte": 2, "question_html": "<p>Dans Jamovi (Analyses → ANOVA → ANOVA), comment remplir les cases ?<\/p>", "question_texte": "Dans Jamovi (Analyses → ANOVA → ANOVA), comment remplir les cases ?", "feedback_general_html": "<p>La VD numérique va dans <em>Dependent Variable<\/em>, les deux facteurs inter-sujets dans <em>Fixed Factors<\/em>. CM01, section Conditions, « Jamovi » ; CM03.<\/p>", "options": [{"texte_html": "<em>Niveau<\/em> dans <em>Dependent Variable<\/em> ; <em>Milieu<\/em> et <em>Performance<\/em> dans <em>Fixed Factors<\/em> (facteurs fixes).", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "<em>Milieu<\/em> dans <em>Dependent Variable<\/em> ; <em>Niveau<\/em> et <em>Performance<\/em> dans <em>Fixed Factors<\/em>.", "score": -50.0, "feedback_html": "<p><em>Milieu<\/em> est un facteur, et <em>Niveau<\/em> est la VD numérique.<\/p>"}, {"texte_html": "<em>Niveau<\/em> dans <em>Dependent Variable<\/em> et <em>Milieu<\/em> dans <em>Fixed Factors<\/em> ; <em>Performance<\/em> n'est pas utilisée, car elle ne concerne que la moitié des participants.", "score": -20.0, "feedback_html": "<p><em>Performance<\/em> concerne bien tous les participants : la moitié l'ont vue, l'autre non.<\/p>"}, {"texte_html": "<em>Niveau<\/em> et <em>Performance<\/em> dans <em>Dependent Variable<\/em> ; <em>Milieu<\/em> dans <em>Fixed Factors<\/em>.", "score": -30.0, "feedback_html": "<p><em>Performance<\/em> est un facteur, pas une VD.<\/p>"}]}, {"id": "S-017-q3", "difficulte": 2, "question_html": "<p>Les auteurs pensent que l'information sur le milieu social n'influence le jugement que lorsqu'on a vu Hannah résoudre des problèmes. Quel effet teste cette hypothèse ?<\/p>", "question_texte": "Les auteurs pensent que l'information sur le milieu social n'influence le jugement que lorsqu'on a vu Hannah résoudre des problèmes. Quel effet teste cette hypothèse ?", "feedback_general_html": "<p>L'hypothèse dit que l'effet du milieu dépend de la performance vue : c'est la définition d'une interaction. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal du milieu.", "score": -30.0, "feedback_html": "<p>Il moyenne sur les deux niveaux de <em>Performance<\/em>.<\/p>"}, {"texte_html": "L'effet principal de la performance.", "score": -50.0, "feedback_html": "<p>Il ne dit rien de l'effet du milieu.<\/p>"}, {"texte_html": "L'effet simple du milieu chez les participants qui n'ont pas vu la seconde vidéo.", "score": -20.0, "feedback_html": "<p>Il n'examine qu'une partie de l'hypothèse.<\/p>"}, {"texte_html": "L'interaction <em>Milieu<\/em> × <em>Performance<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. L'effet du milieu dépendrait de la performance vue.<\/p>"}]}, {"id": "S-017-q4", "difficulte": 1, "question_html": "<p>Comment appelle-t-on l'effet du milieu social chez les seuls participants qui ont vu la seconde vidéo ?<\/p>", "question_texte": "Comment appelle-t-on l'effet du milieu social chez les seuls participants qui ont vu la seconde vidéo ?", "feedback_general_html": "<p>Un effet simple est l'effet d'un facteur pour un niveau fixé de l'autre facteur. CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "Un effet principal.", "score": -20.0, "feedback_html": "<p>L'effet principal du milieu serait moyenné sur les deux niveaux de <em>Performance<\/em>.<\/p>"}, {"texte_html": "Une interaction.", "score": -30.0, "feedback_html": "<p>L'interaction compare l'effet du milieu entre les deux niveaux de <em>Performance<\/em>.<\/p>"}, {"texte_html": "Un effet simple.", "score": 100.0, "feedback_html": "<p>Exact. L'effet d'un facteur pour un niveau fixé de l'autre.<\/p>"}, {"texte_html": "Un paradoxe de Simpson.", "score": -50.0, "feedback_html": "<p>Le paradoxe de Simpson désigne l'inversion d'un effet à l'agrégation.<\/p>"}]}, {"id": "S-017-q5", "difficulte": 2, "question_html": "<p>Supposons que l'interaction et l'effet principal du milieu soient tous deux significatifs. Comment interpréter l'effet principal du milieu ?<\/p>", "question_texte": "Supposons que l'interaction et l'effet principal du milieu soient tous deux significatifs. Comment interpréter l'effet principal du milieu ?", "feedback_general_html": "<p>Quand l'interaction est significative, l'effet principal, qui fait la moyenne, peut être trompeur : on interprète d'abord les effets simples. CM03, section Compléments, « Complément sur l'interaction ».<\/p>", "options": [{"texte_html": "Comme la preuve que le milieu influence le jugement dans toutes les conditions.", "score": -20.0, "feedback_html": "<p>L'interaction montre que l'effet du milieu n'est pas le même dans les deux conditions de performance.<\/p>"}, {"texte_html": "Avec prudence : il moyenne deux situations très différentes, et il faut d'abord examiner les effets simples.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Il faut l'ignorer et retirer le facteur <em>Milieu<\/em> du modèle.", "score": -30.0, "feedback_html": "<p>Retirer le facteur supprimerait aussi l'interaction qui teste l'hypothèse.<\/p>"}, {"texte_html": "Comme la preuve que la performance vue n'a aucun effet.", "score": -50.0, "feedback_html": "<p>L'effet du milieu ne dit rien de l'effet de la performance.<\/p>"}]}, {"id": "S-017-q6", "difficulte": 3, "question_html": "<p>Quelques participants ont été exclus, si bien que les quatre groupes n'ont plus le même effectif. L'interaction étant l'objet principal de l'étude, quel type de sommes des carrés faut-il choisir ?<\/p>", "question_texte": "Quelques participants ont été exclus, si bien que les quatre groupes n'ont plus le même effectif. L'interaction étant l'objet principal de l'étude, quel type de sommes des carrés faut-il choisir ?", "feedback_general_html": "<p>Avec des groupes déséquilibrés, le choix compte. Le type III est la référence quand l'interaction est l'objet de l'étude. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Le type I, car les groupes sont déséquilibrés.", "score": -30.0, "feedback_html": "<p>Le type I suppose une hiérarchie entre les facteurs, sans justification ici.<\/p>"}, {"texte_html": "Le type II, car c'est le plus puissant.", "score": -20.0, "feedback_html": "<p>Le type II n'est indiqué que si l'interaction n'est pas significative ou pas l'objet principal.<\/p>"}, {"texte_html": "Peu importe : le type de sommes des carrés ne change jamais rien dans un plan croisé.", "score": -50.0, "feedback_html": "<p>Avec des groupes déséquilibrés, le choix compte.<\/p>"}, {"texte_html": "Le type III, réglage par défaut et référence pour tester une interaction.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "S-017-q7", "difficulte": 1, "question_html": "<p>Si l'hypothèse des auteurs est juste, à quoi devrait ressembler le graphique des moyennes, avec <em>Performance<\/em> en abscisse (<em>Non vue<\/em>, puis <em>Vue<\/em>) et une courbe par milieu ?<\/p>", "question_texte": "Si l'hypothèse des auteurs est juste, à quoi devrait ressembler le graphique des moyennes, avec *Performance* en abscisse (*Non vue*, puis *Vue*) et une courbe par milieu ?", "feedback_general_html": "<p>Sans la seconde vidéo, les deux milieux reçoivent des estimations proches ; avec elle, l'écart se creuse : les courbes ne sont pas parallèles. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Deux courbes proches pour <em>Non vue<\/em>, qui s'écartent pour <em>Vue<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Les courbes ne sont pas parallèles : c'est l'interaction attendue.<\/p>"}, {"texte_html": "Deux courbes parallèles et nettement écartées.", "score": -20.0, "feedback_html": "<p>Des courbes parallèles indiqueraient l'absence d'interaction.<\/p>"}, {"texte_html": "Deux courbes confondues sur toute la largeur.", "score": -30.0, "feedback_html": "<p>Ce serait l'absence de tout effet du milieu.<\/p>"}, {"texte_html": "Deux courbes parallèles et horizontales.", "score": -50.0, "feedback_html": "<p>Ce serait l'absence d'interaction et d'effet de la performance.<\/p>"}]}]}, {"id": "S-020", "type": "serie", "categorie": "choix", "cm": [1, 4, 5], "etude": {"titre": "Mentir pour un dollar (plan simple)"}, "etude_html": "<h4>Mentir pour un dollar (plan simple)<\/h4><p>Festinger et Carlsmith (1959) faisaient accomplir à des étudiants une tâche très ennuyeuse pendant une heure (tourner des chevilles d'un quart de tour). Les participants étaient ensuite répartis au hasard en trois conditions. Dans les conditions <em>1 dollar<\/em> et <em>20 dollars<\/em>, on les payait pour dire au participant suivant que la tâche était passionnante ; dans la condition <em>Contrôle<\/em>, on ne leur demandait rien. Tous évaluaient enfin l'intérêt de la tâche sur une échelle de −5 (très ennuyeuse) à +5 (très intéressante).<\/p><p>Selon la théorie de la dissonance cognitive, ceux qui ont menti pour une petite somme, sans justification suffisante, devraient changer d'avis sur la tâche et la juger plus intéressante que les deux autres groupes.<\/p><p style=\"font-size:0.85em;color:#555\">Festinger, L., &amp; Carlsmith, J. M. (1959). Cognitive consequences of forced compliance. <em>Journal of Abnormal and Social Psychology, 58<\/em>(2), 203–210. https://doi.org/10.1037/h0041593<\/p>", "questions": [{"id": "S-020-q1", "difficulte": 1, "question_html": "<p>Quelle est la VD de cette étude ?<\/p>", "question_texte": "Quelle est la VD de cette étude ?", "feedback_general_html": "<p>La VD est la variable mesurée : l'intérêt déclaré pour la tâche. La VI, manipulée, est la condition (trois modalités). CM01, section Placebo.<\/p>", "options": [{"texte_html": "Le fait de mentir ou non au participant suivant.", "score": -20.0, "feedback_html": "<p>Ce mensonge fait partie de la manipulation, il n'est pas mesuré.<\/p>"}, {"texte_html": "La durée de la tâche.", "score": -50.0, "feedback_html": "<p>Elle est la même pour tous les participants.<\/p>"}, {"texte_html": "L'intérêt perçu de la tâche, évalué de −5 à +5.", "score": 100.0, "feedback_html": "<p>Exact. C'est ce que les chercheurs mesurent.<\/p>"}, {"texte_html": "La somme d'argent reçue.", "score": -30.0, "feedback_html": "<p>La condition (1 dollar, 20 dollars, contrôle) est manipulée : c'est la VI.<\/p>"}]}, {"id": "S-020-q2", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour comparer l'intérêt moyen déclaré dans les trois conditions ?<\/p>", "question_texte": "Quelle analyse convient pour comparer l'intérêt moyen déclaré dans les trois conditions ?", "feedback_general_html": "<p>Une VI inter-sujets à trois modalités et une VD quantitative : ANOVA à un facteur. CM01, section Philosophie.<\/p>", "options": [{"texte_html": "Une ANOVA à mesures répétées.", "score": -30.0, "feedback_html": "<p>Chaque participant n'est que dans une condition : les groupes sont indépendants.<\/p>"}, {"texte_html": "Une ANOVA à un facteur inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Une VD quantitative, une VI à trois modalités, des groupes indépendants.<\/p>"}, {"texte_html": "Une ANOVA à deux facteurs croisés.", "score": -50.0, "feedback_html": "<p>Il n'y a qu'une VI.<\/p>"}, {"texte_html": "Trois tests t de Student, un pour chaque paire de conditions.", "score": -20.0, "feedback_html": "<p>Multiplier les tests sans correction gonfle le risque d'erreur de type I ; l'ANOVA teste d'abord l'effet global.<\/p>"}]}, {"id": "S-020-q3", "difficulte": 2, "question_html": "<p>Les niveaux du facteur sont rangés dans l'ordre <em>1 dollar<\/em>, <em>20 dollars<\/em>, <em>Contrôle<\/em>. Quel contraste traduit le plus directement l'hypothèse de la dissonance cognitive ?<\/p>", "question_texte": "Les niveaux du facteur sont rangés dans l'ordre *1 dollar*, *20 dollars*, *Contrôle*. Quel contraste traduit le plus directement l'hypothèse de la dissonance cognitive ?", "feedback_general_html": "<p>Un contraste compare des moyennes avec des coefficients de somme nulle. Opposer un groupe à la moyenne des deux autres : (2, −1, −1). CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "(2, −1, −1) : la condition <em>1 dollar<\/em> contre la moyenne des deux autres.", "score": 100.0, "feedback_html": "<p>Exact. L'hypothèse oppose la condition <em>1 dollar<\/em> aux deux autres.<\/p>"}, {"texte_html": "(1, 1, −2) : les deux conditions payées contre la condition contrôle.", "score": -30.0, "feedback_html": "<p>Il teste l'effet d'avoir été payé, sans distinguer les deux sommes.<\/p>"}, {"texte_html": "(1, −1, 0) : la condition <em>1 dollar<\/em> contre la condition <em>20 dollars<\/em>.", "score": -20.0, "feedback_html": "<p>Ce contraste laisse de côté la condition contrôle, alors que l'hypothèse porte aussi sur elle.<\/p>"}, {"texte_html": "(1, 1, 1).", "score": -50.0, "feedback_html": "<p>Ce n'est pas un contraste : ses coefficients ne somment pas à zéro.<\/p>"}]}, {"id": "S-020-q4", "difficulte": 2, "question_html": "<p>Dans Jamovi (ANOVA → <em>Contrasts<\/em>), quel type de contraste teste en premier la condition <em>1 dollar<\/em> contre la moyenne des deux autres, avec cet ordre des niveaux ?<\/p>", "question_texte": "Dans Jamovi (ANOVA → *Contrasts*), quel type de contraste teste en premier la condition *1 dollar* contre la moyenne des deux autres, avec cet ordre des niveaux ?", "feedback_general_html": "<p>Helmert : niveau 1 contre la moyenne des niveaux 2 et 3, puis niveau 2 contre niveau 3. Avec cet ordre, le premier contraste traduit l'hypothèse. CM04, section Contrastes, « Avec Jamovi ».<\/p>", "options": [{"texte_html": "<em>Polynomial<\/em>.", "score": -50.0, "feedback_html": "<p>Il cherche des tendances (linéaire, quadratique) sur des niveaux ordonnés.<\/p>"}, {"texte_html": "<em>Deviation<\/em>.", "score": -20.0, "feedback_html": "<p><em>Deviation<\/em> compare chaque niveau (sauf le premier) à la moyenne générale.<\/p>"}, {"texte_html": "<em>Simple<\/em>.", "score": -30.0, "feedback_html": "<p><em>Simple<\/em> compare chaque niveau au premier, pris comme référence, un par un.<\/p>"}, {"texte_html": "<em>Helmert<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Le premier contraste de Helmert compare le premier niveau à la moyenne des niveaux suivants.<\/p>"}]}, {"id": "S-020-q5", "difficulte": 2, "question_html": "<p>Supposons que le test de Levene soit significatif (p = .004). Que faire ?<\/p>", "question_texte": "Supposons que le test de Levene soit significatif (p = .004). Que faire ?", "feedback_general_html": "<p>Si l'homogénéité des variances est rejetée, on lit l'ANOVA de Welch. CM01, section Conditions, « Jamovi ».<\/p>", "options": [{"texte_html": "Garder l'ANOVA classique, qui est toujours robuste.", "score": -20.0, "feedback_html": "<p>Avec des effectifs égaux, l'ANOVA est assez robuste, mais la règle vue en cours est de lire Welch quand Levene est significatif.<\/p>"}, {"texte_html": "Conclure que la condition a un effet sur l'intérêt déclaré.", "score": -50.0, "feedback_html": "<p>Le test de Levene compare des variances, pas des moyennes.<\/p>"}, {"texte_html": "Lire le test de Welch (<em>One-Way ANOVA<\/em> de Jamovi), qui NE suppose PAS l'égalité des variances.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Appliquer la correction de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>Cette correction concerne la sphéricité, dans les plans à mesures répétées.<\/p>"}]}, {"id": "S-020-q6", "difficulte": 2, "question_html": "<p>Les chercheurs veulent rapporter la taille de l'effet de la condition. Quel indice convient, et avec quels repères ?<\/p>", "question_texte": "Les chercheurs veulent rapporter la taille de l'effet de la condition. Quel indice convient, et avec quels repères ?", "feedback_general_html": "<p>Pour une ANOVA à un facteur, on rapporte η² (égal ici à η²p), éventuellement ω², avec les repères de Cohen (1988). CM05, section Classique.<\/p>", "options": [{"texte_html": "η²G, interprété avec les seuils de Bakeman (2005).", "score": -20.0, "feedback_html": "<p>η²G sert surtout dans les plans à mesures répétées ; avec un seul facteur inter-sujets, il est égal à η².<\/p>"}, {"texte_html": "η², interprété avec les repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.", "score": 100.0, "feedback_html": "<p>Exact. Avec un seul facteur, η² et η²p sont égaux.<\/p>"}, {"texte_html": "La valeur p : plus elle est petite, plus l'effet est grand.", "score": -50.0, "feedback_html": "<p>p dépend de l'effectif ; ce n'est pas une taille d'effet.<\/p>"}, {"texte_html": "Le F de Fisher, interprété avec les repères de Cohen.", "score": -30.0, "feedback_html": "<p>F est une statistique de test, pas une taille d'effet.<\/p>"}]}]}, {"id": "S-022", "type": "serie", "categorie": "choix", "cm": [2, 4, 5], "etude": {"titre": "L'effet de simple exposition (mesures répétées)"}, "etude_html": "<h4>L&#x27;effet de simple exposition (mesures répétées)<\/h4><p>Zajonc (1968) présentait à des étudiants des mots turcs qu'ils ne connaissaient pas. Chaque mot apparaissait 0, 1, 2, 5, 10 ou 25 fois, de sorte que chaque participant voyait des mots à chacune de ces six fréquences. Les participants devaient ensuite deviner si chaque mot avait un sens positif ou négatif, sur une échelle de 0 (très négatif) à 6 (très positif). On calcule pour chacun la note moyenne à chaque fréquence d'exposition.<\/p><p>L'hypothèse : plus un mot a été vu souvent, plus il est jugé positif.<\/p><p style=\"font-size:0.85em;color:#555\">Zajonc, R. B. (1968). Attitudinal effects of mere exposure. <em>Journal of Personality and Social Psychology, 9<\/em>(2, Pt. 2), 1–27. https://doi.org/10.1037/h0025848<\/p>", "questions": [{"id": "S-022-q1", "difficulte": 1, "question_html": "<p>Comment décrire le facteur <em>Fréquence d'exposition<\/em> ?<\/p>", "question_texte": "Comment décrire le facteur *Fréquence d'exposition* ?", "feedback_general_html": "<p>Un facteur dont chaque participant passe toutes les modalités est intra-sujet. CM02, section Formalisation.<\/p>", "options": [{"texte_html": "La VD de l'étude.", "score": -50.0, "feedback_html": "<p>La fréquence est manipulée : c'est la VI. La VD est l'évaluation du sens du mot.<\/p>"}, {"texte_html": "Un facteur intra-sujet à deux modalités, <em>vu<\/em> et <em>jamais vu<\/em>.", "score": -20.0, "feedback_html": "<p>Les six fréquences sont distinguées : 0, 1, 2, 5, 10 et 25.<\/p>"}, {"texte_html": "Un facteur intra-sujet à six modalités.", "score": 100.0, "feedback_html": "<p>Exact. Chaque participant voit des mots aux six fréquences.<\/p>"}, {"texte_html": "Un facteur inter-sujets à six modalités.", "score": -30.0, "feedback_html": "<p>Les participants ne sont pas répartis en six groupes : chacun passe toutes les fréquences.<\/p>"}]}, {"id": "S-022-q2", "difficulte": 1, "question_html": "<p>Quelle analyse de Jamovi faut-il utiliser ?<\/p>", "question_texte": "Quelle analyse de Jamovi faut-il utiliser ?", "feedback_general_html": "<p>Mesures répétées : Analyses → ANOVA → Repeated Measures ANOVA, données au format large (une colonne par modalité). CM02, section Équiprobabilité, « Formats ».<\/p>", "options": [{"texte_html": "<em>One-Way ANOVA<\/em>, pour obtenir le test de Welch.", "score": -50.0, "feedback_html": "<p>Le test de Welch concerne des groupes indépendants aux variances inégales.<\/p>"}, {"texte_html": "<em>ANOVA<\/em>, avec la fréquence dans <em>Fixed Factors<\/em>.", "score": -30.0, "feedback_html": "<p>Cette analyse suppose des observations indépendantes, ce qui n'est pas le cas quand les mêmes participants sont mesurés six fois.<\/p>"}, {"texte_html": "<em>Repeated Measures ANOVA<\/em>, avec une seule colonne contenant les six notes de chaque participant à la suite.", "score": -20.0, "feedback_html": "<p>La bonne analyse, mais Jamovi attend le format large : une colonne par modalité.<\/p>"}, {"texte_html": "<em>Repeated Measures ANOVA<\/
