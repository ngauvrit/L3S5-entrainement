"S-027-q3", "difficulte": 2, "question_html": "<p>D'après le graphique et les moyennes marginales, comment décrire l'interaction ?<\/p>", "question_texte": "D'après le graphique et les moyennes marginales, comment décrire l'interaction ?", "feedback_general_html": "<p>La progression a lieu pendant l'intervalle qui contient du sommeil, quel que soit le moment de l'entraînement : c'est ce que traduit l'interaction. CM03, sections Factoriel et Plans mixtes.<\/p>", "options": [{"texte_html": "Le groupe <em>Soir<\/em> est meilleur que le groupe <em>Matin<\/em> à toutes les sessions.", "score": -30.0, "feedback_html": "<p>À l'entraînement et à 24 h, les deux groupes sont proches ; ils ne diffèrent qu'à 12 h.<\/p>"}, {"texte_html": "Aucun groupe ne progresse.", "score": -50.0, "feedback_html": "<p>Les deux groupes passent d'environ 14 à près de 18 séquences.<\/p>"}, {"texte_html": "Chaque groupe progresse surtout pendant l'intervalle qui contient une nuit de sommeil : entre 0 et 12 h pour le groupe <em>Soir<\/em>, entre 12 h et 24 h pour le groupe <em>Matin<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Matin : 13.98, 14.61, 17.89 ; Soir : 13.61, 17.16, 17.58.<\/p>"}, {"texte_html": "Les deux groupes progressent de façon parallèle.", "score": -20.0, "feedback_html": "<p>Des courbes parallèles signifieraient l'absence d'interaction ; ici, elles s'écartent à 12 h.<\/p>"}]}, {"id": "S-027-q4", "difficulte": 3, "question_html": "<p>L'effet principal du groupe n'est pas significatif (p = .474). Comment l'interpréter ?<\/p>", "question_texte": "L'effet principal du groupe n'est pas significatif (p = .474). Comment l'interpréter ?", "feedback_general_html": "<p>L'effet principal du groupe moyenne les trois sessions ; les groupes ne diffèrent nettement qu'à 12 h. L'interaction répond à la question posée. CM03, section Compléments.<\/p>", "options": [{"texte_html": "Les deux groupes étaient très différents dès l'entraînement.", "score": -50.0, "feedback_html": "<p>À l'entraînement, les moyennes sont proches (13.98 et 13.61).<\/p>"}, {"texte_html": "En moyenne sur les trois sessions, les groupes ne diffèrent pas : leur écart n'existe qu'à 12 h, ce que la moyenne dilue.", "score": 100.0, "feedback_html": "<p>Exact. C'est l'interaction qui porte la question de recherche.<\/p>"}, {"texte_html": "Le sommeil n'a aucun effet sur l'apprentissage moteur.", "score": -30.0, "feedback_html": "<p>Le moment du sommeil, et non le groupe en lui-même, explique la progression : l'interaction est significative.<\/p>"}, {"texte_html": "Il faut retirer l'interaction du modèle.", "score": -20.0, "feedback_html": "<p>On ne retire une interaction que si elle n'est pas significative.<\/p>"}]}, {"id": "S-027-q5", "difficulte": 2, "question_html": "<p>Comment qualifier la taille de l'effet d'interaction (η²G = 0.071) ?<\/p><p><em>Rappel : seuils de Bakeman (2005) pour η²G : 0,02 petit, 0,13 moyen, 0,26 grand.<\/em><\/p>", "question_texte": "Comment qualifier la taille de l'effet d'interaction (η²G = 0.071) ?\n\n*Rappel : seuils de Bakeman (2005) pour η²G : 0,02 petit, 0,13 moyen, 0,26 grand.*", "feedback_general_html": "<p>η²G = 0.071 se situe entre 0,02 (petit) et 0,13 (moyen) selon Bakeman (2005). CM02, section Compléments ; CM05.<\/p>", "options": [{"texte_html": "Nul, puisque η²G est inférieur à 0,1.", "score": -50.0, "feedback_html": "<p>0.071 dépasse le seuil d'un petit effet.<\/p>"}, {"texte_html": "Petit à moyen : η²G dépasse le seuil d'un petit effet, sans atteindre celui d'un effet moyen.", "score": 100.0, "feedback_html": "<p>Exact. 0.071 se situe entre 0,02 et 0,13.<\/p>"}, {"texte_html": "Grand, puisque p &lt; .001.", "score": -30.0, "feedback_html": "<p>La valeur p ne dit rien de la taille d'un effet.<\/p>"}, {"texte_html": "Moyen, puisque η²G est supérieur à 0,06.", "score": -20.0, "feedback_html": "<p>0,06 est un repère de Cohen pour η² ; pour η²G, le seuil d'un effet moyen est 0,13.<\/p>"}]}, {"id": "S-027-q6", "difficulte": 2, "question_html": "<p>Dans la fenêtre <em>Repeated Measures ANOVA<\/em> de Jamovi, comment a-t-on rempli les cases pour obtenir cette sortie ?<\/p>", "question_texte": "Dans la fenêtre *Repeated Measures ANOVA* de Jamovi, comment a-t-on rempli les cases pour obtenir cette sortie ?", "feedback_general_html": "<p>On déclare le facteur intra-sujet et ses modalités dans <em>Repeated Measures Factors<\/em>, on glisse chaque colonne dans sa case de <em>Repeated Measures Cells<\/em>, et le facteur inter-sujets va dans <em>Between Subject Factors<\/em>. CM06, section Désinformation, « Jamovi ».<\/p>", "options": [{"texte_html": "Une seule colonne de vitesse dans <em>Repeated Measures Cells<\/em>.", "score": -20.0, "feedback_html": "<p>Chaque modalité de <em>Session<\/em> a sa colonne : il faut trois colonnes (format large).<\/p>"}, {"texte_html": "Facteur <em>Session<\/em> (3 modalités) dans <em>Repeated Measures Factors<\/em>, les trois colonnes de vitesse dans <em>Repeated Measures Cells<\/em>, <em>Groupe<\/em> dans <em>Between Subject Factors<\/em>.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "<em>Groupe<\/em> dans <em>Repeated Measures Factors<\/em>, <em>Session<\/em> dans <em>Between Subject Factors<\/em>.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : <em>Session<\/em> est intra-sujet, <em>Groupe<\/em> inter-sujets.<\/p>"}, {"texte_html": "<em>Vitesse<\/em> dans <em>Dependent Variable<\/em> et les deux facteurs dans <em>Fixed Factors<\/em>.", "score": -50.0, "feedback_html": "<p>Ce sont les cases de l'ANOVA pour groupes indépendants, pas de l'ANOVA à mesures répétées.<\/p>"}]}]}]</script>
<script>
(function () {
  "use strict";
  const BASE = JSON.parse(document.getElementById("donnees").textContent);
  const app = document.getElementById("app");
  const LETTRES = "ABCD";
  const NOMS_CAT = { comprehension: "Cours et réflexion", choix: "Choisir le test", interpretation: "Sortie Jamovi" };

  // --- mémoire légère dans le navigateur (questions déjà vues) ---
  function lireVues() { try { return JSON.parse(localStorage.getItem("l3s5-vues") || "{}"); } catch (e) { return {}; } }
  function ecrireVues(v) { try { localStorage.setItem("l3s5-vues", JSON.stringify(v)); } catch (e) {} }

  function melanger(t) { t = t.slice(); for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function fmtPoints(p) { const s = (Math.round(p * 100) / 100).toString().replace(".", ","); return (p > 0 ? "+" : "") + s; }

  let session = null;

  // ------------------------------------------------------------ accueil
  function accueil() {
    const cms = [1, 2, 3, 4, 5, 6];
    app.innerHTML = `
      <h2>Composer une série d'exercices</h2>
      <p class="note">Les questions sont tirées au hasard, en priorité parmi celles que vous n'avez pas encore vues sur cet appareil.</p>
      <form id="reglages">
        <fieldset><legend>Cours magistraux</legend><div class="choix">
          ${cms.map(c => `<label><input type="checkbox" name="cm" value="${c}" checked> CM ${c}</label>`).join("")}
        </div></fieldset>
        <fieldset><legend>Type de questions</legend><div class="choix">
          <label><input type="checkbox" name="cat" value="comprehension" checked> Questions de cours et de réflexion</label>
          <label><input type="checkbox" name="cat" value="choix" checked> Choisir le test (séries sur une expérience)</label>
          <label><input type="checkbox" name="cat" value="interpretation" checked> Interpréter une sortie Jamovi (séries)</label>
        </div></fieldset>
        <fieldset><legend>Difficulté</legend><div class="choix">
          <label><input type="checkbox" name="diff" value="1" checked> Facile</label>
          <label><input type="checkbox" name="diff" value="2" checked> Moyenne</label>
          <label><input type="checkbox" name="diff" value="3" checked> Difficile</label>
        </div></fieldset>
        <fieldset><legend>Nombre de questions</legend><div class="choix">
          ${[5, 10, 20, 40].map((n, i) => `<label><input type="radio" name="nb" value="${n}" ${i === 1 ? "checked" : ""}> ${n}</label>`).join("")}
        </div>
        <p class="note">Une étude compte pour toutes ses questions : le total peut dépasser un peu le nombre demandé.</p></fieldset>
        <div class="bloc"><strong>Barème de l'examen.</strong> Bonne réponse : +1 point. Mauvaise réponse : un retrait qui dépend de la gravité de l'erreur (−0,2, −0,3 ou −0,5). « Je ne sais pas » : 0 point.</div>
        <p id="erreur" class="note" role="alert"></p>
        <div class="boutons"><button type="submit" class="principal">Commencer</button></div>
      </form>`;
    document.getElementById("reglages").addEventListener("submit", ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const r = { cm: f.getAll("cm").map(Number), cat: f.getAll("cat"), diff: f.getAll("diff").map(Number), nb: Number(f.get("nb")) };
      const items = tirer(r);
      if (!items.length) { document.getElementById("erreur").textContent = "Aucune question ne correspond à ces réglages. Élargissez la sélection."; return; }
      session = { items, i: 0, reponses: [] };
      afficherQuestion();
    });
  }

  // ------------------------------------------------------------ tirage
  function tirer(r) {
    const vues = lireVues();
    const unites = [];
    for (const ex of BASE) {
      if (!r.cat.includes(ex.categorie)) continue;
      if (!ex.cm.some(c => r.cm.includes(c))) continue;
      if (ex.type === "serie") {
        const qs = ex.questions.filter(q => r.diff.includes(q.difficulte));
        if (!qs.length) continue;
        unites.push({ cle: ex.id, questions: ex.questions.map(q => Object.assign({ serie: ex, categorie: ex.categorie, cm: ex.cm }, q)) });
      } else if (r.diff.includes(ex.difficulte)) {
        unites.push({ cle: ex.id, questions: [ex] });
      }
    }
    const triees = melanger(unites).sort((a, b) => (vues[a.cle] || 0) - (vues[b.cle] || 0));
    const choisies = [];
    let n = 0;
    for (const u of triees) {
      if (n >= r.nb) break;
      if (n > 0 && n + u.questions.length > r.nb + 4) continue;
      choisies.push(u); n += u.questions.length;
    }
    // séries groupées, questions isolées mélangées autour
    return melanger(choisies).flatMap(u => u.questions.map(q => Object.assign({}, q, { options: melanger(q.options) })));
  }

  // ------------------------------------------------------------ question
  function afficherQuestion() {
    const q = session.items[session.i], total = session.items.length;
    const etude = q.serie ? `
      <div class="bloc etude">
        ${session.i > 0 && session.items[session.i - 1].serie === q.serie
          ? `<details><summary>Revoir l'étude : ${esc(q.serie.etude.titre)}</summary>${q.serie.etude_html}</details>`
          : q.serie.etude_html}
      </div>` : "";
    app.innerHTML = `
      <div class="progression"><span>Question ${session.i + 1} / ${total}</span><span>${scoreCourant()}</span></div>
      <div class="barre"><div style="width:${100 * session.i / total}%"></div></div>
      <div class="etiquettes"><span>${NOMS_CAT[q.categorie]}</span><span>CM ${q.cm.join(", ")}</span><span>${["", "Facile", "Moyenne", "Difficile"][q.difficulte]}</span></div>
      ${etude}
      <div class="enonce">${q.question_html}</div>
      <form id="qcm">
        ${q.options.map((o, k) => `
          <label class="option" data-k="${k}">
            <input type="radio" name="rep" value="${k}">
            <span class="lettre">${LETTRES[k]}</span><span>${o.texte_html}</span>
          </label>`).join("")}
        <div class="boutons">
          <button type="submit" class="principal" id="valider" disabled>Valider</button>
          <button type="button" class="secondaire" id="passer">Je ne sais pas</button>
        </div>
      </form>
      <div id="retour"></div>`;
    const form = document.getElementById("qcm");
    form.addEventListener("change", () => { document.getElementById("valider").disabled = false; });
    form.addEventListener("submit", ev => { ev.preventDefault(); corriger(Number(new FormData(form).get("rep"))); });
    document.getElementById("passer").addEventListener("click", () => corriger(null));
    window.scrollTo(0, 0);
  }

  function corriger(k) {
    const q = session.items[session.i];
    const bonne = q.options.findIndex(o => o.score === 100);
    const points = k === null ? 0 : q.options[k].score / 100;
    session.reponses.push({ q, k, points });
    const vues = lireVues(); const cle = q.serie ? q.serie.id : q.id;
    vues[cle] = (vues[cle] || 0) + (q.serie ? 1 / q.serie.questions.length : 1); ecrireVues(vues);

    document.querySelectorAll(".option").forEach(el => {
      const j = Number(el.dataset.k);
      el.classList.add("verrouillee");
      el.querySelector("input").disabled = true;
      if (j === bonne) el.classList.add("juste");
      else if (j === k) el.classList.add("fausse");
    });
    const classe = k === null ? "neutre" : (k === bonne ? "ok" : "ko");
    const titre = k === null ? "Pas de réponse" : (k === bonne ? "Bonne réponse" : "Mauvaise réponse");
    let corps = "";
    if (k !== null) corps += `<div>${q.options[k].feedback_html}</div>`;
    if (k !== bonne) corps += `<p><strong>La bonne réponse était ${LETTRES[bonne]}.</strong></p><div>${q.options[bonne].feedback_html}</div>`;
    const dernier = session.i === session.items.length - 1;
    document.getElementById("retour").innerHTML = `
      <div class="retour ${classe}">
        <p><strong>${titre}</strong> · <span class="points">${fmtPoints(points)} point${Math.abs(points) > 1 ? "s" : ""}</span></p>
        ${corps}
        ${q.feedback_general_html ? `<div class="general"><strong>À retenir.</strong> ${q.feedback_general_html}</div>` : ""}
      </div>
      <div class="boutons"><button class="principal" id="suite">${dernier ? "Voir le bilan" : "Question suivante"}</button></div>`;
    document.querySelectorAll("#qcm .boutons button").forEach(b => b.remove());
    const suite = document.getElementById("suite");
    suite.addEventListener("click", () => { session.i++; dernier ? bilan() : afficherQuestion(); });
    suite.focus();
  }

  function scoreCourant() {
    const s = session.reponses.reduce((a, r) => a + r.points, 0);
    return session.reponses.length ? `Score : ${fmtPoints(s).replace("+", "")} / ${session.reponses.length}` : "";
  }

  // ------------------------------------------------------------ bilan
  function bilan() {
    const R = session.reponses, n = R.length;
    const total = R.reduce((a, r) => a + r.points, 0);
    const sur20 = Math.max(0, 20 * total / n);
    const groupes = {};
    for (const r of R) {
      const g = NOMS_CAT[r.q.categorie];
      groupes[g] = groupes[g] || { n: 0, justes: 0, pts: 0 };
      groupes[g].n++; groupes[g].pts += r.points;
      if (r.points === 1) groupes[g].justes++;
    }
    const ratees = R.filter(r => r.points < 1);
    app.innerHTML = `
      <h2>Bilan</h2>
      <div class="score">${fmtPoints(total).replace("+", "")} / ${n}</div>
      <p>Soit ${sur20.toFixed(1).replace(".", ",")} / 20 avec le barème de l'examen. ${R.filter(r => r.points === 1).length} bonne(s) réponse(s), ${R.filter(r => r.k === null).length} « je ne sais pas ».</p>
      <table class="bilan"><tr><th>Type</th><th class="n" style="text-align:right">Questions</th><th style="text-align:right">Justes</th><th style="text-align:right">Points</th></tr>
        ${Object.entries(groupes).map(([g, v]) => `<tr><td>${g}</td><td class="n">${v.n}</td><td class="n">${v.justes}</td><td class="n">${fmtPoints(v.pts).replace("+", "")}</td></tr>`).join("")}
      </table>
      ${ratees.length ? `<h2>À revoir</h2><ul class="revoir">${ratees.map(r =>
        `<li>${r.q.question_texte} <span class="note">(CM ${r.q.cm.join(", ")})</span></li>`).join("")}</ul>` : "<p>Aucune erreur : bravo !</p>"}
      <div class="boutons"><button class="principal" id="encore">Nouvelle série</button></div>`;
    document.getElementById("encore").addEventListener("click", accueil);
    window.scrollTo(0, 0);
  }

  accueil();
})();
</script>
</body>
</html>
