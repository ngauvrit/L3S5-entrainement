exte_html": "L'effet est important, puisque p est très petit.", "score": -30.0, "feedback_html": "<p>Significatif ne veut pas dire important. Avec 5 000 participants, un effet minuscule devient significatif.<\/p>"}, {"texte_html": "L'effet est significatif, mais sa taille n'atteint même pas le repère d'un petit effet.", "score": 100.0, "feedback_html": "<p>Exact. p &lt; 0,001 indique un effet significatif ; η² = 0,004 est sous le repère d'un petit effet (0,01).<\/p>"}, {"texte_html": "L'effet n'est pas significatif, puisque η² est inférieur à 0,01.", "score": -20.0, "feedback_html": "<p>La significativité se lit sur p, pas sur la taille d'effet. Ici p &lt; 0,001 : l'effet est significatif.<\/p>"}, {"texte_html": "Ce résultat est impossible : un effet aussi petit ne peut pas être significatif.", "score": -50.0, "feedback_html": "<p>C'est possible et fréquent avec de grands échantillons : la significativité dépend de l'effectif, la taille d'effet non.<\/p>"}]}, {"id": "C-CM5-003", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une ANOVA pour plan croisé (consigne × âge) donne, pour l'effet de la consigne, η² = 0,08 et η²p = 0,11. Comment interpréter η²p ?<\/p>", "question_texte": "Une ANOVA pour plan croisé (consigne × âge) donne, pour l'effet de la consigne, η² = 0,08 et η²p = 0,11. Comment interpréter η²p ?", "feedback_general_html": "<p>η²p rapporte la variation due à l'effet à cette variation plus l'erreur, en retirant les autres effets du dénominateur. η² rapporte l'effet à la variation totale. CM05, section Classique.<\/p>", "options": [{"texte_html": "La consigne explique 11 % de la variance totale de la VD.", "score": -20.0, "feedback_html": "<p>La part de la variance totale, c'est η², soit 8 % ici.<\/p>"}, {"texte_html": "η²p est une estimation non biaisée de la taille d'effet dans la population.", "score": -30.0, "feedback_html": "<p>η²p est biaisé et surestime la taille d'effet ; c'est ω² qui corrige en partie ce biais.<\/p>"}, {"texte_html": "η²p est toujours inférieur à η².", "score": -50.0, "feedback_html": "<p>η²p est supérieur ou égal à η², comme ici (0,11 contre 0,08).<\/p>"}, {"texte_html": "Si l'âge et l'interaction n'avaient aucun effet, la consigne expliquerait environ 11 % des variations de la VD.", "score": 100.0, "feedback_html": "<p>Exact. η²p retire du dénominateur la variation due aux autres effets.<\/p>"}]}, {"id": "C-CM5-004", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Pourquoi le cours recommande-t-il ω² plutôt que η², surtout avec de petits échantillons ?<\/p>", "question_texte": "Pourquoi le cours recommande-t-il ω² plutôt que η², surtout avec de petits échantillons ?", "feedback_general_html": "<p>η² est un estimateur biaisé, d'autant plus que l'échantillon est petit ; ω² réduit ce biais. CM05, section Rigoureux.<\/p>", "options": [{"texte_html": "Parce que η² tend à surestimer la taille d'effet dans la population, et que ω² corrige en partie ce biais.", "score": 100.0, "feedback_html": "<p>Exact. Le biais de η² est d'autant plus fort que l'échantillon est petit.<\/p>"}, {"texte_html": "Parce que ω² est toujours supérieur à η².", "score": -20.0, "feedback_html": "<p>C'est l'inverse : en corrigeant le biais, ω² vaut en général un peu moins que η².<\/p>"}, {"texte_html": "Parce que ω² permet de comparer des tailles d'effet entre plans inter-sujets et intra-sujets.", "score": -30.0, "feedback_html": "<p>La comparaison entre plans relève de η²G.<\/p>"}, {"texte_html": "Parce que ω² ne dépend pas de la taille de l'échantillon et remplace ainsi la valeur p.", "score": -50.0, "feedback_html": "<p>Une taille d'effet ne remplace pas un test : elles répondent à des questions différentes.<\/p>"}]}, {"id": "C-CM5-005", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Que se passe-t-il pour ω² et η² lorsque l'échantillon devient très grand ?<\/p>", "question_texte": "Que se passe-t-il pour ω² et η² lorsque l'échantillon devient très grand ?", "feedback_general_html": "<p>η² surestime la taille d'effet surtout avec de petits échantillons ; avec un très grand échantillon, la correction apportée par ω² devient négligeable. CM05, section Rigoureux, « Omega ».<\/p>", "options": [{"texte_html": "Ils deviennent presque égaux, car le biais de η² diminue avec la taille de l'échantillon.", "score": 100.0, "feedback_html": "<p>Exact. La correction apportée par ω² devient négligeable.<\/p>"}, {"texte_html": "ω² devient négatif.", "score": -30.0, "feedback_html": "<p>ω² ne devient négatif que lorsque l'effet est presque nul, pas parce que l'échantillon est grand.<\/p>"}, {"texte_html": "η² tend vers 0, quel que soit l'effet.", "score": -50.0, "feedback_html": "<p>η² estime une part de variance expliquée ; il ne tend pas vers 0 si l'effet existe.<\/p>"}, {"texte_html": "ω² devient plus grand que η².", "score": -20.0, "feedback_html": "<p>ω² reste inférieur ou égal à η² ; les deux se rapprochent.<\/p>"}]}, {"id": "C-CM5-007", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Qu'est-ce qu'une taille d'effet ?<\/p>", "question_texte": "Qu'est-ce qu'une taille d'effet ?", "feedback_general_html": "<p>Une taille d'effet est une mesure standardisée d'un lien entre variables ou d'une différence entre groupes : elle répond à la question « l'effet est-il important ? ». CM05, section Rappels, « Principe ».<\/p>", "options": [{"texte_html": "La probabilité que l'effet observé soit dû au hasard.", "score": -30.0, "feedback_html": "<p>C'est une mauvaise définition de la valeur p ; une taille d'effet n'est pas une probabilité.<\/p>"}, {"texte_html": "Une mesure standardisée de l'ampleur d'un lien entre variables ou d'une différence entre groupes.", "score": 100.0, "feedback_html": "<p>Exact. Elle dit si l'effet est grand ou petit, pas seulement s'il existe.<\/p>"}, {"texte_html": "Le nombre de participants nécessaire pour obtenir un effet significatif.", "score": -50.0, "feedback_html": "<p>C'est l'objet d'un calcul de puissance, qui utilise une taille d'effet mais n'en est pas une.<\/p>"}, {"texte_html": "La différence brute entre deux moyennes, exprimée dans l'unité de la VD.", "score": -20.0, "feedback_html": "<p>Une différence brute dépend de l'unité de mesure ; une taille d'effet est standardisée, donc comparable d'une échelle à l'autre.<\/p>"}]}, {"id": "C-CM5-008", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Pourquoi le cours demande-t-il de toujours rapporter une taille d'effet en plus du test ?<\/p>", "question_texte": "Pourquoi le cours demande-t-il de toujours rapporter une taille d'effet en plus du test ?", "feedback_general_html": "<p>La taille d'effet mesure l'ampleur d'un effet, indépendamment de l'effectif ; la signification statistique n'est pas la signification psychologique. CM05, section Classique, « Attention ».<\/p>", "options": [{"texte_html": "Parce que le test ne dit pas si l'effet est important : la significativité dépend aussi de l'effectif.", "score": 100.0, "feedback_html": "<p>Exact. Significatif ne veut pas dire important.<\/p>"}, {"texte_html": "Parce qu'un effet non significatif a toujours une taille d'effet nulle.", "score": -20.0, "feedback_html": "<p>Un effet non significatif peut avoir une taille d'effet non négligeable, notamment avec un petit échantillon.<\/p>"}, {"texte_html": "Parce que la taille d'effet remplace la valeur p quand celle-ci est trop petite.", "score": -30.0, "feedback_html": "<p>La taille d'effet ne remplace pas le test : les deux répondent à des questions différentes.<\/p>"}, {"texte_html": "Parce que la taille d'effet permet de vérifier les conditions d'application.", "score": -50.0, "feedback_html": "<p>Les conditions se vérifient avec d'autres tests (Levene, Shapiro-Wilk, Mauchly).<\/p>"}]}, {"id": "C-CM5-009", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Une étude de génétique comportementale identifie un gène qui influence le QI, avec p = 0,0000001. Que peut-on dire de l'importance de cet effet ?<\/p>", "question_texte": "Une étude de génétique comportementale identifie un gène qui influence le QI, avec p = 0,0000001. Que peut-on dire de l'importance de cet effet ?", "feedback_general_html": "<p>La valeur p ne mesure pas l'importance d'un effet : seule une taille d'effet permet d'en juger. CM05, section Rappels.<\/p>", "options": [{"texte_html": "Il est très important, puisque p est extrêmement petit.", "score": -30.0, "feedback_html": "<p>Une valeur p très petite peut venir d'un très grand échantillon, même pour un effet minuscule.<\/p>"}, {"texte_html": "Il est nul, puisque p est inférieur à 0,05.", "score": -50.0, "feedback_html": "<p>p &lt; 0,05 conduit au contraire à rejeter l'hypothèse d'absence d'effet.<\/p>"}, {"texte_html": "Il est forcément petit, puisque les effets génétiques le sont toujours.", "score": -20.0, "feedback_html": "<p>Les effets sont souvent faibles dans ce domaine, mais on ne peut pas le conclure sans taille d'effet.<\/p>"}, {"texte_html": "On ne peut pas le savoir avec la seule valeur p : il faut une taille d'effet.", "score": 100.0, "feedback_html": "<p>Exact. La valeur p dit seulement que l'effet est peu compatible avec H0.<\/p>"}]}, {"id": "C-CM5-010", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Dans une petite étude auprès de personnes autistes avec un TDAH associé, une thérapie des compétences sociales n'a pas d'effet significatif. Que peut-on en conclure ?<\/p>", "question_texte": "Dans une petite étude auprès de personnes autistes avec un TDAH associé, une thérapie des compétences sociales n'a pas d'effet significatif. Que peut-on en conclure ?", "feedback_general_html": "<p>L'absence de significativité ne dit pas que l'effet est nul ni qu'il est petit. La taille d'effet et son intervalle de confiance renseignent sur ce que les données permettent d'exclure. CM05, section Rappels.<\/p>", "options": [{"texte_html": "L'étude est invalide, puisqu'elle ne trouve rien.", "score": -20.0, "feedback_html": "<p>Une étude peut être valide sans trouver d'effet ; c'est son manque de puissance éventuel qui limite la conclusion.<\/p>"}, {"texte_html": "La thérapie n'a aucun effet.", "score": -30.0, "feedback_html": "<p>Un résultat non significatif ne prouve pas l'absence d'effet.<\/p>"}, {"texte_html": "La thérapie a un effet important, mais caché.", "score": -50.0, "feedback_html": "<p>Rien ne permet d'affirmer un effet important : on ne sait simplement pas.<\/p>"}, {"texte_html": "On ne peut pas conclure à l'absence d'effet : il faut regarder la taille d'effet et son intervalle de confiance.", "score": 100.0, "feedback_html": "<p>Exact. Avec un petit échantillon, un effet réel peut ne pas être détecté.<\/p>"}]}, {"id": "C-CM5-011", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Quelle est la formule de η² ?<\/p>", "question_texte": "Quelle est la formule de η² ?", "feedback_general_html": "<p>η² = SC effet / SC totale : la proportion de la variance totale attribuable à l'effet. CM05, section Classique.<\/p>", "options": [{"texte_html": "SC effet / (SC effet + SC erreur)", "score": -20.0, "feedback_html": "<p>C'est la formule de η²p, qui retire les autres effets du dénominateur.<\/p>"}, {"texte_html": "SC effet / SC totale", "score": 100.0, "feedback_html": "<p>Exact. C'est la proportion de la variation totale attribuable à l'effet.<\/p>"}, {"texte_html": "CM effet / CM erreur", "score": -30.0, "feedback_html": "<p>C'est la formule de F, pas d'une taille d'effet.<\/p>"}, {"texte_html": "SC erreur / SC totale", "score": -50.0, "feedback_html": "<p>Ce serait la part de variation non expliquée.<\/p>"}]}, {"id": "C-CM5-012", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Quelle est la formule de η²p (êta-carré partiel) ?<\/p>", "question_texte": "Quelle est la formule de η²p (êta-carré partiel) ?", "feedback_general_html": "<p>η²p = SC effet / (SC effet + SC erreur) : on retire les autres effets du dénominateur. C'est l'indice fourni par défaut par la plupart des logiciels. CM05, section Classique.<\/p>", "options": [{"texte_html": "SC effet / (SC effet + SC erreur)", "score": 100.0, "feedback_html": "<p>Exact. Les autres effets sont retirés du dénominateur.<\/p>"}, {"texte_html": "(SC effet − ddl effet × CM erreur) / (SC totale + CM erreur)", "score": -30.0, "feedback_html": "<p>C'est la formule de ω².<\/p>"}, {"texte_html": "√(η² / (1 − η²))", "score": -50.0, "feedback_html": "<p>C'est la formule du f de Cohen.<\/p>"}, {"texte_html": "SC effet / SC totale", "score": -20.0, "feedback_html": "<p>C'est la formule de η².<\/p>"}]}, {"id": "C-CM5-013", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Dans une ANOVA pour plan croisé à deux facteurs, on additionne les η²p des deux effets principaux et de l'interaction. Que peut-on observer ?<\/p>", "question_texte": "Dans une ANOVA pour plan croisé à deux facteurs, on additionne les η²p des deux effets principaux et de l'interaction. Que peut-on observer ?", "feedback_general_html": "<p>Chaque η²p rapporte son effet à l'effet plus l'erreur : les dénominateurs diffèrent, et dans un plan factoriel la somme des η²p peut dépasser 1. Les η², eux, sont des parts d'un même total. CM05, section Classique.<\/p>", "options": [{"texte_html": "La somme ne peut jamais dépasser la somme des η².", "score": -20.0, "feedback_html": "<p>C'est l'inverse : chaque η²p est au moins égal au η² correspondant.<\/p>"}, {"texte_html": "La somme peut dépasser 1, car chaque η²p a son propre dénominateur.", "score": 100.0, "feedback_html": "<p>Exact. Les η²p ne sont pas des parts d'un même total.<\/p>"}, {"texte_html": "La somme vaut toujours exactement 1.", "score": -30.0, "feedback_html": "<p>Ce n'est vrai d'aucun indice : même la somme des η² n'atteint 1 qu'en ajoutant la part résiduelle.<\/p>"}, {"texte_html": "La somme est forcément inférieure à 0,14.", "score": -50.0, "feedback_html": "<p>0,14 est le repère d'un grand effet pour un seul indice ; il ne borne pas une somme.<\/p>"}]}, {"id": "C-CM5-014", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Dans un plan croisé, le η² d'un facteur change-t-il selon que l'on ajoute ou non l'autre facteur au modèle ?<\/p>", "question_texte": "Dans un plan croisé, le η² d'un facteur change-t-il selon que l'on ajoute ou non l'autre facteur au modèle ?", "feedback_general_html": "<p>η² calculé pour un facteur ne dépend des autres facteurs que dans un plan déséquilibré. C'est une raison de plus de viser des groupes de même taille. CM05, section Classique, « A retenir ».<\/p>", "options": [{"texte_html": "Non, jamais : η² ne dépend que du facteur considéré.", "score": -20.0, "feedback_html": "<p>C'est vrai dans un plan équilibré seulement.<\/p>"}, {"texte_html": "Seulement si l'interaction est significative.", "score": -50.0, "feedback_html": "<p>Ce qui compte est l'équilibre du plan, pas la significativité de l'interaction.<\/p>"}, {"texte_html": "Oui, toujours, puisque la variation totale change.", "score": -30.0, "feedback_html": "<p>La variation totale de la VD ne dépend pas du modèle ; et dans un plan équilibré, η² ne change pas.<\/p>"}, {"texte_html": "Seulement si le plan est déséquilibré (groupes d'effectifs différents).", "score": 100.0, "feedback_html": "<p>Exact. Avec des groupes de même taille, les facteurs ne se recouvrent pas.<\/p>"}]}, {"id": "C-CM5-015", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Selon le cours, comment faut-il utiliser les seuils de Cohen (1988) pour interpréter une taille d'effet ?<\/p>", "question_texte": "Selon le cours, comment faut-il utiliser les seuils de Cohen (1988) pour interpréter une taille d'effet ?", "feedback_general_html": "<p>Les conventions de Cohen ne sont que des conventions. Les tailles d'effet habituelles dépendent des sous-disciplines : l'idéal est de comparer son effet à la littérature de son domaine précis. CM05, section Classique, « Compléments ».<\/p>", "options": [{"texte_html": "Comme des seuils de significativité, à la place de p &lt; 0,05.", "score": -50.0, "feedback_html": "<p>Les seuils de Cohen qualifient l'ampleur d'un effet ; ils ne disent rien de sa significativité.<\/p>"}, {"texte_html": "Comme des conventions, à utiliser à défaut de mieux : l'idéal est de comparer l'effet à ceux habituellement trouvés dans son domaine.", "score": 100.0, "feedback_html": "<p>Exact. Les tailles d'effet habituelles varient beaucoup d'une sous-discipline à l'autre.<\/p>"}, {"texte_html": "Il ne faut jamais les utiliser.", "score": -30.0, "feedback_html": "<p>Le cours les utilise, à défaut de meilleure référence.<\/p>"}, {"texte_html": "Comme des seuils universels, valables dans toutes les disciplines.", "score": -20.0, "feedback_html": "<p>Ce ne sont que des conventions ; en génétique comportementale, par exemple, les effets habituels sont plus faibles.<\/p>"}]}, {"id": "C-CM5-016", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Selon le cours, que peut-on reprocher à η² et à η²p comme estimateurs de la taille d'effet dans la population ?<\/p>", "question_texte": "Selon le cours, que peut-on reprocher à η² et à η²p comme estimateurs de la taille d'effet dans la population ?", "feedback_general_html": "<p>Les estimateurs η² et η²p sont biaisés et ont tendance à surestimer la taille d'effet, surtout avec de petits échantillons. ω² corrige en partie ce biais. CM05, sections Classique et Rigoureux.<\/p>", "options": [{"texte_html": "Ils dépendent de l'unité de mesure de la VD.", "score": -50.0, "feedback_html": "<p>Ce sont des proportions de variation, sans unité.<\/p>"}, {"texte_html": "Ils sont biaisés : ils ont tendance à surestimer la taille d'effet, surtout avec de petits échantillons.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Ils ne peuvent être calculés qu'avec de grands échantillons.", "score": -30.0, "feedback_html": "<p>Ils se calculent quel que soit l'effectif ; c'est leur biais qui augmente quand l'échantillon est petit.<\/p>"}, {"texte_html": "Ils sont biaisés : ils ont tendance à sous-estimer la taille d'effet.", "score": -20.0, "feedback_html": "<p>Ils sont bien biaisés, mais dans l'autre sens : ils surestiment.<\/p>"}]}, {"id": "C-CM5-017", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>La moyenne d'échantillon x̄ est un estimateur non biaisé de la moyenne de la population μ. Que signifie « non biaisé » ?<\/p>", "question_texte": "La moyenne d'échantillon x̄ est un estimateur non biaisé de la moyenne de la population μ. Que signifie « non biaisé » ?", "feedback_general_html": "<p>Un estimateur est non biaisé si, bien qu'il varie d'un échantillon à l'autre, sa moyenne sur tous les échantillons est égale au paramètre. CM05, section Rappels.<\/p>", "options": [{"texte_html": "x̄ est toujours exactement égale à μ.", "score": -20.0, "feedback_html": "<p>x̄ varie d'un échantillon à l'autre : elle n'est presque jamais exactement égale à μ.<\/p>"}, {"texte_html": "En moyenne sur tous les échantillons possibles, x̄ vaut μ.", "score": 100.0, "feedback_html": "<p>Exact. Les erreurs d'estimation se compensent en moyenne.<\/p>"}, {"texte_html": "x̄ est plus précise quand l'échantillon est petit.", "score": -50.0, "feedback_html": "<p>C'est l'inverse : la précision augmente avec la taille de l'échantillon.<\/p>"}, {"texte_html": "x̄ surestime μ, mais d'une quantité connue.", "score": -30.0, "feedback_html": "<p>Ce serait un estimateur biaisé.<\/p>"}]}, {"id": "C-CM5-018", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Une ANOVA donne η² = 0,08 sur un échantillon. Quel est le statut de cette valeur ?<\/p>", "question_texte": "Une ANOVA donne η² = 0,08 sur un échantillon. Quel est le statut de cette valeur ?", "feedback_general_html": "<p>η² est la taille d'effet observée : une statistique qui sert d'estimateur du paramètre correspondant dans la population. CM05, section Rappels, « Estimateur ».<\/p>", "options": [{"texte_html": "C'est la valeur minimale que peut prendre la vraie taille d'effet.", "score": -30.0, "feedback_html": "<p>η² tend au contraire à surestimer la vraie taille d'effet.<\/p>"}, {"texte_html": "C'est la probabilité que l'effet soit réel.", "score": -50.0, "feedback_html": "<p>η² n'est pas une probabilité.<\/p>"}, {"texte_html": "C'est une statistique, utilisée comme estimation de la taille d'effet dans la population.", "score": 100.0, "feedback_html": "<p>Exact. Et cette estimation est biaisée.<\/p>"}, {"texte_html": "C'est la vraie taille d'effet dans la population.", "score": -20.0, "feedback_html": "<p>C'est la taille d'effet observée, qui varie d'un échantillon à l'autre.<\/p>"}]}, {"id": "C-CM5-019", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>On rapporte une moyenne de sensibilité x̄ = 75, avec un intervalle de confiance à 95 % de [71 ; 79]. Comment le comprendre ?<\/p>", "question_texte": "On rapporte une moyenne de sensibilité x̄ = 75, avec un intervalle de confiance à 95 % de [71 ; 79]. Comment le comprendre ?", "feedback_general_html": "<p>L'intervalle de confiance à 95 % est construit par une méthode qui échoue au maximum dans 5 % des cas : on peut être « sûr à 95 % » que μ s'y trouve. On peut aussi en rapporter un pour une taille d'effet. CM05, section Rappels, « Intervalle de confiance ».<\/p>", "options": [{"texte_html": "La moyenne de l'échantillon a 95 % de chances d'être comprise entre 71 et 79.", "score": -50.0, "feedback_html": "<p>La moyenne de l'échantillon est connue : elle vaut 75.<\/p>"}, {"texte_html": "95 % des participants ont un score compris entre 71 et 79.", "score": -30.0, "feedback_html": "<p>L'intervalle porte sur la moyenne de la population, pas sur les scores individuels.<\/p>"}, {"texte_html": "La vraie moyenne μ vaut 75, avec une erreur de 5 %.", "score": -20.0, "feedback_html": "<p>μ est inconnue : l'intervalle donne une plage de valeurs plausibles, pas une valeur exacte.<\/p>"}, {"texte_html": "L'intervalle a été obtenu par une méthode qui, dans au moins 95 % des cas, contient la vraie moyenne μ.", "score": 100.0, "feedback_html": "<p>Exact. On peut être « sûr à 95 % » que μ est entre 71 et 79.<\/p>"}]}, {"id": "C-CM5-020", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>La formule de ω² est :<\/p><p>ω² = (SC effet − ddl effet × CM erreur) / (SC totale + CM erreur)<\/p><p>Que fait le terme « − ddl effet × CM erreur » au numérateur ?<\/p>", "question_texte": "La formule de ω² est :\n\nω² = (SC effet − ddl effet × CM erreur) / (SC totale + CM erreur)\n\nQue fait le terme « − ddl effet × CM erreur » au numérateur ?", "feedback_general_html": "<p>ω² retire à SC effet ce que l'erreur seule produirait (ddl effet × CM erreur) : c'est ce qui corrige le biais de η². Quand l'effet est presque nul, la correction peut rendre ω² négatif. CM05, section Rigoureux, « Formule ».<\/p>", "options": [{"texte_html": "Il ajoute la variation due aux autres facteurs.", "score": -30.0, "feedback_html": "<p>Il ne s'agit pas des autres facteurs, mais de l'erreur résiduelle.<\/p>"}, {"texte_html": "Il retire à la variation de l'effet la part que le seul hasard produirait en moyenne.", "score": 100.0, "feedback_html": "<p>Exact. C'est ce qui corrige la surestimation de η².<\/p>"}, {"texte_html": "Il corrige la violation de la sphéricité.", "score": -20.0, "feedback_html": "<p>La sphéricité se corrige sur les degrés de liberté du test, pas dans la taille d'effet.<\/p>"}, {"texte_html": "Il transforme la variance en écart-type.", "score": -50.0, "feedback_html": "<p>Aucune racine carrée n'intervient dans ω².<\/p>"}]}, {"id": "C-CM5-021", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>On souhaite rapporter un ω² partiel (ω²p), équivalent moins biaisé de η²p. Que dit le cours sur son calcul dans Jamovi ?<\/p>", "question_texte": "On souhaite rapporter un ω² partiel (ω²p), équivalent moins biaisé de η²p. Que dit le cours sur son calcul dans Jamovi ?", "feedback_general_html": "<p>ω²p, équivalent moins biaisé de η²p, n'est pas disponible directement dans la rubrique ANOVA de Jamovi : il faut un autre module, comme GAMLj. CM05, section Rigoureux, « Omega-carré partiel ».<\/p>", "options": [{"texte_html": "Il s'obtient en cochant une case dans la rubrique ANOVA.", "score": -30.0, "feedback_html": "<p>La rubrique ANOVA de Jamovi ne le propose pas directement.<\/p>"}, {"texte_html": "Il n'est pas disponible directement dans la rubrique ANOVA ; il faut un autre module, comme GAMLj.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Il est identique à η²G, disponible dans Jamovi.", "score": -20.0, "feedback_html": "<p>η²G est un autre indice, pensé pour comparer des plans différents.<\/p>"}, {"texte_html": "Il n'existe pas : seul ω² existe.", "score": -50.0, "feedback_html": "<p>ω²p existe : c'est l'équivalent moins biaisé de η²p.<\/p>"}]}, {"id": "C-CM5-022", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Dans quelles analyses Jamovi propose-t-il η²G (êta-carré généralisé) ?<\/p>", "question_texte": "Dans quelles analyses Jamovi propose-t-il η²G (êta-carré généralisé) ?", "feedback_general_html": "<p>η²G est disponible dans Jamovi, mais uniquement pour les plans à mesures répétées ou mixtes. CM05, section Rigoureux, « Eta-carré généralisé ».<\/p>", "options": [{"texte_html": "Dans aucune : il faut le calculer à la main.", "score": -30.0, "feedback_html": "<p>Jamovi le fournit pour les plans à mesures répétées ou mixtes.<\/p>"}, {"texte_html": "Seulement dans l'ANOVA simple.", "score": -50.0, "feedback_html": "<p>C'est l'inverse : il n'apparaît que pour les plans avec mesures répétées.<\/p>"}, {"texte_html": "Dans toutes les ANOVA.", "score": -20.0, "feedback_html": "<p>La rubrique ANOVA pour groupes indépendants ne le propose pas.<\/p>"}, {"texte_html": "Seulement dans les ANOVA pour plan à mesures répétées ou mixte.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM5-023", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Selon le cours, quelle taille d'effet rapporter par défaut dans une ANOVA ?<\/p>", "question_texte": "Selon le cours, quelle taille d'effet rapporter par défaut dans une ANOVA ?", "feedback_general_html": "<p>Que choisir ? Par défaut η²p ; la part de variance dans un plan à un facteur : η² ; une estimation moins biaisée : ω² ; la comparabilité entre plans : η²G ; la puissance ou la comparaison avec un d : f. CM05, section Rigoureux, « Que choisir ? ».<\/p>", "options": [{"texte_html": "η²G", "score": -30.0, "feedback_html": "<p>η²G sert surtout à comparer des plans différents ou en méta-analyse.<\/p>"}, {"texte_html": "Le f de Cohen", "score": -50.0, "feedback_html": "<p>Le f de Cohen est réservé aux calculs de puissance et aux comparaisons avec un d.<\/p>"}, {"texte_html": "ω²", "score": -20.0, "feedback_html": "<p>ω² est préférable pour une estimation moins biaisée, mais le choix par défaut du cours est η²p.<\/p>"}, {"texte_html": "η²p", "score": 100.0, "feedback_html": "<p>Exact. C'est l'indice le plus utilisé, fourni par défaut par la plupart des logiciels.<\/p>"}]}, {"id": "C-CM5-024", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Une étude porte sur trois petits groupes de 8 participants. On veut l'estimation la moins biaisée possible de la taille d'effet dans la population. Quel indice choisir ?<\/p>", "question_texte": "Une étude porte sur trois petits groupes de 8 participants. On veut l'estimation la moins biaisée possible de la taille d'effet dans la population. Quel indice choisir ?", "feedback_general_html": "<p>ω² corrige en partie le biais de η² ; il est préférable surtout lorsque les groupes sont petits. CM05, section Rigoureux, « Omega ».<\/p>", "options": [{"texte_html": "ω²", "score": 100.0, "feedback_html": "<p>Exact. Il corrige en partie le biais de η².<\/p>"}, {"texte_html": "La valeur de F", "score": -50.0, "feedback_html": "<p>F n'est pas une taille d'effet.<\/p>"}, {"texte_html": "La valeur p", "score": -30.0, "feedback_html": "<p>La valeur p n'est pas une taille d'effet.<\/p>"}, {"texte_html": "η²", "score": -20.0, "feedback_html": "<p>η² surestime la taille d'effet, et d'autant plus que l'échantillon est petit.<\/p>"}]}, {"id": "C-CM5-025", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 3, "question_html": "<p>Une ANOVA donne η² = 0,20. Que vaut le f de Cohen correspondant ?<\/p><p><em>Rappel : f = √(η² / (1 − η²)).<\/em><\/p>", "question_texte": "Une ANOVA donne η² = 0,20. Que vaut le f de Cohen correspondant ?\n\n*Rappel : f = √(η² / (1 − η²)).*", "feedback_general_html": "<p>f = √(η² / (1 − η²)) = √(0,20 / 0,80) = √0,25 = 0,5. Le f de Cohen se lit comme un d de Cohen. CM05, section Rigoureux, « Complément ».<\/p>", "options": [{"texte_html": "0,5", "score": 100.0, "feedback_html": "<p>Exact. 0,20 / 0,80 = 0,25, et √0,25 = 0,5.<\/p>"}, {"texte_html": "0,04", "score": -50.0, "feedback_html": "<p>0,04 = 0,20² : ce n'est pas la formule.<\/p>"}, {"texte_html": "0,25", "score": -20.0, "feedback_html": "<p>0,25 est la valeur de η² / (1 − η²) : il manque la racine carrée.<\/p>"}, {"texte_html": "0,45", "score": -30.0, "feedback_html": "<p>0,45 ≈ √0,20 : il manque la division par 1 − η².<\/p>"}]}, {"id": "C-CM5-026", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Pourquoi un η² ne se compare-t-il pas directement à un d de Cohen ?<\/p>", "question_texte": "Pourquoi un η² ne se compare-t-il pas directement à un d de Cohen ?", "feedback_general_html": "<p>Le d de Cohen ne compare pas la variation entre groupes à la variation totale et se fonde sur l'écart-type, pas sur la variance. Le f de Cohen, f = √(η² / (1 − η²)), se lit comme un d. CM05, section Rigoureux, « Complément ».<\/p>", "options": [{"texte_html": "Parce que le d de Cohen se fonde sur un écart-type, et η² sur une variance (une part de variation).", "score": 100.0, "feedback_html": "<p>Exact. C'est pourquoi on calcule parfois le f de Cohen, qui se lit comme un d.<\/p>"}, {"texte_html": "Parce que le d de Cohen ne s'utilise qu'avec des mesures répétées.", "score": -50.0, "feedback_html": "<p>Le d de Cohen est la taille d'effet habituelle du test de Student, y compris pour groupes indépendants.<\/p>"}, {"texte_html": "Parce que η² est toujours plus grand que d.", "score": -30.0, "feedback_html": "<p>Ce n'est pas une question d'ordre de grandeur, mais de nature des deux indices.<\/p>"}, {"texte_html": "Parce que d est biaisé et η² ne l'est pas.", "score": -20.0, "feedback_html": "<p>η² est lui-même biaisé ; la différence tient à ce que mesurent les deux indices.<\/p>"}]}, {"id": "C-CM5-027", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Une méta-analyse en psychologie sociale rapporte une corrélation typique de r = 0,30. En utilisant la relation approximative r² ≈ η², comment la situer ?<\/p><p><em>Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Une méta-analyse en psychologie sociale rapporte une corrélation typique de r = 0,30. En utilisant la relation approximative r² ≈ η², comment la situer ?\n\n*Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>r² ≈ η² : 0,30² = 0,09, un effet moyen selon les repères de Cohen (1988). CM05, section Classique, « Compléments ».<\/p>", "options": [{"texte_html": "On ne peut rien dire : r et η² n'ont aucun lien.", "score": -50.0, "feedback_html": "<p>Le cours donne justement la relation approximative r² ≈ η².<\/p>"}, {"texte_html": "Un effet petit : η² ≈ 0,03.", "score": -30.0, "feedback_html": "<p>0,30² = 0,09, pas 0,03.<\/p>"}, {"texte_html": "Un effet moyen : η² ≈ 0,09.", "score": 100.0, "feedback_html": "<p>Exact. 0,09 se situe entre 0,06 et 0,14.<\/p>"}, {"texte_html": "Un grand effet : η² ≈ 0,30.", "score": -20.0, "feedback_html": "<p>Il faut élever r au carré : η² ≈ 0,09.<\/p>"}]}, {"id": "C-CM5-028", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Dans un article, l'effet de l'intelligence émotionnelle n'est pas significatif. Faut-il quand même rapporter sa taille d'effet ?<\/p>", "question_texte": "Dans un article, l'effet de l'intelligence émotionnelle n'est pas significatif. Faut-il quand même rapporter sa taille d'effet ?", "feedback_general_html": "<p>On rapporte la taille d'effet de tous les effets testés : un effet non significatif peut avoir une taille non nulle, et l'information sert aux comparaisons. CM05, section Rigoureux, « Rédaction ».<\/p>", "options": [{"texte_html": "Non, car elle est forcément nulle.", "score": -30.0, "feedback_html": "<p>Un effet non significatif n'a pas une taille d'effet nulle pour autant.<\/p>"}, {"texte_html": "Oui, mais seulement si elle est supérieure à 0,14.", "score": -50.0, "feedback_html": "<p>On rapporte la taille d'effet quelle que soit sa valeur.<\/p>"}, {"texte_html": "Non : une taille d'effet ne se rapporte que pour un effet significatif.", "score": -20.0, "feedback_html": "<p>C'est une pratique fréquente, mais elle prive le lecteur d'une information utile.<\/p>"}, {"texte_html": "Oui : elle indique l'ampleur de l'effet estimé, même faible, et permet les comparaisons et les méta-analyses.", "score": 100.0, "feedback_html": "<p>Exact. Le cours rapporte ainsi ω² = 0,004 pour un effet non significatif.<\/p>"}]}, {"id": "C-CM5-029", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Laquelle de ces phrases rapporte correctement un résultat d'ANOVA ?<\/p>", "question_texte": "Laquelle de ces phrases rapporte correctement un résultat d'ANOVA ?", "feedback_general_html": "<p>Un résultat se rapporte avec le test (F, degrés de liberté, p) et une taille d'effet interprétée selon des repères cités. CM05, section Classique, « Rédaction ».<\/p>", "options": [{"texte_html": "L'âge explique 15,4 % de la variance totale (p = 0,002).", "score": -50.0, "feedback_html": "<p>η²p n'est pas une part de la variance totale : ce serait η².<\/p>"}, {"texte_html": "L'effet de l'âge est significatif (η²p = 0,154).", "score": -20.0, "feedback_html": "<p>La taille d'effet ne dit pas si l'effet est significatif : il manque le test (F et p).<\/p>"}, {"texte_html": "L'effet de l'âge est très important (p = 0,002).", "score": -30.0, "feedback_html": "<p>La valeur p ne mesure pas l'importance de l'effet, et la taille d'effet manque.<\/p>"}, {"texte_html": "L'effet de l'âge est significatif (F(1, 56) = 10,22, p = 0,002, η²p = 0,154), ce qui correspond à un grand effet selon les repères de Cohen (1988).", "score": 100.0, "feedback_html": "<p>Exact. Le test, la valeur p, la taille d'effet et son interprétation sont rapportés.<\/p>"}]}, {"id": "C-CM5-030", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 1, "question_html": "<p>Dans une ANOVA simple, on veut dire quelle part de la variation de la VD le facteur explique. Quel indice convient ?<\/p>", "question_texte": "Dans une ANOVA simple, on veut dire quelle part de la variation de la VD le facteur explique. Quel indice convient ?", "feedback_general_html": "<p>Pour la part de variance expliquée dans un plan à un facteur : η² (égal ici à η²p). CM05, section Rigoureux, « Que choisir ? ».<\/p>", "options": [{"texte_html": "η²G", "score": -20.0, "feedback_html": "<p>η²G sert à comparer des plans différents.<\/p>"}, {"texte_html": "η²", "score": 100.0, "feedback_html": "<p>Exact. η² est la part de la variance totale attribuable au facteur.<\/p>"}, {"texte_html": "Le f de Cohen", "score": -50.0, "feedback_html": "<p>Le f de Cohen se lit comme un d ; ce n'est pas une part de variance.<\/p>"}, {"texte_html": "Le test de Levene", "score": -30.0, "feedback_html": "<p>Le test de Levene vérifie l'égalité des variances ; ce n'est pas une taille d'effet.<\/p>"}]}, {"id": "C-CM6-002", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Le titre d'un article annonce un essai <em>randomized<\/em> (randomisé). Que signifie ce terme ?<\/p>", "question_texte": "Le titre d'un article annonce un essai *randomized* (randomisé). Que signifie ce terme ?", "feedback_general_html": "<p>Randomized : les participants sont répartis aléatoirement entre les groupes, ce qui rend les groupes comparables au départ. CM06, section Méditation.<\/p>", "options": [{"texte_html": "Les participants sont recrutés au hasard dans la population générale.", "score": -20.0, "feedback_html": "<p>La randomisation porte sur l'affectation aux groupes, pas sur le recrutement.<\/p>"}, {"texte_html": "Les résultats sont analysés par un tirage au hasard des valeurs p.", "score": -50.0, "feedback_html": "<p>Rien de tel : l'analyse statistique est fixée à l'avance.<\/p>"}, {"texte_html": "Les mesures sont prises à des moments tirés au hasard.", "score": -30.0, "feedback_html": "<p>Les moments de mesure sont fixés à l'avance (avant, 8 semaines, 3 mois).<\/p>"}, {"texte_html": "Les participants sont répartis au hasard entre les groupes.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM6-003", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Le même titre annonce un essai <em>controlled<\/em> (contrôlé). Que signifie ce terme ?<\/p>", "question_texte": "Le même titre annonce un essai *controlled* (contrôlé). Que signifie ce terme ?", "feedback_general_html": "<p>Controlled : il existe un groupe contrôle de référence. Dans l'étude de Jiang et al. (2022), c'est un contrôle actif, la TCC. CM06, section Méditation.<\/p>", "options": [{"texte_html": "Les participants ne savent pas dans quel groupe ils sont.", "score": -20.0, "feedback_html": "<p>Ce serait un essai « en aveugle », une autre caractéristique.<\/p>"}, {"texte_html": "Les participants sont surveillés pendant toute l'étude.", "score": -30.0, "feedback_html": "<p>Le terme ne désigne pas une surveillance des participants.<\/p>"}, {"texte_html": "Les conditions d'application de l'ANOVA ont été vérifiées.", "score": -50.0, "feedback_html": "<p>Le terme décrit le plan d'expérience, pas l'analyse.<\/p>"}, {"texte_html": "Il existe un groupe contrôle de référence, auquel on compare le traitement étudié.", "score": 100.0, "feedback_html": "<p>Exact. Ici, la thérapie cognitive et comportementale (TCC).<\/p>"}]}, {"id": "C-CM6-004", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Jiang et al. (2022) comparent une thérapie fondée sur la pleine conscience à la TCC dans un essai de <em>noninferiority<\/em> (non-infériorité). Quel est l'objectif d'un tel essai ?<\/p>", "question_texte": "Jiang et al. (2022) comparent une thérapie fondée sur la pleine conscience à la TCC dans un essai de *noninferiority* (non-infériorité). Quel est l'objectif d'un tel essai ?", "feedback_general_html": "<p>Un essai de non-infériorité ne cherche pas à montrer la supériorité de la nouvelle thérapie, mais à suggérer qu'elle n'est pas inférieure au traitement de référence. CM06, section Méditation.<\/p>", "options": [{"texte_html": "Montrer que les deux thérapies n'ont aucun effet.", "score": -50.0, "feedback_html": "<p>La TCC est une thérapie validée ; il ne s'agit pas de montrer l'absence d'effet.<\/p>"}, {"texte_html": "Montrer que la nouvelle thérapie est supérieure à la TCC.", "score": -20.0, "feedback_html": "<p>Ce serait un essai de supériorité ; ici, l'ambition est plus modeste.<\/p>"}, {"texte_html": "Montrer que la nouvelle thérapie n'est pas inférieure à la TCC, au-delà d'une marge fixée à l'avance.", "score": 100.0, "feedback_html": "<p>Exact. La marge de non-infériorité était ici de 10 %.<\/p>"}, {"texte_html": "Montrer que les participants ne se sentent pas inférieurs après la thérapie.", "score": -30.0, "feedback_html": "<p>Le terme porte sur la comparaison des thérapies, pas sur le ressenti des patients.<\/p>"}]}, {"id": "C-CM6-005", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Dans un essai clinique, quelle est la différence entre une analyse en intention de traiter (ITT) et une analyse per-protocole (PP) ?<\/p>", "question_texte": "Dans un essai clinique, quelle est la différence entre une analyse en intention de traiter (ITT) et une analyse per-protocole (PP) ?", "feedback_general_html": "<p>ITT : tous les participants sont inclus, qu'ils aient réellement suivi la thérapie prévue ou non. PP : seuls ceux qui l'ont au moins en partie suivie sont pris en compte. CM06, section Méditation.<\/p>", "options": [{"texte_html": "L'ITT analyse les intentions des patients ; la PP analyse leurs résultats.", "score": -50.0, "feedback_html": "<p>Les deux analyses portent sur les mêmes résultats ; elles diffèrent par les participants inclus.<\/p>"}, {"texte_html": "L'ITT utilise une ANOVA, la PP un test de Student.", "score": -30.0, "feedback_html": "<p>La différence ne tient pas au test utilisé, mais aux participants inclus.<\/p>"}, {"texte_html": "L'ITT inclut tous les participants répartis dans les groupes, qu'ils aient suivi la thérapie ou non ; la PP ne garde que ceux qui l'ont au moins en partie suivie.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "L'ITT ne garde que ceux qui ont suivi la thérapie ; la PP inclut tous les participants.", "score": -20.0, "feedback_html": "<p>C'est exactement l'inverse.<\/p>"}]}, {"id": "C-CM6-006", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Dans l'étude de Jiang et al. (2022), l'anxiété est mesurée avant la thérapie, à 8 semaines et à 3 mois, dans deux groupes (pleine conscience, TCC). De quel plan s'agit-il ?<\/p>", "question_texte": "Dans l'étude de Jiang et al. (2022), l'anxiété est mesurée avant la thérapie, à 8 semaines et à 3 mois, dans deux groupes (pleine conscience, TCC). De quel plan s'agit-il ?", "feedback_general_html": "<p>VD : anxiété ; VI intra-sujet : temps (3 modalités) ; VI inter-sujets : groupe (2 modalités). C'est un plan mixte. CM06, section Méditation, « Situation statistique ».<\/p>", "options": [{"texte_html": "Un plan croisé avec deux facteurs inter-sujets.", "score": -20.0, "feedback_html": "<p>Les trois mesures portent sur les mêmes patients : le temps est intra-sujet.<\/p>"}, {"texte_html": "Un plan à mesures répétées avec deux facteurs intra-sujets.", "score": -30.0, "feedback_html": "<p>Chaque patient n'appartient qu'à un groupe : le groupe est inter-sujets.<\/p>"}, {"texte_html": "Un plan mixte : groupe inter-sujets, temps intra-sujet.", "score": 100.0, "feedback_html": "<p>Exact. C'est l'analyse retenue par les auteurs (two-way mixed ANOVA).<\/p>"}, {"texte_html": "Un plan simple à six groupes.", "score": -50.0, "feedback_html": "<p>Il y a deux facteurs croisés, dont l'un est intra-sujet.<\/p>"}]}, {"id": "C-CM6-007", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Pourquoi un essai clinique mesure-t-il les symptômes 3 mois après la fin de la thérapie, en plus de la mesure de fin de thérapie ?<\/p>", "question_texte": "Pourquoi un essai clinique mesure-t-il les symptômes 3 mois après la fin de la thérapie, en plus de la mesure de fin de thérapie ?", "feedback_general_html": "<p>La mesure de suivi à 3 mois permet de savoir si l'effet de la thérapie dure après sa fin. CM06, section Méditation, « Outcomes ».<\/p>", "options": [{"texte_html": "Pour avoir assez de mesures pour faire une ANOVA.", "score": -30.0, "feedback_html": "<p>Deux mesures suffiraient pour une ANOVA ; la troisième répond à une question de fond.<\/p>"}, {"texte_html": "Pour savoir si l'effet de la thérapie se maintient dans le temps.", "score": 100.0, "feedback_html": "<p>Exact. C'est la mesure de suivi (follow-up).<\/p>"}, {"texte_html": "Pour remplacer les patients perdus en cours d'étude.", "score": -20.0, "feedback_html": "<p>Une mesure supplémentaire ne remplace pas les patients perdus.<\/p>"}, {"texte_html": "Pour vérifier la sphéricité.", "score": -50.0, "feedback_html": "<p>On ne choisit pas les moments de mesure pour tester une condition d'application.<\/p>"}]}, {"id": "C-CM6-008", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Pour calculer la taille de leur échantillon, Jiang et al. (2022) fixent le risque d'erreur de type II à 20 %. Quelle puissance visent-ils ?<\/p>", "question_texte": "Pour calculer la taille de leur échantillon, Jiang et al. (2022) fixent le risque d'erreur de type II à 20 %. Quelle puissance visent-ils ?", "feedback_general_html": "<p>La puissance est la probabilité de détecter un effet qui existe : 1 − β, où β est le risque d'erreur de type II. Avec β = 20 %, la puissance visée est de 80 %. CM06, section Méditation, « Sample size ».<\/p>", "options": [{"texte_html": "97,5 %", "score": -30.0, "feedback_html": "<p>97,5 % correspond au complément du risque de type I unilatéral de 2,5 %, pas à la puissance.<\/p>"}, {"texte_html": "On ne peut pas le savoir sans les données.", "score": -50.0, "feedback_html": "<p>La puissance visée se déduit directement de β.<\/p>"}, {"texte_html": "20 %", "score": -20.0, "feedback_html": "<p>20 % est le risque d'erreur de type II (β) ; la puissance est son complément.<\/p>"}, {"texte_html": "80 %", "score": 100.0, "feedback_html": "<p>Exact. Puissance = 1 − β = 1 − 0,20 = 0,80.<\/p>"}]}, {"id": "C-CM6-009", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Le calcul de puissance donne 61 participants par groupe, mais les chercheurs visent 69 participants par groupe. Pourquoi ?<\/p>", "question_texte": "Le calcul de puissance donne 61 participants par groupe, mais les chercheurs visent 69 participants par groupe. Pourquoi ?", "feedback_general_html": "<p>Avec un taux d'abandon supposé de 13 %, il faut recruter plus que l'effectif donné par le calcul de puissance pour garder assez de participants à la fin. CM06, section Méditation, « Sample size ».<\/p>", "options": [{"texte_html": "Pour augmenter le risque d'erreur de type I.", "score": -30.0, "feedback_html": "<p>Le risque de type I est fixé par le seuil (2,5 %), pas par l'effectif.<\/p>"}, {"texte_html": "Pour compenser les abandons attendus (environ 13 %) et garder assez de participants à la fin.", "score": 100.0, "feedback_html": "<p>Exact. Si 13 % abandonnent, il en reste environ 60 sur 69.<\/p>"}, {"texte_html": "Pour que les groupes soient de taille différente.", "score": -50.0, "feedback_html": "<p>Les deux groupes visent le même effectif, 69.<\/p>"}, {"texte_html": "Parce qu'un calcul de puissance sous-estime toujours l'effectif nécessaire.", "score": -20.0, "feedback_html": "<p>Le calcul donne l'effectif nécessaire à l'analyse ; c'est la perte prévisible de participants qui oblige à recruter plus.<\/p>"}]}, {"id": "C-CM6-010", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Pourquoi est-il important de calculer la taille de l'échantillon avant de lancer une étude ?<\/p>", "question_texte": "Pourquoi est-il important de calculer la taille de l'échantillon avant de lancer une étude ?", "feedback_general_html": "<p>Le calcul de puissance détermine l'effectif nécessaire pour avoir une bonne probabilité de détecter l'effet attendu. Trop peu de participants : risque élevé d'erreur de type II. CM06, section Méditation, « Sample size ».<\/p>", "options": [{"texte_html": "Pour choisir après coup le seuil de significativité.", "score": -30.0, "feedback_html": "<p>Le seuil est fixé à l'avance, il fait partie des données du calcul.<\/p>"}, {"texte_html": "Pour garantir que le résultat sera significatif.", "score": -20.0, "feedback_html": "<p>Le calcul fixe une probabilité de détecter l'effet (la puissance), pas une certitude.<\/p>"}, {"texte_html": "Pour s'assurer d'avoir assez de puissance pour détecter l'effet attendu, sans recruter inutilement.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Pour pouvoir se passer des conditions d'application.", "score": -50.0, "feedback_html": "<p>Les conditions d'application se vérifient quel que soit l'effectif.<\/p>"}]}, {"id": "C-CM6-011", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Les auteurs écrivent avoir calculé η²p « pour tous les résultats significatifs ». Que peut-on en penser ?<\/p>", "question_texte": "Les auteurs écrivent avoir calculé η²p « pour tous les résultats significatifs ». Que peut-on en penser ?", "feedback_general_html": "<p>On rapporte de préférence la taille d'effet de tous les effets testés : un effet non significatif peut avoir une taille non négligeable, et ces valeurs servent aux comparaisons et aux méta-analyses. CM05 ; CM06, section Méditation.<\/p>", "options": [{"texte_html": "C'est discutable : rapporter aussi la taille des effets non significatifs informe le lecteur et permet les méta-analyses.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "C'est obligatoire, car η²p ne peut pas être calculé pour un effet non significatif.", "score": -50.0, "feedback_html": "<p>η²p se calcule pour tout effet, significatif ou non.<\/p>"}, {"texte_html": "C'est sans importance, car la taille d'effet ne dépend que de la valeur p.", "score": -30.0, "feedback_html": "<p>La taille d'effet ne se déduit pas de la seule valeur p : celle-ci dépend aussi de l'effectif.<\/p>"}, {"texte_html": "C'est la bonne pratique : une taille d'effet n'a pas de sens si l'effet n'est pas significatif.", "score": -20.0, "feedback_html": "<p>Une taille d'effet a un sens même pour un effet non significatif.<\/p>"}]}, {"id": "C-CM6-012", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Une étude sur la désinformation croise deux facteurs intra-sujets à deux modalités : le design du site (fiable, non fiable) et l'expertise de la source (expert, non expert). Quelles conditions propres à ce plan faut-il vérifier ?<\/p>", "question_texte": "Une étude sur la désinformation croise deux facteurs intra-sujets à deux modalités : le design du site (fiable, non fiable) et l'expertise de la source (expert, non expert). Quelles conditions propres à ce plan faut-il vérifier ?", "feedback_general_html": "<p>Sans facteur inter-sujets, l'homogénéité des variances n'est pas une condition ; avec des facteurs à deux niveaux, il n'y a pas de sphéricité à vérifier. CM06, section Désinformation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Aucune de ces deux conditions : il n'y a pas de facteur inter-sujets, et les facteurs n'ont que deux modalités.", "score": 100.0, "feedback_html": "<p>Exact. La normalité reste, elle, à examiner.<\/p>"}, {"texte_html": "La sphéricité et l'homogénéité des variances.", "score": -30.0, "feedback_html": "<p>Ni l'une ni l'autre ne se pose ici.<\/p>"}, {"texte_html": "Seulement l'homogénéité des variances.", "score": -20.0, "feedback_html": "<p>Il n'y a pas de facteur inter-sujets : l'homogénéité des variances n'est pas une condition.<\/p>"}, {"texte_html": "Seulement la sphéricité, pour chacun des deux facteurs.", "score": -50.0, "feedback_html": "<p>Avec deux modalités, la sphéricité est forcément respectée.<\/p>"}]}, {"id": "C-CM6-013", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Dans l'étude sur la désinformation, la croyance est mesurée dans les quatre combinaisons design × expertise. Une fois les données au format large, combien de colonnes de croyance chaque participant a-t-il ?<\/p>", "question_texte": "Dans l'étude sur la désinformation, la croyance est mesurée dans les quatre combinaisons design × expertise. Une fois les données au format large, combien de colonnes de croyance chaque participant a-t-il ?", "feedback_general_html": "<p>Au format large, chaque mesure répétée a sa colonne : 2 × 2 = 4 colonnes de croyance par participant, glissées chacune dans sa case de <em>Repeated Measures Cells<\/em>. CM06, section Désinformation, « Jamovi ».<\/p>", "options": [{"texte_html": "1", "score": -30.0, "feedback_html": "<p>Une seule colonne correspondrait au format long.<\/p>"}, {"texte_html": "2", "score": -20.0, "feedback_html": "<p>Il y a deux facteurs, mais chaque combinaison de modalités est une mesure : 2 × 2.<\/p>"}, {"texte_html": "4", "score": 100.0, "feedback_html": "<p>Exact. Par exemple <em>Croyance_Fiable_Expert<\/em>, <em>Croyance_Fiable_NonExpert<\/em>, etc.<\/p>"}, {"texte_html": "90, une par participant.", "score": -50.0, "feedback_html": "<p>Au format large, chaque participant est une ligne, pas une colonne.<\/p>"}]}, {"id": "C-CM6-014", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Des données de mesures répétées sont présentées au format long, avec une colonne <em>Id<\/em>. À quoi sert cette colonne ?<\/p>", "question_texte": "Des données de mesures répétées sont présentées au format long, avec une colonne *Id*. À quoi sert cette colonne ?", "feedback_general_html": "<p>Au format long, chaque ligne est une mesure ; la colonne <em>Id<\/em> dit à quel participant elle appartient. Pour Jamovi, il faut ensuite passer au format large. CM06, section Désinformation.<\/p>", "options": [{"texte_html": "Elle indique à quel participant appartient chaque mesure.", "score": 100.0, "feedback_html": "<p>Exact. Au format long, un participant occupe plusieurs lignes.<\/p>"}, {"texte_html": "Elle numérote les lignes et peut être supprimée sans perte.", "score": -30.0, "feedback_html": "<p>Sans elle, on ne saurait plus quelles mesures viennent du même participant.<\/p>"}, {"texte_html": "Elle contient la VD.", "score": -50.0, "feedback_html": "<p>La VD est dans une autre colonne.<\/p>"}, {"texte_html": "Elle indique la condition expérimentale.", "score": -20.0, "feedback_html": "<p>La condition a sa propre colonne ; <em>Id<\/em> identifie le participant.<\/p>"}]}, {"id": "C-CM6-015", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Dans l'étude sur la désinformation, l'ordre de présentation des conditions est contrebalancé entre les participants. Pourquoi ?<\/p>", "question_texte": "Dans l'étude sur la désinformation, l'ordre de présentation des conditions est contrebalancé entre les participants. Pourquoi ?", "feedback_general_html": "<p>Quand chaque participant passe toutes les conditions, l'ordre peut avoir un effet propre. Le contrebalancement répartit cet effet de façon équilibrée entre les conditions. CM06, section Désinformation, « Situation statistique ».<\/p>", "options": [{"texte_html": "Pour transformer les facteurs intra-sujets en facteurs inter-sujets.", "score": -50.0, "feedback_html": "<p>Chaque participant passe toujours toutes les conditions : les facteurs restent intra-sujets.<\/p>"}, {"texte_html": "Pour respecter la condition de sphéricité.", "score": -30.0, "feedback_html": "<p>Le contrebalancement ne garantit pas la sphéricité.<\/p>"}, {"texte_html": "Pour que les participants ne sachent pas quelle condition ils passent.", "score": -20.0, "feedback_html": "<p>Le but n'est pas de masquer la condition, mais de répartir les effets d'ordre.<\/p>"}, {"texte_html": "Pour que les effets d'ordre (fatigue, apprentissage) ne se confondent pas avec l'effet des conditions.", "score": 100.0, "feedback_html": "<p>Exact. Chaque condition apparaît aussi souvent en début qu'en fin de passation.<\/p>"}]}, {"id": "C-CM6-016", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Dans l'étude sur la désinformation, les effets principaux du design et de l'expertise sont significatifs, mais pas l'interaction. Comment le résumer ?<\/p>", "question_texte": "Dans l'étude sur la désinformation, les effets principaux du design et de l'expertise sont significatifs, mais pas l'interaction. Comment le résumer ?", "feedback_general_html": "<p>Sans interaction, les effets des deux facteurs s'additionnent : l'expertise apparente et le design du site ont des effets additifs sur l'adhésion à l'information. CM06, section Désinformation, « Rédaction ».<\/p>", "options": [{"texte_html": "Les deux facteurs ont des effets additifs : chacun agit de la même façon quel que soit le niveau de l'autre.", "score": 100.0, "feedback_html": "<p>Exact. C'est la conclusion des auteurs.<\/p>"}, {"texte_html": "L'effet du design dépend de l'expertise de la source.", "score": -20.0, "feedback_html": "<p>Ce serait une interaction, qui n'est pas significative ici.<\/p>"}, {"texte_html": "Il faut interpréter les effets simples avant les effets principaux.", "score": -30.0, "feedback_html": "<p>C'est la démarche en cas d'interaction significative, pas ici.<\/p>"}, {"texte_html": "Aucun des deux facteurs n'a d'effet, puisque l'interaction n'est pas significative.", "score": -50.0, "feedback_html": "<p>Les effets principaux sont significatifs, indépendamment de l'interaction.<\/p>"}]}, {"id": "C-CM6-017", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Dans l'étude sur la désinformation, l'effet du design a η²p = 0,049 et celui de l'expertise η²p = 0,068. Comment les qualifier ?<\/p><p><em>Rappel : repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Dans l'étude sur la désinformation, l'effet du design a η²p = 0,049 et celui de l'expertise η²p = 0,068. Comment les qualifier ?\n\n*Rappel : repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>0,049 se situe entre 0,01 et 0,06 ; 0,068 dépasse à peine 0,06 : des effets faibles à moyens selon Cohen (1988). CM06, section Désinformation, « Rédaction ».<\/p>", "options": [{"texte_html": "Grands, puisque les deux effets sont significatifs.", "score": -30.0, "feedback_html": "<p>La significativité ne dit rien de la taille de l'effet.<\/p>"}, {"texte_html": "Petits tous les deux, puisqu'ils sont inférieurs à 0,1.", "score": -20.0, "feedback_html": "<p>0,068 dépasse le repère d'un effet moyen (0,06).<\/p>"}, {"texte_html": "Nuls, puisqu'ils sont inférieurs à 0,14.", "score": -50.0, "feedback_html": "<p>Être sous le repère d'un grand effet ne rend pas un effet nul.<\/p>"}, {"texte_html": "Faibles à moyens : le premier entre petit et moyen, le second juste au-dessus du repère d'un effet moyen.", "score": 100.0, "feedback_html": "<p>Exact. C'est la formulation des auteurs (« faibles-moyens »).<\/p>"}]}, {"id": "C-CM6-018", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Trois groupes d'étudiants suivent trois versions d'un cours de statistique. Leur niveau est mesuré au début (prétest) et à la fin du semestre (post-test). On veut seulement savoir si, à la fin du cours, les notes diffèrent entre les groupes. Quelle analyse convient ?<\/p>", "question_texte": "Trois groupes d'étudiants suivent trois versions d'un cours de statistique. Leur niveau est mesuré au début (prétest) et à la fin du semestre (post-test). On veut seulement savoir si, à la fin du cours, les notes diffèrent entre les groupes. Quelle analyse convient ?", "feedback_general_html": "<p>La façon de poser la question détermine l'analyse : pour comparer les groupes à la fin du cours, une ANOVA simple sur le post-test suffit. CM06, section Pre-test Post-test.<\/p>", "options": [{"texte_html": "Une ANOVA simple sur la note au post-test, avec le facteur <em>Groupe<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. La question ne porte que sur le post-test.<\/p>"}, {"texte_html": "Une ANOVA simple sur la note au prétest.", "score": -30.0, "feedback_html": "<p>Le prétest mesure le niveau avant le cours ; la question porte sur la fin du cours.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées sans facteur inter-sujets.", "score": -20.0, "feedback_html": "<p>Elle ignorerait le facteur <em>Groupe<\/em>, qui est l'objet de la question.<\/p>"}, {"texte_html": "Trois tests de Student sans correction.", "score": -50.0, "feedback_html": "<p>Trois tests sans correction gonfleraient le risque d'erreur de type I.<\/p>"}]}, {"id": "C-CM6-019", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 2, "question_html": "<p>Dans la même étude (trois groupes, prétest et post-test), on veut savoir si l'évolution des notes au cours du semestre diffère selon le groupe. Quelle analyse et quel effet faut-il examiner ?<\/p>", "question_texte": "Dans la même étude (trois groupes, prétest et post-test), on veut savoir si l'évolution des notes au cours du semestre diffère selon le groupe. Quelle analyse et quel effet faut-il examiner ?", "feedback_general_html": "<p>Pour comparer des évolutions, on utilise une ANOVA mixte : la question porte sur l'interaction entre le groupe et le temps. CM06, section Pre-test Post-test.<\/p>", "options": [{"texte_html": "Une ANOVA mixte (groupe inter-sujets, temps intra-sujet), en examinant l'interaction groupe × temps.", "score": 100.0, "feedback_html": "<p>Exact. Une évolution qui diffère selon le groupe, c'est une interaction.<\/p>"}, {"texte_html": "Une ANOVA mixte, en examinant l'effet principal du temps.", "score": -20.0, "feedback_html": "<p>Le bon plan, mais l'effet principal du temps décrit l'évolution moyenne, tous groupes confondus.<\/p>"}, {"texte_html": "Une ANOVA simple sur le post-test, en examinant l'effet du groupe.", "score": -30.0, "feedback_html": "<p>Elle compare les groupes à la fin, sans tenir compte de leur point de départ.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé avec deux facteurs inter-sujets.", "score": -50.0, "feedback_html": "<p>Les deux notes viennent des mêmes étudiants : le temps est intra-sujet.<\/p>"}]}, {"id": "C-CM6-020", "type": "question", "categorie": "comprehension", "cm": [6], "difficulte": 1, "question_html": "<p>Dans l'étude sur la désinformation, deux VD sont mesurées : la croyance en l'information et la fiabilité perçue du site. Comment les analyse-t-on dans le cours ?<\/p>", "question_texte": "Dans l'étude sur la désinformation, deux VD sont mesurées : la croyance en l'information et la fiabilité perçue du site. Comment les analyse-t-on dans le cours ?", "feedback_general_html": "<p>On fait deux analyses séparées, une par VD ; les deux VI (design, expertise) sont intra-sujets. CM06, section Désinformation, « Situation statistique ».<\/p>", "options": [{"texte_html": "En traitant la croyance comme un facteur et la fiabilité comme la VD.", "score": -50.0, "feedback_html": "<p>La croyance est mesurée, pas manipulée : ce n'est pas un facteur.<\/p>"}, {"texte_html": "On n'en analyse qu'une, l'autre servant à vérifier les conditions d'application.", "score": -20.0, "feedback_html": "<p>Les deux VD répondent à des questions de recherche ; elles sont analysées toutes les deux.<\/p>"}, {"texte_html": "Par deux ANOVA séparées, une par VD.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Par une seule ANOVA, en additionnant les deux scores.", "score": -30.0, "feedback_html": "<p>Additionner deux VD qui mesurent des choses différentes mélangerait leurs effets.<\/p>"}]}, {"id": "S-004", "type": "serie", "categorie": "interpretation", "cm": [3, 4, 5], "etude": {"titre": "Convaincre selon l'implication (plan croisé)"}, "etude_html": "<h4>Convaincre selon l&#x27;implication (plan croisé)<\/h4><p>Petty, Cacioppo et Goldman (1981) faisaient écouter à des étudiants un message en faveur d'un examen général obligatoire en dernière année d'université. Pour la moitié d'entre eux, la mesure devait s'appliquer dès l'année suivante, donc à eux-mêmes (implication forte) ; pour l'autre moitié, dans dix ans (implication faible). Le message contenait soit des arguments solides (chiffres, études), soit des arguments faibles (anecdotes, opinions). L'étude originale croisait aussi un troisième facteur, l'expertise de la source, laissé de côté ici.<\/p><p>Les résultats ci-dessous portent sur des données simulées : 80 étudiants, 20 par condition. Les facteurs inter-sujets sont <em>Implication<\/em> (<em>Faible<\/em>, <em>Forte<\/em>) et <em>Arguments<\/em> (<em>Faibles<\/em>, <em>Forts<\/em>). La VD <em>Attitude<\/em> va de 1 (très défavorable à l'examen) à 9 (très favorable).<\/p><p style=\"font-size:0.85em;color:#555\">Résultats calculés sur des données simulées, inspirées de l'étude citée.<\/p><p style=\"font-size:0.85em;color:#555\">Petty, R. E., Cacioppo, J. T., &amp; Goldman, R. (1981). Personal involvement as a determinant of argument-based persuasion. <em>Journal of Personality and Social Psychology, 41<\/em>(5), 847–855. https://doi.org/10.1037/0022-3514.41.5.847<\/p><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">ANOVA<\/p><p style=\"margin-bottom:2px\"><strong>ANOVA - Attitude<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\"><\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Sum of Squares<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean Square<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">η²p<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">ω²<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Implication<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.300<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.300<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.18<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.673<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.002<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.002<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">−0.007<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Arguments<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">42.195<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">42.195<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">25.30<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.215<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.250<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.205<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Implication ✻ Arguments<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">26.796<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">26.796<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">16.07<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">&lt; .001<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.137<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.175<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.127<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Residuals<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">126.763<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">76<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">1.668<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\"><\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Homogeneity of Variances Test (Levene&#x27;s)<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">F<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df1<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">df2<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">p<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">2.145<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">76<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">.101<\/td><\/tr><\/table><\/div><p style=\"margin:10px 0 2px;color:#3E6DA9;font-size:1.15em\">Estimated Marginal Means<\/p><p style=\"margin-bottom:2px\"><strong>Estimated Marginal Means - Implication ✻ Arguments<\/strong><\/p><div style=\"overflow-x:auto\"><table style=\"border-collapse:collapse;font-size:0.88em;border-top:1px solid #333;border-bottom:1px solid #333;\"><tr><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Implication<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:left;border-bottom:1px solid #333\">Arguments<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">Mean<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">SE<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Lower<\/th><th style=\"padding:3px 7px;white-space:nowrap;text-align:right;border-bottom:1px solid #333\">95% CI Upper<\/th><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Faible<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Faibles<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.955<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.289<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.380<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.530<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Faible<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Forts<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.250<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.289<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.675<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.825<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Forte<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Faibles<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3.675<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.289<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">3.100<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">4.250<\/td><\/tr><tr><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Forte<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:left\">Forts<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.285<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">0.289<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">5.710<\/td><td style=\"padding:2px 7px;white-space:nowrap;text-align:right\">6.860<\/td><\/tr><\/table><\/div><p style=\"margin-bottom:2px\"><strong>Moyennes de l&#x27;attitude selon l&#x27;implication et la qualité des arguments (IC à 95 %)<\/strong><\/p><p><img src=\"images/s1_petty_interaction.png\" alt=\"Moyennes de l&#x27;attitude selon l&#x27;implication et la qualité des arguments (IC à 95 %)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><\/p>", "questions": [{"id": "S-004-q1", "difficulte": 1, "question_html": "<p>Quels effets sont significatifs au seuil de 5 % ?<\/p>", "question_texte": "Quels effets sont significatifs au seuil de 5 % ?", "feedback_general_html": "<p>Arguments : p &lt; .001 ; interaction : p &lt; .001 ; implication : p = .673. CM03, section Factoriel.<\/p>", "options": [{"texte_html": "Seulement l'effet principal des arguments.", "score": -20.0, "feedback_html": "<p>L'interaction est aussi significative (p &lt; .001).<\/p>"}, {"texte_html": "L'effet principal des arguments et l'interaction.", "score": 100.0, "feedback_html": "<p>Exact. Arguments : p &lt; .001 ; interaction : p &lt; .001 ; implication : p = .673.<\/p>"}, {"texte_html": "Les effets principaux de l'implication et des arguments.", "score": -30.0, "feedback_html": "<p>L'effet principal de l'implication n'est pas significatif (p = .673), et vous oubliez l'interaction.<\/p>"}, {"texte_html": "Les deux effets principaux et l'interaction.", "score": -50.0, "feedback_html": "<p>L'effet principal de l'implication n'est pas significatif : p = .673.<\/p>"}]}, {"id": "S-004-q2", "difficulte": 1, "question_html": "<p>Dans quelle condition l'attitude envers l'examen est-elle la plus favorable ?<\/p>", "question_texte": "Dans quelle condition l'attitude envers l'examen est-elle la plus favorable ?", "feedback_general_html": "<p>La moyenne la plus élevée est 6.285 (implication forte, arguments forts), visible dans le tableau des moyennes marginales et sur le graphique. <em>Estimated Marginal Means<\/em>.<\/p>", "options": [{"texte_html": "Implication forte, arguments forts.", "score": 100.0, "feedback_html": "<p>Exact. C'est la moyenne la plus élevée (6.285).<\/p>"}, {"texte_html": "Implication faible, arguments forts.", "score": -20.0, "feedback_html": "<p>5.250 : c'est la deuxième moyenne, nettement sous 6.285.<\/p>"}, {"texte_html": "Implication forte, arguments faibles.", "score": -50.0, "feedback_html": "<p>C'est au contraire la condition la moins favorable (3.675).<\/p>"}, {"texte_html": "Implication faible, arguments faibles.", "score": -30.0, "feedback_html": "<p>4.955 : c'est une moyenne intermédiaire.<\/p>"}]}, {"id": "S-004-q3", "difficulte": 2, "question_html": "<p>Comment décrire l'interaction ?<\/p>", "question_texte": "Comment décrire l'interaction ?", "feedback_general_html": "<p>Avec une implication faible, les moyennes sont proches (4.955 et 5.250) ; avec une implication forte, elles s'écartent nettement (3.675 et 6.285). Une interaction peut être significative sans effet principal. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "L'implication rend les étudiants plus favorables à l'examen, quels que soient les arguments.", "score": -50.0, "feedback_html": "<p>L'implication n'a pas d'effet global (p = .673), et son effet dépend des arguments.<\/p>"}, {"texte_html": "La qualité des arguments n'a d'effet que lorsque l'implication est faible.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : avec une implication faible, les moyennes sont proches (4.955 et 5.250).<\/p>"}, {"texte_html": "La qualité des arguments a un effet beaucoup plus marqué lorsque l'implication est forte.", "score": 100.0, "feedback_html": "<p>Exact. Implication forte : 3.675 contre 6.285 ; implication faible : 4.955 contre 5.250.<\/p>"}, {"texte_html": "Il n'y a pas d'interaction, puisque l'effet principal de l'implication n'est pas significatif.", "score": -20.0, "feedback_html": "<p>Une interaction peut être significative sans effet principal : c'est le cas ici (p &lt; .001).<\/p>"}]}, {"id": "S-004-q4", "difficulte": 2, "question_html": "<p>L'interaction étant significative, comment interpréter l'effet principal des arguments ?<\/p>", "question_texte": "L'interaction étant significative, comment interpréter l'effet principal des arguments ?", "feedback_general_html": "<p>Quand l'interaction est significative, on interprète les effets simples avant les effets principaux. CM03, section Compléments.<\/p>", "options": [{"texte_html": "Comme un effet général : les arguments forts convainquent autant dans toutes les conditions.", "score": -30.0, "feedback_html": "<p>L'interaction montre justement que l'effet des arguments n'est pas le même selon l'implication.<\/p>"}, {"texte_html": "Il faut l'ignorer, puisqu'il est significatif.", "score": -50.0, "feedback_html": "<p>Être significatif n'est pas une raison de l'ignorer ; il faut l'interpréter avec prudence.<\/p>"}, {"texte_html": "Il faut retirer l'interaction du modèle pour l'interpréter.", "score": -20.0, "feedback_html": "<p>On ne retire une interaction que lorsqu'elle n'est pas significative.<\/p>"}, {"texte_html": "Avec prudence : il faut d'abord examiner l'effet des arguments à chaque niveau d'implication, car l'effet principal moyenne deux effets très différents.", "score": 100.0, "feedback_html": "<p>Exact. On interprète les effets simples avant les effets principaux.<\/p>"}]}, {"id": "S-004-q5", "difficulte": 2, "question_html": "<p>Comment qualifier la taille de l'effet d'interaction (η²p = 0.175) ?<\/p><p><em>Rappel : repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Comment qualifier la taille de l'effet d'interaction (η²p = 0.175) ?\n\n*Rappel : repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>Selon les repères de Cohen (1988), 0.175 correspond à un grand effet. La taille de l'interaction ne dépend pas de celle des effets principaux. CM05, section Classique.<\/p>", "options": [{"texte_html": "Grand, puisque η²p dépasse 0,14.", "score": 100.0, "feedback_html": "<p>Exact. Selon les repères de Cohen (1988), 0.175 correspond à un grand effet.<\/p>"}, {"texte_html": "Moyen, puisque η²p est compris entre 0,06 et 0,20.", "score": -20.0, "feedback_html": "<p>Le repère d'un grand effet est 0,14 : au-delà, l'effet est grand.<\/p>"}, {"texte_html": "Petit, puisque η²p est inférieur à 0,5.", "score": -30.0, "feedback_html": "<p>Les repères de Cohen sont bien plus bas que 0,5.<\/p>"}, {
