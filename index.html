em>, avec les six colonnes de notes dans <em>Repeated Measures Cells<\/em>.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "S-022-q3", "difficulte": 2, "question_html": "<p>Quelle condition d'application faut-il vérifier en plus de la normalité ?<\/p>", "question_texte": "Quelle condition d'application faut-il vérifier en plus de la normalité ?", "feedback_general_html": "<p>Dans une ANOVA à mesures répétées avec au moins trois modalités, on vérifie la sphéricité (test de Mauchly). CM02, section Formalisation, « Tester la sphéricité ».<\/p>", "options": [{"texte_html": "Aucune : l'ANOVA à mesures répétées n'a pas de condition d'application.", "score": -30.0, "feedback_html": "<p>Elle suppose notamment la sphéricité.<\/p>"}, {"texte_html": "L'indépendance entre les six notes d'un même participant.", "score": -50.0, "feedback_html": "<p>Les notes d'un même participant sont justement liées ; c'est ce que l'ANOVA à mesures répétées prend en compte.<\/p>"}, {"texte_html": "La sphéricité, avec le test de Mauchly.", "score": 100.0, "feedback_html": "<p>Exact. Avec six modalités, la sphéricité peut être violée.<\/p>"}, {"texte_html": "L'homogénéité des variances, avec le test de Levene.", "score": -20.0, "feedback_html": "<p>Sans facteur inter-sujets, il n'y a pas de groupes à comparer : le test de Levene ne s'applique pas.<\/p>"}]}, {"id": "S-022-q4", "difficulte": 2, "question_html": "<p>Quel type de contraste, dans Jamovi, correspond le mieux à l'hypothèse « plus un mot a été vu souvent, plus il est jugé positif » ?<\/p>", "question_texte": "Quel type de contraste, dans Jamovi, correspond le mieux à l'hypothèse « plus un mot a été vu souvent, plus il est jugé positif » ?", "feedback_general_html": "<p>Pour des modalités ordonnées, le contraste polynomial décompose l'effet en tendances linéaire, quadratique, etc. CM04, section Exemples de contrastes, « Ordre ».<\/p>", "options": [{"texte_html": "<em>Polynomial<\/em>, en regardant la composante linéaire.", "score": 100.0, "feedback_html": "<p>Exact. Il teste une tendance croissante sur des modalités ordonnées.<\/p>"}, {"texte_html": "<em>Helmert<\/em>.", "score": -20.0, "feedback_html": "<p>Helmert compare chaque modalité à la moyenne des suivantes ; il NE teste PAS une tendance d'ensemble.<\/p>"}, {"texte_html": "<em>Simple<\/em>, en prenant 0 exposition comme référence.", "score": -30.0, "feedback_html": "<p>Il compare chaque fréquence à 0, une par une, sans tester la régularité de la progression.<\/p>"}, {"texte_html": "Aucun : il faut des comparaisons post-hoc de Tukey.", "score": -50.0, "feedback_html": "<p>Les post-hoc explorent toutes les paires ; une hypothèse a priori sur une tendance se teste par un contraste.<\/p>"}]}, {"id": "S-022-q5", "difficulte": 3, "question_html": "<p>Les fréquences (0, 1, 2, 5, 10, 25) ne sont pas régulièrement espacées. Qu'implique ce choix pour le contraste polynomial de Jamovi ?<\/p>", "question_texte": "Les fréquences (0, 1, 2, 5, 10, 25) ne sont pas régulièrement espacées. Qu'implique ce choix pour le contraste polynomial de Jamovi ?", "feedback_general_html": "<p>Les coefficients polynomiaux supposent des modalités également espacées. Ici, ils testent une progression selon l'ordre (0 &lt; 1 &lt; 2 &lt; 5 &lt; 10 &lt; 25), ce qui reste cohérent avec l'hypothèse. CM04, section Exemples de contrastes, « Ordre ».<\/p>", "options": [{"texte_html": "Il faut d'abord vérifier l'homogénéité des variances avec le test de Levene.", "score": -50.0, "feedback_html": "<p>Cela n'a rien à voir avec l'espacement des modalités.<\/p>"}, {"texte_html": "Jamovi traite les six modalités comme régulièrement espacées : la composante linéaire teste une tendance selon l'ordre des modalités, pas une relation linéaire avec le nombre d'expositions.", "score": 100.0, "feedback_html": "<p>Exact. Les coefficients ne dépendent que du rang des modalités.<\/p>"}, {"texte_html": "Le contraste polynomial devient impossible à calculer.", "score": -30.0, "feedback_html": "<p>Il se calcule, mais sur les rangs des modalités.<\/p>"}, {"texte_html": "Jamovi utilise automatiquement les vraies fréquences pour calculer les coefficients.", "score": -20.0, "feedback_html": "<p>Les coefficients polynomiaux de Jamovi ne tiennent compte que de l'ordre des modalités.<\/p>"}]}, {"id": "S-022-q6", "difficulte": 2, "question_html": "<p>Si l'on voulait comparer toutes les paires de fréquences, quelle correction choisir dans Jamovi ?<\/p>", "question_texte": "Si l'on voulait comparer toutes les paires de fréquences, quelle correction choisir dans Jamovi ?", "feedback_general_html": "<p>Six modalités donnent 15 comparaisons. Pour des mesures répétées, on corrige par Holm ou Bonferroni. CM02, section Compléments, « Choix de correction ».<\/p>", "options": [{"texte_html": "Holm (ou Bonferroni).", "score": 100.0, "feedback_html": "<p>Exact. Ce sont les corrections recommandées pour les mesures répétées.<\/p>"}, {"texte_html": "Aucune : les mesures répétées protègent déjà de l'erreur de type I.", "score": -50.0, "feedback_html": "<p>Avec 15 comparaisons, le risque d'erreur de type I augmente fortement sans correction.<\/p>"}, {"texte_html": "Tukey.", "score": -20.0, "feedback_html": "<p>Tukey suppose des groupes indépendants ; avec des mesures répétées, on préfère Holm ou Bonferroni.<\/p>"}, {"texte_html": "Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>C'est une correction de la sphéricité, pas des comparaisons multiples.<\/p>"}]}, {"id": "S-022-q7", "difficulte": 2, "question_html": "<p>Quelle taille d'effet le cours recommande-t-il de rapporter pour l'effet de la fréquence ?<\/p>", "question_texte": "Quelle taille d'effet le cours recommande-t-il de rapporter pour l'effet de la fréquence ?", "feedback_general_html": "<p>Pour les mesures répétées, η²G (eta carré généralisé) est l'indice recommandé ; on l'interprète avec les seuils de Bakeman (2005). CM02, section Compléments, « La taille d'effet ».<\/p>", "options": [{"texte_html": "Le ε de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>ε mesure l'écart à la sphéricité, pas la taille de l'effet.<\/p>"}, {"texte_html": "η²G, interprété avec les seuils de Bakeman (2005) : 0,02 petit, 0,13 moyen, 0,26 grand.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "η²p, interprété avec les repères de Cohen (1988).", "score": -20.0, "feedback_html": "<p>En mesures répétées, η²p est gonflé par le retrait des différences entre participants ; η²G se compare mieux aux autres études.<\/p>"}, {"texte_html": "La statistique W de Mauchly.", "score": -50.0, "feedback_html": "<p>W sert à tester la sphéricité.<\/p>"}]}]}, {"id": "S-024", "type": "serie", "categorie": "choix", "cm": [3, 5], "etude": {"titre": "Des blattes en public (plan croisé)"}, "etude_html": "<h4>Des blattes en public (plan croisé)<\/h4><p>Zajonc, Heingartner et Herman (1969) voulaient tester une théorie de la facilitation sociale : la présence d'autrui améliore les performances aux tâches simples, mais les dégrade aux tâches complexes. Des blattes devaient fuir la lumière pour rejoindre une boîte sombre, soit par un couloir droit (tâche <em>Simple<\/em>), soit par un petit labyrinthe (tâche <em>Complexe<\/em>). Elles couraient seules (<em>Seule<\/em>) ou devant d'autres blattes placées dans des boîtes transparentes le long du parcours (<em>Public<\/em>). Chaque blatte ne passait qu'une seule condition. La VD était le temps mis pour atteindre la boîte, en secondes.<\/p><p style=\"font-size:0.85em;color:#555\">Zajonc, R. B., Heingartner, A., &amp; Herman, E. M. (1969). Social enhancement and impairment of performance in the cockroach. <em>Journal of Personality and Social Psychology, 13<\/em>(2), 83–92. https://doi.org/10.1037/h0028063<\/p>", "questions": [{"id": "S-024-q1", "difficulte": 1, "question_html": "<p>Comment décrire ce plan expérimental ?<\/p>", "question_texte": "Comment décrire ce plan expérimental ?", "feedback_general_html": "<p>Deux VI à deux modalités (<em>Tâche<\/em>, <em>Présence<\/em>), toutes deux inter-sujets : plan croisé 2 × 2. CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "Un plan croisé 2 × 2 entièrement inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Deux facteurs à deux modalités, chaque blatte dans une seule condition.<\/p>"}, {"texte_html": "Un plan à mesures répétées 2 × 2.", "score": -50.0, "feedback_html": "<p>Aucune blatte n'est mesurée plusieurs fois.<\/p>"}, {"texte_html": "Un plan à un facteur à quatre modalités, sans autre possibilité.", "score": -30.0, "feedback_html": "<p>On pourrait coder quatre groupes, mais on perdrait la possibilité de tester l'interaction prédite.<\/p>"}, {"texte_html": "Un plan mixte : la tâche en inter-sujets, la présence d'autrui en intra-sujet.", "score": -20.0, "feedback_html": "<p>Chaque blatte ne passe qu'une condition : les deux facteurs sont inter-sujets.<\/p>"}]}, {"id": "S-024-q2", "difficulte": 1, "question_html": "<p>Dans Jamovi, comment lancer l'analyse ?<\/p>", "question_texte": "Dans Jamovi, comment lancer l'analyse ?", "feedback_general_html": "<p>Plan croisé inter-sujets : Analyses → ANOVA → ANOVA, les deux facteurs dans <em>Fixed Factors<\/em>. CM03, section Factoriel.<\/p>", "options": [{"texte_html": "<em>ANOVA<\/em>, avec <em>Temps<\/em> dans <em>Dependent Variable<\/em>, <em>Tâche<\/em> et <em>Présence<\/em> dans <em>Fixed Factors<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Jamovi ajoute automatiquement l'interaction au modèle.<\/p>"}, {"texte_html": "<em>One-Way ANOVA<\/em>, deux fois de suite, une par facteur.", "score": -20.0, "feedback_html": "<p>Deux analyses séparées ne testent pas l'interaction.<\/p>"}, {"texte_html": "<em>ANOVA<\/em>, avec <em>Tâche<\/em> dans <em>Dependent Variable<\/em>.", "score": -50.0, "feedback_html": "<p>La tâche est un facteur manipulé, pas une variable mesurée.<\/p>"}, {"texte_html": "<em>Repeated Measures ANOVA<\/em>, avec <em>Tâche<\/em> comme facteur répété.", "score": -30.0, "feedback_html": "<p>Aucun facteur n'est intra-sujet.<\/p>"}]}, {"id": "S-024-q3", "difficulte": 2, "question_html": "<p>Quel effet du modèle teste directement la théorie de la facilitation sociale ?<\/p>", "question_texte": "Quel effet du modèle teste directement la théorie de la facilitation sociale ?", "feedback_general_html": "<p>La théorie prédit un effet du public qui dépend de la tâche : c'est la définition d'une interaction. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "L'interaction <em>Tâche ✻ Présence<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. La théorie prédit que l'effet du public change de sens selon la tâche.<\/p>"}, {"texte_html": "L'effet principal de la présence.", "score": -20.0, "feedback_html": "<p>Si l'effet s'inverse selon la tâche, l'effet principal moyen peut être nul : il NE teste PAS la théorie.<\/p>"}, {"texte_html": "Le test de Levene.", "score": -30.0, "feedback_html": "<p>Il vérifie une condition d'application.<\/p>"}, {"texte_html": "L'effet principal de la tâche.", "score": -50.0, "feedback_html": "<p>Que le labyrinthe prenne plus de temps que le couloir est attendu, mais ne dit rien de la facilitation sociale.<\/p>"}]}, {"id": "S-024-q4", "difficulte": 2, "question_html": "<p>Si la théorie est juste, à quoi devrait ressembler le graphique des moyennes (tâche en abscisse, une courbe par condition de présence) ?<\/p>", "question_texte": "Si la théorie est juste, à quoi devrait ressembler le graphique des moyennes (tâche en abscisse, une courbe par condition de présence) ?", "feedback_general_html": "<p>Une interaction se voit à des courbes non parallèles ; ici, la théorie prédit même qu'elles se croisent. Rappel : la VD est un temps, donc un temps plus court est une meilleure performance. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Les deux courbes sont confondues.", "score": -50.0, "feedback_html": "<p>Cela signifierait que le public n'a aucun effet.<\/p>"}, {"texte_html": "Les deux courbes se croisent : avec public, le temps est plus court dans le couloir et plus long dans le labyrinthe.", "score": 100.0, "feedback_html": "<p>Exact. Une interaction croisée.<\/p>"}, {"texte_html": "Les deux courbes sont parallèles, celle du public au-dessus.", "score": -30.0, "feedback_html": "<p>Le public ralentirait alors les blattes dans les deux tâches.<\/p>"}, {"texte_html": "Les deux courbes sont parallèles, celle du public au-dessous.", "score": -20.0, "feedback_html": "<p>Des courbes parallèles indiquent un effet du public identique pour les deux tâches : pas d'interaction.<\/p>"}]}, {"id": "S-024-q5", "difficulte": 2, "question_html": "<p>L'interaction est significative. Quelle analyse permet de savoir si le public a un effet dans chacune des deux tâches ?<\/p>", "question_texte": "L'interaction est significative. Quelle analyse permet de savoir si le public a un effet dans chacune des deux tâches ?", "feedback_general_html": "<p>Les effets simples testent l'effet d'un facteur à chaque niveau de l'autre. C'est la suite naturelle d'une interaction significative. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal de la présence.", "score": -30.0, "feedback_html": "<p>Il fait la moyenne sur les deux tâches.<\/p>"}, {"texte_html": "Les effets simples de la présence, à chaque niveau de la tâche.", "score": 100.0, "feedback_html": "<p>Exact. Dans Jamovi : <em>Simple Effects<\/em>, avec <em>Présence<\/em> en <em>Simple effects variable<\/em> et <em>Tâche<\/em> en <em>Moderator<\/em>.<\/p>"}, {"texte_html": "Le test de Mauchly.", "score": -50.0, "feedback_html": "<p>Il porte sur la sphéricité, qui ne se pose pas ici.<\/p>"}, {"texte_html": "L'effet principal de la tâche.", "score": -20.0, "feedback_html": "<p>Il compare les tâches, pas l'effet du public dans chacune.<\/p>"}]}, {"id": "S-024-q6", "difficulte": 2, "question_html": "<p>Pour rapporter la taille de l'interaction, quel indice et quels repères utiliser ?<\/p>", "question_texte": "Pour rapporter la taille de l'interaction, quel indice et quels repères utiliser ?", "feedback_general_html": "<p>Dans un plan croisé, on rapporte η²p, la part de variation expliquée par l'effet une fois retirés les autres effets. CM05, section Classique.<\/p>", "options": [{"texte_html": "η²G, interprété avec les repères de Cohen (1988).", "score": -20.0, "feedback_html": "<p>Les repères de Cohen se rapportent à η² et η²p ; les seuils de η²G sont ceux de Bakeman (2005). Dans un plan croisé inter-sujets, le cours rapporte η²p.<\/p>"}, {"texte_html": "La différence brute entre les moyennes, sans autre indice.", "score": -30.0, "feedback_html": "<p>Une différence brute est utile, mais NE permet PAS de comparer des effets d'une étude à l'autre.<\/p>"}, {"texte_html": "La valeur p de l'interaction.", "score": -50.0, "feedback_html": "<p>Une valeur p n'est pas une taille d'effet.<\/p>"}, {"texte_html": "η²p, interprété avec les repères de Cohen (1988) : 0,01 petit, 0,06 moyen, 0,14 grand.", "score": 100.0, "feedback_html": "<p>Exact. C'est l'indice le plus courant dans un plan croisé.<\/p>"}]}]}, {"id": "S-026", "type": "serie", "categorie": "choix", "cm": [2, 3, 5, 6], "etude": {"titre": "Prendre des notes à la main ou sur ordinateur (plan mixte)"}, "etude_html": "<h4>Prendre des notes à la main ou sur ordinateur (plan mixte)<\/h4><p>Dans leur première étude, Mueller et Oppenheimer (2014) faisaient regarder à des étudiants de courtes conférences filmées. La moitié prenait des notes sur un ordinateur portable (<em>Ordinateur<\/em>), l'autre moitié à la main (<em>Papier<\/em>). Après une tâche distractrice de 30 minutes, tous répondaient à deux sortes de questions : des questions <em>Factuelles<\/em> (« En quelle année… ? ») et des questions <em>Conceptuelles<\/em> (« Comment comprendre… ? »). La VD est le score de réussite à chaque type de question.<\/p><p>Les auteurs s'attendaient à ce que les notes à la main, moins littérales, aident surtout à répondre aux questions conceptuelles.<\/p><p style=\"font-size:0.85em;color:#555\">Mueller, P. A., &amp; Oppenheimer, D. M. (2014). The pen is mightier than the keyboard: Advantages of longhand over laptop note taking. <em>Psychological Science, 25<\/em>(6), 1159–1168. https://doi.org/10.1177/0956797614524581<\/p>", "questions": [{"id": "S-026-q1", "difficulte": 1, "question_html": "<p>Comment décrire les deux facteurs ?<\/p>", "question_texte": "Comment décrire les deux facteurs ?", "feedback_general_html": "<p>Un facteur inter-sujets et un facteur intra-sujet : c'est un plan mixte. CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "Les deux facteurs sont inter-sujets.", "score": -20.0, "feedback_html": "<p>Chaque étudiant répond aux deux types de questions : ce facteur est intra-sujet.<\/p>"}, {"texte_html": "Les deux facteurs sont intra-sujets.", "score": -50.0, "feedback_html": "<p>Chaque étudiant n'utilise qu'un seul support.<\/p>"}, {"texte_html": "<em>Support<\/em> (Ordinateur, Papier) est inter-sujets ; <em>Type de question<\/em> (Factuelle, Conceptuelle) est intra-sujet.", "score": 100.0, "feedback_html": "<p>Exact. Chaque étudiant n'utilise qu'un support, mais répond aux deux types de questions.<\/p>"}, {"texte_html": "<em>Support<\/em> est intra-sujet ; <em>Type de question<\/em> est inter-sujets.", "score": -30.0, "feedback_html": "<p>C'est l'inverse.<\/p>"}]}, {"id": "S-026-q2", "difficulte": 1, "question_html": "<p>Quelle analyse convient ?<\/p>", "question_texte": "Quelle analyse convient ?", "feedback_general_html": "<p>Plan mixte : ANOVA mixte, dans Jamovi Repeated Measures ANOVA avec un facteur inter-sujets. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une ANOVA mixte 2 × 2.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Une ANOVA à mesures répétées à un facteur.", "score": -50.0, "feedback_html": "<p>Elle ignorerait le support, qui est la VI principale.<\/p>"}, {"texte_html": "Deux tests t de Student, un par type de question.", "score": -30.0, "feedback_html": "<p>On ne testerait pas l'interaction, qui porte l'hypothèse.<\/p>"}, {"texte_html": "Une ANOVA croisée 2 × 2 inter-sujets.", "score": -20.0, "feedback_html": "<p>Elle traiterait comme indépendantes les deux notes d'un même étudiant.<\/p>"}]}, {"id": "S-026-q3", "difficulte": 2, "question_html": "<p>Comment remplir la fenêtre <em>Repeated Measures ANOVA<\/em> de Jamovi ?<\/p>", "question_texte": "Comment remplir la fenêtre *Repeated Measures ANOVA* de Jamovi ?", "feedback_general_html": "<p>Le facteur intra-sujet et ses colonnes vont dans les cases <em>Repeated Measures<\/em>, le facteur inter-sujets dans <em>Between Subject Factors<\/em>. CM06, section Désinformation, « Jamovi ».<\/p>", "options": [{"texte_html": "<em>Type de question<\/em> (2 modalités) dans <em>Repeated Measures Factors<\/em>, les colonnes <em>Factuelle<\/em> et <em>Conceptuelle<\/em> dans <em>Repeated Measures Cells<\/em>, <em>Support<\/em> dans <em>Between Subject Factors<\/em>.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Le score dans <em>Dependent Variable<\/em>, les deux facteurs dans <em>Fixed Factors<\/em>.", "score": -50.0, "feedback_html": "<p>Ce sont les cases de l'ANOVA pour groupes indépendants.<\/p>"}, {"texte_html": "<em>Support<\/em> dans <em>Repeated Measures Factors<\/em>, <em>Type de question<\/em> dans <em>Between Subject Factors<\/em>.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : le support est inter-sujets.<\/p>"}, {"texte_html": "<em>Type de question<\/em> dans <em>Repeated Measures Factors<\/em>, <em>Support<\/em> dans <em>Covariates<\/em>.", "score": -20.0, "feedback_html": "<p>Le support est un facteur, pas une covariable.<\/p>"}]}, {"id": "S-026-q4", "difficulte": 2, "question_html": "<p>Faut-il s'inquiéter de la sphéricité dans cette analyse ?<\/p>", "question_texte": "Faut-il s'inquiéter de la sphéricité dans cette analyse ?", "feedback_general_html": "<p>La sphéricité porte sur les variances des différences entre modalités ; avec deux modalités, il n'y a qu'une différence. CM02, section Formalisation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "OUI : il faut vérifier la sphéricité du facteur <em>Support<\/em>.", "score": -50.0, "feedback_html": "<p>La sphéricité ne concerne que les facteurs intra-sujets.<\/p>"}, {"texte_html": "NON : avec deux modalités intra-sujet, il n'y a qu'une seule différence, et la sphéricité est forcément respectée.", "score": 100.0, "feedback_html": "<p>Exact. Jamovi le signale d'ailleurs par une note sous le tableau du test de sphéricité.<\/p>"}, {"texte_html": "NON, parce que le plan est mixte.", "score": -20.0, "feedback_html": "<p>La bonne réponse, mais pas la bonne raison : dans un plan mixte avec trois modalités intra-sujet ou plus, il faut vérifier la sphéricité.<\/p>"}, {"texte_html": "OUI : il faut toujours appliquer la correction de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>Les corrections ne servent que si la sphéricité est violée, ce qui est impossible avec deux modalités.<\/p>"}]}, {"id": "S-026-q5", "difficulte": 2, "question_html": "<p>Quel résultat confirmerait l'hypothèse des auteurs ?<\/p>", "question_texte": "Quel résultat confirmerait l'hypothèse des auteurs ?", "feedback_general_html": "<p>Un effet du support qui dépend du type de question correspond à une interaction. C'est bien ce qu'ont observé Mueller et Oppenheimer (2014) : pas de différence pour les questions factuelles, un avantage du papier pour les questions conceptuelles. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Un effet principal du support significatif.", "score": -20.0, "feedback_html": "<p>Il indiquerait un avantage moyen du papier, sans dire s'il est plus fort pour les questions conceptuelles.<\/p>"}, {"texte_html": "Une interaction <em>Type de question ✻ Support<\/em> significative, avec un avantage du papier plus net pour les questions conceptuelles.", "score": 100.0, "feedback_html": "<p>Exact. L'hypothèse porte sur un effet du support qui dépend du type de question.<\/p>"}, {"texte_html": "Un test de Levene significatif.", "score": -30.0, "feedback_html": "<p>Ce test vérifie une condition d'application.<\/p>"}, {"texte_html": "Un effet principal du type de question significatif.", "score": -50.0, "feedback_html": "<p>Il dirait seulement qu'un type de question est plus facile.<\/p>"}]}, {"id": "S-026-q6", "difficulte": 2, "question_html": "<p>Comment vérifier l'homogénéité des variances dans cette ANOVA mixte ?<\/p>", "question_texte": "Comment vérifier l'homogénéité des variances dans cette ANOVA mixte ?", "feedback_general_html": "<p>Dans un plan mixte, on vérifie l'homogénéité des variances entre groupes (facteur inter-sujets) à chaque modalité du facteur intra-sujet. CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "Avec un test de Levene comparant les deux supports, pour chaque type de question.", "score": 100.0, "feedback_html": "<p>Exact. Jamovi affiche un test de Levene par modalité du facteur intra-sujet.<\/p>"}, {"texte_html": "On NE la vérifie PAS dans une ANOVA mixte.", "score": -50.0, "feedback_html": "<p>Le facteur inter-sujets impose de la vérifier.<\/p>"}, {"texte_html": "Avec un test de Levene comparant les deux types de questions.", "score": -20.0, "feedback_html": "<p>Le type de question est intra-sujet : on compare des groupes indépendants, donc les supports.<\/p>"}, {"texte_html": "Avec le test de Mauchly.", "score": -30.0, "feedback_html": "<p>Il porte sur la sphéricité, pas sur l'homogénéité des variances entre groupes.<\/p>"}]}, {"id": "S-026-q7", "difficulte": 3, "question_html": "<p>Pourquoi préférer η²G à η²p pour comparer la taille de l'interaction à celle d'études faites avec un plan entièrement inter-sujets ?<\/p>", "question_texte": "Pourquoi préférer η²G à η²p pour comparer la taille de l'interaction à celle d'études faites avec un plan entièrement inter-sujets ?", "feedback_general_html": "<p>η²G garde au dénominateur les sources de variation individuelles, ce qui le rend comparable entre plans inter et intra-sujets (Bakeman, 2005). CM02, section Compléments, « La taille d'effet » ; CM05.<\/p>", "options": [{"texte_html": "Parce que η²p ne peut pas être calculé dans un plan mixte.", "score": -50.0, "feedback_html": "<p>Jamovi le calcule sans difficulté.<\/p>"}, {"texte_html": "Parce que η²p dépend du plan : en retirant les différences entre participants, il donne des valeurs plus élevées en mesures répétées, alors que η²G reste comparable d'un plan à l'autre.", "score": 100.0, "feedback_html": "<p>Exact. On l'interprète avec les seuils de Bakeman (2005) : 0,02, 0,13, 0,26.<\/p>"}, {"texte_html": "Parce que η²G est toujours plus grand que η²p.", "score": -30.0, "feedback_html": "<p>C'est généralement l'inverse.<\/p>"}, {"texte_html": "Parce que η²G corrige le biais de surestimation, comme ω².", "score": -20.0, "feedback_html": "<p>C'est le rôle de ω² ; η²G vise la comparabilité entre plans.<\/p>"}]}]}, {"id": "C-CM1-002", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>L'ANOVA simple permet d'étudier le lien entre :<\/p>", "question_texte": "L'ANOVA simple permet d'étudier le lien entre :", "feedback_general_html": "<p>L'ANOVA compare les moyennes d'une VD numérique entre les modalités d'un facteur catégoriel. CM01, section Placebo, « Retenir ».<\/p>", "options": [{"texte_html": "une VI catégorielle et une VD numérique.", "score": 100.0, "feedback_html": "<p>Exact. L'ANOVA compare les moyennes d'une VD numérique entre les modalités d'un facteur catégoriel.<\/p>"}, {"texte_html": "une VI numérique et une VD catégorielle.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : la VD doit être numérique pour qu'on puisse calculer des moyennes, et le facteur (la VI) définit les groupes.<\/p>"}, {"texte_html": "deux variables catégorielles.", "score": -20.0, "feedback_html": "<p>Le facteur est bien catégoriel, mais la VD doit être numérique : l'ANOVA compare des moyennes. Deux variables catégorielles relèvent d'un tableau de contingence.<\/p>"}, {"texte_html": "deux variables numériques.", "score": -50.0, "feedback_html": "<p>Deux variables numériques relèvent de la corrélation ou de la régression. L'ANOVA demande un facteur catégoriel qui définit des groupes.<\/p>"}]}, {"id": "C-CM1-004", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Une chercheuse compare quatre groupes indépendants. Elle hésite entre une ANOVA et les six tests de Student possibles, chacun au seuil de 5 %. Quelle raison justifie le choix de l'ANOVA ?<\/p>", "question_texte": "Une chercheuse compare quatre groupes indépendants. Elle hésite entre une ANOVA et les six tests de Student possibles, chacun au seuil de 5 %. Quelle raison justifie le choix de l'ANOVA ?", "feedback_general_html": "<p>Multiplier les tests augmente le risque d'erreur de type I : 1 − 0,95⁶ ≈ 0,26. L'ANOVA teste toutes les moyennes en un seul test. CM01, section Placebo.<\/p>", "options": [{"texte_html": "Le test de Student ne s'applique pas à des groupes indépendants.", "score": -30.0, "feedback_html": "<p>Le test de Student pour échantillons indépendants existe. Le problème est la multiplication des tests.<\/p>"}, {"texte_html": "L'ANOVA indique directement quels groupes diffèrent.", "score": -20.0, "feedback_html": "<p>Un F significatif dit qu'une différence existe, pas laquelle : il faut ensuite des comparaisons post-hoc ou des contrastes.<\/p>"}, {"texte_html": "Avec six tests au seuil de 5 %, le risque de commettre au moins une erreur de type I, si aucune différence n'existe, dépasse 20 %.", "score": 100.0, "feedback_html": "<p>Exact. 1 − 0,95⁶ ≈ 0,26 ; l'ANOVA contrôle ce risque en un seul test.<\/p>"}, {"texte_html": "L'ANOVA reste valable même si les observations ne sont pas indépendantes.", "score": -50.0, "feedback_html": "<p>L'indépendance des observations est une condition d'application de l'ANOVA.<\/p>"}]}, {"id": "C-CM1-005", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Une ANOVA simple sur quatre groupes donne F(3, 56) = 9,4, p &lt; 0,001. Que peut-on conclure ?<\/p>", "question_texte": "Une ANOVA simple sur quatre groupes donne F(3, 56) = 9,4, p < 0,001. Que peut-on conclure ?", "feedback_general_html": "<p>Un F significatif dit qu'une différence existe, pas laquelle ni de quelle taille. CM01, sections Philosophie et Conditions.<\/p>", "options": [{"texte_html": "Les moyennes des quatre groupes ne sont pas toutes égales.", "score": 100.0, "feedback_html": "<p>Exact. C'est exactement l'hypothèse H1.<\/p>"}, {"texte_html": "Les quatre moyennes diffèrent toutes deux à deux.", "score": -20.0, "feedback_html": "<p>Un F significatif dit qu'au moins une différence existe, pas que toutes les paires diffèrent.<\/p>"}, {"texte_html": "L'effet est important, puisque p est très petit.", "score": -30.0, "feedback_html": "<p>La valeur p ne mesure pas la taille de l'effet : il faut une taille d'effet (CM05).<\/p>"}, {"texte_html": "Les conditions d'application de l'ANOVA sont vérifiées.", "score": -50.0, "feedback_html": "<p>Les conditions se vérifient à part, avec les tests de Shapiro-Wilk et de Levene.<\/p>"}]}, {"id": "C-CM1-006", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une ANOVA simple à trois groupes de 15 participants, le test de Levene donne p = 0,003. Que faire, selon le cours ?<\/p>", "question_texte": "Dans une ANOVA simple à trois groupes de 15 participants, le test de Levene donne p = 0,003. Que faire, selon le cours ?", "feedback_general_html": "<p>Le test de Levene a pour H0 l'égalité des variances ; ici elle est rejetée. La correction de Welch permet de garder l'analyse. CM01, section Conditions.<\/p>", "options": [{"texte_html": "Renoncer à l'ANOVA, puisque ses conditions ne sont pas remplies.", "score": -20.0, "feedback_html": "<p>L'égalité des variances est bien rejetée, mais on n'abandonne pas l'analyse : une correction existe.<\/p>"}, {"texte_html": "Appliquer la correction de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>Greenhouse-Geisser corrige un défaut de sphéricité en mesures répétées, pas des variances inégales entre groupes indépendants.<\/p>"}, {"texte_html": "Conclure que le facteur a un effet significatif sur la VD.", "score": -50.0, "feedback_html": "<p>Le test de Levene ne teste pas l'effet du facteur, mais l'égalité des variances.<\/p>"}, {"texte_html": "Utiliser la correction de Welch.", "score": 100.0, "feedback_html": "<p>Exact. Welch modifie les degrés de liberté pour tenir compte des variances inégales.<\/p>"}]}, {"id": "C-CM1-007", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Pourquoi parle-t-on d'analyse de variance alors que l'on compare des moyennes ?<\/p>", "question_texte": "Pourquoi parle-t-on d'analyse de variance alors que l'on compare des moyennes ?", "feedback_general_html": "<p>L'ANOVA sépare la variation inter-groupe (expliquée) de la variation intra-groupe (résiduelle) et compare les deux par le rapport F. CM01, section Philosophie.<\/p>", "options": [{"texte_html": "Parce que la méthode compare les variances des groupes entre elles.", "score": -20.0, "feedback_html": "<p>Comparer les variances des groupes, c'est le rôle du test de Levene.<\/p>"}, {"texte_html": "Parce que la méthode décompose la variation de la VD en une part expliquée par le facteur et une part résiduelle, puis les compare.", "score": 100.0, "feedback_html": "<p>Exact. Le rapport F compare la variation inter-groupe à la variation intra-groupe.<\/p>"}, {"texte_html": "Parce que la méthode ne s'applique qu'à des VD dont la variance est connue.", "score": -50.0, "feedback_html": "<p>La variance de la VD n'a pas à être connue : elle est estimée à partir des données.<\/p>"}, {"texte_html": "Parce que la méthode remplace les moyennes par les variances.", "score": -30.0, "feedback_html": "<p>L'ANOVA teste bien des moyennes ; c'est sa façon de raisonner qui passe par les variations.<\/p>"}]}, {"id": "C-CM1-008", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Le test de Levene a pour hypothèse nulle :<\/p>", "question_texte": "Le test de Levene a pour hypothèse nulle :", "feedback_general_html": "<p>H0 du test de Levene : égalité des variances. H0 de l'ANOVA : égalité des moyennes ; de Shapiro-Wilk : normalité ; de Mauchly : sphéricité. CM01, section Conditions.<\/p>", "options": [{"texte_html": "l'égalité des moyennes des groupes.", "score": -50.0, "feedback_html": "<p>C'est l'hypothèse nulle de l'ANOVA.<\/p>"}, {"texte_html": "la normalité des résidus.", "score": -30.0, "feedback_html": "<p>C'est l'hypothèse nulle du test de Shapiro-Wilk.<\/p>"}, {"texte_html": "la sphéricité.", "score": -20.0, "feedback_html": "<p>C'est l'hypothèse nulle du test de Mauchly, l'équivalent pour les mesures répétées.<\/p>"}, {"texte_html": "l'égalité des variances entre les groupes.", "score": 100.0, "feedback_html": "<p>Exact. On souhaite donc qu'il ne soit pas significatif.<\/p>"}]}, {"id": "C-CM1-010", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Avec seulement deux groupes indépendants, à quel test une ANOVA simple est-elle équivalente ?<\/p>", "question_texte": "Avec seulement deux groupes indépendants, à quel test une ANOVA simple est-elle équivalente ?", "feedback_general_html": "<p>L'ANOVA simple généralise le test de Student pour échantillons indépendants ; avec deux groupes, les deux tests donnent la même conclusion. CM01, section Placebo, « Retenir ».<\/p>", "options": [{"texte_html": "Au test de Levene.", "score": -50.0, "feedback_html": "<p>Le test de Levene vérifie une condition d'application ; il ne compare pas les moyennes.<\/p>"}, {"texte_html": "Au test de Student pour échantillons indépendants.", "score": 100.0, "feedback_html": "<p>Exact. Avec deux groupes, les deux tests donnent la même conclusion.<\/p>"}, {"texte_html": "Au test de Student pour échantillons appariés.", "score": -20.0, "feedback_html": "<p>Le test pour échantillons appariés concerne des mesures répétées, pas des groupes indépendants.<\/p>"}, {"texte_html": "Au test de Mauchly.", "score": -30.0, "feedback_html": "<p>Le test de Mauchly vérifie la sphéricité ; il ne compare pas les moyennes.<\/p>"}]}, {"id": "C-CM1-011", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Un chercheur compare 4 groupes à l'aide de 6 tests de Student, chacun au seuil de 0,05. Si, en réalité, aucune différence n'existe entre les groupes, que devient le risque de conclure à tort à au moins une différence ?<\/p>", "question_texte": "Un chercheur compare 4 groupes à l'aide de 6 tests de Student, chacun au seuil de 0,05. Si, en réalité, aucune différence n'existe entre les groupes, que devient le risque de conclure à tort à au moins une différence ?", "feedback_general_html": "<p>Le risque global vaut à peu près 1 − (1 − 0,05)⁶ ≈ 0,26. C'est pour cela qu'on préfère l'ANOVA, ou qu'on corrige les comparaisons multiples. CM01, section Placebo, « Student ».<\/p>", "options": [{"texte_html": "Il reste égal à 0,05.", "score": -20.0, "feedback_html": "<p>Chaque test a un risque de 0,05 ; en les multipliant, le risque global augmente.<\/p>"}, {"texte_html": "Il devient nul, puisque les tests se compensent.", "score": -50.0, "feedback_html": "<p>Les tests ne se compensent pas : chacun ajoute une occasion de se tromper.<\/p>"}, {"texte_html": "Il devient égal à 0,05 / 6.", "score": -30.0, "feedback_html": "<p>0,05 / 6 est le seuil que la correction de Bonferroni appliquerait à chaque test, pas le risque global.<\/p>"}, {"texte_html": "Il dépasse nettement 0,05 (environ 0,26).", "score": 100.0, "feedback_html": "<p>Exact. 1 − (1 − 0,05)⁶ ≈ 0,26.<\/p>"}]}, {"id": "C-CM1-012", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Une ANOVA simple donne η² = 0,20. Que signifie cette valeur ?<\/p>", "question_texte": "Une ANOVA simple donne η² = 0,20. Que signifie cette valeur ?", "feedback_general_html": "<p>η² = SC inter / SC total : c'est la proportion de la variation de la VD attribuable au facteur. CM01, section Compléments, « La taille d'effet ».<\/p>", "options": [{"texte_html": "Le facteur explique 20 % de la variation de la VD.", "score": 100.0, "feedback_html": "<p>Exact. η² = SC inter / SC total.<\/p>"}, {"texte_html": "La probabilité que l'hypothèse nulle soit vraie est de 20 %.", "score": -50.0, "feedback_html": "<p>η² n'est pas une probabilité.<\/p>"}, {"texte_html": "Les moyennes des groupes diffèrent de 20 %.", "score": -20.0, "feedback_html": "<p>η² est une proportion de variation, pas un écart entre moyennes.<\/p>"}, {"texte_html": "20 % des participants sont sensibles au facteur.", "score": -30.0, "feedback_html": "<p>η² ne porte pas sur une proportion de participants.<\/p>"}]}, {"id": "C-CM1-013", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Le cours présente l'ANOVA comme une méthode robuste. Que signifie cette expression ?<\/p>", "question_texte": "Le cours présente l'ANOVA comme une méthode robuste. Que signifie cette expression ?", "feedback_general_html": "<p>La robustesse concerne surtout la normalité et, dans une moindre mesure, l'homogénéité des variances. Elle ne s'étend pas à l'indépendance des observations. CM01, section Conditions.<\/p>", "options": [{"texte_html": "Elle donne toujours un résultat significatif quand un effet existe.", "score": -50.0, "feedback_html": "<p>Un effet réel peut ne pas être détecté, faute de puissance.<\/p>"}, {"texte_html": "Elle n'a aucune condition d'application.", "score": -30.0, "feedback_html": "<p>L'ANOVA a bien des conditions d'application.<\/p>"}, {"texte_html": "Une violation modérée de ses conditions d'application a souvent un effet négligeable sur les résultats.", "score": 100.0, "feedback_html": "<p>Exact. Surtout pour la normalité, et dans une moindre mesure l'homogénéité des variances.<\/p>"}, {"texte_html": "Elle reste valable même lorsque les observations ne sont pas indépendantes.", "score": -20.0, "feedback_html": "<p>La robustesse ne s'étend pas à l'indépendance, dont le défaut remet en cause l'ensemble des résultats.<\/p>"}]}, {"id": "C-CM1-014", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans laquelle des situations suivantes l'indépendance des observations est-elle la plus menacée ?<\/p>", "question_texte": "Dans laquelle des situations suivantes l'indépendance des observations est-elle la plus menacée ?", "feedback_general_html": "<p>Des participants qui s'influencent mutuellement ne fournissent pas des observations indépendantes : le cours met en garde contre les passations collectives. CM01, section Conditions, « Indépendance ».<\/p>", "options": [{"texte_html": "Les groupes n'ont pas tous le même effectif.", "score": -20.0, "feedback_html": "<p>Des effectifs inégaux sont acceptables ; ils ne créent pas de dépendance entre observations.<\/p>"}, {"texte_html": "La VD ne suit pas exactement une loi normale.", "score": -30.0, "feedback_html": "<p>La normalité est une autre condition.<\/p>"}, {"texte_html": "Les participants d'un même groupe passent l'épreuve ensemble, dans la même salle, et peuvent échanger leurs réponses.", "score": 100.0, "feedback_html": "<p>Exact. Des participants qui s'influencent ne fournissent pas des observations indépendantes.<\/p>"}, {"texte_html": "Les participants ont été répartis au hasard entre les groupes.", "score": -50.0, "feedback_html": "<p>La répartition au hasard favorise au contraire l'indépendance.<\/p>"}]}, {"id": "C-CM1-015", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Avec la correction de Bonferroni, quel seuil faut-il appliquer à chacune de 5 comparaisons pour garder un risque global de 0,05 ?<\/p>", "question_texte": "Avec la correction de Bonferroni, quel seuil faut-il appliquer à chacune de 5 comparaisons pour garder un risque global de 0,05 ?", "feedback_general_html": "<p>Bonferroni divise le risque α par le nombre de comparaisons c : 0,05 / 5 = 0,01. CM01, section Compléments, « Comparaisons post-hoc ».<\/p>", "options": [{"texte_html": "0,01", "score": 100.0, "feedback_html": "<p>Exact. 0,05 / 5 = 0,01.<\/p>"}, {"texte_html": "0,05", "score": -30.0, "feedback_html": "<p>Garder 0,05 pour chaque comparaison ferait monter le risque global.<\/p>"}, {"texte_html": "0,25", "score": -50.0, "feedback_html": "<p>0,25 = 0,05 × 5 : c'est l'inverse de la correction.<\/p>"}, {"texte_html": "0,005", "score": -20.0, "feedback_html": "<p>Ce serait le seuil pour 10 comparaisons.<\/p>"}]}, {"id": "C-CM1-016", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une étude sur une thérapie, le groupe témoin, qui ne reçoit rien, voit pourtant ses symptômes s'améliorer en moyenne. Comment l'expliquer ?<\/p>", "question_texte": "Dans une étude sur une thérapie, le groupe témoin, qui ne reçoit rien, voit pourtant ses symptômes s'améliorer en moyenne. Comment l'expliquer ?", "feedback_general_html": "<p>Même sans traitement, on s'attend à une amélioration : effets non spécifiques (attention reçue, attentes…) et régression vers la moyenne. CM01, section Placebo, « Attention ».<\/p>", "options": [{"texte_html": "Par des effets non spécifiques et par la régression vers la moyenne.", "score": 100.0, "feedback_html": "<p>Exact. C'est pourquoi on compare la thérapie à un groupe témoin plutôt qu'à zéro.<\/p>"}, {"texte_html": "Par une erreur du test de Levene.", "score": -50.0, "feedback_html": "<p>Le test de Levene vérifie l'égalité des variances ; il n'explique pas une évolution des moyennes.<\/p>"}, {"texte_html": "Par le fait que l'ANOVA surestime toujours les améliorations.", "score": -30.0, "feedback_html": "<p>L'amélioration est observée dans les données, avant toute analyse.<\/p>"}, {"texte_html": "Par la taille trop réduite du groupe témoin.", "score": -20.0, "feedback_html": "<p>Un petit groupe rend l'estimation imprécise, mais n'explique pas une amélioration systématique.<\/p>"}]}, {"id": "C-CM1-017", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans un essai de thérapie, que désigne un groupe témoin « TAU » (<em>treatment as usual<\/em>) ?<\/p>", "question_texte": "Dans un essai de thérapie, que désigne un groupe témoin « TAU » (*treatment as usual*) ?", "feedback_general_html": "<p>Le groupe témoin peut prendre plusieurs formes : Rien, Attente, Contrôle actif (fausse thérapie) ou TAU (thérapie habituelle). CM01, section Placebo, « Tester une thérapie ».<\/p>", "options": [{"texte_html": "Des participants qui ne reçoivent rien et ne savent pas que l'étude porte sur une thérapie.", "score": -30.0, "feedback_html": "<p>C'est le groupe témoin « Rien ».<\/p>"}, {"texte_html": "Des participants placés sur liste d'attente.", "score": -20.0, "feedback_html": "<p>C'est le groupe témoin « Attente ».<\/p>"}, {"texte_html": "Des participants qui suivent la nouvelle thérapie testée.", "score": -50.0, "feedback_html": "<p>C'est le groupe test, pas un groupe témoin.<\/p>"}, {"texte_html": "Des participants qui suivent la thérapie habituelle.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM1-018", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Que reçoivent les participants d'un groupe « contrôle actif » ?<\/p>", "question_texte": "Que reçoivent les participants d'un groupe « contrôle actif » ?", "feedback_general_html": "<p>Dans le groupe contrôle actif, les participants suivent une « fausse thérapie ». Le choix du groupe témoin n'est pas indifférent, d'où la prudence dans l'interprétation des études. CM01, section Placebo.<\/p>", "options": [{"texte_html": "Une « fausse thérapie », sans structure ni principe actif supposé.", "score": 100.0, "feedback_html": "<p>Exact. Elle contrôle les effets non spécifiques (attention reçue, attentes…).<\/p>"}, {"texte_html": "Rien du tout.", "score": -30.0, "feedback_html": "<p>C'est le groupe « Rien ».<\/p>"}, {"texte_html": "Un médicament actif.", "score": -50.0, "feedback_html": "<p>« Actif » désigne ici une activité qui ressemble à une thérapie, pas un traitement efficace.<\/p>"}, {"texte_html": "La thérapie habituelle.", "score": -20.0, "feedback_html": "<p>C'est le groupe TAU.<\/p>"}]}, {"id": "C-CM1-019", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Pour comparer quatre types de groupes témoins, comment répartir les participants entre les groupes ?<\/p>", "question_texte": "Pour comparer quatre types de groupes témoins, comment répartir les participants entre les groupes ?", "feedback_general_html": "<p>On répartit les participants au hasard pour que les groupes ne diffèrent, au départ, que par le hasard. CM01, section Placebo, « Méthode ».<\/p>", "options": [{"texte_html": "Selon la gravité de leurs symptômes, les plus atteints dans les groupes actifs.", "score": -30.0, "feedback_html": "<p>Les groupes ne seraient plus comparables : la gravité se confondrait avec le type de groupe.<\/p>"}, {"texte_html": "Selon leur préférence.", "score": -20.0, "feedback_html": "<p>Les participants qui choisissent un groupe peuvent différer de ceux qui en choisissent un autre.<\/p>"}, {"texte_html": "Par ordre d'arrivée, les premiers dans le premier groupe.", "score": -50.0, "feedback_html": "<p>Les premiers inscrits peuvent différer des suivants (motivation, disponibilité).<\/p>"}, {"texte_html": "Au hasard.", "score": 100.0, "feedback_html": "<p>Exact. La répartition aléatoire rend les groupes comparables au départ.<\/p>"}]}, {"id": "C-CM1-020", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Une étude compare 4 groupes de 10 personnes. Avec les notations du cours, que valent k et N ?<\/p>", "question_texte": "Une étude compare 4 groupes de 10 personnes. Avec les notations du cours, que valent k et N ?", "feedback_general_html": "<p>k : nombre de groupes ; N : nombre total d'individus ; ni : effectif du groupe i ; x̄i : moyenne du groupe i. CM01, section Placebo, « Notations ».<\/p>", "options": [{"texte_html": "k = 4 et N = 10", "score": -30.0, "feedback_html": "<p>N est le nombre total d'individus, pas l'effectif d'un groupe.<\/p>"}, {"texte_html": "k = 40 et N = 4", "score": -50.0, "feedback_html": "<p>Les deux notations sont inversées.<\/p>"}, {"texte_html": "k = 10 et N = 40", "score": -20.0, "feedback_html": "<p>10 est l'effectif de chaque groupe (ni), pas le nombre de groupes.<\/p>"}, {"texte_html": "k = 4 et N = 40", "score": 100.0, "feedback_html": "<p>Exact. k est le nombre de groupes, N le nombre total d'individus.<\/p>"}]}, {"id": "C-CM1-021", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans une ANOVA simple, comment la somme des carrés totale se décompose-t-elle ?<\/p>", "question_texte": "Dans une ANOVA simple, comment la somme des carrés totale se décompose-t-elle ?", "feedback_general_html": "<p>SC totale = Σ nj (x̄j − x̄)² (SC inter, expliquée) + Σ Σ (xij − x̄j)² (SC intra, résiduelle). CM01, section Philosophie, « Comprendre ».<\/p>", "options": [{"texte_html": "SC totale = SC inter − SC intra.", "score": -50.0, "feedback_html": "<p>La SC totale est la somme des deux parts, pas leur différence.<\/p>"}, {"texte_html": "SC totale = SC inter × SC intra.", "score": -30.0, "feedback_html": "<p>Les sommes des carrés s'additionnent, elles ne se multiplient pas.<\/p>"}, {"texte_html": "SC totale = SC inter / SC intra.", "score": -20.0, "feedback_html": "<p>Ce rapport, une fois chaque SC divisée par ses degrés de liberté, donne F ; ce n'est pas la SC totale.<\/p>"}, {"texte_html": "SC totale = SC inter + SC intra.", "score": 100.0, "feedback_html": "<p>Exact. Variation expliquée par la VI plus variation résiduelle.<\/p>"}]}, {"id": "C-CM1-022", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Que mesure la somme des carrés inter-groupes, SC inter = Σ nj (x̄j − x̄)² ?<\/p>", "question_texte": "Que mesure la somme des carrés inter-groupes, SC inter = Σ nj (x̄j − x̄)² ?", "feedback_general_html": "<p>SC inter : écarts des moyennes de groupe à la moyenne générale (variation expliquée). SC intra : écarts des observations à la moyenne de leur groupe (variation résiduelle). CM01, section Philosophie.<\/p>", "options": [{"texte_html": "La différence entre la plus grande et la plus petite moyenne.", "score": -50.0, "feedback_html": "<p>La SC inter fait intervenir tous les groupes, pas seulement les extrêmes.<\/p>"}, {"texte_html": "L'écart de chaque observation à la moyenne de son groupe.", "score": -20.0, "feedback_html": "<p>C'est la somme des carrés intra-groupe.<\/p>"}, {"texte_html": "L'écart de chaque observation à la moyenne générale.", "score": -30.0, "feedback_html": "<p>C'est la somme des carrés totale.<\/p>"}, {"texte_html": "L'écart des moyennes des groupes à la moyenne générale, pondéré par l'effectif de chaque groupe.", "score": 100.0, "feedback_html": "<p>Exact. C'est la part de variation expliquée par la VI.<\/p>"}]}, {"id": "C-CM1-023", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Pourquoi transforme-t-on les sommes des carrés (SC) en carrés moyens (CM) avant de calculer F ?<\/p>", "question_texte": "Pourquoi transforme-t-on les sommes des carrés (SC) en carrés moyens (CM) avant de calculer F ?", "feedback_general_html": "<p>Les SC sont transformées en CM, mesures de variations standardisées : CM inter = SC inter / (k − 1), CM intra = SC intra / (N − k). F = CM inter / CM intra. CM01, section Philosophie, « Calculs ».<\/p>", "options": [{"texte_html": "Pour obtenir des mesures de variation standardisées, en divisant chaque SC par ses degrés de liberté.", "score": 100.0, "feedback_html": "<p>Exact. CM inter = SC inter / (k − 1), CM intra = SC intra / (N − k).<\/p>"}, {"texte_html": "Pour corriger une violation de la normalité.", "score": -50.0, "feedback_html": "<p>Le passage aux CM fait partie du calcul de F, quelle que soit la normalité.<\/p>"}, {"texte_html": "Pour obtenir directement la taille d'effet.", "score": -20.0, "feedback_html": "<p>La taille d'effet η² se calcule avec les SC, pas avec les CM.<\/p>"}, {"texte_html": "Pour que la somme des CM soit égale à la SC totale.", "score": -30.0, "feedback_html": "<p>C'est vrai des SC, pas des CM.<\/p>"}]}, {"id": "C-CM1-024", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Comment se calcule la statistique F de l'ANOVA simple ?<\/p>", "question_texte": "Comment se calcule la statistique F de l'ANOVA simple ?", "feedback_general_html": "<p>F = CM inter / CM intra. Sous H0, F vaut environ 1 ; plus F est grand, plus le signal domine le bruit, et plus p est petit. CM01, section Philosophie, « Statistique F ».<\/p>", "options": [{"texte_html": "F = SC inter / SC totale", "score": -30.0, "feedback_html": "<p>C'est la formule de η².<\/p>"}, {"texte_html": "F = CM inter / CM intra", "score": 100.0, "feedback_html": "<p>Exact. Le signal (inter) rapporté au bruit (intra).<\/p>"}, {"texte_html": "F = CM intra / CM inter", "score": -20.0, "feedback_html": "<p>Le rapport est inversé : c'est la variation expliquée qui est au numérateur.<\/p>"}, {"texte_html": "F = moyenne la plus grande − moyenne la plus petite", "score": -50.0, "feedback_html": "<p>F est un rapport de carrés moyens, pas une différence de moyennes.<\/p>"}]}, {"id": "C-CM1-025", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Une ANOVA sur 4 groupes de 10 personnes donne p = 0,116. Les conditions d'application sont remplies. Que conclure ?<\/p>", "question_texte": "Une ANOVA sur 4 groupes de 10 personnes donne p = 0,116. Les conditions d'application sont remplies. Que conclure ?", "feedback_general_html": "<p>p = 0,116 &gt; 0,05 : on ne peut pas conclure que les conditions diffèrent. Ce résultat peut être dû à un manque de puissance, du fait de l'échantillon réduit. CM01, section Conditions, « Interprétation ».<\/p>", "options": [{"texte_html": "On ne peut pas conclure à une différence entre les groupes ; ce résultat peut venir d'un manque de puissance, l'échantillon étant petit.", "score": 100.0, "feedback_html": "<p>Exact. D'autres études seraient nécessaires pour conclure.<\/p>"}, {"texte_html": "Il faut comparer les groupes deux à deux pour trouver où sont les différences.", "score": -30.0, "feedback_html": "<p>Sans F significatif, on ne cherche pas à détailler les différences entre conditions particulières.<\/p>"}, {"texte_html": "Il faut appliquer la correction de Welch pour obtenir un résultat significatif.", "score": -50.0, "feedback_html": "<p>On ne choisit pas une correction pour changer le résultat ; ici les variances sont homogènes.<\/p>"}, {"texte_html": "Les quatre groupes ont la même moyenne.", "score": -20.0, "feedback_html": "<p>Un résultat non significatif ne prouve pas l'égalité des moyennes.<\/p>"}]}, {"id": "C-CM1-026", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Selon le cours, de quoi dépend la puissance d'un test ?<\/p>", "question_texte": "Selon le cours, de quoi dépend la puissance d'un test ?", "feedback_general_html": "<p>La puissance est la probabilité de conclure H1 si c'est bien H1 qui est vraie. Elle dépend de la taille d'effet, du test utilisé et de la taille de l'échantillon. CM01, section Conditions, « Rappel ».<\/p>", "options": [{"texte_html": "Uniquement de la taille de l'échantillon.", "score": -20.0, "feedback_html": "<p>La taille de l'échantillon compte, mais aussi la taille d'effet et le test utilisé.<\/p>"}, {"texte_html": "De la valeur p obtenue.", "score": -50.0, "feedback_html": "<p>La puissance se raisonne avant de voir les données ; elle ne se déduit pas de p.<\/p>"}, {"texte_html": "De la taille d'effet, du test utilisé et de la taille de l'échantillon.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Uniquement du seuil α.", "score": -30.0, "feedback_html": "<p>Le seuil joue un rôle, mais le cours retient la taille d'effet, le test et l'effectif.<\/p>"}]}, {"id": "C-CM1-027", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Qu'est-ce que le risque de type I, α ?<\/p>", "question_texte": "Qu'est-ce que le risque de type I, α ?", "feedback_general_html": "<p>Le risque de type I, α, est la probabilité de conclure H1 si c'est en réalité H0 qui est vraie. La puissance est la probabilité de conclure H1 si c'est bien H1 qui est vraie. CM01, section Conditions, « Rappel ».<\/p>", "options": [{"texte_html": "La probabilité de conclure H0 alors que c'est H1 qui est vraie.", "score": -20.0, "feedback_html": "<p>C'est le risque de type II (β).<\/p>"}, {"texte_html": "La probabilité que H0 soit vraie.", "score": -50.0, "feedback_html": "<p>α est fixé à l'avance ; ce n'est pas la probabilité de H0.<\/p>"}, {"texte_html": "La probabilité de conclure H1 alors que c'est en réalité H0 qui est vraie.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "La probabilité de conclure H1 quand H1 est vraie.", "score": -30.0, "feedback_html": "<p>C'est la puissance.<\/p>"}]}, {"id": "C-CM1-028", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Avec des groupes de 200 participants, le test de Shapiro-Wilk est significatif (p = 0,03). Que dit le cours ?<\/p>", "question_texte": "Avec des groupes de 200 participants, le test de Shapiro-Wilk est significatif (p = 0,03). Que dit le cours ?", "feedback_general_html": "<p>La normalité porte sur les résidus. L'ANOVA est robuste vis-à-vis de cette condition : si les échantillons sont grands, un test significatif n'est pas toujours problématique. CM01, section Conditions, « Normalité ».<\/p>", "options": [{"texte_html": "Cela montre que les variances sont inégales.", "score": -20.0, "feedback_html": "<p>Le test de Shapiro-Wilk porte sur la normalité, pas sur les variances.<\/p>"}, {"texte_html": "Avec de grands échantillons, un test significatif n'est pas toujours problématique : l'ANOVA est robuste vis-à-vis de la normalité.", "score": 100.0, "feedback_html": "<p>Exact. Le test détecte alors de petits écarts sans conséquence.<\/p>"}, {"texte_html": "Il faut appliquer la correction de Welch.", "score": -30.0, "feedback_html": "<p>Welch corrige l'hétérogénéité des variances, pas un défaut de normalité.<\/p>"}, {"texte_html": "Il faut renoncer à l'ANOVA.", "score": -50.0, "feedback_html": "<p>L'ANOVA est robuste vis-à-vis de la normalité, surtout avec de grands échantillons.<\/p>"}]}, {"id": "C-CM1-029", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une ANOVA simple, faut-il que tous les groupes aient le même effectif ?<\/p>", "question_texte": "Dans une ANOVA simple, faut-il que tous les groupes aient le même effectif ?", "feedback_general_html": "<p>Il est préférable d'avoir des groupes de tailles similaires, mais ce n'est pas indispensable. CM01, section Conditions, « Retenir ».<\/p>", "options": [{"texte_html": "Oui, sinon il faut appliquer la correction de Greenhouse-Geisser.", "score": -20.0, "feedback_html": "<p>Greenhouse-Geisser corrige la sphéricité, en mesures répétées.<\/p>"}, {"texte_html": "Oui, sinon l'ANOVA ne peut pas être calculée.", "score": -30.0, "feedback_html": "<p>L'ANOVA se calcule avec des effectifs différents.<\/p>"}, {"texte_html": "C'est préférable, mais pas indispensable.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Non, et c'est même préférable d'avoir des groupes déséquilibrés.", "score": -50.0, "feedback_html": "<p>Des groupes de tailles similaires restent préférables.<\/p>"}]}, {"id": "C-CM1-030", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Pour une ANOVA simple dans Jamovi, quel menu le cours recommande-t-il de préférence ?<\/p>", "question_texte": "Pour une ANOVA simple dans Jamovi, quel menu le cours recommande-t-il de préférence ?", "feedback_general_html": "<p>Avec Jamovi, utiliser de préférence Analyses → ANOVA → ANOVA ; le choix « unidirectionnel » (One-Way ANOVA) rassemble moins d'options utiles. CM01, section Conditions, « Jamovi ».<\/p>", "options": [{"texte_html": "Analyses → T-Tests → Independent Samples T-Test.", "score": -50.0, "feedback_html": "<p>Le test de Student ne compare que deux groupes.<\/p>"}, {"texte_html": "Analyses → ANOVA → One-Way ANOVA, réservé à l'ANOVA simple.", "score": -20.0, "feedback_html": "<p>Il convient aussi, mais rassemble moins d'options utiles pour la suite.<\/p>"}, {"texte_html": "Analyses → ANOVA → ANOVA, qui rassemble plus d'options utiles que la version unidirectionnelle.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Analyses → ANOVA → Repeated Measures ANOVA.", "score": -30.0, "feedback_html": "<p>Ce menu est réservé aux plans avec mesures répétées.<\/p>"}]}, {"id": "C-CM1-031", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 3, "question_html": "<p>On peut présenter l'ANOVA comme un modèle : X = x̄ + a1 × 1Rien + a2 × 1Attente + a3 × 1Actif + a4 × 1TAU + ε. Que signifie un résultat significatif dans ce cadre ?<\/p>", "question_texte": "On peut présenter l'ANOVA comme un modèle : X = x̄ + a1 × 1Rien + a2 × 1Attente + a3 × 1Actif + a4 × 1TAU + ε. Que signifie un résultat significatif dans ce cadre ?", "feedback_general_html": "<p>Trouver un résultat significatif, c'est dire que ce modèle est utile : il permet une meilleure prévision de X connaissant le groupe que sans cette information. CM01, section Compléments, « Une autre manière d'aborder l'ANOVA ».<\/p>", "options": [{"texte_html": "Que le terme d'erreur ε est nul.", "score": -30.0, "feedback_html": "<p>Il reste toujours une erreur ; le modèle prévoit mieux, pas parfaitement.<\/p>"}, {"texte_html": "Que les conditions d'application sont respectées.", "score": -50.0, "feedback_html": "<p>Les conditions se vérifient à part.<\/p>"}, {"texte_html": "Que le modèle est utile : connaître le groupe permet de mieux prévoir X que sans cette information.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Que tous les coefficients a1 à a4 sont différents les uns des autres.", "score": -20.0, "feedback_html": "<p>Un résultat significatif dit qu'ils ne sont pas tous nuls, pas qu'ils diffèrent tous.<\/p>"}]}, {"id": "C-CM2-003", "type": "question", "categorie": "comprehension", "cm": [2, 5], "difficulte": 2, "question_html": "<p>On veut comparer la taille d'un effet obtenu dans un plan à mesures répétées avec celle d'un effet obtenu dans un plan à groupes indépendants. Quel indice le cours recommande-t-il ?<\/p>", "question_texte": "On veut comparer la taille d'un effet obtenu dans un plan à mesures répétées avec celle d'un effet obtenu dans un plan à groupes indépendants. Quel indice le cours recommande-t-il ?", "feedback_general_html": "<p>La valeur de η²p dépend du plan ; η²G est conçu pour comparer des études de plans différents. CM02, section Compléments ; CM05, section Rigoureux.<\/p>", "options": [{"texte_html": "η²G (êta-carré généralisé).", "score": 100.0, "feedback_html": "<p>Exact. η²G est conçu pour comparer des tailles d'effet entre plans différents.<\/p>"}, {"texte_html": "η²p (êta-carré partiel).", "score": -20.0, "feedback_html": "<p>La valeur de η²p dépend du plan : dans un plan à mesures répétées, elle retire la variabilité entre participants et se compare mal à celle d'un plan à groupes indépendants.<\/p>"}, {"texte_html": "Le f de Cohen.", "score": -30.0, "feedback_html": "<p>Le f de Cohen sert surtout aux calculs de puissance. Il n'est pas conçu pour comparer des plans différents.<\/p>"}, {"texte_html": "La valeur de F.", "score": -50.0, "feedback_html": "<p>F n'est pas une taille d'effet : il dépend aussi de l'effectif.<\/p>"}]}, {"id": "C-CM2-004", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans une ANOVA pour plan à mesures répétées, la condition de sphéricité porte sur :<\/p>", "question_texte": "Dans une ANOVA pour plan à mesures répétées, la condition de sphéricité porte sur :", "feedback_general_html": "<p>La sphéricité porte sur les variances des différences entre conditions, pas sur les variances des conditions elles-mêmes. CM02, section Formalisation.<\/p>", "options": [{"texte_html": "l'égalité des variances de la VD dans chaque condition.", "score": -20.0, "feedback_html": "<p>C'est l'homogénéité des variances. La sphéricité porte sur les variances des différences entre conditions.<\/p>"}, {"texte_html": "la normalité des résidus.", "score": -30.0, "feedback_html": "<p>La normalité est une autre condition d'application.<\/p>"}, {"texte_html": "l'égalité des variances des différences entre toutes les paires de conditions.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "l'indépendance des mesures prises sur un même participant.", "score": -50.0, "feedback_html": "<p>Les mesures d'un même participant ne sont justement pas indépendantes ; l'indépendance porte sur les participants.<\/p>"}]}, {"id": "C-CM2-005", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Pourquoi un plan à mesures répétées est-il en général plus puissant qu'un plan à groupes indépendants ?<\/p>", "question_texte": "Pourquoi un plan à mesures répétées est-il en général plus puissant qu'un plan à groupes indépendants ?", "feedback_general_html": "<p>Chaque participant sert de point de comparaison à lui-même : les différences individuelles stables sortent du terme d'erreur. CM02, section Équiprobabilité, « A retenir ».<\/p>", "options": [{"texte_html": "Parce que la sphéricité y est toujours vérifiée.", "score": -30.0, "feedback_html": "<p>La sphéricité n'est jamais garantie : c'est pour cela qu'on la teste.<\/p>"}, {"texte_html": "Parce que les participants s'améliorent d'une mesure à l'autre.", "score": -20.0, "feedback_html": "<p>Un effet d'apprentissage n'est pas une source de puissance, mais un biais à contrôler.<\/p>"}, {"texte_html": "Parce que le test de Mauchly corrige les erreurs de mesure.", "score": -50.0, "feedback_html": "<p>Le test de Mauchly teste la sphéricité ; il ne corrige rien.<\/p>"}, {"texte_html": "Parce qu'on retire du terme d'erreur la variabilité due aux différences entre participants.", "score": 100.0, "feedback_html": "<p>Exact. Les différences individuelles stables ne gonflent plus le bruit.<\/p>"}]}, {"id": "C-CM2-006", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans un plan à mesures répétées, que sont les individus statistiques ?<\/p>", "question_texte": "Dans un plan à mesures répétées, que sont les individus statistiques ?", "feedback_general_html": "<p>Chaque ligne du format long est une mesure d'un participant dans une condition. La variable « participant » (id) devient alors une variable à part entière. CM02, section Équiprobabilité, « A retenir ».<\/p>", "options": [{"texte_html": "Les participants.", "score": -20.0, "feedback_html": "<p>Chaque participant fournit plusieurs mesures : l'individu statistique est la mesure, c'est-à-dire un participant à un moment donné.<\/p>"}, {"texte_html": "Les participants à un moment donné (chaque mesure d'un participant).", "score": 100.0, "feedback_html": "<p>Exact. Chaque ligne du format long est une mesure d'un participant dans une condition.<\/p>"}, {"texte_html": "Les conditions expérimentales.", "score": -30.0, "feedback_html": "<p>Les conditions sont les modalités du facteur, pas les individus statistiques.<\/p>"}, {"texte_html": "Les moyennes des conditions.", "score": -50.0, "feedback_html": "<p>Les moyennes résument les données ; elles ne sont pas des individus statistiques.<\/p>"}]}, {"id": "C-CM2-008", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Six participants sont mesurés à quatre moments. Le test de Mauchly donne p = 0,41. Que conclure ?<\/p>", "question_texte": "Six participants sont mesurés à quatre moments. Le test de Mauchly donne p = 0,41. Que conclure ?", "feedback_general_html": "<p>Un test non significatif ne prouve pas H0, surtout avec un petit échantillon : on peut choisir d'appliquer quand même une correction. CM02, section Formalisation, « Tester la sphéricité ».<\/p>", "options": [{"texte_html": "La sphéricité est démontrée ; aucune correction n'est utile.", "score": -20.0, "feedback_html": "<p>Un test non significatif ne prouve pas H0, surtout avec un petit échantillon.<\/p>"}, {"texte_html": "Le test ne rejette pas la sphéricité, mais sa puissance est faible : la sphéricité n'est pas garantie pour autant.", "score": 100.0, "feedback_html": "<p>Exact. On peut alors choisir d'appliquer quand même une correction.<\/p>"}, {"texte_html": "La sphéricité est violée ; il faut renoncer à l'ANOVA.", "score": -50.0, "feedback_html": "<p>p = 0,41 : la sphéricité n'est pas rejetée ; et même rejetée, on corrigerait sans renoncer.<\/p>"}, {"texte_html": "Il faut appliquer la correction de Welch.", "score": -30.0, "feedback_html": "<p>Welch concerne l'homogénéité des variances en groupes indépendants.<\/p>"}]}, {"id": "C-CM2-009", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Dans une ANOVA pour plan à mesures répétées SANS facteur inter-sujets, pourquoi l'homogénéité des variances entre groupes N'EST-elle PAS une condition à vérifier ?<\/p>", "question_texte": "Dans une ANOVA pour plan à mesures répétées SANS facteur inter-sujets, pourquoi l'homogénéité des variances entre groupes N'EST-elle PAS une condition à vérifier ?", "feedback_general_html": "<p>Tous les participants passent toutes les conditions : il n'y a pas de groupes indépendants. La condition propre au plan intra-sujet est la sphéricité. CM02, section Formalisation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Parce que l'ANOVA est robuste.", "score": -50.0, "feedback_html": "<p>La robustesse ne dispense jamais de vérifier une condition ; ici, la condition ne se pose simplement pas.<\/p>"}, {"texte_html": "Parce que le test de Mauchly la vérifie déjà.", "score": -20.0, "feedback_html": "<p>Le test de Mauchly teste la sphéricité, pas l'homogénéité des variances.<\/p>"}, {"texte_html": "Parce que des variances mesurées sur les mêmes personnes sont forcément égales.", "score": -30.0, "feedback_html": "<p>Rien n'oblige les variances des conditions à être égales.<\/p>"}, {"texte_html": "Parce qu'il n'y a pas de groupes indépendants à comparer ; c'est la sphéricité qui prend sa place.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM2-010", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Quand la sphéricité est violée, que modifie la correction de Greenhouse-Geisser ?<\/p>", "question_texte": "Quand la sphéricité est violée, que modifie la correction de Greenhouse-Geisser ?", "feedback_general_html": "<p>Si la sphéricité est violée, on corrige les degrés de liberté par un facteur ε (0 &lt; ε ≤ 1) : ddl corrigés = ε (k − 1) et ε (k − 1)(n − 1). F et les sommes des carrés ne changent pas, la valeur p si. CM02, section Formalisation, « Tester la sphéricité ».<\/p>", "options": [{"texte_html": "La valeur de F, divisée par ε.", "score": -20.0, "feedback_html": "<p>F reste identique sur toutes les lignes ; ce sont les degrés de liberté qui sont corrigés.<\/p>"}, {"texte_html": "Les données elles-mêmes, qui sont transformées.", "score": -50.0, "feedback_html": "<p>La correction porte sur le test, pas sur les données.<\/p>"}, {"texte_html": "Les sommes des carrés, qui sont recalculées.", "score": -30.0, "feedback_html": "<p>Les sommes des carrés sont les mêmes sur les lignes <em>None<\/em>, Greenhouse-Geisser et Huynh-Feldt.<\/p>"}, {"texte_html": "Les degrés de liberté, multipliés par ε, et donc la valeur p.", "score": 100.0, "feedback_html": "<p>Exact. F reste le même ; seuls les degrés de liberté, et donc p, changent.<\/p>"}]}, {"id": "C-CM2-011", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Des deux corrections de sphéricité, Greenhouse-Geisser et Huynh-Feldt, laquelle est la plus prudente ?<\/p>", "question_texte": "Des deux corrections de sphéricité, Greenhouse-Geisser et Huynh-Feldt, laquelle est la plus prudente ?", "feedback_general_html": "<p>La correction de Greenhouse-Geisser (εGG) est plus prudente ; Huynh-Feldt (εHF) est préférée lorsque εGG ≥ 0,75. CM02, section Formalisation, « Choisir une correction ».<\/p>", "options": [{"texte_html": "Huynh-Feldt", "score": -20.0, "feedback_html": "<p>Huynh-Feldt est la moins prudente des deux ; on la préfère quand ε de Greenhouse-Geisser atteint 0,75.<\/p>"}, {"texte_html": "Aucune : ce sont des tests, pas des corrections.", "score": -50.0, "feedback_html": "<p>Ce sont bien des corrections des degrés de liberté ; le test de la sphéricité est celui de Mauchly.<\/p>"}, {"texte_html": "Elles sont équivalentes.", "score": -30.0, "feedback_html": "<p>Elles donnent des ε différents, comme on le voit dans les sorties de Jamovi.<\/p>"}, {"texte_html": "Greenhouse-Geisser", "score": 100.0, "feedback_html": "<p>Exact. Son ε est le plus petit, ce qui réduit davantage les degrés de liberté.<\/p>"}]}, {"id": "C-CM2-012", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Avec un très grand échantillon (500 participants), le test de Mauchly est significatif, mais ε de Greenhouse-Geisser vaut 0,97. Que dit le cours ?<\/p>", "question_texte": "Avec un très grand échantillon (500 participants), le test de Mauchly est significatif, mais ε de Greenhouse-Geisser vaut 0,97. Que dit le cours ?", "feedback_general_html": "<p>Un très grand échantillon donne une grande puissance : un test de Mauchly significatif n'est pas forcément problématique, et ε dit à quel point la violation est marquée. CM02, section Formalisation, « Tester la sphéricité ».<\/p>", "options": [{"texte_html": "Il faut appliquer la correction de Welch.", "score": -20.0, "feedback_html": "<p>Welch concerne les groupes indépendants, pas les mesures répétées.<\/p>"}, {"texte_html": "Le test de Mauchly n'est pas valable avec plus de 100 participants.", "score": -30.0, "feedback_html": "<p>Le test reste valable ; c'est son interprétation qui doit tenir compte de la puissance.<\/p>"}, {"texte_html": "Il faut renoncer à l'ANOVA, puisque la sphéricité est rejetée.", "score": -50.0, "feedback_html": "<p>On n'abandonne jamais l'analyse pour un défaut de sphéricité : on corrige les degrés de liberté.<\/p>"}, {"texte_html": "Un résultat significatif n'est pas forcément problématique : avec une grande puissance, le test détecte des écarts minimes.", "score": 100.0, "feedback_html": "<p>Exact. ε très proche de 1 montre que l'écart à la sphéricité est faible.<\/p>"}]}, {"id": "C-CM2-013", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans une ANOVA pour plan à mesures répétées, sur quoi porte la condition d'indépendance ?<\/p>", "question_texte": "Dans une ANOVA pour plan à mesures répétées, sur quoi porte la condition d'indépendance ?", "feedback_general_html": "<p>Dans un plan à mesures répétées, l'indépendance porte sur les participants, et non sur les observations. Elle est normalement garantie par le protocole. CM02, section Formalisation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Sur l'indépendance entre les participants.", "score": 100.0, "feedback_html": "<p>Exact. Les mesures d'un même participant sont liées ; les participants, eux, doivent être indépendants.<\/p>"}, {"texte_html": "Sur l'indépendance de toutes les observations, y compris celles d'un même participant.", "score": -30.0, "feedback_html": "<p>Les mesures d'un même participant ne sont justement pas indépendantes.<\/p>"}, {"texte_html": "Sur l'indépendance entre les conditions expérimentales.", "score": -20.0, "feedback_html": "<p>Les conditions sont passées par les mêmes personnes : ce n'est pas d'elles que l'on exige l'indépendance.<\/p>"}, {"texte_html": "Il n'y a pas de condition d'indépendance dans ce plan.", "score": -50.0, "feedback_html": "<p>La condition existe, mais elle porte sur les participants.<\/p>"}]}, {"id": "C-CM2-014", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Comment vérifier la normalité dans une ANOVA pour plan à mesures répétées, selon le cours ?<\/p>", "question_texte": "Comment vérifier la normalité dans une ANOVA pour plan à mesures répétées, selon le cours ?", "feedback_general_html": "<p>La normalité porte sur les résidus : test de Shapiro-Wilk ou Q-Q plot. Jamovi ne propose pas le test directement dans l'ANOVA à mesures répétées. CM02, section Formalisation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Avec un test de Shapiro-Wilk sur chaque participant.", "score": -20.0, "feedback_html": "<p>Le test porte sur les résidus de l'ensemble des données, pas sur chaque participant.<\/p>"}, {"texte_html": "Sur les résidus, avec un test de Shapiro-Wilk ou un Q-Q plot ; Jamovi ne propose pas directement le test dans cette analyse.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Avec le test de Mauchly.", "score": -30.0, "feedback_html": "<p>Le test de Mauchly porte sur la sphéricité.<\/p>"}, {"texte_html": "Avec le test de Levene sur chaque condition.", "score": -50.0, "feedback_html": "<p>Le test de Levene porte sur l'égalité des variances.<\/p>"}]}, {"id": "C-CM2-015", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>80 enseignants passent un test à 4 moments. Au format long, combien de lignes compte le tableau de données ?<\/p>", "question_texte": "80 enseignants passent un test à 4 moments. Au format long, combien de lignes compte le tableau de données ?", "feedback_general_html": "<p>Au format long, chaque ligne est une mesure (un participant à un moment) : N = n × k = 80 × 4 = 320 lignes, avec une colonne pour l'identifiant, une pour le temps et une pour la VD. CM02, section Équiprobabilité, « Formats ».<\/p>", "options": [{"texte_html": "80", "score": -20.0, "feedback_html": "<p>80 lignes, c'est le format large (une ligne par enseignant).<\/p>"}, {"texte_html": "4", "score": -50.0, "feedback_html": "<p>Ce serait une ligne par moment, ce qui n'est aucun des deux formats.<\/p>"}, {"texte_html": "84", "score": -30.0, "feedback_html": "<p>On ne fait pas la somme : chaque enseignant fournit 4 lignes.<\/p>"}, {"texte_html": "320", "score": 100.0, "feedback_html": "<p>Exact. Une ligne par mesure : 80 × 4 = 320.<\/p>"}]}, {"id": "C-CM2-016", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Pourquoi le cours dit-il que le format long est « le plus logique mathématiquement » pour un plan à mesures répétées ?<\/p>", "question_texte": "Pourquoi le cours dit-il que le format long est « le plus logique mathématiquement » pour un plan à mesures répétées ?", "feedback_general_html": "<p>Au format long, une colonne pour la VI, une pour la VD et une pour l'identifiant : la variable « sujet », cachée au format large, apparaît. Jamovi utilise cependant le format large. CM02, section Équiprobabilité, « Formats » et « A retenir ».<\/p>", "options": [{"texte_html": "Parce que Jamovi l'exige.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : Jamovi attend le format large pour cette analyse.<\/p>"}, {"texte_html": "Parce qu'il supprime la dépendance entre les mesures d'un même participant.", "score": -20.0, "feedback_html": "<p>Le format ne change rien à la dépendance des mesures ; il la rend visible par la colonne <em>id<\/em>.<\/p>"}, {"texte_html": "Parce qu'il fait apparaître explicitement la variable « participant » (id), qui est une variable à part entière du plan.", "score": 100.0, "feedback_html": "<p>Exact. Au format large, cette variable est implicite (une ligne = un participant).<\/p>"}, {"texte_html": "Parce qu'il prend moins de place.", "score": -50.0, "feedback_html": "<p>Il prend au contraire plus de lignes.<\/p>"}]}, {"id": "C-CM2-017", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Quel est l'inconvénient principal d'un plan à mesures répétées par rapport à un plan à groupes indépendants ?<\/p>", "question_texte": "Quel est l'inconvénient principal d'un plan à mesures répétées par rapport à un plan à groupes indépendants ?", "feedback_general_html": "<p>Un plan intra-sujet augmente la puissance, mais chaque mesure peut être influencée par les précédentes : apprentissage, fatigue, effets d'ordre. CM02, section Équiprobabilité, « Questions » ; CM06, section Désinformation.<\/p>", "options": [{"texte_html": "Il demande plus de participants.", "score": -20.0, "feedback_html": "<p>Il en demande souvent moins, puisque chacun passe toutes les conditions.<\/p>"}, {"texte_html": "On ne peut pas y calculer de taille d'effet.", "score": -50.0, "feedback_html": "<p>On y calcule des tailles d'effet, notamment η²p et η²G.<\/p>"}, {"texte_htm
