l": "Il est moins puissant.", "score": -30.0, "feedback_html": "<p>Il est au contraire en général plus puissant.<\/p>"}, {"texte_html": "Les mesures successives peuvent être influencées par les précédentes (apprentissage, fatigue, effets d'ordre).", "score": 100.0, "feedback_html": "<p>Exact. D'où l'intérêt de contrebalancer l'ordre quand c'est possible.<\/p>"}]}, {"id": "C-CM2-018", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Le cours montre un « graphique spaghetti », où chaque participant est relié par une ligne entre T0 et T1. Que fait-il apparaître que le nuage de points ne montre pas ?<\/p>", "question_texte": "Le cours montre un « graphique spaghetti », où chaque participant est relié par une ligne entre T0 et T1. Que fait-il apparaître que le nuage de points ne montre pas ?", "feedback_general_html": "<p>En reliant les mesures de chaque participant, on voit que l'évolution est régulière malgré de grandes différences entre personnes. Retirer ces différences du terme d'erreur fait gagner de la puissance. CM02, section Formalisation, « Gain de puissance ».<\/p>", "options": [{"texte_html": "Que les deux temps de mesure ont la même moyenne.", "score": -20.0, "feedback_html": "<p>Les moyennes se voient aussi sur le nuage de points ; le spaghetti montre les trajectoires individuelles.<\/p>"}, {"texte_html": "Que les données suivent une loi normale.", "score": -50.0, "feedback_html": "<p>Ce graphique ne renseigne pas sur la normalité.<\/p>"}, {"texte_html": "Que la plupart des participants évoluent dans le même sens, même si leurs niveaux de départ sont très différents.", "score": 100.0, "feedback_html": "<p>Exact. C'est cette régularité, invisible quand on mélange les participants, que l'ANOVA à mesures répétées exploite.<\/p>"}, {"texte_html": "Que la sphéricité est respectée.", "score": -30.0, "feedback_html": "<p>La sphéricité se teste avec le test de Mauchly, et ne se pose pas avec deux temps.<\/p>"}]}, {"id": "C-CM2-019", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Pourquoi l'ANOVA pour plan à mesures répétées a-t-elle besoin de la sphéricité ?<\/p>", "question_texte": "Pourquoi l'ANOVA pour plan à mesures répétées a-t-elle besoin de la sphéricité ?", "feedback_general_html": "<p>L'ANOVA à mesures répétées ne se sert que d'un seul terme d'erreur : il faut que le bruit soit comparable pour toutes les paires de conditions. C'est la sphéricité. CM02, section Formalisation, « Sphéricité ».<\/p>", "options": [{"texte_html": "Parce que les participants doivent avoir la même variance.", "score": -20.0, "feedback_html": "<p>La condition porte sur les variances des différences entre conditions, pas sur les participants.<\/p>"}, {"texte_html": "Parce qu'il faut que les moyennes des conditions soient égales.", "score": -50.0, "feedback_html": "<p>C'est l'hypothèse nulle testée, pas une condition d'application.<\/p>"}, {"texte_html": "Parce qu'elle n'utilise qu'un seul terme d'erreur pour toutes les comparaisons entre conditions : le bruit doit être le même quelle que soit la paire comparée.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Parce que le test de Mauchly l'exige.", "score": -30.0, "feedback_html": "<p>Le test de Mauchly vérifie la condition ; il n'en est pas la raison.<\/p>"}]}, {"id": "C-CM2-020", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Dans quel cas le cours juge-t-il la correction de Scheffé pertinente ?<\/p>", "question_texte": "Dans quel cas le cours juge-t-il la correction de Scheffé pertinente ?", "feedback_general_html": "<p>Scheffé est pertinent quand on veut tester des contrastes complexes non planifiés, découverts en explorant les données. Pour savoir quelles paires diffèrent, il est bien trop sévère. CM02, section Compléments, « Attention ».<\/p>", "options": [{"texte_html": "Pour corriger une violation de la sphéricité.", "score": -50.0, "feedback_html": "<p>La sphéricité se corrige avec ε (Greenhouse-Geisser ou Huynh-Feldt).<\/p>"}, {"texte_html": "Pour comparer toutes les paires de conditions après un F significatif.", "score": -20.0, "feedback_html": "<p>Pour de simples comparaisons de paires, Scheffé inflige une pénalité injustifiée.<\/p>"}, {"texte_html": "Pour tester des contrastes planifiés avant l'analyse.", "score": -30.0, "feedback_html": "<p>Des contrastes planifiés ne demandent pas une correction aussi sévère.<\/p>"}, {"texte_html": "Pour tester des contrastes complexes non prévus, découverts en explorant les données.", "score": 100.0, "feedback_html": "<p>Exact. C'est la seule procédure qui autorise cette exploration sans inflation du risque α.<\/p>"}]}, {"id": "C-CM2-021", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Pour comparer deux à deux les conditions d'un plan à mesures répétées, pourquoi le cours préfère-t-il Holm à Bonferroni ?<\/p>", "question_texte": "Pour comparer deux à deux les conditions d'un plan à mesures répétées, pourquoi le cours préfère-t-il Holm à Bonferroni ?", "feedback_general_html": "<p>On choisira généralement Holm dans un plan à mesures répétées : Bonferroni est plus conservateur, peut-être trop ; Tukey n'est pas adapté ; Scheffé est bien trop sévère. CM02, section Compléments, « Choix de correction ».<\/p>", "options": [{"texte_html": "Parce que Holm ne demande aucune condition d'application.", "score": -50.0, "feedback_html": "<p>Holm est une correction des valeurs p ; les conditions de l'ANOVA restent à vérifier.<\/p>"}, {"texte_html": "Parce que Bonferroni est réservé aux plans croisés.", "score": -20.0, "feedback_html": "<p>Bonferroni s'utilise dans tous les plans ; il est seulement moins puissant que Holm.<\/p>"}, {"texte_html": "Parce que Holm reste rigoureux tout en étant plus puissant que Bonferroni, jugé trop conservateur.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Parce que Bonferroni ne contrôle pas le risque d'erreur.", "score": -30.0, "feedback_html": "<p>Bonferroni le contrôle, mais de façon trop conservatrice.<\/p>"}]}, {"id": "C-CM2-022", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans un plan à mesures répétées, on sait avant l'analyse quelles conditions on veut comparer. Que propose le cours ?<\/p>", "question_texte": "Dans un plan à mesures répétées, on sait avant l'analyse quelles conditions on veut comparer. Que propose le cours ?", "feedback_general_html": "<p>Quand on sait à l'avance quelles comparaisons on souhaite, on peut utiliser des tests de Student pour échantillons appariés, ou des contrastes. CM02, section Compléments, « Comparaisons post-hoc ».<\/p>", "options": [{"texte_html": "Une nouvelle ANOVA pour chaque paire de conditions, sans correction.", "score": -50.0, "feedback_html": "<p>Multiplier les ANOVA ne remplace pas des comparaisons planifiées.<\/p>"}, {"texte_html": "La correction de Scheffé sur toutes les paires.", "score": -30.0, "feedback_html": "<p>Scheffé est bien trop sévère ici, et les comparaisons sont prévues à l'avance.<\/p>"}, {"texte_html": "Des tests de Student pour échantillons appariés, ou des contrastes.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Des tests de Student pour échantillons indépendants.", "score": -20.0, "feedback_html": "<p>Les mesures viennent des mêmes participants : il faut des tests pour échantillons appariés.<\/p>"}]}, {"id": "C-CM2-023", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Une ANOVA à mesures répétées sur quatre temps de mesure donne F(3, 57) = 17,1, p &lt; 0,001. Que peut-on conclure ?<\/p>", "question_texte": "Une ANOVA à mesures répétées sur quatre temps de mesure donne F(3, 57) = 17,1, p < 0,001. Que peut-on conclure ?", "feedback_general_html": "<p>Un F significatif indique une évolution des scores, mais ne dit ni quelles sont les différences, ni la taille de cette évolution. CM02, section Formalisation, « Interprétation ».<\/p>", "options": [{"texte_html": "L'effet du temps est grand.", "score": -30.0, "feedback_html": "<p>La taille de l'effet se lit sur une taille d'effet, pas sur p.<\/p>"}, {"texte_html": "Les scores augmentent régulièrement d'un temps au suivant.", "score": -20.0, "feedback_html": "<p>Le F ne dit ni quels temps diffèrent ni dans quel sens.<\/p>"}, {"texte_html": "La sphéricité est respectée.", "score": -50.0, "feedback_html": "<p>La sphéricité se teste avec le test de Mauchly, pas avec le F de l'ANOVA.<\/p>"}, {"texte_html": "Les scores évoluent entre les temps de mesure, sans que l'on sache encore lesquels diffèrent ni de combien.", "score": 100.0, "feedback_html": "<p>Exact. Il faut ensuite des comparaisons post-hoc et une taille d'effet.<\/p>"}]}, {"id": "C-CM2-024", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 1, "question_html": "<p>Dans la fenêtre <em>Repeated Measures ANOVA<\/em> de Jamovi, où demande-t-on le test de Mauchly et les corrections de sphéricité ?<\/p>", "question_texte": "Dans la fenêtre *Repeated Measures ANOVA* de Jamovi, où demande-t-on le test de Mauchly et les corrections de sphéricité ?", "feedback_general_html": "<p>Analyses → ANOVA → Repeated Measures ANOVA ; <em>Assumption Checks<\/em> : test de sphéricité (Mauchly) et corrections (Greenhouse-Geisser, Huynh-Feldt) ; <em>Estimated Marginal Means<\/em> : graphique des moyennes. CM02, section Formalisation.<\/p>", "options": [{"texte_html": "Dans <em>Repeated Measures Cells<\/em>.", "score": -50.0, "feedback_html": "<p>Cette zone reçoit les colonnes de données.<\/p>"}, {"texte_html": "Dans <em>Estimated Marginal Means<\/em>.", "score": -30.0, "feedback_html": "<p><em>Estimated Marginal Means<\/em> sert au graphique et au tableau des moyennes.<\/p>"}, {"texte_html": "Dans <em>Assumption Checks<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. On y coche le test de sphéricité et les corrections.<\/p>"}, {"texte_html": "Dans <em>Post Hoc Tests<\/em>.", "score": -20.0, "feedback_html": "<p><em>Post Hoc Tests<\/em> sert aux comparaisons entre conditions.<\/p>"}]}, {"id": "C-CM2-025", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Pourquoi le cours juge-t-il l'interprétation de η²p « trompeuse » dans un plan à mesures répétées ?<\/p>", "question_texte": "Pourquoi le cours juge-t-il l'interprétation de η²p « trompeuse » dans un plan à mesures répétées ?", "feedback_general_html": "<p>η²p est l'indice courant, mais sa valeur dépend du plan, ce qui gêne les comparaisons entre études ; η²G est recommandé, surtout pour comparer un effet entre plans inter et intra. CM02, section Compléments, « La taille d'effet ».<\/p>", "options": [{"texte_html": "Parce que η²p dépend de la correction de sphéricité choisie.", "score": -20.0, "feedback_html": "<p>Les corrections ne modifient pas les tailles d'effet.<\/p>"}, {"texte_html": "Parce que η²p laisse de côté les différences entre participants : sa valeur dépend du plan et se compare mal à celle d'un plan à groupes indépendants.", "score": 100.0, "feedback_html": "<p>Exact. D'où la recommandation de η²G.<\/p>"}, {"texte_html": "Parce que η²p ne peut pas être calculé avec des mesures répétées.", "score": -50.0, "feedback_html": "<p>Jamovi le calcule ; c'est son interprétation qui pose problème.<\/p>"}, {"texte_html": "Parce que η²p est toujours inférieur à η²G.", "score": -30.0, "feedback_html": "<p>C'est en général l'inverse : η²p est plus grand, car son dénominateur est plus petit.<\/p>"}]}, {"id": "C-CM3-002", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Dans l'étude de la question précédente, la VD est la performance à une tâche de lecture. Parmi les 4 questions de recherche suivantes, laquelle porte sur un effet simple ?<\/p>", "question_texte": "Dans l'étude de la question précédente, la VD est la performance à une tâche de lecture. Parmi les 4 questions de recherche suivantes, laquelle porte sur un effet simple ?", "feedback_general_html": "<p>Un effet simple est l'effet d'un facteur à un niveau fixé de l'autre. Un effet principal moyenne sur l'autre facteur ; l'interaction compare les effets d'un facteur selon l'autre. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "La performance dépend-elle du type de musique, avec et sans bruit confondus ?", "score": -20.0, "feedback_html": "<p>« Avec et sans bruit confondus » : on moyenne sur l'autre facteur. C'est un effet principal, pas un effet simple.<\/p>"}, {"texte_html": "L'effet du type de musique est-il le même avec et sans bruit de fond ?", "score": -30.0, "feedback_html": "<p>Se demander si l'effet d'un facteur change selon l'autre, c'est interroger l'interaction.<\/p>"}, {"texte_html": "En présence de bruit de fond, le type de musique a-t-il un effet sur la performance ?", "score": 100.0, "feedback_html": "<p>Exact. On fixe un facteur (bruit présent) et on examine l'effet de l'autre : c'est un effet simple.<\/p>"}, {"texte_html": "Le bruit de fond diminue-t-il la performance, quel que soit le type de musique ?", "score": -50.0, "feedback_html": "<p>« Quel que soit le type de musique » : on moyenne sur l'autre facteur. C'est l'effet principal du bruit.<\/p>"}]}, {"id": "C-CM3-003", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 3, "question_html": "<p>Dans une ANOVA mixte (un facteur inter-sujets, un facteur intra-sujet), combien de termes d'erreur distincts l'analyse utilise-t-elle ?<\/p>", "question_texte": "Dans une ANOVA mixte (un facteur inter-sujets, un facteur intra-sujet), combien de termes d'erreur distincts l'analyse utilise-t-elle ?", "feedback_general_html": "<p>Le plan mixte combine la logique du plan à groupes indépendants et celle des mesures répétées : deux termes d'erreur. CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "Un seul, commun à tous les effets.", "score": -30.0, "feedback_html": "<p>C'est le cas d'un plan croisé à groupes indépendants. Dans un plan mixte, les deux types de facteurs ne se comparent pas à la même variabilité.<\/p>"}, {"texte_html": "Trois : un par effet.", "score": -20.0, "feedback_html": "<p>Il y a bien trois effets (deux principaux et l'interaction), mais l'effet intra-sujet et l'interaction partagent le même terme d'erreur.<\/p>"}, {"texte_html": "Aucun, puisque chaque participant est son propre contrôle.", "score": -50.0, "feedback_html": "<p>Être son propre contrôle retire la variabilité entre participants des effets intra-sujet, mais il reste toujours une erreur résiduelle pour tester chaque effet.<\/p>"}, {"texte_html": "Deux : l'un pour l'effet inter-sujets, l'autre pour l'effet intra-sujet et l'interaction.", "score": 100.0, "feedback_html": "<p>Exact. Un terme d'erreur entre participants pour le facteur inter, un terme d'erreur intra-participants pour le facteur intra et l'interaction.<\/p>"}]}, {"id": "C-CM3-004", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Une étude croise deux facteurs inter-sujets : la consigne (avec ou sans pression temporelle) et l'expertise (novices ou experts). La VD est le nombre d'erreurs. Parmi les 4 questions de recherche suivantes, laquelle porte sur l'interaction ?<\/p>", "question_texte": "Une étude croise deux facteurs inter-sujets : la consigne (avec ou sans pression temporelle) et l'expertise (novices ou experts). La VD est le nombre d'erreurs. Parmi les 4 questions de recherche suivantes, laquelle porte sur l'interaction ?", "feedback_general_html": "<p>Il y a interaction quand l'effet d'un facteur dépend du niveau de l'autre. Un effet principal moyenne sur l'autre facteur ; un effet simple le fixe. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "Les experts font-ils moins d'erreurs que les novices, quelle que soit la consigne ?", "score": -50.0, "feedback_html": "<p>« Quelle que soit la consigne » : on moyenne sur l'autre facteur. C'est un effet principal.<\/p>"}, {"texte_html": "L'effet de la pression temporelle est-il le même chez les novices et chez les experts ?", "score": 100.0, "feedback_html": "<p>Exact. On demande si l'effet d'un facteur dépend du niveau de l'autre.<\/p>"}, {"texte_html": "Chez les novices, la pression temporelle augmente-t-elle le nombre d'erreurs ?", "score": -20.0, "feedback_html": "<p>On fixe l'expertise (novices) et on regarde la consigne : c'est un effet simple.<\/p>"}, {"texte_html": "La pression temporelle augmente-t-elle le nombre d'erreurs, tous niveaux d'expertise confondus ?", "score": -30.0, "feedback_html": "<p>« Tous niveaux confondus » : c'est l'effet principal de la consigne.<\/p>"}]}, {"id": "C-CM3-005", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Dans une ANOVA pour plan croisé, l'interaction A × B est significative, ainsi que l'effet principal de A. Comment procéder ?<\/p>", "question_texte": "Dans une ANOVA pour plan croisé, l'interaction A × B est significative, ainsi que l'effet principal de A. Comment procéder ?", "feedback_general_html": "<p>Quand l'interaction est significative, l'effet principal peut masquer des effets simples différents, voire opposés (paradoxe de Simpson). CM03, section Compléments.<\/p>", "options": [{"texte_html": "Interpréter d'abord les effets simples, car l'effet principal de A peut être trompeur.", "score": 100.0, "feedback_html": "<p>Exact. L'effet principal fait la moyenne d'effets simples qui peuvent être différents, voire opposés.<\/p>"}, {"texte_html": "Interpréter l'effet principal de A en priorité, puisqu'il résume l'effet de A.", "score": -20.0, "feedback_html": "<p>Justement, avec une interaction, l'effet de A n'est pas le même selon B : une moyenne le résume mal.<\/p>"}, {"texte_html": "Retirer l'interaction du modèle, puis interpréter les effets principaux.", "score": -30.0, "feedback_html": "<p>On ne retire une interaction du modèle que lorsqu'elle n'est pas significative.<\/p>"}, {"texte_html": "Ignorer l'interaction, qui ne répond pas à la question sur A.", "score": -50.0, "feedback_html": "<p>L'interaction dit précisément comment l'effet de A change selon B : c'est la première chose à interpréter.<\/p>"}]}, {"id": "C-CM3-008", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une université, les filles ont de meilleures notes que les garçons dans chacun des deux départements, mais une moins bonne moyenne sur l'ensemble de l'université. Comment l'expliquer ?<\/p>", "question_texte": "Dans une université, les filles ont de meilleures notes que les garçons dans chacun des deux départements, mais une moins bonne moyenne sur l'ensemble de l'université. Comment l'expliquer ?", "feedback_general_html": "<p>Tous les effets simples vont dans un sens, l'effet principal dans l'autre : c'est le paradoxe de Simpson, dû ici à des effectifs déséquilibrés. CM03, section Compléments.<\/p>", "options": [{"texte_html": "C'est un paradoxe de Simpson : les filles sont surreprésentées dans le département où les notes sont basses.", "score": 100.0, "feedback_html": "<p>Exact. Les effectifs déséquilibrés inversent l'effet global.<\/p>"}, {"texte_html": "C'est une interaction synergique entre le sexe et le département.", "score": -20.0, "feedback_html": "<p>L'effet va dans le même sens dans les deux départements : c'est l'agrégation qui l'inverse, pas une interaction.<\/p>"}, {"texte_html": "C'est une violation de l'homogénéité des variances.", "score": -30.0, "feedback_html": "<p>Le phénomène porte sur les moyennes, pas sur les variances.<\/p>"}, {"texte_html": "C'est une erreur de type I due à la multiplication des comparaisons.", "score": -50.0, "feedback_html": "<p>Le phénomène s'explique par la composition des départements, pas par le hasard des tests.<\/p>"}]}, {"id": "C-CM3-009", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Le produit A fait baisser la température de 1 °C, le produit B de 2 °C. Donnés ensemble, ils la font baisser de 5 °C. Comment qualifier cette situation ?<\/p>", "question_texte": "Le produit A fait baisser la température de 1 °C, le produit B de 2 °C. Donnés ensemble, ils la font baisser de 5 °C. Comment qualifier cette situation ?", "feedback_general_html": "<p>Sans interaction, la baisse serait de 1 + 2 = 3 °C. Une baisse plus forte que la somme des effets indique une interaction synergique ; plus faible, une interaction antagoniste. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Absence d'interaction : les effets s'additionnent.", "score": -20.0, "feedback_html": "<p>Sans interaction, la baisse serait de 1 + 2 = 3 °C, pas de 5 °C.<\/p>"}, {"texte_html": "Interaction synergique.", "score": 100.0, "feedback_html": "<p>Exact. L'effet combiné dépasse la somme des effets.<\/p>"}, {"texte_html": "Interaction antagoniste.", "score": -30.0, "feedback_html": "<p>Une interaction antagoniste donnerait une baisse plus faible que la somme des effets.<\/p>"}, {"texte_html": "Paradoxe de Simpson.", "score": -50.0, "feedback_html": "<p>Le paradoxe de Simpson concerne l'inversion d'un effet à l'agrégation, pas la combinaison de deux effets.<\/p>"}]}, {"id": "C-CM3-010", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Qu'est-ce qu'une ANOVA pour plan croisé (ou factoriel) ?<\/p>", "question_texte": "Qu'est-ce qu'une ANOVA pour plan croisé (ou factoriel) ?", "feedback_general_html": "<p>L'ANOVA pour plan croisé croise au moins deux facteurs inter-sujets et teste, en une seule analyse, l'effet de chacun (effets principaux) et la façon dont ils se combinent (interaction). CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "Une ANOVA qui croise au moins deux facteurs inter-sujets et teste, en une seule analyse, leurs effets principaux et leur interaction.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Une ANOVA avec un seul facteur à plus de deux modalités.", "score": -30.0, "feedback_html": "<p>C'est une ANOVA simple, quel que soit le nombre de modalités.<\/p>"}, {"texte_html": "Une suite d'ANOVA simples, une par facteur.", "score": -20.0, "feedback_html": "<p>Des ANOVA séparées ne testeraient pas l'interaction ; le plan croisé teste tout en une analyse.<\/p>"}, {"texte_html": "Une ANOVA où chaque participant passe toutes les conditions.", "score": -50.0, "feedback_html": "<p>Ce serait un plan à mesures répétées.<\/p>"}]}, {"id": "C-CM3-011", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Combien de questions distinctes une ANOVA pour plan croisé à deux facteurs, A et B, permet-elle de tester ?<\/p>", "question_texte": "Combien de questions distinctes une ANOVA pour plan croisé à deux facteurs, A et B, permet-elle de tester ?", "feedback_general_html": "<p>Un plan factoriel fournit trois questions distinctes : l'effet de A (moyenné sur B), l'effet de B (moyenné sur A), et leur interaction. CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "Deux : l'effet de A et l'effet de B.", "score": -20.0, "feedback_html": "<p>Il faut ajouter l'interaction A × B.<\/p>"}, {"texte_html": "Trois : l'effet principal de A, l'effet principal de B et leur interaction.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Quatre : une par groupe.", "score": -30.0, "feedback_html": "<p>Le nombre de groupes ne correspond pas au nombre d'effets testés.<\/p>"}, {"texte_html": "Une seule : l'égalité de toutes les moyennes.", "score": -50.0, "feedback_html": "<p>Le plan croisé décompose la question en plusieurs effets.<\/p>"}]}, {"id": "C-CM3-012", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Dans un plan croisé âge (8 ou 12 ans) × intelligence émotionnelle (basse ou haute), qu'est-ce que l'effet principal de l'âge ?<\/p>", "question_texte": "Dans un plan croisé âge (8 ou 12 ans) × intelligence émotionnelle (basse ou haute), qu'est-ce que l'effet principal de l'âge ?", "feedback_general_html": "<p>Effet principal : effet de A indépendamment de B (moyenné sur B). Effet simple : effet de A pour B fixé. Interaction : différences d'effet de A selon les niveaux de B. CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "La différence entre les enfants de 8 et de 12 ans, toutes intelligences émotionnelles confondues.", "score": 100.0, "feedback_html": "<p>Exact. On moyenne sur l'autre facteur.<\/p>"}, {"texte_html": "Le fait que l'effet de l'âge change selon l'intelligence émotionnelle.", "score": -30.0, "feedback_html": "<p>C'est l'interaction.<\/p>"}, {"texte_html": "La différence entre les enfants de 8 et de 12 ans, chez ceux dont l'intelligence émotionnelle est haute.", "score": -20.0, "feedback_html": "<p>C'est un effet simple de l'âge : l'autre facteur est fixé.<\/p>"}, {"texte_html": "L'effet le plus important des deux.", "score": -50.0, "feedback_html": "<p>« Principal » ne veut pas dire « le plus grand » : c'est l'effet moyenné sur l'autre facteur.<\/p>"}]}, {"id": "C-CM3-013", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Le produit A fait baisser la température de 1 °C, le produit B de 2 °C. Donnés ensemble, ils ne la font baisser que de 2 °C. Comment qualifier cette situation ?<\/p>", "question_texte": "Le produit A fait baisser la température de 1 °C, le produit B de 2 °C. Donnés ensemble, ils ne la font baisser que de 2 °C. Comment qualifier cette situation ?", "feedback_general_html": "<p>Sans interaction, la baisse serait de 3 °C. Moins que la somme des effets : interaction antagoniste ; plus : interaction synergique. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Paradoxe de Simpson.", "score": -50.0, "feedback_html": "<p>Le paradoxe de Simpson concerne l'inversion d'un effet quand on agrège des groupes.<\/p>"}, {"texte_html": "Interaction synergique.", "score": -30.0, "feedback_html": "<p>Une interaction synergique donnerait une baisse supérieure à 3 °C.<\/p>"}, {"texte_html": "Interaction antagoniste.", "score": 100.0, "feedback_html": "<p>Exact. L'effet combiné est plus faible que la somme des effets.<\/p>"}, {"texte_html": "Absence d'interaction.", "score": -20.0, "feedback_html": "<p>Sans interaction, les effets s'additionneraient : 1 + 2 = 3 °C.<\/p>"}]}, {"id": "C-CM3-014", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Comment représenter graphiquement les moyennes d'un plan croisé pour visualiser une éventuelle interaction ?<\/p>", "question_texte": "Comment représenter graphiquement les moyennes d'un plan croisé pour visualiser une éventuelle interaction ?", "feedback_general_html": "<p>Pour visualiser une interaction : un facteur en abscisse, l'autre représenté par des courbes distinctes. Parallèles : pas d'interaction ; qui se croisent ou divergent : interaction. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Une boîte à moustaches par facteur, séparément.", "score": -20.0, "feedback_html": "<p>Des graphiques séparés montrent les effets principaux, pas la façon dont les facteurs se combinent.<\/p>"}, {"texte_html": "Un nuage de points des deux facteurs l'un contre l'autre.", "score": -50.0, "feedback_html": "<p>Les facteurs sont catégoriels ; c'est la VD qu'il faut représenter selon eux.<\/p>"}, {"texte_html": "Un facteur en abscisse, l'autre représenté par des courbes distinctes.", "score": 100.0, "feedback_html": "<p>Exact. On regarde ensuite si les courbes sont parallèles.<\/p>"}, {"texte_html": "Un histogramme de la VD pour l'ensemble des participants.", "score": -30.0, "feedback_html": "<p>Il ne distingue pas les groupes et ne montre aucune interaction.<\/p>"}]}, {"id": "C-CM3-015", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 3, "question_html": "<p>Dans une université, 180 garçons ont 16/20 de moyenne en sciences et 20 garçons ont 11/20 en lettres. Quelle est la moyenne générale des garçons ?<\/p>", "question_texte": "Dans une université, 180 garçons ont 16/20 de moyenne en sciences et 20 garçons ont 11/20 en lettres. Quelle est la moyenne générale des garçons ?", "feedback_general_html": "<p>La moyenne générale pondère chaque département par son effectif : (180 × 16 + 20 × 11) / 200 = 15,5. Ce poids des effectifs explique le paradoxe de Simpson. CM03, section Compléments, Table 1.<\/p>", "options": [{"texte_html": "16/20", "score": -30.0, "feedback_html": "<p>Les 20 garçons de lettres tirent la moyenne un peu vers le bas.<\/p>"}, {"texte_html": "27/20", "score": -50.0, "feedback_html": "<p>On ne fait pas la somme des moyennes.<\/p>"}, {"texte_html": "13,5/20", "score": -20.0, "feedback_html": "<p>13,5 est la moyenne simple de 16 et 11, qui ne tient pas compte des effectifs.<\/p>"}, {"texte_html": "15,5/20", "score": 100.0, "feedback_html": "<p>Exact. (180 × 16 + 20 × 11) / 200 = 3 100 / 200 = 15,5.<\/p>"}]}, {"id": "C-CM3-016", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 3, "question_html": "<p>Pour un plan croisé, une chercheuse découpe un score continu d'intelligence émotionnelle en deux groupes (bas, haut) à la médiane. Quel est l'inconvénient de ce choix ?<\/p>", "question_texte": "Pour un plan croisé, une chercheuse découpe un score continu d'intelligence émotionnelle en deux groupes (bas, haut) à la médiane. Quel est l'inconvénient de ce choix ?", "feedback_general_html": "<p>Découper une variable continue en groupes permet d'utiliser une ANOVA, mais perd de l'information : la question « est-ce une bonne idée de créer deux groupes ? » mérite d'être posée. CM03, section Factoriel, « Questions ».<\/p>", "options": [{"texte_html": "Il crée forcément des groupes d'effectifs différents.", "score": -30.0, "feedback_html": "<p>Un découpage à la médiane donne justement des groupes de taille comparable.<\/p>"}, {"texte_html": "Il perd de l'information : des enfants aux scores très proches peuvent être classés dans des groupes différents, et les différences à l'intérieur d'un groupe sont ignorées.", "score": 100.0, "feedback_html": "<p>Exact. Le découpage simplifie l'analyse au prix d'une perte d'information, et donc de puissance.<\/p>"}, {"texte_html": "Il rend l'ANOVA impossible.", "score": -50.0, "feedback_html": "<p>Le découpage rend au contraire l'ANOVA possible.<\/p>"}, {"texte_html": "Il transforme le facteur en facteur intra-sujet.", "score": -20.0, "feedback_html": "<p>Chaque enfant n'appartient qu'à un groupe : le facteur reste inter-sujets.<\/p>"}]}, {"id": "C-CM3-017", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Pour étudier l'effet de l'âge (8 ou 12 ans), on compare deux groupes d'enfants différents plutôt que de suivre les mêmes enfants pendant quatre ans. Quel est le principal avantage de ce choix ?<\/p>", "question_texte": "Pour étudier l'effet de l'âge (8 ou 12 ans), on compare deux groupes d'enfants différents plutôt que de suivre les mêmes enfants pendant quatre ans. Quel est le principal avantage de ce choix ?", "feedback_general_html": "<p>Un âge inter-sujets évite d'attendre et de perdre des participants, mais les groupes peuvent différer par autre chose que l'âge ; un suivi longitudinal (intra-sujet) gagne en puissance mais prend du temps. CM03, section Factoriel, « Questions ».<\/p>", "options": [{"texte_html": "Les deux groupes ne diffèrent que par l'âge.", "score": -20.0, "feedback_html": "<p>C'est justement la limite : des enfants différents peuvent différer par d'autres caractéristiques.<\/p>"}, {"texte_html": "L'analyse est plus puissante qu'avec des mesures répétées.", "score": -30.0, "feedback_html": "<p>Un plan intra-sujet est en général plus puissant ; l'avantage est ailleurs.<\/p>"}, {"texte_html": "L'étude se fait en une seule fois, sans attendre quatre ans ni perdre d'enfants en route.", "score": 100.0, "feedback_html": "<p>Exact. En contrepartie, les deux groupes peuvent différer par autre chose que l'âge.<\/p>"}, {"texte_html": "Il n'y a plus de conditions d'application à vérifier.", "score": -50.0, "feedback_html": "<p>Le plan inter-sujets a ses propres conditions, dont l'homogénéité des variances.<\/p>"}]}, {"id": "C-CM3-018", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Selon le cours, quand peut-on se passer de tester la normalité dans une ANOVA pour plan croisé ?<\/p>", "question_texte": "Selon le cours, quand peut-on se passer de tester la normalité dans une ANOVA pour plan croisé ?", "feedback_general_html": "<p>L'ANOVA est robuste vis-à-vis de la normalité : si les groupes comptent au moins 30 participants, on pourra se passer de la tester. CM03, section Compléments, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Quand les groupes comptent au moins 30 participants, l'ANOVA étant robuste vis-à-vis de la normalité.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Quand le test de Levene n'est pas significatif.", "score": -30.0, "feedback_html": "<p>Le test de Levene porte sur l'égalité des variances, pas sur la normalité.<\/p>"}, {"texte_html": "Jamais : la normalité doit toujours être démontrée.", "score": -20.0, "feedback_html": "<p>Un test ne démontre jamais la normalité ; et l'ANOVA est robuste avec des groupes assez grands.<\/p>"}, {"texte_html": "Quand l'interaction n'est pas significative.", "score": -50.0, "feedback_html": "<p>La significativité des effets ne dit rien des conditions d'application.<\/p>"}]}, {"id": "C-CM3-019", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Dans une ANOVA pour plan croisé, le test de Levene est significatif. Quelle solution le cours évoque-t-il ?<\/p>", "question_texte": "Dans une ANOVA pour plan croisé, le test de Levene est significatif. Quelle solution le cours évoque-t-il ?", "feedback_general_html": "<p>L'homogénéité des variances se vérifie avec le test de Levene, qu'on espère non significatif. En cas de problème, on peut transformer les données (carré, log…). CM03, section Compléments, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Transformer les données (racine carrée, logarithme…).", "score": 100.0, "feedback_html": "<p>Exact. Une transformation peut rendre les variances plus homogènes.<\/p>"}, {"texte_html": "Appliquer la correction de Greenhouse-Geisser.", "score": -20.0, "feedback_html": "<p>Greenhouse-Geisser corrige la sphéricité, en mesures répétées.<\/p>"}, {"texte_html": "Retirer l'interaction du modèle.", "score": -30.0, "feedback_html": "<p>Le modèle ne change rien à l'hétérogénéité des variances.<\/p>"}, {"texte_html": "Conclure que l'interaction est significative.", "score": -50.0, "feedback_html": "<p>Le test de Levene ne teste aucun effet.<\/p>"}]}, {"id": "C-CM3-020", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une ANOVA pour plan croisé à groupes indépendants, comment chaque effet (A, B, A × B) est-il testé ?<\/p>", "question_texte": "Dans une ANOVA pour plan croisé à groupes indépendants, comment chaque effet (A, B, A × B) est-il testé ?", "feedback_general_html": "<p>Chaque effet est testé par le rapport de son carré moyen au carré moyen d'erreur, commun à tous les effets. CM03, section Factoriel, « Formules ».<\/p>", "options": [{"texte_html": "Chacun avec un terme d'erreur différent.", "score": -20.0, "feedback_html": "<p>C'est le cas du plan mixte ; en plan croisé à groupes indépendants, l'erreur est commune.<\/p>"}, {"texte_html": "Par le rapport de son carré moyen au même carré moyen d'erreur.", "score": 100.0, "feedback_html": "<p>Exact. FA = CMA / CMerreur, et de même pour B et A × B.<\/p>"}, {"texte_html": "Par le rapport de son carré moyen au carré moyen de l'autre facteur.", "score": -30.0, "feedback_html": "<p>Chaque effet est comparé à l'erreur, pas à un autre effet.<\/p>"}, {"texte_html": "Par un test de Student par effet.", "score": -50.0, "feedback_html": "<p>Chaque effet est testé par un F dans l'ANOVA.<\/p>"}]}, {"id": "C-CM3-021", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 3, "question_html": "<p>On considère l'ANOVA comme un modèle qui prédit le score ERC à partir de l'âge (8 ou 12 ans). Quelles sont les meilleures prédictions possibles ?<\/p>", "question_texte": "On considère l'ANOVA comme un modèle qui prédit le score ERC à partir de l'âge (8 ou 12 ans). Quelles sont les meilleures prédictions possibles ?", "feedback_general_html": "<p>Dans le modèle de l'ANOVA, la meilleure prédiction pour un groupe est sa moyenne ; la variation restante autour de ces moyennes est l'erreur. CM03, section Compléments, « Questions ».<\/p>", "options": [{"texte_html": "La moyenne générale d'ERC, pour tous les enfants.", "score": -20.0, "feedback_html": "<p>Ce serait le modèle sans effet de l'âge, celui de l'hypothèse nulle.<\/p>"}, {"texte_html": "La médiane de chaque enfant.", "score": -30.0, "feedback_html": "<p>Chaque enfant n'a qu'un score ; le modèle prédit à partir du groupe.<\/p>"}, {"texte_html": "La moyenne d'ERC de chaque groupe d'âge.", "score": 100.0, "feedback_html": "<p>Exact. Les écarts à ces moyennes forment l'erreur résiduelle.<\/p>"}, {"texte_html": "La valeur de F.", "score": -50.0, "feedback_html": "<p>F est une statistique de test, pas une prédiction.<\/p>"}]}, {"id": "C-CM3-022", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Une étude croise trois facteurs inter-sujets : le sexe (2 modalités), la consigne (2 modalités) et l'âge (3 tranches). Combien de groupes indépendants comporte le plan ?<\/p>", "question_texte": "Une étude croise trois facteurs inter-sujets : le sexe (2 modalités), la consigne (2 modalités) et l'âge (3 tranches). Combien de groupes indépendants comporte le plan ?", "feedback_general_html": "<p>Dans un plan croisé, le nombre de groupes est le produit des nombres de modalités : 2 × 2 × 3 = 12. CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "6", "score": -20.0, "feedback_html": "<p>6 = 2 × 3 : il manque un facteur.<\/p>"}, {"texte_html": "12", "score": 100.0, "feedback_html": "<p>Exact. 2 × 2 × 3 = 12.<\/p>"}, {"texte_html": "3", "score": -50.0, "feedback_html": "<p>3 est le nombre de facteurs.<\/p>"}, {"texte_html": "7", "score": -30.0, "feedback_html": "<p>7 = 2 + 2 + 3 : on ne fait pas la somme des modalités.<\/p>"}]}, {"id": "C-CM3-023", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>On mesure les compétences émotionnelles d'élèves de CE2 en début et en fin d'année, dans un groupe à QI bas et un groupe à QI haut. Quel effet indique si les élèves à QI haut progressent plus vite ?<\/p>", "question_texte": "On mesure les compétences émotionnelles d'élèves de CE2 en début et en fin d'année, dans un groupe à QI bas et un groupe à QI haut. Quel effet indique si les élèves à QI haut progressent plus vite ?", "feedback_general_html": "<p>Une progression plus rapide dans un groupe signifie que l'effet du temps dépend du groupe : c'est l'interaction. Un avantage stable, présent dès le début, se lirait sur l'effet principal du groupe. CM03, section Plans mixtes, « Questions ».<\/p>", "options": [{"texte_html": "Le test de Levene.", "score": -50.0, "feedback_html": "<p>Il vérifie une condition d'application.<\/p>"}, {"texte_html": "L'effet principal du temps.", "score": -20.0, "feedback_html": "<p>Il décrit la progression moyenne, tous groupes confondus.<\/p>"}, {"texte_html": "L'interaction temps × groupe de QI.", "score": 100.0, "feedback_html": "<p>Exact. Une progression qui diffère selon le groupe est une interaction.<\/p>"}, {"texte_html": "L'effet principal du groupe de QI.", "score": -30.0, "feedback_html": "<p>Il compare les groupes en moyenne sur les deux mesures, pas leur progression.<\/p>"}]}, {"id": "C-CM3-024", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une ANOVA pour plan croisé, les tests de Shapiro-Wilk et de Levene ne sont pas significatifs. Quelle phrase de compte rendu est correcte ?<\/p>", "question_texte": "Dans une ANOVA pour plan croisé, les tests de Shapiro-Wilk et de Levene ne sont pas significatifs. Quelle phrase de compte rendu est correcte ?", "feedback_general_html": "<p>Des tests de Shapiro-Wilk et de Levene non significatifs permettent de conserver les hypothèses de normalité et d'homogénéité des variances. CM03, section Compléments, « Rédaction ».<\/p>", "options": [{"texte_html": "Il faut appliquer la correction de Welch.", "score": -30.0, "feedback_html": "<p>Welch se justifie quand le test de Levene est significatif, pas ici.<\/p>"}, {"texte_html": "Les tests ne remettent en cause ni la normalité ni l'homogénéité des variances, ce qui permet d'utiliser l'ANOVA.", "score": 100.0, "feedback_html": "<p>Exact. On ne rejette pas les hypothèses nulles de ces tests.<\/p>"}, {"texte_html": "Les effets de l'âge et de l'intelligence émotionnelle sont significatifs.", "score": -50.0, "feedback_html": "<p>Ces tests portent sur les conditions d'application, pas sur les effets.<\/p>"}, {"texte_html": "Les tests prouvent que les données sont normales et que les variances sont égales.", "score": -20.0, "feedback_html": "<p>Un test non significatif ne prouve pas l'hypothèse nulle ; il ne la remet pas en cause.<\/p>"}]}, {"id": "C-CM3-025", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une ANOVA mixte, à quel terme d'erreur l'interaction entre le facteur inter-sujets et le facteur intra-sujet est-elle comparée ?<\/p>", "question_texte": "Dans une ANOVA mixte, à quel terme d'erreur l'interaction entre le facteur inter-sujets et le facteur intra-sujet est-elle comparée ?", "feedback_general_html": "<p>Le plan mixte a deux sources d'erreur : l'une pour la partie inter-sujets, l'autre pour la partie intra-sujet et l'interaction. CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "Au terme d'erreur intra-participants, celui du facteur intra-sujet.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Au terme d'erreur entre participants, celui du facteur inter-sujets.", "score": -20.0, "feedback_html": "<p>L'interaction fait intervenir le facteur intra-sujet : elle relève de l'erreur intra-participants.<\/p>"}, {"texte_html": "À aucun : l'interaction n'est pas testée dans un plan mixte.", "score": -30.0, "feedback_html": "<p>L'interaction est testée, et c'est souvent elle qui répond à la question de recherche.<\/p>"}, {"texte_html": "À la variation totale.", "score": -50.0, "feedback_html": "<p>Un F compare un effet à une erreur, pas à la variation totale.<\/p>"}]}, {"id": "C-CM4-001", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans Jamovi, que fait le contraste <em>repeated<\/em> ?<\/p>", "question_texte": "Dans Jamovi, que fait le contraste *repeated* ?", "feedback_general_html": "<p><em>repeated<\/em> convient à des niveaux ordonnés, comme des moments de mesure successifs. <em>simple<\/em> compare au premier niveau, <em>Helmert<\/em> à la moyenne des suivants, <em>polynomial<\/em> teste des tendances. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "Il compare chaque niveau au premier.", "score": -20.0, "feedback_html": "<p>C'est le contraste <em>simple<\/em> : chaque niveau est comparé au niveau de référence.<\/p>"}, {"texte_html": "Il compare chaque niveau à la moyenne des niveaux suivants.", "score": -30.0, "feedback_html": "<p>C'est le contraste <em>Helmert<\/em>.<\/p>"}, {"texte_html": "Il teste les tendances linéaire et quadratique.", "score": -50.0, "feedback_html": "<p>C'est le contraste <em>polynomial<\/em>, qui cherche une tendance dans des niveaux ordonnés.<\/p>"}, {"texte_html": "Il compare chaque niveau, sauf le dernier, au niveau immédiatement suivant.", "score": 100.0, "feedback_html": "<p>Exact. <em>repeated<\/em> compare les niveaux voisins deux à deux : 1 contre 2, 2 contre 3, etc.<\/p>"}]}, {"id": "C-CM4-002", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Une étude compare quatre groupes de même effectif. Quelle paire de contrastes est orthogonale ?<\/p>", "question_texte": "Une étude compare quatre groupes de même effectif. Quelle paire de contrastes est orthogonale ?", "feedback_general_html": "<p>Avec des effectifs égaux, deux contrastes sont orthogonaux si la somme des produits de leurs coefficients est nulle. CM04, section Contrastes, « Contrastes orthogonaux ».<\/p>", "options": [{"texte_html": "(1, −1, 0, 0) et (1, 0, −1, 0)", "score": -20.0, "feedback_html": "<p>1 × 1 + (−1) × 0 + 0 × (−1) + 0 × 0 = 1 : pas nul.<\/p>"}, {"texte_html": "(1, 0, 0, −1) et (1, 1, 1, −3)", "score": -50.0, "feedback_html": "<p>1 + 0 + 0 + 3 = 4 : pas nul.<\/p>"}, {"texte_html": "(1, 1, −1, −1) et (1, 0, −2, 1)", "score": -30.0, "feedback_html": "<p>1 + 0 + 2 − 1 = 2 : pas nul.<\/p>"}, {"texte_html": "(1, 1, −1, −1) et (1, −1, 0, 0)", "score": 100.0, "feedback_html": "<p>Exact. 1 − 1 + 0 + 0 = 0.<\/p>"}]}, {"id": "C-CM4-003", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Un chercheur examine les moyennes de ses quatre groupes. Il remarque que deux d'entre elles semblent plus élevées et décide alors de tester un contraste opposant ces deux groupes aux deux autres. Que dire de cette démarche ?<\/p>", "question_texte": "Un chercheur examine les moyennes de ses quatre groupes. Il remarque que deux d'entre elles semblent plus élevées et décide alors de tester un contraste opposant ces deux groupes aux deux autres. Que dire de cette démarche ?", "feedback_general_html": "<p>Un contraste traduit une hypothèse formulée avant l'analyse. Choisi après avoir regardé les moyennes, il devient une comparaison post-hoc, qui demande une correction adaptée. CM04, section Contrastes.<\/p>", "options": [{"texte_html": "Elle est correcte : un contraste peut être choisi à tout moment de l'analyse.", "score": -30.0, "feedback_html": "<p>Un contraste traduit une hypothèse formulée avant de voir les données.<\/p>"}, {"texte_html": "Elle est correcte, à condition que le contraste soit orthogonal aux autres.", "score": -20.0, "feedback_html": "<p>L'orthogonalité ne règle pas le problème : le contraste a été choisi en regardant les moyennes.<\/p>"}, {"texte_html": "Il s'agit en réalité d'une comparaison <em>post-hoc<\/em> (qui a été choisie après coup), qui demande une correction adaptée.", "score": 100.0, "feedback_html": "<p>Exact. Choisi après avoir vu les moyennes, le contraste devient une comparaison post-hoc.<\/p>"}, {"texte_html": "Il faut remplacer ce contraste par un contraste polynomial.", "score": -50.0, "feedback_html": "<p>Un contraste polynomial suppose des groupes ordonnés et régulièrement espacés ; il ne répond pas à la question.<\/p>"}]}, {"id": "C-CM4-004", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans quelle situation le choix entre les sommes des carrés de type I, II et III peut-il modifier les résultats ?<\/p>", "question_texte": "Dans quelle situation le choix entre les sommes des carrés de type I, II et III peut-il modifier les résultats ?", "feedback_general_html": "<p>Les trois types sont équivalents pour une ANOVA simple et pour un plan équilibré. Le choix ne compte que pour les plans croisés ou mixtes déséquilibrés. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Une ANOVA simple avec des groupes d'effectifs différents.", "score": -20.0, "feedback_html": "<p>Avec un seul facteur, les trois types sont équivalents, même si les effectifs diffèrent.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé avec des groupes d'effectifs différents.", "score": 100.0, "feedback_html": "<p>Exact. La question ne se pose que pour les plans croisés ou mixtes déséquilibrés.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé avec des groupes de même effectif.", "score": -30.0, "feedback_html": "<p>Dans un plan équilibré, les trois types donnent les mêmes résultats.<\/p>"}, {"texte_html": "Dans aucune situation : les trois types donnent toujours les mêmes résultats.", "score": -50.0, "feedback_html": "<p>Ils diffèrent dans les plans croisés ou mixtes déséquilibrés.<\/p>"}]}, {"id": "C-CM4-005", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec trois niveaux ordonnés et régulièrement espacés, que teste le contraste de coefficients (1, 0, −1) ?<\/p>", "question_texte": "Avec trois niveaux ordonnés et régulièrement espacés, que teste le contraste de coefficients (1, 0, −1) ?", "feedback_general_html": "<p>Si les trois moyennes sont alignées, la plus grande différence oppose les deux extrêmes : c'est ce que teste (1, 0, −1). La courbure se teste avec (1, −2, 1). CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "Une courbure (tendance quadratique).", "score": -20.0, "feedback_html": "<p>La courbure se teste avec (1, −2, 1), qui oppose le milieu aux extrêmes.<\/p>"}, {"texte_html": "Une tendance linéaire.", "score": 100.0, "feedback_html": "<p>Exact. Il oppose les deux extrêmes.<\/p>"}, {"texte_html": "Le niveau du milieu contre la moyenne des deux autres.", "score": -30.0, "feedback_html": "<p>Le niveau du milieu a ici un coefficient nul : il n'intervient pas.<\/p>"}, {"texte_html": "Rien : ces coefficients ne définissent pas un contraste.", "score": -50.0, "feedback_html": "<p>La somme des coefficients est nulle : c'est bien un contraste.<\/p>"}]}, {"id": "C-CM4-006", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Selon le cours, quand peut-on préférer les sommes des carrés de type II ?<\/p>", "question_texte": "Selon le cours, quand peut-on préférer les sommes des carrés de type II ?", "feedback_general_html": "<p>Le type III est le réglage par défaut et la référence pour tester une interaction ; le type II est plus puissant pour les effets principaux quand l'interaction est négligeable ; le type I convient aux plans hiérarchiques. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Toujours : c'est le réglage par défaut.", "score": -30.0, "feedback_html": "<p>Le réglage par défaut est le type III.<\/p>"}, {"texte_html": "Quand l'interaction est l'objet principal de l'étude.", "score": -20.0, "feedback_html": "<p>Pour tester une interaction, la référence est le type III.<\/p>"}, {"texte_html": "Quand un facteur est imbriqué dans un autre.", "score": -50.0, "feedback_html": "<p>Les plans hiérarchiques relèvent plutôt du type I.<\/p>"}, {"texte_html": "Quand l'interaction n'est pas significative : le type II teste alors les effets principaux avec plus de puissance.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM4-007", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Avec trois groupes, lequel de ces ensembles de coefficients NE DÉFINIT PAS un contraste ?<\/p>", "question_texte": "Avec trois groupes, lequel de ces ensembles de coefficients NE DÉFINIT PAS un contraste ?", "feedback_general_html": "<p>Un contraste est une combinaison de moyennes dont les coefficients ont une somme nulle. CM04, section Contrastes, « Formalisation ».<\/p>", "options": [{"texte_html": "(1, −1, 0)", "score": -30.0, "feedback_html": "<p>1 − 1 + 0 = 0 : c'est un contraste.<\/p>"}, {"texte_html": "(2, −1, −1)", "score": -20.0, "feedback_html": "<p>2 − 1 − 1 = 0 : c'est un contraste.<\/p>"}, {"texte_html": "(1, −2, 1)", "score": -50.0, "feedback_html": "<p>1 − 2 + 1 = 0 : c'est un contraste.<\/p>"}, {"texte_html": "(1, 1, −1)", "score": 100.0, "feedback_html": "<p>Exact. 1 + 1 − 1 = 1 : la somme n'est pas nulle.<\/p>"}]}, {"id": "C-CM4-008", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>On compare quatre types de groupes témoins, dans l'ordre <em>Rien<\/em>, <em>Attente<\/em>, <em>Actif<\/em>, <em>TAU<\/em>. Quels coefficients permettent de comparer le groupe <em>Actif<\/em> à la moyenne des groupes <em>Rien<\/em> et <em>TAU<\/em> ?<\/p>", "question_texte": "On compare quatre types de groupes témoins, dans l'ordre *Rien*, *Attente*, *Actif*, *TAU*. Quels coefficients permettent de comparer le groupe *Actif* à la moyenne des groupes *Rien* et *TAU* ?", "feedback_general_html": "<p>Le groupe <em>Actif<\/em> (3e position) reçoit −2, les groupes <em>Rien<\/em> et <em>TAU<\/em> reçoivent 1, le groupe <em>Attente<\/em> 0 ; la somme est nulle. CM04, section Contrastes.<\/p>", "options": [{"texte_html": "(1, 0, 0, −1)", "score": -50.0, "feedback_html": "<p>Ce contraste compare <em>Rien<\/em> et <em>TAU<\/em> entre eux.<\/p>"}, {"texte_html": "(1, 1, −1, −1)", "score": -30.0, "feedback_html": "<p>Ce contraste oppose les deux premiers groupes aux deux derniers.<\/p>"}, {"texte_html": "(1, 0, −2, 1)", "score": 100.0, "feedback_html": "<p>Exact. <em>Actif<\/em> reçoit −2, <em>Rien<\/em> et <em>TAU<\/em> reçoivent 1, <em>Attente<\/em> 0 ; la somme est nulle.<\/p>"}, {"texte_html": "(0, 1, −2, 1)", "score": -20.0, "feedback_html": "<p>Ce contraste compare <em>Actif<\/em> à la moyenne d'<em>Attente<\/em> et de <em>TAU<\/em>.<\/p>"}]}, {"id": "C-CM4-009", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans un plan à 5 groupes, combien de contrastes mutuellement orthogonaux peut-on définir au plus ?<\/p>", "question_texte": "Dans un plan à 5 groupes, combien de contrastes mutuellement orthogonaux peut-on définir au plus ?", "feedback_general_html": "<p>Avec k groupes, on peut définir au plus k − 1 contrastes mutuellement orthogonaux : ensemble, ils découpent exactement la variation inter-groupe. CM04, section Contrastes, « Contrastes orthogonaux ».<\/p>", "options": [{"texte_html": "5", "score": -20.0, "feedback_html": "<p>Avec k groupes, on en définit au plus k − 1.<\/p>"}, {"texte_html": "4", "score": 100.0, "feedback_html": "<p>Exact. k − 1 = 4.<\/p>"}, {"texte_html": "10", "score": -30.0, "feedback_html": "<p>10 est le nombre de paires de groupes.<\/p>"}, {"texte_html": "Autant que l'on veut.", "score": -50.0, "feedback_html": "<p>Des contrastes mutuellement orthogonaux découpent la variation inter-groupe : leur nombre est limité.<\/p>"}]}, {"id": "C-CM4-010", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec des sommes des carrés de type I, de quoi dépend le résultat obtenu pour chaque facteur ?<\/p>", "question_texte": "Avec des sommes des carrés de type I, de quoi dépend le résultat obtenu pour chaque facteur ?", "feedback_general_html": "<p>Le type I attribue au premier facteur toute la variation possible, puis au suivant ce qui reste : l'ordre est essentiel. CM04, section Compléments, « Sommes des carrés ».<\/p>", "options": [{"texte_html": "Du nombre de contrastes demandés.", "score": -30.0, "feedback_html": "<p>Les contrastes n'interviennent pas dans le calcul des sommes des carrés des effets.<\/p>"}, {"texte_html": "De la correction de sphéricité choisie.", "score": -50.0, "feedback_html": "<p>La correction de sphéricité modifie les degrés de liberté, pas les sommes des carrés.<\/p>"}, {"texte_html": "De rien : les trois types de sommes des carrés donnent toujours le même résultat.", "score": -20.0, "feedback_html": "<p>Ils ne donnent le même résultat que pour une ANOVA simple ou un plan équilibré.<\/p>"}, {"texte_html": "De l'ordre dans lequel les facteurs sont entrés dans le modèle.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM4-011", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Qu'est-ce qu'un contraste ?<\/p>", "question_texte": "Qu'est-ce qu'un contraste ?", "feedback_general_html": "<p>Un contraste teste une hypothèse précise, décidée à l'avance, sur une combinaison particulière de moyennes : ψ̂ = Σ cj × x̄j, avec Σ cj = 0. CM04, section Contrastes, « Principe » et « Formalisation ».<\/p>", "options": [{"texte_html": "Une correction des degrés de liberté quand la sphéricité est violée.", "score": -50.0, "feedback_html": "<p>Ce sont les corrections de Greenhouse-Geisser et Huynh-Feldt.<\/p>"}, {"texte_html": "La différence entre la plus grande et la plus petite moyenne.", "score": -30.0, "feedback_html": "<p>C'est une étendue ; un contraste peut opposer n'importe quelle combinaison de groupes.<\/p>"}, {"texte_html": "Une combinaison linéaire de moyennes dont la somme des coefficients est nulle, qui traduit une hypothèse précise décidée à l'avance.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Une comparaison de toutes les paires de groupes après un F significatif.", "score": -20.0, "feedback_html": "<p>Ce sont les comparaisons post-hoc.<\/p>"}]}, {"id": "C-CM4-012", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Pourquoi impose-t-on que la somme des coefficients d'un contraste soit nulle ?<\/p>", "question_texte": "Pourquoi impose-t-on que la somme des coefficients d'un contraste soit nulle ?", "feedback_general_html": "<p>La contrainte de somme nulle garantit que l'on compare des moyennes entre elles, et non leur niveau absolu. Les coefficients positifs et négatifs définissent les deux « camps » opposés. CM04, section Contrastes, « Formalisation ».<\/p>", "options": [{"texte_html": "Pour que l'on compare bien des moyennes entre elles, et non leur niveau absolu.", "score": 100.0, "feedback_html": "<p>Exact. Si toutes les moyennes augmentaient de la même quantité, le contraste ne changerait pas.<\/p>"}, {"texte_html": "Pour que le contraste soit orthogonal aux autres.", "score": -20.0, "feedback_html": "<p>L'orthogonalité est une autre condition, qui concerne deux contrastes entre eux.<\/p>"}, {"texte_html": "Pour que la sphéricité soit respectée.", "score": -30.0, "feedback_html": "<p>La sphéricité est une condition des mesures répétées, sans lien avec les coefficients.<\/p>"}, {"texte_html": "Pour que le contraste soit significatif.", "score": -50.0, "feedback_html": "<p>La somme nulle ne dit rien du résultat du test.<\/p>"}]}, {"id": "C-CM4-013", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec les coefficients c = (1, −1, 0), on obtient ψ̂ = −3,2. Que signifie le signe négatif ?<\/p>", "question_texte": "Avec les coefficients c = (1, −1, 0), on obtient ψ̂ = −3,2. Que signifie le signe négatif ?", "feedback_general_html": "<p>Avec c = (1, −1, 0), ψ̂ = x̄1 − x̄2. Le signe de ψ̂ renseigne sur le sens de la différence. CM04, section Contrastes, « Exemple 1 ».<\/p>", "options": [{"texte_html": "Le contraste est mal défini.", "score": -50.0, "feedback_html": "<p>Les coefficients ont une somme nulle : le contraste est bien défini.<\/p>"}, {"texte_html": "La moyenne du groupe 2 est plus élevée que celle du groupe 1.", "score": 100.0, "feedback_html": "<p>Exact. ψ̂ = x̄1 − x̄2 &lt; 0, donc x̄2 &gt; x̄1.<\/p>"}, {"texte_html": "Le contraste n'est pas significatif.", "score": -30.0, "feedback_html": "<p>La significativité se lit sur le test ; le signe indique le sens de la différence.<\/p>"}, {"texte_html": "La moyenne du groupe 1 est plus élevée que celle du groupe 2.", "score": -20.0, "feedback_html": "<p>ψ̂ = x̄1 − x̄2 : un résultat négatif signifie que x̄1 est la plus petite.<\/p>"}]}, {"id": "C-CM4-014", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Pourquoi le contraste calculé sur les données est-il noté ψ̂ (avec un chapeau) plutôt que ψ ?<\/p>", "question_texte": "Pourquoi le contraste calculé sur les données est-il noté ψ̂ (avec un chapeau) plutôt que ψ ?", "feedback_general_html": "<p>Le chapeau indique une estimation : ψ̂ est calculé sur les moyennes observées et estime le contraste ψ de la population, comme x̄ estime μ. CM04, section Contrastes, « Réflexion ».<\/p>", "options": [{"texte_html": "Parce qu'il est corrigé pour la sphéricité.", "score": -50.0, "feedback_html": "<p>Le chapeau n'a rien à voir avec une correction.<\/p>"}, {"texte_html": "Parce qu'il est standardisé, comme une taille d'effet.", "score": -20.0, "feedback_html": "<p>ψ̂ est exprimé dans l'unité de la VD ; le chapeau indique une estimation.<\/p>"}, {"texte_html": "Parce qu'il est toujours positif.", "score": -30.0, "feedback_html": "<p>ψ̂ peut être négatif : son signe indique le sens de la différence.<\/p>"}, {"texte_html": "Parce qu'il est calculé à partir des moyennes de l'échantillon : c'est une estimation du vrai contraste dans la population.", "score": 100.0, "feedback_html": "<p>Exact. Le chapeau signale une estimation.<\/p>"}]}, {"id": "C-CM4-015", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 3, "question_html": "<p>Avec trois groupes, les coefficients c = (2, 1, −3) définissent-ils un contraste ? Si oui, que compare-t-il ?<\/p>", "question_texte": "Avec trois groupes, les coefficients c = (2, 1, −3) définissent-ils un contraste ? Si oui, que compare-t-il ?", "feedback_general_html": "<p>2 + 1 − 3 = 0 : c'est un contraste. Il vaut 0 quand 3 x̄3 = 2 x̄1 + x̄2, c'est-à-dire quand x̄3 égale une moyenne pondérée des groupes 1 et 2. CM04, section Contrastes, « Réflexion ».<\/p>", "options": [{"texte_html": "Oui : il compare le groupe 3 à une moyenne pondérée des groupes 1 et 2, où le groupe 1 compte double.", "score": 100.0, "feedback_html": "<p>Exact. ψ̂ = 0 si et seulement si x̄3 = (2 x̄1 + x̄2) / 3.<\/p>"}, {"texte_html": "Non, car les coefficients ne sont pas tous égaux en valeur absolue.", "score": -30.0, "feedback_html": "<p>Seule la somme compte : 2 + 1 − 3 = 0.<\/p>"}, {"texte_html": "Oui : il compare le groupe 3 à la moyenne simple des groupes 1 et 2.", "score": -20.0, "feedback_html": "<p>Ce serait (1, 1, −2) ; ici le groupe 1 a un poids double.<\/p>"}, {"texte_html": "Non, car un contraste ne peut pas avoir de coefficient égal à 3.", "score": -50.0, "feedback_html": "<p>Les coefficients peuvent prendre toutes les valeurs, pourvu que leur somme soit nulle.<\/p>"}]}, {"id": "C-CM4-016", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 3, "question_html": "<p>Un chercheur avait planifié trois contrastes. Après coup, il renonce à en tester un. Que dit le cours ?<\/p>", "question_texte": "Un chercheur avait planifié trois contrastes. Après coup, il renonce à en tester un. Que dit le cours ?", "feedback_general_html": "<p>Les contrastes doivent être décidés à l'avance de manière exhaustive. Même si l'on renonce après coup à l'un d'eux, il faut le prendre en compte lorsqu'on corrige pour le nombre de comparaisons. CM04, section Contrastes, « Attention ».<\/p>", "options": [{"texte_html": "Il doit quand même le compter s'il corrige pour le nombre de comparaisons.", "score": 100.0, "feedback_html": "<p>Exact. Les contrastes sont décidés à l'avance de manière exhaustive.<\/p>"}, {"texte_html": "Il peut le remplacer par un contraste choisi en regardant les moyennes.", "score": -50.0, "feedback_html": "<p>Un contraste choisi après avoir vu les moyennes devient une comparaison post-hoc.<\/p>"}, {"texte_html": "Il doit refaire l'expérience.", "score": -30.0, "feedback_html": "<p>Rien n'oblige à refaire l'expérience ; il faut seulement tenir compte du contraste prévu.<\/p>"}, {"texte_html": "Il ne compte plus : seuls les contrastes testés interviennent dans la correction.", "score": -20.0, "feedback_html": "<p>C'est précisément ce que le cours interdit : le choix a été fait avant l'analyse.<\/p>"}]}, {"id": "C-CM4-017", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Selon le cours, quels contrastes faut-il privilégier ?<\/p>", "question_texte": "Selon le cours, quels contrastes faut-il privilégier ?", "feedback_general_html": "<p>On choisit toujours les contrastes à l'avance, de préférence en petit nombre (2 ou 3), et on privilégie des contrastes orthogonaux. CM04, section Contrastes, « Retenir ».<\/p>", "options": [{"texte_html": "Un petit nombre (2 ou 3 par exemple), décidés à l'avance et de préférence orthogonaux.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Ceux que suggèrent les moyennes, une fois les données recueillies.", "score": -50.0, "feedback_html": "<p>Choisis après coup, ce ne sont plus des contrastes mais des comparaisons post-hoc.<\/p>"}, {"texte_html": "Le plus grand nombre possible, pour ne rien manquer.", "score": -30.0, "feedback_html": "<p>Multiplier les contrastes augmente le risque d'erreur de type I.<\/p>"}, {"texte_html": "Uniquement des contrastes non orthogonaux, plus informatifs.", "score": -20.0, "feedback_html": "<p>Des contrastes non orthogonaux restent légitimes, mais leurs informations se recoupent : on préfère l'orthogonalité.<\/p>"}]}, {"id": "C-CM4-018", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec trois groupes, les contrastes <em>simple<\/em> de Jamovi sont (1, −1, 0) et (1, 0, −1). Sont-ils orthogonaux ?<\/p>", "question_texte": "Avec trois groupes, les contrastes *simple* de Jamovi sont (1, −1, 0) et (1, 0, −1). Sont-ils orthogonaux ?", "feedback_general_html": "<p>Les deux contrastes <em>simple<\/em> partagent le premier groupe : la somme des produits vaut 1, ils ne sont pas orthogonaux. Ils restent légitimes, mais leurs informations se recoupent. CM04, section Exemples de contrastes, « Réponses ».<\/p>", "options": [{"texte_html": "Oui, car chacun a une somme de coefficients nulle.", "score": -20.0, "feedback_html": "<p>Cela fait de chacun un contraste ; l'orthogonalité dépend de la somme de leurs produits.<\/p>"}, {"texte_html": "On ne peut pas le savoir sans les données.", "score": -50.0, "feedback_html": "<p>L'orthogonalité se vérifie sur les coefficients seuls.<\/p>"}, {"texte_html": "Oui : la somme des produits vaut 0.", "score": -30.0, "feedback_html": "<p>Refaites le calcul : 1 + 0 + 0 = 1.<\/p>"}, {"texte_html": "Non : la somme des produits des coefficients vaut 1.", "score": 100.0, "feedback_html": "<p>Exact. 1 × 1 + (−1) × 0 + 0 × (−1) = 1.<\/p>"}]}, {"id": "C-CM4-019", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Avec trois groupes, les contrastes <em>polynomial<\/em> sont (1, 0, −1) pour la tendance linéaire et (1, −2, 1) pour la tendance quadratique. Sont-ils orthogonaux ?<\/p>", "question_texte": "Avec trois groupes, les contrastes *polynomial* sont (1, 0, −1) pour la tendance linéaire et (1, −2, 1) pour la tendance quadratique. Sont-ils orthogonaux ?", "feedback_general_html": "<p>1 × 1 + 0 × (−2) + (−1) × 1 = 0 : les contrastes polynomiaux sont orthogonaux. CM04, section Exemples de contrastes, « Orthogonalité ».<\/p>", "options": [{"texte_html": "Non : la somme des produits vaut 2.", "score": -20.0, "feedback_html": "<p>Refaites le calcul : 1 + 0 − 1 = 0.<\/p>"}, {"texte_html": "Oui : 1 × 1 + 0 × (−2) + (−1) × 1 = 0.", "score": 100.0, "feedback_html": "<p>Exact. Les contrastes polynomiaux sont orthogonaux, ce qui est toujours préférable.<\/p>"}, {"texte_html": "Non : leurs coefficients sont différents.", "score": -30.0, "feedback_html": "<p>Des coefficients différents n'empêchent pas l'orthogonalité.<\/p>"}, {"texte_html": "On ne peut pas le savoir sans les données.", "score": -50.0, "feedback_html": "<p>L'orthogonalité se vérifie sur les coefficients seuls.<\/p>"}]}, {"id": "C-CM4-020", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans Jamovi, on veut tester un contraste aux coefficients entièrement personnalisés, par exemple (3, −1, −1, −1). Que dit le cours ?<\/p>", "question_texte": "Dans Jamovi, on veut tester un contraste aux coefficients entièrement personnalisés, par exemple (3, −1, −1, −1). Que dit le cours ?", "feedback_general_html": "<p>La section <em>Contrasts<\/em> de Jamovi propose des types prédéfinis (<em>deviation<\/em>, <em>simple<\/em>, <em>difference<\/em>, <em>Helmert<\/em>, <em>repeated<\/em>, <em>polynomial<\/em>). Pour des coefficients personnalisés, il faut le module GAMLj, hors programme cette année. CM04, section Contrastes, « Avec Jamovi ».<\/p>", "options": [{"texte_html": "Il faut le saisir dans la section <em>Contrasts<\/em> de l'ANOVA.", "score": -20.0, "feedback_html": "<p>La section <em>Contrasts<\/em> ne propose que des types prédéfinis.<\/p>"}, {"texte_html": "C'est impossible dans Jamovi.", "score": -30.0, "feedback_html": "<p>C'est possible avec le module GAMLj.<\/p>"}, {"texte_html": "Il faut demander des comparaisons post-hoc avec Tukey.", "score": -50.0, "feedback_html": "<p>Des comparaisons post-hoc ne testent pas un contraste prévu.<\/p>"}, {"texte_html": "Il faut utiliser le module GAMLj, hors programme cette année.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM4-021", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Pour les contrastes prédéfinis de Jamovi, pourquoi l'ordre des niveaux du facteur est-il important ?<\/p>", "question_texte": "Pour les contrastes prédéfinis de Jamovi, pourquoi l'ordre des niveaux du facteur est-il important ?", "feedback_general_html": "<p>Pour plusieurs familles de contrastes, l'ordre des groupes n'est pas anodin. Dans Jamovi, on le modifie pour que le premier niveau soit la référence, et on garde l'ordre naturel s'il y en a un. CM04, section Exemples de contrastes, « Ordre ».<\/p>", "options": [{"texte_html": "Parce que l'ordre change la valeur de F de l'ANOVA globale.", "score": -50.0, "feedback_html": "<p>Le F global ne dépend pas de l'ordre des niveaux.<\/p>"}, {"texte_html": "Parce que plusieurs contrastes dépendent de cet ordre : le premier niveau doit être la référence, et un ordre naturel doit être gardé.", "score": 100.0, "feedback_html": "<p>Exact. Avec <em>simple<\/em>, par exemple, tout est comparé au premier niveau.<\/p>"}, {"texte_html": "Il n'a aucune importance : les contrastes sont calculés quel que soit l'ordre.", "score": -30.0, "feedback_html": "<p>Le calcul se fait, mais il ne compare pas les bons groupes si l'ordre est mal choisi.<\/p>"}, {"texte_html": "Parce que Jamovi trie les niveaux par moyenne croissante.", "score": -20.0, "feedback_html": "<p>Jamovi ne trie pas par moyenne ; c'est à l'utilisateur de fixer l'ordre.<\/p>"}]}, {"id": "C-CM4-022", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans le tableau des contrastes de Jamovi, que donne la colonne <em>Estimate<\/em> ?<\/p>", "question_texte": "Dans le tableau des contrastes de Jamovi, que donne la colonne *Estimate* ?", "feedback_general_html": "<p><em>Estimate<\/em> donne la valeur du contraste avec les moyennes observées ; <em>SE<\/em> mesure l'erreur de cette estimation ; <em>t<\/em> est la statistique du test (F et t sont équivalents pour un contraste). CM04, section Exemples de contrastes, « Notes ».<\/p>", "options": [{"texte_html": "La probabilité que le contraste soit nul.", "score": -30.0, "feedback_html": "<p>C'est une mauvaise lecture de la valeur p ; <em>Estimate<\/em> est la valeur du contraste.<\/p>"}, {"texte_html": "La taille d'effet du contraste.", "score": -20.0, "feedback_html": "<p><em>Estimate<\/em> est exprimée dans l'unité de la VD : ce n'est pas une taille d'effet standardisée.<\/p>"}, {"texte_html": "La valeur du contraste calculée avec les moyennes observées.", "score": 100.0, "feedback_html": "<p>Exact. L'erreur standard dit à quel point cette valeur est fiable, t permet de la tester.<\/p>"}, {"texte_html": "Le nombre de participants par groupe.", "score": -50.0, "feedback_html": "<p>Les effectifs ne figurent pas dans cette colonne.<\/p>"}]}, {"id": "C-CM4-023", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>On compare quatre types de groupes témoins, dans l'ordre <em>Rien<\/em>, <em>Attente<\/em>, <em>Actif<\/em>, <em>TAU<\/em>. On pense que <em>TAU<\/em> est supérieur aux trois autres réunis. Quel contraste convient ?<\/p>", "question_texte": "On compare quatre types de groupes témoins, dans l'ordre *Rien*, *Attente*, *Actif*, *TAU*. On pense que *TAU* est supérieur aux trois autres réunis. Quel contraste convient ?", "feedback_general_html": "<p>Pour opposer <em>TAU<\/em> à la moyenne des trois autres groupes, on donne 1 à chacun d'eux et −3 à <em>TAU<\/em> : la somme est nulle. CM04, section Exemples de contrastes, « Réponses ».<\/p>", "options": [{"texte_html": "(1, 1, −1, −1)", "score": -20.0, "feedback_html": "<p>Ce contraste oppose les deux premiers groupes aux deux derniers.<\/p>"}, {"texte_html": "(1, 1, 1, −3)", "score": 100.0, "feedback_html": "<p>Exact. <em>TAU<\/em> est opposé à la moyenne des trois autres groupes.<\/p>"}, {"texte_html": "(1, 0, 0, −1)", "score": -30.0, "feedback_html": "<p>Ce contraste compare seulement <em>Rien<\/em> et <em>TAU<\/em>.<\/p>"}, {"texte_html": "(0, 0, 0, 1)", "score": -50.0, "feedback_html": "<p>La somme des coefficients n'est pas nulle : ce n'est pas un contraste.<\/p>"}]}, {"id": "C-CM4-024", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Avec les groupes <em>Rien<\/em>, <em>Attente<\/em>, <em>Actif<\/em> et <em>TAU<\/em>, on veut savoir si <em>Rien<\/em> est inférieur à chacun des autres types de groupes. Quels contrastes utiliser ?<\/p>", "question_texte": "Avec les groupes *Rien*, *Attente*, *Actif* et *TAU*, on veut savoir si *Rien* est inférieur à chacun des autres types de groupes. Quels contrastes utiliser ?", "feedback_general_html": "<p>Pour comparer <em>Rien<\/em> à chacun des autres groupes : c1 = (1, −1, 0, 0), c2 = (1, 0, −1, 0), c3 = (1, 0, 0, −1), soit les contrastes <em>simple<\/em> de Jamovi avec <em>Rien<\/em> en référence. CM04, section Exemples de contrastes, « Réponses ».<\/p>", "options": [{"texte_html": "Les contrastes <em>simple<\/em> de Jamovi, avec <em>Rien<\/em> en premier niveau.", "score": 100.0, "feedback_html": "<p>Exact. (1, −1, 0, 0), (1, 0, −1, 0) et (1, 0, 0, −1).<\/p>"}, {"texte_html": "Un seul contraste (3, −1, −1, −1).", "score": -20.0, "feedback_html": "<p>Il compare <em>Rien<\/em> à la moyenne des autres, pas à chacun d'eux.<\/p>"}, {"texte_html": "Les contrastes <em>polynomial<\/em>.", "score": -50.0, "feedback_html": "<p>Les types de groupes témoins ne forment pas une échelle régulière ; il n'y a pas de tendance à tester.<\/p>"}, {"texte_html": "Les contrastes <em>repeated<\/em>.", "score": -30.0, "feedback_html": "<p><em>repeated<\/em> compare chaque niveau au suivant, pas chaque niveau à <em>Rien<\/em>.<\/p>"}]}, {"id": "C-CM4-025", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Que fait la somme des carrés de type III ?<\/p>", "question_texte": "Que fait la somme des carrés de type III ?", "feedback_general_html": "<p>Type III : chaque effet est testé en contrôlant tous les autres, interaction comprise. C'est la référence pour tester une interaction et le réglage par défaut, qu'on utilise sauf bonne raison. CM04, section Compléments, « Type 3 ».<\/p>", "options": [{"texte_html": "Elle ne s'utilise qu'avec des mesures répétées.", "score": -50.0, "feedback_html": "<p>Le type III s'utilise dans tous les plans ; c'est le réglage par défaut.<\/p>"}, {"texte_html": "Elle teste chaque effet en contrôlant tous les autres effets du modèle, interaction comprise.", "score": 100.0, "feedback_html": "<p>Exact. C'est le réglage par défaut de Jamovi, de SPSS et de SAS.<\/p>"}, {"texte_html": "Elle attribue toute la variation possible au premier facteur entré, puis le reste au suivant.", "score": -30.0, "feedback_html": "<p>C'est le type I.<\/p>"}, {"texte_html": "Elle teste les effets principaux en contrôlant l'autre facteur, mais pas l'interaction.", "score": -20.0, "feedback_html": "<p>C'est le type II.<\/p>"}]}, {"id": "C-CM4-026", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 3, "question_html": "<p>Pourquoi le type II de sommes des carrés est-il parfois jugé risqué ?<\/p>", "question_texte": "Pourquoi le type II de sommes des carrés est-il parfois jugé risqué ?", "feedback_general_html": "<p>Le type II suppose implicitement une interaction négligeable. Pratique de bon sens : examiner d'abord l'interaction (type III), puis, si elle n'est pas significative, passer au type II pour les effets principaux. CM04, section Compléments, « Type 2 ».<\/p>", "options": [{"texte_html": "Parce que ses résultats dépendent de l'ordre des facteurs.", "score": -20.0, "feedback_html": "<p>C'est le défaut du type I ; le type II ne dépend pas de l'ordre.<\/p>"}, {"texte_html": "Parce qu'il est moins puissant que le type III pour les effets principaux.", "score": -30.0, "feedback_html": "<p>C'est l'inverse : il offre la meilleure puissance pour les effets principaux.<\/p>"}, {"texte_html": "Parce qu'il teste les effets principaux comme s'il n'y avait pas d'interaction, ce qui peut être trompeur si une interaction existe réellement.", "score": 100.0, "feedback_html": "<p>Exact. On ne l'utilise que si l'interaction n'est pas significative ou n'est pas l'objet de l'analyse.<\/p>"}, {"texte_html": "Parce qu'il n'est pas disponible dans Jamovi.", "score": -50.0, "feedback_html": "<p>Jamovi propose les trois types.<\/p>"}]}, {"id": "C-CM4-027", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Dans un contraste <em>polynomial<\/em>, à quelle forme de relation correspond une tendance quadratique ?<\/p>", "question_texte": "Dans un contraste *polynomial*, à quelle forme de relation correspond une tendance quadratique ?", "feedback_general_html": "<p>Les contrastes polynomiaux cherchent un lien linéaire (en forme de droite), quadratique (en forme de parabole), etc., quand les groupes sont supposés régulièrement espacés. CM04, section Exemples de contrastes, « Retenir ».<\/p>", "options": [{"texte_html": "Une différence entre les deux premiers groupes seulement.", "score": -50.0, "feedback_html": "<p>Le contraste quadratique porte sur la forme de l'ensemble des moyennes.<\/p>"}, {"texte_html": "Une absence de lien entre les groupes.", "score": -30.0, "feedback_html": "<p>L'absence de lien correspond à des moyennes égales, sans tendance.<\/p>"}, {"texte_html": "Une droite.", "score": -20.0, "feedback_html": "<p>C'est la tendance linéaire.<\/p>"}, {"texte_html": "Une parabole (une courbure, avec un maximum ou un minimum).", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM5-002", "type": "question", "categorie": "comprehension", "cm": [5], "difficulte": 2, "question_html": "<p>Une étude portant sur 5 000 participants obtient p &lt; 0,001 et η² = 0,004. Que conclure ?<\/p><p><em>Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.<\/em><\/p>", "question_texte": "Une étude portant sur 5 000 participants obtient p < 0,001 et η² = 0,004. Que conclure ?\n\n*Rappel : repères de Cohen (1988) pour η² : 0,01 petit, 0,06 moyen, 0,14 grand.*", "feedback_general_html": "<p>La significativité dépend de l'effectif : avec 5 000 participants, un effet minuscule devient significatif. Significatif ne veut pas dire important. CM05, sections Rappels et Classique.<\/p>", "options": [{"t
