<script id="donnees" type="application/json">[{"id": "S-005", "type": "serie", "categorie": "choix", "cm": [1, 4], "etude": {"titre": "Les verbes et la vitesse (plan simple)"}, "etude_html": "<h4>Les verbes et la vitesse (plan simple)<\/h4><p>Loftus et Palmer (1974) ont montré à 45 étudiants des films d'accidents de voiture. Les étudiants, répartis au hasard en cinq groupes de 9, devaient ensuite estimer la vitesse des voitures au moment du choc. Seul le verbe de la question changeait d'un groupe à l'autre : « À quelle vitesse allaient les voitures quand elles se sont <em>contacted<\/em> (touchées) / <em>hit<\/em> (heurtées) / <em>bumped<\/em> (cognées) / <em>collided<\/em> (percutées) / <em>smashed<\/em> (fracassées) ? » Ces verbes sont rangés ici du moins violent au plus violent.<\/p><p style=\"font-size:0.85em;color:#555\">Loftus, E. F., &amp; Palmer, J. C. (1974). Reconstruction of automobile destruction: An example of the interaction between language and memory. <em>Journal of Verbal Learning and Verbal Behavior, 13<\/em>(5), 585–589. https://doi.org/10.1016/S0022-5371(74)80011-3<\/p>", "questions": [{"id": "S-005-q1", "difficulte": 1, "question_html": "<p>Quelle est la VD de cette étude, et de quel type est-elle ?<\/p>", "question_texte": "Quelle est la VD de cette étude, et de quel type est-elle ?", "feedback_general_html": "<p>La VD est ce que l'on mesure : la vitesse estimée, numérique. Le verbe est la VI, catégorielle. CM01, section Placebo.<\/p>", "options": [{"texte_html": "Le verbe utilisé dans la question ; une variable catégorielle.", "score": -20.0, "feedback_html": "<p>Le verbe est manipulé par les chercheurs : c'est la VI.<\/p>"}, {"texte_html": "La vitesse estimée par les participants ; une variable numérique.", "score": 100.0, "feedback_html": "<p>Exact. C'est ce que l'on mesure chez chaque participant.<\/p>"}, {"texte_html": "La vitesse réelle des voitures ; une variable numérique.", "score": -30.0, "feedback_html": "<p>La vitesse réelle est la même pour tous : ce n'est pas elle qu'on mesure.<\/p>"}, {"texte_html": "Le groupe des participants ; une variable numérique à cinq modalités.", "score": -50.0, "feedback_html": "<p>Le groupe correspond à la VI ; et une variable à modalités est catégorielle, pas numérique.<\/p>"}]}, {"id": "S-005-q2", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour tester l'effet du verbe sur la vitesse estimée ?<\/p>", "question_texte": "Quelle analyse convient pour tester l'effet du verbe sur la vitesse estimée ?", "feedback_general_html": "<p>Une VD numérique, une VI catégorielle, des groupes indépendants : c'est le cas de l'ANOVA simple. CM01.<\/p>", "options": [{"texte_html": "Une série de dix tests de Student, un pour chaque paire de verbes.", "score": -20.0, "feedback_html": "<p>Dix tests gonfleraient le risque d'erreur de type I ; l'ANOVA teste tout en une fois.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées.", "score": -30.0, "feedback_html": "<p>Chaque participant ne passe qu'une condition : les groupes sont indépendants.<\/p>"}, {"texte_html": "Une ANOVA simple, avec un facteur inter-sujets à cinq modalités.", "score": 100.0, "feedback_html": "<p>Exact. VD numérique, VI catégorielle, groupes indépendants.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé 5 × 9.", "score": -50.0, "feedback_html": "<p>Les 9 participants par groupe ne forment pas un facteur.<\/p>"}]}, {"id": "S-005-q3", "difficulte": 2, "question_html": "<p>Supposons que les chercheurs n'aient formulé aucune hypothèse précise. L'ANOVA est significative et le test de Levene ne l'est pas. Ils veulent maintenant savoir quels verbes diffèrent entre eux. Que faire ?<\/p>", "question_texte": "Supposons que les chercheurs n'aient formulé aucune hypothèse précise. L'ANOVA est significative et le test de Levene ne l'est pas. Ils veulent maintenant savoir quels verbes diffèrent entre eux. Que faire ?", "feedback_general_html": "<p>Sans hypothèse a priori, on compare toutes les paires en contrôlant le risque total ; Tukey est recommandé quand les variances sont homogènes. CM01, section Compléments.<\/p>", "options": [{"texte_html": "Dix tests de Student sans correction, puisque l'ANOVA est déjà significative.", "score": -30.0, "feedback_html": "<p>Sans correction, dix tests gonfleraient le risque d'erreur de type I, même après un F significatif.<\/p>"}, {"texte_html": "Un contraste polynomial, puisque les verbes sont ordonnés.", "score": -20.0, "feedback_html": "<p>Un contraste polynomial traduit une hypothèse a priori sur la forme de la tendance ; il ne compare pas les paires.<\/p>"}, {"texte_html": "La correction de Welch, puis des tests de Student.", "score": -50.0, "feedback_html": "<p>Welch ne se justifie qu'en cas de variances hétérogènes, ce que le test de Levene n'indique pas ici.<\/p>"}, {"texte_html": "Des comparaisons post-hoc de toutes les paires, avec la correction de Tukey.", "score": 100.0, "feedback_html": "<p>Exact. Tukey est recommandé quand les variances sont homogènes.<\/p>"}]}, {"id": "S-005-q4", "difficulte": 1, "question_html": "<p>Avant l'analyse, les chercheurs décident de comparer chaque verbe au verbe le plus neutre, <em>contacted<\/em>. Dans Jamovi, quel type de contraste choisir, et quel niveau placer en premier ?<\/p>", "question_texte": "Avant l'analyse, les chercheurs décident de comparer chaque verbe au verbe le plus neutre, *contacted*. Dans Jamovi, quel type de contraste choisir, et quel niveau placer en premier ?", "feedback_general_html": "<p>Le contraste <em>simple<\/em> compare chaque niveau au premier, qui doit donc être la référence, <em>contacted<\/em>. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "Le contraste <em>simple<\/em>, avec <em>contacted<\/em> en premier niveau.", "score": 100.0, "feedback_html": "<p>Exact. <em>simple<\/em> compare chaque niveau au premier, qui sert de référence.<\/p>"}, {"texte_html": "Le contraste <em>simple<\/em>, avec <em>smashed<\/em> en premier niveau.", "score": -20.0, "feedback_html": "<p>Le bon contraste, mais la référence serait le mauvais verbe.<\/p>"}, {"texte_html": "Le contraste <em>Helmert<\/em>, avec <em>contacted<\/em> en premier niveau.", "score": -30.0, "feedback_html": "<p><em>Helmert<\/em> compare chaque niveau à la moyenne des suivants, pas à une référence.<\/p>"}, {"texte_html": "Le contraste <em>polynomial<\/em>, avec <em>contacted<\/em> en premier niveau.", "score": -50.0, "feedback_html": "<p><em>polynomial<\/em> teste la forme d'une tendance, pas des comparaisons à une référence.<\/p>"}]}]}, {"id": "S-006", "type": "serie", "categorie": "choix", "cm": [2, 4], "etude": {"titre": "La rotation mentale (mesures répétées)"}, "etude_html": "<h4>La rotation mentale (mesures répétées)<\/h4><p>Shepard et Metzler (1971) présentaient des paires de dessins d'objets en cubes. Dans chaque paire, le second objet était tourné d'un certain angle, de 0° à 180°, par rapport au premier. Les participants devaient dire le plus vite possible si les deux objets étaient identiques. Chaque participant passait tous les angles, et le temps de réponse augmentait avec l'angle.<\/p><p>Pour l'exercice, on imagine une réplication avec 12 participants et quatre angles (0°, 60°, 120°, 180°). Pour chaque participant et chaque angle, on relève le temps de réponse moyen, en secondes.<\/p><p style=\"font-size:0.85em;color:#555\">Shepard, R. N., &amp; Metzler, J. (1971). Mental rotation of three-dimensional objects. <em>Science, 171<\/em>(3972), 701–703. https://doi.org/10.1126/science.171.3972.701<\/p>", "questions": [{"id": "S-006-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour tester l'effet de l'angle sur le temps de réponse ?<\/p>", "question_texte": "Quelle analyse convient pour tester l'effet de l'angle sur le temps de réponse ?", "feedback_general_html": "<p>Les mêmes participants passent les quatre angles : l'angle est un facteur intra-sujet. CM02.<\/p>", "options": [{"texte_html": "Une ANOVA simple à quatre groupes.", "score": -20.0, "feedback_html": "<p>Une ANOVA simple supposerait des groupes indépendants ; ici, les mêmes participants passent les quatre angles.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé 12 × 4.", "score": -50.0, "feedback_html": "<p>Les participants ne constituent pas un facteur croisé.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées, avec un facteur intra-sujet à quatre modalités.", "score": 100.0, "feedback_html": "<p>Exact. L'angle est un facteur intra-sujet.<\/p>"}, {"texte_html": "Une ANOVA mixte, avec l'angle comme facteur inter-sujets.", "score": -30.0, "feedback_html": "<p>Il n'y a aucun facteur inter-sujets ici, et l'angle est intra-sujet.<\/p>"}]}, {"id": "S-006-q2", "difficulte": 2, "question_html": "<p>Pour l'analyse dans Jamovi, les données sont saisies au format large. Comment se présente le tableau ?<\/p>", "question_texte": "Pour l'analyse dans Jamovi, les données sont saisies au format large. Comment se présente le tableau ?", "feedback_general_html": "<p>Au format large, chaque ligne est un participant et chaque mesure répétée a sa colonne. Le format long a une ligne par mesure, avec l'identifiant du participant. CM02, section Équiprobabilité, « Formats ».<\/p>", "options": [{"texte_html": "48 lignes et 2 colonnes : l'angle et le temps.", "score": -30.0, "feedback_html": "<p>Ce serait un format long, et il oublie l'identifiant du participant.<\/p>"}, {"texte_html": "12 lignes et 4 colonnes de temps, une par angle.", "score": 100.0, "feedback_html": "<p>Exact. Une ligne par participant, une colonne par mesure répétée.<\/p>"}, {"texte_html": "4 lignes et 12 colonnes, une par participant.", "score": -50.0, "feedback_html": "<p>Lignes et colonnes sont inversées : chaque ligne doit être un participant.<\/p>"}, {"texte_html": "48 lignes et 3 colonnes : le participant, l'angle et le temps.", "score": -20.0, "feedback_html": "<p>C'est le format long, pas le format large demandé.<\/p>"}]}, {"id": "S-006-q3", "difficulte": 2, "question_html": "<p>Avant l'analyse, les chercheurs font l'hypothèse que le temps de réponse augmente linéairement avec l'angle. Quel type de contraste correspond à cette hypothèse ?<\/p>", "question_texte": "Avant l'analyse, les chercheurs font l'hypothèse que le temps de réponse augmente linéairement avec l'angle. Quel type de contraste correspond à cette hypothèse ?", "feedback_general_html": "<p>Pour des niveaux ordonnés et régulièrement espacés, le contraste polynomial teste la tendance linéaire, puis quadratique. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "Un contraste <em>simple<\/em>, qui compare chaque angle à 0°.", "score": -30.0, "feedback_html": "<p>Il dirait si chaque angle diffère de 0°, pas si l'augmentation est régulière.<\/p>"}, {"texte_html": "Un contraste <em>repeated<\/em>, qui compare chaque angle au suivant.", "score": -20.0, "feedback_html": "<p>Il compare les angles voisins, sans tester une tendance en ligne droite.<\/p>"}, {"texte_html": "Un contraste <em>Helmert<\/em>, qui compare chaque angle à la moyenne des suivants.", "score": -50.0, "feedback_html": "<p>Il ne teste pas la forme de la relation entre angle et temps.<\/p>"}, {"texte_html": "Un contraste <em>polynomial<\/em>, dont la composante linéaire teste une tendance en ligne droite.", "score": 100.0, "feedback_html": "<p>Exact. Les angles sont ordonnés et régulièrement espacés.<\/p>"}]}, {"id": "S-006-q4", "difficulte": 1, "question_html": "<p>Supposons maintenant qu'aucune hypothèse n'ait été formulée à l'avance. Après un F significatif, on souhaite comparer les angles deux à deux. Quelle correction le cours recommande-t-il pour ce plan ?<\/p>", "question_texte": "Supposons maintenant qu'aucune hypothèse n'ait été formulée à l'avance. Après un F significatif, on souhaite comparer les angles deux à deux. Quelle correction le cours recommande-t-il pour ce plan ?", "feedback_general_html": "<p>Pour un plan à mesures répétées, Holm reste rigoureux tout en étant plus puissant que Bonferroni ; Tukey n'est pas adapté. CM02, section Compléments.<\/p>", "options": [{"texte_html": "La correction de Holm.", "score": 100.0, "feedback_html": "<p>Exact. Rigoureuse et plus puissante que Bonferroni.<\/p>"}, {"texte_html": "La correction de Tukey.", "score": -20.0, "feedback_html": "<p>Tukey n'est pas adapté aux mesures répétées.<\/p>"}, {"texte_html": "Aucune correction, puisque les mesures viennent des mêmes participants.", "score": -50.0, "feedback_html": "<p>Six comparaisons sans correction gonfleraient le risque d'erreur de type I.<\/p>"}, {"texte_html": "La correction de Bonferroni, parce qu'elle est la plus puissante.", "score": -30.0, "feedback_html": "<p>Bonferroni est au contraire la moins puissante ; Holm la surpasse.<\/p>"}]}]}, {"id": "S-007", "type": "serie", "categorie": "choix", "cm": [3, 4], "etude": {"titre": "La menace du stéréotype (plan croisé)"}, "etude_html": "<h4>La menace du stéréotype (plan croisé)<\/h4><p>Dans leur première étude, Steele et Aronson (1995) ont fait passer un test verbal difficile à 114 étudiants noirs ou blancs de l'université Stanford. La présentation du test, attribuée au hasard, prenait trois formes : test diagnostique des capacités intellectuelles, simple exercice de résolution de problèmes sans valeur diagnostique, ou exercice non diagnostique présenté comme un défi. La VD était la performance au test.<\/p><p>Les chercheurs faisaient l'hypothèse que la présentation diagnostique ferait baisser la performance des étudiants noirs, en activant un stéréotype négatif sur leur groupe, mais pas celle des étudiants blancs.<\/p><p style=\"font-size:0.85em;color:#555\">Steele, C. M., &amp; Aronson, J. (1995). Stereotype threat and the intellectual test performance of African Americans. <em>Journal of Personality and Social Psychology, 69<\/em>(5), 797–811. https://doi.org/10.1037/0022-3514.69.5.797<\/p>", "questions": [{"id": "S-007-q1", "difficulte": 1, "question_html": "<p>De quel plan s'agit-il ?<\/p>", "question_texte": "De quel plan s'agit-il ?", "feedback_general_html": "<p>Deux facteurs catégoriels inter-sujets sont croisés : le groupe des étudiants (2) et la présentation du test (3). CM03, section Factoriel.<\/p>", "options": [{"texte_html": "Un plan à mesures répétées à deux facteurs.", "score": -50.0, "feedback_html": "<p>Chaque participant n'appartient qu'à une cellule : aucun facteur n'est intra-sujet.<\/p>"}, {"texte_html": "Un plan croisé 2 × 3, avec deux facteurs inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. Groupe (2 modalités) × présentation (3 modalités), une seule cellule par participant.<\/p>"}, {"texte_html": "Un plan mixte 2 × 3.", "score": -30.0, "feedback_html": "<p>Un plan mixte demande un facteur intra-sujet ; ici, chaque participant ne voit qu'une présentation.<\/p>"}, {"texte_html": "Un plan simple à trois groupes.", "score": -20.0, "feedback_html": "<p>Il ignorerait le groupe des étudiants, qui est au cœur de l'hypothèse.<\/p>"}]}, {"id": "S-007-q2", "difficulte": 1, "question_html": "<p>Quel effet faut-il examiner pour tester l'hypothèse des chercheurs ?<\/p>", "question_texte": "Quel effet faut-il examiner pour tester l'hypothèse des chercheurs ?", "feedback_general_html": "<p>L'hypothèse dit que l'effet de la présentation dépend du groupe : c'est la définition d'une interaction. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal de la présentation du test.", "score": -30.0, "feedback_html": "<p>Il moyenne sur les deux groupes d'étudiants ; or l'hypothèse dit que l'effet dépend du groupe.<\/p>"}, {"texte_html": "L'effet principal du groupe des étudiants.", "score": -50.0, "feedback_html": "<p>Il moyenne sur les trois présentations et ne dit rien de leur effet.<\/p>"}, {"texte_html": "L'effet simple de la présentation chez les étudiants blancs.", "score": -20.0, "feedback_html": "<p>Il ne teste qu'une moitié de l'hypothèse.<\/p>"}, {"texte_html": "L'interaction entre le groupe des étudiants et la présentation du test.", "score": 100.0, "feedback_html": "<p>Exact. L'effet de la présentation dépendrait du groupe.<\/p>"}]}, {"id": "S-007-q3", "difficulte": 1, "question_html": "<p>Supposons que les résultats confirment l'hypothèse des chercheurs. On trace le graphique des moyennes, avec la présentation du test en abscisse et une courbe par groupe d'étudiants. À quoi faut-il s'attendre ?<\/p>", "question_texte": "Supposons que les résultats confirment l'hypothèse des chercheurs. On trace le graphique des moyennes, avec la présentation du test en abscisse et une courbe par groupe d'étudiants. À quoi faut-il s'attendre ?", "feedback_general_html": "<p>Une interaction se lit sur le graphique des moyennes : des courbes non parallèles. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Deux courbes non parallèles.", "score": 100.0, "feedback_html": "<p>Exact. Si l'effet de la présentation diffère selon le groupe, les courbes ne sont pas parallèles.<\/p>"}, {"texte_html": "Deux courbes parallèles et nettement écartées.", "score": -20.0, "feedback_html": "<p>Ce serait un effet principal du groupe, sans interaction.<\/p>"}, {"texte_html": "Deux courbes confondues.", "score": -30.0, "feedback_html": "<p>Ce serait l'absence d'effet du groupe.<\/p>"}, {"texte_html": "Deux courbes horizontales.", "score": -50.0, "feedback_html": "<p>Ce serait l'absence d'effet de la présentation.<\/p>"}]}, {"id": "S-007-q4", "difficulte": 2, "question_html": "<p>Les six cellules n'ont pas le même effectif, et l'interaction est l'objet principal de l'étude. Quel type de sommes des carrés choisir ?<\/p>", "question_texte": "Les six cellules n'ont pas le même effectif, et l'interaction est l'objet principal de l'étude. Quel type de sommes des carrés choisir ?", "feedback_general_html": "<p>Le type III est la référence pour tester une interaction dans un plan déséquilibré, et le réglage par défaut de Jamovi. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Le type I, car l'ordre des facteurs reflète leur importance théorique.", "score": -30.0, "feedback_html": "<p>Le type I dépend de l'ordre des facteurs, sans justification ici.<\/p>"}, {"texte_html": "Le type II, car il est le plus puissant pour les effets principaux.", "score": -20.0, "feedback_html": "<p>Le type II suppose une interaction négligeable, alors qu'elle est ici l'objet de l'étude.<\/p>"}, {"texte_html": "Le type III.", "score": 100.0, "feedback_html": "<p>Exact. C'est la référence pour tester une interaction, et le réglage par défaut de Jamovi.<\/p>"}, {"texte_html": "Peu importe : les trois types donnent les mêmes résultats dans un plan croisé.", "score": -50.0, "feedback_html": "<p>Avec des effectifs inégaux, les trois types diffèrent.<\/p>"}]}]}, {"id": "S-008", "type": "serie", "categorie": "choix", "cm": [2, 3, 6], "etude": {"titre": "Croire que l'intelligence se développe (plan mixte)"}, "etude_html": "<h4>Croire que l&#x27;intelligence se développe (plan mixte)<\/h4><p>Dans leur deuxième étude, Blackwell, Trzesniewski et Dweck (2007) ont suivi 91 élèves américains de 7th grade (environ 12 ans) dont les notes de mathématiques déclinaient. Tous ont suivi un atelier de huit séances sur les méthodes de travail. Pour 48 d'entre eux (groupe expérimental), l'atelier enseignait aussi que l'intelligence se développe par l'apprentissage ; les 43 autres (groupe contrôle) recevaient à la place une séance sur la mémoire.<\/p><p>Pour l'exercice, on retient trois relevés des notes de mathématiques : avant l'atelier, à la fin du premier semestre et à la fin de l'année.<\/p><p style=\"font-size:0.85em;color:#555\">Blackwell, L. S., Trzesniewski, K. H., &amp; Dweck, C. S. (2007). Implicit theories of intelligence predict achievement across an adolescent transition: A longitudinal study and an intervention. <em>Child Development, 78<\/em>(1), 246–263. https://doi.org/10.1111/j.1467-8624.2007.00995.x<\/p>", "questions": [{"id": "S-008-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour étudier l'évolution des notes dans les deux groupes ?<\/p>", "question_texte": "Quelle analyse convient pour étudier l'évolution des notes dans les deux groupes ?", "feedback_general_html": "<p>Les élèves appartiennent à un seul groupe (inter-sujets) mais sont notés trois fois (intra-sujet) : c'est un plan mixte. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une ANOVA pour plan croisé 2 × 3, avec deux facteurs inter-sujets.", "score": -20.0, "feedback_html": "<p>Elle ignore que les trois relevés portent sur les mêmes élèves.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées, avec un facteur à six modalités.", "score": -30.0, "feedback_html": "<p>Elle ignore que le groupe est inter-sujets : chaque élève n'est que dans un groupe.<\/p>"}, {"texte_html": "Une ANOVA simple comparant les deux groupes sur la moyenne des trois relevés.", "score": -50.0, "feedback_html": "<p>Elle supprime l'évolution dans le temps, qui est la question posée.<\/p>"}, {"texte_html": "Une ANOVA mixte, avec le groupe comme facteur inter-sujets et le moment du relevé comme facteur intra-sujet.", "score": 100.0, "feedback_html": "<p>Exact. Un seul groupe par élève, trois relevés par élève.<\/p>"}]}, {"id": "S-008-q2", "difficulte": 2, "question_html": "<p>Quel résultat indiquerait que le groupe expérimental a de meilleures notes à tous les relevés, y compris avant l'atelier, sans que leur évolution diffère de celle du groupe contrôle ?<\/p>", "question_texte": "Quel résultat indiquerait que le groupe expérimental a de meilleures notes à tous les relevés, y compris avant l'atelier, sans que leur évolution diffère de celle du groupe contrôle ?", "feedback_general_html": "<p>Un écart constant entre les groupes se traduit par un effet principal du groupe ; l'absence de différence d'évolution, par une interaction non significative. CM03, section Plans mixtes.<\/p>", "options": [{"texte_html": "Une interaction groupe × temps significative et un effet principal du groupe non significatif.", "score": -50.0, "feedback_html": "<p>Une interaction significative signalerait au contraire des évolutions différentes.<\/p>"}, {"texte_html": "Un effet principal du groupe significatif et une interaction groupe × temps non significative.", "score": 100.0, "feedback_html": "<p>Exact. Écart constant entre groupes : effet du groupe ; même évolution : pas d'interaction.<\/p>"}, {"texte_html": "Un effet principal du temps significatif, sans autre effet significatif.", "score": -20.0, "feedback_html": "<p>Cela décrirait une évolution commune aux deux groupes, sans écart entre eux.<\/p>"}, {"texte_html": "Un test de Mauchly significatif.", "score": -30.0, "feedback_html": "<p>Le test de Mauchly porte sur une condition d'application, pas sur les effets.<\/p>"}]}, {"id": "S-008-q3", "difficulte": 2, "question_html": "<p>Quelles conditions d'application propres à ce plan faut-il vérifier, en plus de l'indépendance et de la normalité ?<\/p>", "question_texte": "Quelles conditions d'application propres à ce plan faut-il vérifier, en plus de l'indépendance et de la normalité ?", "feedback_general_html": "<p>Dans un plan mixte, les conditions se cumulent : homogénéité des variances (Levene) pour la partie inter-sujets, sphéricité (Mauchly) pour la partie intra-sujet. CM03, section Plans mixtes, « Principe ».<\/p>", "options": [{"texte_html": "Seulement la sphéricité, car le temps est un facteur intra-sujet.", "score": -20.0, "feedback_html": "<p>Il faut aussi l'homogénéité des variances pour le facteur inter-sujets.<\/p>"}, {"texte_html": "Seulement l'homogénéité des variances, car le groupe est un facteur inter-sujets.", "score": -30.0, "feedback_html": "<p>Il faut aussi la sphéricité : le temps a trois modalités intra-sujet.<\/p>"}, {"texte_html": "L'homogénéité des variances pour le facteur groupe, et la sphéricité pour le facteur temps.", "score": 100.0, "feedback_html": "<p>Exact. Dans un plan mixte, les conditions se cumulent.<\/p>"}, {"texte_html": "Aucune, car l'ANOVA mixte est robuste.", "score": -50.0, "feedback_html": "<p>La robustesse de l'ANOVA ne dispense pas de vérifier les conditions.<\/p>"}]}, {"id": "S-008-q4", "difficulte": 3, "question_html": "<p>Si l'on n'avait retenu que deux relevés (avant et après l'atelier), que deviendrait la condition de sphéricité ?<\/p>", "question_texte": "Si l'on n'avait retenu que deux relevés (avant et après l'atelier), que deviendrait la condition de sphéricité ?", "feedback_general_html": "<p>La sphéricité compare les variances des différences entre paires de conditions. Avec deux modalités, il n'y a qu'une paire. CM02, section Formalisation ; CM06, section Désinformation.<\/p>", "options": [{"texte_html": "Elle n'aurait pas à être vérifiée : avec deux modalités, il n'existe qu'une seule différence entre conditions.", "score": 100.0, "feedback_html": "<p>Exact. Avec une seule paire de conditions, il n'y a rien à comparer.<\/p>"}, {"texte_html": "Il faudrait appliquer systématiquement la correction de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>Avec deux modalités, ε vaut toujours 1 : la correction ne changerait rien.<\/p>"}, {"texte_html": "Elle se vérifierait avec le test de Levene.", "score": -50.0, "feedback_html": "<p>Le test de Levene porte sur l'homogénéité des variances entre groupes, pas sur la sphéricité.<\/p>"}, {"texte_html": "Elle serait plus difficile à satisfaire qu'avec trois relevés.", "score": -20.0, "feedback_html": "<p>C'est l'inverse : avec deux modalités, elle est toujours satisfaite.<\/p>"}]}]}, {"id": "S-016", "type": "serie", "categorie": "choix", "cm": [1, 4], "etude": {"titre": "Le prix de l'entrée dans un groupe (plan simple, contrastes)"}, "etude_html": "<h4>Le prix de l&#x27;entrée dans un groupe (plan simple, contrastes)<\/h4><p>Aronson et Mills (1959) recrutaient des étudiantes volontaires pour participer à un groupe de discussion sur la psychologie de la sexualité. Avant d'y être admises, elles passaient une « épreuve d'entrée » qui variait selon la condition. Dans la condition <em>Sévère<\/em>, elles lisaient à voix haute une liste de mots obscènes et deux passages de romans décrivant des scènes sexuelles. Dans la condition <em>Légère<\/em>, elles lisaient à voix haute des mots en lien avec la sexualité, mais non obscènes. Dans la condition <em>Contrôle<\/em>, elles étaient admises sans épreuve. Toutes écoutaient ensuite le même enregistrement d'une discussion du groupe, volontairement ennuyeuse, puis évaluaient l'intérêt de la discussion et de ses membres. Les participantes de la condition <em>Sévère<\/em> jugeaient le groupe plus attrayant que les autres.<\/p><p>Pour l'exercice, on suppose 21 participantes par condition. Dans le fichier de données, la variable <em>Attrait<\/em> contient l'évaluation du groupe (plus elle est élevée, plus le groupe est jugé attrayant) et la variable <em>Initiation<\/em> indique la condition, avec les modalités rangées dans l'ordre <em>Contrôle<\/em>, <em>Légère<\/em>, <em>Sévère<\/em>. Avant l'étude, les chercheurs avaient formulé deux hypothèses : (1) une épreuve légère suffit à augmenter l'attrait par rapport à l'absence d'épreuve ; (2) l'épreuve sévère augmente l'attrait par rapport aux deux autres conditions réunies.<\/p><p style=\"font-size:0.85em;color:#555\">Aronson, E., &amp; Mills, J. (1959). The effect of severity of initiation on liking for a group. <em>Journal of Abnormal and Social Psychology, 59<\/em>(2), 177–181. https://doi.org/10.1037/h0047195<\/p>", "questions": [{"id": "S-016-q1", "difficulte": 1, "question_html": "<p>Quelle est la VI de cette étude ?<\/p>", "question_texte": "Quelle est la VI de cette étude ?", "feedback_general_html": "<p>La VI est la variable manipulée par les chercheurs : le type d'épreuve, à trois modalités. L'attrait est la VD. CM01, section Placebo, « Situation statistique ».<\/p>", "options": [{"texte_html": "Le type d'épreuve d'entrée (<em>Contrôle<\/em>, <em>Légère<\/em>, <em>Sévère<\/em>).", "score": 100.0, "feedback_html": "<p>Exact. C'est la variable manipulée, catégorielle à trois modalités.<\/p>"}, {"texte_html": "L'attrait du groupe de discussion.", "score": -20.0, "feedback_html": "<p>L'attrait est mesuré : c'est la VD.<\/p>"}, {"texte_html": "Le contenu de l'enregistrement.", "score": -30.0, "feedback_html": "<p>L'enregistrement est le même pour toutes : ce n'est pas une variable.<\/p>"}, {"texte_html": "Le nombre de participantes par condition.", "score": -50.0, "feedback_html": "<p>L'effectif décrit l'échantillon ; ce n'est pas une variable.<\/p>"}]}, {"id": "S-016-q2", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour tester l'effet du type d'épreuve sur l'attrait ?<\/p>", "question_texte": "Quelle analyse convient pour tester l'effet du type d'épreuve sur l'attrait ?", "feedback_general_html": "<p>Une VD numérique et un facteur inter-sujets à trois modalités : c'est le cas de l'ANOVA simple. CM01.<\/p>", "options": [{"texte_html": "Une ANOVA pour plan à mesures répétées.", "score": -30.0, "feedback_html": "<p>Chaque participante ne passe qu'une condition.<\/p>"}, {"texte_html": "Trois tests de Student, sans correction.", "score": -20.0, "feedback_html": "<p>Des tests sans correction augmenteraient le risque d'erreur de type I.<\/p>"}, {"texte_html": "Une ANOVA simple.", "score": 100.0, "feedback_html": "<p>Exact. Une VD numérique et un facteur inter-sujets à trois modalités.<\/p>"}, {"texte_html": "Une ANOVA mixte.", "score": -50.0, "feedback_html": "<p>Il n'y a qu'un facteur, inter-sujets.<\/p>"}]}, {"id": "S-016-q3", "difficulte": 3, "question_html": "<p>Les modalités étant rangées dans l'ordre <em>Contrôle<\/em>, <em>Légère<\/em>, <em>Sévère<\/em>, quel type de contraste prédéfini de Jamovi correspond exactement aux deux hypothèses des chercheurs ?<\/p>", "question_texte": "Les modalités étant rangées dans l'ordre *Contrôle*, *Légère*, *Sévère*, quel type de contraste prédéfini de Jamovi correspond exactement aux deux hypothèses des chercheurs ?", "feedback_general_html": "<p><em>difference<\/em> compare chaque niveau, sauf le premier, à la moyenne des niveaux qui le précèdent. CM04, section Exemples de contrastes.<\/p>", "options": [{"texte_html": "<em>simple<\/em>", "score": -20.0, "feedback_html": "<p><em>simple<\/em> comparerait <em>Légère<\/em> et <em>Sévère<\/em> chacune à <em>Contrôle<\/em> : la seconde comparaison ne correspond pas à l'hypothèse 2.<\/p>"}, {"texte_html": "<em>repeated<\/em>", "score": -30.0, "feedback_html": "<p><em>repeated<\/em> comparerait <em>Sévère<\/em> à <em>Légère<\/em> seulement, pas à la moyenne des deux autres.<\/p>"}, {"texte_html": "<em>polynomial<\/em>", "score": -50.0, "feedback_html": "<p><em>polynomial<\/em> teste des tendances, pas ces comparaisons.<\/p>"}, {"texte_html": "<em>difference<\/em>", "score": 100.0, "feedback_html": "<p>Exact. <em>Légère<\/em> contre <em>Contrôle<\/em>, puis <em>Sévère<\/em> contre la moyenne de <em>Contrôle<\/em> et <em>Légère<\/em>.<\/p>"}]}, {"id": "S-016-q4", "difficulte": 2, "question_html": "<p>Les deux contrastes s'écrivent c1 = (1, −1, 0) et c2 = (1, 1, −2). Les groupes ont le même effectif. Que peut-on en dire ?<\/p>", "question_texte": "Les deux contrastes s'écrivent c1 = (1, −1, 0) et c2 = (1, 1, −2). Les groupes ont le même effectif. Que peut-on en dire ?", "feedback_general_html": "<p>1 × 1 + (−1) × 1 + 0 × (−2) = 0 : les deux contrastes sont orthogonaux et portent des informations indépendantes. CM04, section Contrastes, « Contrastes orthogonaux ».<\/p>", "options": [{"texte_html": "Ils ne sont pas orthogonaux, car leurs coefficients sont différents.", "score": -30.0, "feedback_html": "<p>Des coefficients différents n'empêchent pas l'orthogonalité : c'est la somme des produits qui compte.<\/p>"}, {"texte_html": "Ils sont orthogonaux, car la somme des produits de leurs coefficients est nulle.", "score": 100.0, "feedback_html": "<p>Exact. 1 × 1 + (−1) × 1 + 0 × (−2) = 0.<\/p>"}, {"texte_html": "Ce ne sont pas des contrastes, car leurs coefficients ne sont pas tous positifs.", "score": -50.0, "feedback_html": "<p>Un contraste a forcément des coefficients positifs et négatifs, de somme nulle.<\/p>"}, {"texte_html": "Ils sont orthogonaux, car chacun comporte trois coefficients.", "score": -20.0, "feedback_html": "<p>La conclusion est juste, mais pas la raison : c'est la somme des produits des coefficients qui doit être nulle.<\/p>"}]}, {"id": "S-016-q5", "difficulte": 2, "question_html": "<p>Quelle est l'hypothèse nulle testée par le contraste c2 = (1, 1, −2) ?<\/p>", "question_texte": "Quelle est l'hypothèse nulle testée par le contraste c2 = (1, 1, −2) ?", "feedback_general_html": "<p>Le contraste vaut 0 si et seulement si 2 × moyenne(<em>Sévère<\/em>) = moyenne(<em>Contrôle<\/em>) + moyenne(<em>Légère<\/em>). CM04, section Contrastes, « Exemple 2 ».<\/p>", "options": [{"texte_html": "La moyenne de la condition <em>Sévère<\/em> est égale à la moyenne des moyennes des conditions <em>Contrôle<\/em> et <em>Légère<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Le contraste vaut 0 si et seulement si 2 × moyenne(<em>Sévère<\/em>) = moyenne(<em>Contrôle<\/em>) + moyenne(<em>Légère<\/em>).<\/p>"}, {"texte_html": "Les trois moyennes sont égales.", "score": -30.0, "feedback_html": "<p>C'est l'hypothèse nulle de l'ANOVA globale.<\/p>"}, {"texte_html": "La moyenne de la condition <em>Sévère<\/em> est supérieure à celle des deux autres.", "score": -20.0, "feedback_html": "<p>C'est l'hypothèse des chercheurs, pas l'hypothèse nulle.<\/p>"}, {"texte_html": "La moyenne de la condition <em>Sévère<\/em> vaut le double de celle de la condition <em>Contrôle<\/em>.", "score": -50.0, "feedback_html": "<p>Le coefficient −2 sert à équilibrer la somme ; il ne compare pas <em>Sévère<\/em> au double de <em>Contrôle<\/em>.<\/p>"}]}, {"id": "S-016-q6", "difficulte": 1, "question_html": "<p>Dans Jamovi (Analyses → ANOVA → ANOVA), où choisit-on ce contraste ?<\/p>", "question_texte": "Dans Jamovi (Analyses → ANOVA → ANOVA), où choisit-on ce contraste ?", "feedback_general_html": "<p>La section <em>Contrasts<\/em> propose les contrastes prédéfinis (<em>deviation<\/em>, <em>simple<\/em>, <em>difference<\/em>, <em>Helmert<\/em>, <em>repeated<\/em>, <em>polynomial<\/em>) pour chaque facteur. CM04, section Contrastes, « Avec Jamovi ».<\/p>", "options": [{"texte_html": "Dans la section <em>Post Hoc Tests<\/em>.", "score": -20.0, "feedback_html": "<p><em>Post Hoc Tests<\/em> sert aux comparaisons non planifiées.<\/p>"}, {"texte_html": "Dans la section <em>Assumption Checks<\/em>.", "score": -50.0, "feedback_html": "<p><em>Assumption Checks<\/em> sert aux conditions d'application.<\/p>"}, {"texte_html": "Dans la section <em>Contrasts<\/em>, en choisissant le type de contraste pour le facteur <em>Initiation<\/em>.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Dans la section <em>Model<\/em>, en ajoutant un terme au modèle.", "score": -30.0, "feedback_html": "<p><em>Model<\/em> définit les effets du modèle, pas les contrastes.<\/p>"}]}, {"id": "S-016-q7", "difficulte": 2, "question_html": "<p>Un collègue propose plutôt de comparer toutes les paires de conditions par des tests post-hoc avec la correction de Tukey. Pourquoi les contrastes sont-ils préférables ici ?<\/p>", "question_texte": "Un collègue propose plutôt de comparer toutes les paires de conditions par des tests post-hoc avec la correction de Tukey. Pourquoi les contrastes sont-ils préférables ici ?", "feedback_general_html": "<p>Quand une prédiction est formulée à l'avance, le contraste planifié est plus ciblé et plus puissant que des comparaisons de toutes les paires. CM04, section Contrastes, « Attention ».<\/p>", "options": [{"texte_html": "Parce que la correction de Tukey n'est pas disponible dans Jamovi.", "score": -50.0, "feedback_html": "<p>Tukey est bien disponible dans Jamovi.<\/p>"}, {"texte_html": "Parce que les tests post-hoc exigent des groupes d'effectifs inégaux.", "score": -30.0, "feedback_html": "<p>Les tests post-hoc n'exigent rien de tel.<\/p>"}, {"texte_html": "Parce que les contrastes n'ont aucune condition d'application.", "score": -20.0, "feedback_html": "<p>Les contrastes reposent sur les mêmes conditions d'application que l'ANOVA.<\/p>"}, {"texte_html": "Parce que les hypothèses ont été formulées avant l'analyse : les contrastes les testent directement, avec plus de puissance.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}]}, {"id": "S-017", "type": "serie", "categorie": "choix", "cm": [1, 3, 4], "etude": {"titre": "Juger une élève d'après son milieu (plan croisé)"}, "etude_html": "<h4>Juger une élève d&#x27;après son milieu (plan croisé)<\/h4><p>Darley et Gross (1983) présentaient à des étudiants une vidéo d'environ 6 minutes montrant Hannah, une fillette en classe de CM1. Selon la condition, la vidéo et une fiche suggéraient un milieu social <em>Favorisé<\/em> (quartier résidentiel, parents diplômés de l'université) ou <em>Défavorisé<\/em> (quartier urbain dégradé, parents sans études supérieures). Ensuite, la moitié des participants de chaque condition regardaient une seconde vidéo de 12 minutes, où Hannah répondait à des problèmes scolaires de difficulté variée, avec une performance volontairement ambiguë ; l'autre moitié ne voyait pas cette seconde vidéo. Tous estimaient enfin le niveau scolaire d'Hannah. Sans la seconde vidéo, les deux conditions donnaient des estimations proches ; avec elle, les participants qui croyaient Hannah issue d'un milieu favorisé la jugeaient au-dessus de son niveau, et les autres en dessous.<\/p><p>Pour l'exercice, on suppose 15 participants par combinaison de conditions. Dans le fichier de données, la variable <em>Niveau<\/em> contient le niveau scolaire estimé, la variable <em>Milieu<\/em> le milieu présenté (<em>Favorisé<\/em>, <em>Défavorisé<\/em>), et la variable <em>Performance<\/em> indique si la seconde vidéo a été vue (<em>Vue<\/em>, <em>Non vue<\/em>).<\/p><p style=\"font-size:0.85em;color:#555\">Darley, J. M., &amp; Gross, P. H. (1983). A hypothesis-confirming bias in labeling effects. <em>Journal of Personality and Social Psychology, 44<\/em>(1), 20–33. https://doi.org/10.1037/0022-3514.44.1.20<\/p>", "questions": [{"id": "S-017-q1", "difficulte": 1, "question_html": "<p>Quelle analyse convient pour cette étude ?<\/p>", "question_texte": "Quelle analyse convient pour cette étude ?", "feedback_general_html": "<p>Deux facteurs (<em>Milieu<\/em>, <em>Performance<\/em>), chacun à deux modalités ; chaque participant ne connaît qu'une combinaison : plan croisé 2 × 2 à groupes indépendants. CM03, section Factoriel.<\/p>", "options": [{"texte_html": "Une ANOVA mixte.", "score": -30.0, "feedback_html": "<p>Aucun facteur n'est intra-sujet : chaque participant ne connaît qu'une combinaison.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé, avec deux facteurs inter-sujets.", "score": 100.0, "feedback_html": "<p>Exact. 2 × 2 = 4 groupes indépendants.<\/p>"}, {"texte_html": "Une ANOVA simple à deux groupes.", "score": -20.0, "feedback_html": "<p>Elle ignorerait l'un des deux facteurs.<\/p>"}, {"texte_html": "Une ANOVA pour plan à mesures répétées.", "score": -50.0, "feedback_html": "<p>Aucun facteur n'est intra-sujet.<\/p>"}]}, {"id": "S-017-q2", "difficulte": 2, "question_html": "<p>Dans Jamovi (Analyses → ANOVA → ANOVA), comment remplir les cases ?<\/p>", "question_texte": "Dans Jamovi (Analyses → ANOVA → ANOVA), comment remplir les cases ?", "feedback_general_html": "<p>La VD numérique va dans <em>Dependent Variable<\/em>, les deux facteurs inter-sujets dans <em>Fixed Factors<\/em>. CM01, section Conditions, « Jamovi » ; CM03.<\/p>", "options": [{"texte_html": "<em>Niveau<\/em> dans <em>Dependent Variable<\/em> ; <em>Milieu<\/em> et <em>Performance<\/em> dans <em>Fixed Factors<\/em> (facteurs fixes).", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "<em>Milieu<\/em> dans <em>Dependent Variable<\/em> ; <em>Niveau<\/em> et <em>Performance<\/em> dans <em>Fixed Factors<\/em>.", "score": -50.0, "feedback_html": "<p><em>Milieu<\/em> est un facteur, et <em>Niveau<\/em> est la VD numérique.<\/p>"}, {"texte_html": "<em>Niveau<\/em> dans <em>Dependent Variable<\/em> et <em>Milieu<\/em> dans <em>Fixed Factors<\/em> ; <em>Performance<\/em> n'est pas utilisée, car elle ne concerne que la moitié des participants.", "score": -20.0, "feedback_html": "<p><em>Performance<\/em> concerne bien tous les participants : la moitié l'ont vue, l'autre non.<\/p>"}, {"texte_html": "<em>Niveau<\/em> et <em>Performance<\/em> dans <em>Dependent Variable<\/em> ; <em>Milieu<\/em> dans <em>Fixed Factors<\/em>.", "score": -30.0, "feedback_html": "<p><em>Performance<\/em> est un facteur, pas une VD.<\/p>"}]}, {"id": "S-017-q3", "difficulte": 2, "question_html": "<p>Les auteurs pensent que l'information sur le milieu social n'influence le jugement que lorsqu'on a vu Hannah résoudre des problèmes. Quel effet teste cette hypothèse ?<\/p>", "question_texte": "Les auteurs pensent que l'information sur le milieu social n'influence le jugement que lorsqu'on a vu Hannah résoudre des problèmes. Quel effet teste cette hypothèse ?", "feedback_general_html": "<p>L'hypothèse dit que l'effet du milieu dépend de la performance vue : c'est la définition d'une interaction. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "L'effet principal du milieu.", "score": -30.0, "feedback_html": "<p>Il moyenne sur les deux niveaux de <em>Performance<\/em>.<\/p>"}, {"texte_html": "L'effet principal de la performance.", "score": -50.0, "feedback_html": "<p>Il ne dit rien de l'effet du milieu.<\/p>"}, {"texte_html": "L'effet simple du milieu chez les participants qui n'ont pas vu la seconde vidéo.", "score": -20.0, "feedback_html": "<p>Il n'examine qu'une partie de l'hypothèse.<\/p>"}, {"texte_html": "L'interaction <em>Milieu<\/em> × <em>Performance<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. L'effet du milieu dépendrait de la performance vue.<\/p>"}]}, {"id": "S-017-q4", "difficulte": 1, "question_html": "<p>Comment appelle-t-on l'effet du milieu social chez les seuls participants qui ont vu la seconde vidéo ?<\/p>", "question_texte": "Comment appelle-t-on l'effet du milieu social chez les seuls participants qui ont vu la seconde vidéo ?", "feedback_general_html": "<p>Un effet simple est l'effet d'un facteur pour un niveau fixé de l'autre facteur. CM03, section Factoriel, « Principe ».<\/p>", "options": [{"texte_html": "Un effet principal.", "score": -20.0, "feedback_html": "<p>L'effet principal du milieu serait moyenné sur les deux niveaux de <em>Performance<\/em>.<\/p>"}, {"texte_html": "Une interaction.", "score": -30.0, "feedback_html": "<p>L'interaction compare l'effet du milieu entre les deux niveaux de <em>Performance<\/em>.<\/p>"}, {"texte_html": "Un effet simple.", "score": 100.0, "feedback_html": "<p>Exact. L'effet d'un facteur pour un niveau fixé de l'autre.<\/p>"}, {"texte_html": "Un paradoxe de Simpson.", "score": -50.0, "feedback_html": "<p>Le paradoxe de Simpson désigne l'inversion d'un effet à l'agrégation.<\/p>"}]}, {"id": "S-017-q5", "difficulte": 2, "question_html": "<p>Supposons que l'interaction et l'effet principal du milieu soient tous deux significatifs. Comment interpréter l'effet principal du milieu ?<\/p>", "question_texte": "Supposons que l'interaction et l'effet principal du milieu soient tous deux significatifs. Comment interpréter l'effet principal du milieu ?", "feedback_general_html": "<p>Quand l'interaction est significative, l'effet principal, qui fait la moyenne, peut être trompeur : on interprète d'abord les effets simples. CM03, section Compléments, « Complément sur l'interaction ».<\/p>", "options": [{"texte_html": "Comme la preuve que le milieu influence le jugement dans toutes les conditions.", "score": -20.0, "feedback_html": "<p>L'interaction montre que l'effet du milieu n'est pas le même dans les deux conditions de performance.<\/p>"}, {"texte_html": "Avec prudence : il moyenne deux situations très différentes, et il faut d'abord examiner les effets simples.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "Il faut l'ignorer et retirer le facteur <em>Milieu<\/em> du modèle.", "score": -30.0, "feedback_html": "<p>Retirer le facteur supprimerait aussi l'interaction qui teste l'hypothèse.<\/p>"}, {"texte_html": "Comme la preuve que la performance vue n'a aucun effet.", "score": -50.0, "feedback_html": "<p>L'effet du milieu ne dit rien de l'effet de la performance.<\/p>"}]}, {"id": "S-017-q6", "difficulte": 3, "question_html": "<p>Quelques participants ont été exclus, si bien que les quatre groupes n'ont plus le même effectif. L'interaction étant l'objet principal de l'étude, quel type de sommes des carrés faut-il choisir ?<\/p>", "question_texte": "Quelques participants ont été exclus, si bien que les quatre groupes n'ont plus le même effectif. L'interaction étant l'objet principal de l'étude, quel type de sommes des carrés faut-il choisir ?", "feedback_general_html": "<p>Avec des groupes déséquilibrés, le choix compte. Le type III est la référence quand l'interaction est l'objet de l'étude. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Le type I, car les groupes sont déséquilibrés.", "score": -30.0, "feedback_html": "<p>Le type I suppose une hiérarchie entre les facteurs, sans justification ici.<\/p>"}, {"texte_html": "Le type II, car c'est le plus puissant.", "score": -20.0, "feedback_html": "<p>Le type II n'est indiqué que si l'interaction n'est pas significative ou pas l'objet principal.<\/p>"}, {"texte_html": "Peu importe : le type de sommes des carrés ne change jamais rien dans un plan croisé.", "score": -50.0, "feedback_html": "<p>Avec des groupes déséquilibrés, le choix compte.<\/p>"}, {"texte_html": "Le type III, réglage par défaut et référence pour tester une interaction.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "S-017-q7", "difficulte": 1, "question_html": "<p>Si l'hypothèse des auteurs est juste, à quoi devrait ressembler le graphique des moyennes, avec <em>Performance<\/em> en abscisse (<em>Non vue<\/em>, puis <em>Vue<\/em>) et une courbe par milieu ?<\/p>", "question_texte": "Si l'hypothèse des auteurs est juste, à quoi devrait ressembler le graphique des moyennes, avec *Performance* en abscisse (*Non vue*, puis *Vue*) et une courbe par milieu ?", "feedback_general_html": "<p>Sans la seconde vidéo, les deux milieux reçoivent des estimations proches ; avec elle, l'écart se creuse : les courbes ne sont pas parallèles. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Deux courbes proches pour <em>Non vue<\/em>, qui s'écartent pour <em>Vue<\/em>.", "score": 100.0, "feedback_html": "<p>Exact. Les courbes ne sont pas parallèles : c'est l'interaction attendue.<\/p>"}, {"texte_html": "Deux courbes parallèles et nettement écartées.", "score": -20.0, "feedback_html": "<p>Des courbes parallèles indiqueraient l'absence d'interaction.<\/p>"}, {"texte_html": "Deux courbes confondues sur toute la largeur.", "score": -30.0, "feedback_html": "<p>Ce serait l'absence de tout effet du milieu.<\/p>"}, {"texte_html": "Deux courbes parallèles et horizontales.", "score": -50.0, "feedback_html": "<p>Ce serait l'absence d'interaction et d'effet de la performance.<\/p>"}]}]}, {"id": "C-CM1-004", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Une chercheuse compare quatre groupes indépendants. Elle hésite entre une ANOVA et les six tests de Student possibles, chacun au seuil de 5 %. Quelle raison justifie le choix de l'ANOVA ?<\/p>", "question_texte": "Une chercheuse compare quatre groupes indépendants. Elle hésite entre une ANOVA et les six tests de Student possibles, chacun au seuil de 5 %. Quelle raison justifie le choix de l'ANOVA ?", "feedback_general_html": "<p>Multiplier les tests augmente le risque d'erreur de type I : 1 − 0,95⁶ ≈ 0,26. L'ANOVA teste toutes les moyennes en un seul test. CM01, section Placebo.<\/p>", "options": [{"texte_html": "Le test de Student ne s'applique pas à des groupes indépendants.", "score": -30.0, "feedback_html": "<p>Le test de Student pour échantillons indépendants existe. Le problème est la multiplication des tests.<\/p>"}, {"texte_html": "L'ANOVA indique directement quels groupes diffèrent.", "score": -20.0, "feedback_html": "<p>Un F significatif dit qu'une différence existe, pas laquelle : il faut ensuite des comparaisons post-hoc ou des contrastes.<\/p>"}, {"texte_html": "Avec six tests au seuil de 5 %, le risque de commettre au moins une erreur de type I, si aucune différence n'existe, dépasse 20 %.", "score": 100.0, "feedback_html": "<p>Exact. 1 − 0,95⁶ ≈ 0,26 ; l'ANOVA contrôle ce risque en un seul test.<\/p>"}, {"texte_html": "L'ANOVA reste valable même si les observations ne sont pas indépendantes.", "score": -50.0, "feedback_html": "<p>L'indépendance des observations est une condition d'application de l'ANOVA.<\/p>"}]}, {"id": "C-CM1-005", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Une ANOVA simple sur quatre groupes donne F(3, 56) = 9,4, p &lt; 0,001. Que peut-on conclure ?<\/p>", "question_texte": "Une ANOVA simple sur quatre groupes donne F(3, 56) = 9,4, p < 0,001. Que peut-on conclure ?", "feedback_general_html": "<p>Un F significatif dit qu'une différence existe, pas laquelle ni de quelle taille. CM01, sections Philosophie et Conditions.<\/p>", "options": [{"texte_html": "Les moyennes des quatre groupes ne sont pas toutes égales.", "score": 100.0, "feedback_html": "<p>Exact. C'est exactement l'hypothèse H1.<\/p>"}, {"texte_html": "Les quatre moyennes diffèrent toutes deux à deux.", "score": -20.0, "feedback_html": "<p>Un F significatif dit qu'au moins une différence existe, pas que toutes les paires diffèrent.<\/p>"}, {"texte_html": "L'effet est important, puisque p est très petit.", "score": -30.0, "feedback_html": "<p>La valeur p ne mesure pas la taille de l'effet : il faut une taille d'effet (CM05).<\/p>"}, {"texte_html": "Les conditions d'application de l'ANOVA sont vérifiées.", "score": -50.0, "feedback_html": "<p>Les conditions se vérifient à part, avec les tests de Shapiro-Wilk et de Levene.<\/p>"}]}, {"id": "C-CM1-006", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une ANOVA simple à trois groupes de 15 participants, le test de Levene donne p = 0,003. Que faire, selon le cours ?<\/p>", "question_texte": "Dans une ANOVA simple à trois groupes de 15 participants, le test de Levene donne p = 0,003. Que faire, selon le cours ?", "feedback_general_html": "<p>Le test de Levene a pour H0 l'égalité des variances ; ici elle est rejetée. La correction de Welch permet de garder l'analyse. CM01, section Conditions.<\/p>", "options": [{"texte_html": "Renoncer à l'ANOVA, puisque ses conditions ne sont pas remplies.", "score": -20.0, "feedback_html": "<p>L'égalité des variances est bien rejetée, mais on n'abandonne pas l'analyse : une correction existe.<\/p>"}, {"texte_html": "Appliquer la correction de Greenhouse-Geisser.", "score": -30.0, "feedback_html": "<p>Greenhouse-Geisser corrige un défaut de sphéricité en mesures répétées, pas des variances inégales entre groupes indépendants.<\/p>"}, {"texte_html": "Conclure que le facteur a un effet significatif sur la VD.", "score": -50.0, "feedback_html": "<p>Le test de Levene ne teste pas l'effet du facteur, mais l'égalité des variances.<\/p>"}, {"texte_html": "Utiliser la correction de Welch.", "score": 100.0, "feedback_html": "<p>Exact. Welch modifie les degrés de liberté pour tenir compte des variances inégales.<\/p>"}]}, {"id": "C-CM1-010", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Avec seulement deux groupes indépendants, à quel test une ANOVA simple est-elle équivalente ?<\/p>", "question_texte": "Avec seulement deux groupes indépendants, à quel test une ANOVA simple est-elle équivalente ?", "feedback_general_html": "<p>L'ANOVA simple généralise le test de Student pour échantillons indépendants ; avec deux groupes, les deux tests donnent la même conclusion. CM01, section Placebo, « Retenir ».<\/p>", "options": [{"texte_html": "Au test de Levene.", "score": -50.0, "feedback_html": "<p>Le test de Levene vérifie une condition d'application ; il ne compare pas les moyennes.<\/p>"}, {"texte_html": "Au test de Student pour échantillons indépendants.", "score": 100.0, "feedback_html": "<p>Exact. Avec deux groupes, les deux tests donnent la même conclusion.<\/p>"}, {"texte_html": "Au test de Student pour échantillons appariés.", "score": -20.0, "feedback_html": "<p>Le test pour échantillons appariés concerne des mesures répétées, pas des groupes indépendants.<\/p>"}, {"texte_html": "Au test de Mauchly.", "score": -30.0, "feedback_html": "<p>Le test de Mauchly vérifie la sphéricité ; il ne compare pas les moyennes.<\/p>"}]}, {"id": "C-CM1-011", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Un chercheur compare 4 groupes à l'aide de 6 tests de Student, chacun au seuil de 0,05. Si, en réalité, aucune différence n'existe entre les groupes, que devient le risque de conclure à tort à au moins une différence ?<\/p>", "question_texte": "Un chercheur compare 4 groupes à l'aide de 6 tests de Student, chacun au seuil de 0,05. Si, en réalité, aucune différence n'existe entre les groupes, que devient le risque de conclure à tort à au moins une différence ?", "feedback_general_html": "<p>Le risque global vaut à peu près 1 − (1 − 0,05)⁶ ≈ 0,26. C'est pour cela qu'on préfère l'ANOVA, ou qu'on corrige les comparaisons multiples. CM01, section Placebo, « Student ».<\/p>", "options": [{"texte_html": "Il reste égal à 0,05.", "score": -20.0, "feedback_html": "<p>Chaque test a un risque de 0,05 ; en les multipliant, le risque global augmente.<\/p>"}, {"texte_html": "Il devient nul, puisque les tests se compensent.", "score": -50.0, "feedback_html": "<p>Les tests ne se compensent pas : chacun ajoute une occasion de se tromper.<\/p>"}, {"texte_html": "Il devient égal à 0,05 / 6.", "score": -30.0, "feedback_html": "<p>0,05 / 6 est le seuil que la correction de Bonferroni appliquerait à chaque test, pas le risque global.<\/p>"}, {"texte_html": "Il dépasse nettement 0,05 (environ 0,26).", "score": 100.0, "feedback_html": "<p>Exact. 1 − (1 − 0,05)⁶ ≈ 0,26.<\/p>"}]}, {"id": "C-CM1-012", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Une ANOVA simple donne η² = 0,20. Que signifie cette valeur ?<\/p>", "question_texte": "Une ANOVA simple donne η² = 0,20. Que signifie cette valeur ?", "feedback_general_html": "<p>η² = SC inter / SC total : c'est la proportion de la variation de la VD attribuable au facteur. CM01, section Compléments, « La taille d'effet ».<\/p>", "options": [{"texte_html": "Le facteur explique 20 % de la variation de la VD.", "score": 100.0, "feedback_html": "<p>Exact. η² = SC inter / SC total.<\/p>"}, {"texte_html": "La probabilité que l'hypothèse nulle soit vraie est de 20 %.", "score": -50.0, "feedback_html": "<p>η² n'est pas une probabilité.<\/p>"}, {"texte_html": "Les moyennes des groupes diffèrent de 20 %.", "score": -20.0, "feedback_html": "<p>η² est une proportion de variation, pas un écart entre moyennes.<\/p>"}, {"texte_html": "20 % des participants sont sensibles au facteur.", "score": -30.0, "feedback_html": "<p>η² ne porte pas sur une proportion de participants.<\/p>"}]}, {"id": "C-CM1-013", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Le cours présente l'ANOVA comme une méthode robuste. Que signifie cette expression ?<\/p>", "question_texte": "Le cours présente l'ANOVA comme une méthode robuste. Que signifie cette expression ?", "feedback_general_html": "<p>La robustesse concerne surtout la normalité et, dans une moindre mesure, l'homogénéité des variances. Elle ne s'étend pas à l'indépendance des observations. CM01, section Conditions.<\/p>", "options": [{"texte_html": "Elle donne toujours un résultat significatif quand un effet existe.", "score": -50.0, "feedback_html": "<p>Un effet réel peut ne pas être détecté, faute de puissance.<\/p>"}, {"texte_html": "Elle n'a aucune condition d'application.", "score": -30.0, "feedback_html": "<p>L'ANOVA a bien des conditions d'application.<\/p>"}, {"texte_html": "Une violation modérée de ses conditions d'application a souvent un effet négligeable sur les résultats.", "score": 100.0, "feedback_html": "<p>Exact. Surtout pour la normalité, et dans une moindre mesure l'homogénéité des variances.<\/p>"}, {"texte_html": "Elle reste valable même lorsque les observations ne sont pas indépendantes.", "score": -20.0, "feedback_html": "<p>La robustesse ne s'étend pas à l'indépendance, dont le défaut remet en cause l'ensemble des résultats.<\/p>"}]}, {"id": "C-CM1-014", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 2, "question_html": "<p>Dans laquelle des situations suivantes l'indépendance des observations est-elle la plus menacée ?<\/p>", "question_texte": "Dans laquelle des situations suivantes l'indépendance des observations est-elle la plus menacée ?", "feedback_general_html": "<p>Des participants qui s'influencent mutuellement ne fournissent pas des observations indépendantes : le cours met en garde contre les passations collectives. CM01, section Conditions, « Indépendance ».<\/p>", "options": [{"texte_html": "Les groupes n'ont pas tous le même effectif.", "score": -20.0, "feedback_html": "<p>Des effectifs inégaux sont acceptables ; ils ne créent pas de dépendance entre observations.<\/p>"}, {"texte_html": "La VD ne suit pas exactement une loi normale.", "score": -30.0, "feedback_html": "<p>La normalité est une autre condition.<\/p>"}, {"texte_html": "Les participants d'un même groupe passent l'épreuve ensemble, dans la même salle, et peuvent échanger leurs réponses.", "score": 100.0, "feedback_html": "<p>Exact. Des participants qui s'influencent ne fournissent pas des observations indépendantes.<\/p>"}, {"texte_html": "Les participants ont été répartis au hasard entre les groupes.", "score": -50.0, "feedback_html": "<p>La répartition au hasard favorise au contraire l'indépendance.<\/p>"}]}, {"id": "C-CM1-015", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Avec la correction de Bonferroni, quel seuil faut-il appliquer à chacune de 5 comparaisons pour garder un risque global de 0,05 ?<\/p>", "question_texte": "Avec la correction de Bonferroni, quel seuil faut-il appliquer à chacune de 5 comparaisons pour garder un risque global de 0,05 ?", "feedback_general_html": "<p>Bonferroni divise le risque α par le nombre de comparaisons c : 0,05 / 5 = 0,01. CM01, section Compléments, « Comparaisons post-hoc ».<\/p>", "options": [{"texte_html": "0,01", "score": 100.0, "feedback_html": "<p>Exact. 0,05 / 5 = 0,01.<\/p>"}, {"texte_html": "0,05", "score": -30.0, "feedback_html": "<p>Garder 0,05 pour chaque comparaison ferait monter le risque global.<\/p>"}, {"texte_html": "0,25", "score": -50.0, "feedback_html": "<p>0,25 = 0,05 × 5 : c'est l'inverse de la correction.<\/p>"}, {"texte_html": "0,005", "score": -20.0, "feedback_html": "<p>Ce serait le seuil pour 10 comparaisons.<\/p>"}]}, {"id": "C-CM1-016", "type": "question", "categorie": "comprehension", "cm": [1], "difficulte": 1, "question_html": "<p>Dans une étude sur une thérapie, le groupe témoin, qui ne reçoit rien, voit pourtant ses symptômes s'améliorer en moyenne. Comment l'expliquer ?<\/p>", "question_texte": "Dans une étude sur une thérapie, le groupe témoin, qui ne reçoit rien, voit pourtant ses symptômes s'améliorer en moyenne. Comment l'expliquer ?", "feedback_general_html": "<p>Même sans traitement, on s'attend à une amélioration : effets non spécifiques (attention reçue, attentes…) et régression vers la moyenne. CM01, section Placebo, « Attention ».<\/p>", "options": [{"texte_html": "Par des effets non spécifiques et par la régression vers la moyenne.", "score": 100.0, "feedback_html": "<p>Exact. C'est pourquoi on compare la thérapie à un groupe témoin plutôt qu'à zéro.<\/p>"}, {"texte_html": "Par une erreur du test de Levene.", "score": -50.0, "feedback_html": "<p>Le test de Levene vérifie l'égalité des variances ; il n'explique pas une évolution des moyennes.<\/p>"}, {"texte_html": "Par le fait que l'ANOVA surestime toujours les améliorations.", "score": -30.0, "feedback_html": "<p>L'amélioration est observée dans les données, avant toute analyse.<\/p>"}, {"texte_html": "Par la taille trop réduite du groupe témoin.", "score": -20.0, "feedback_html": "<p>Un petit groupe rend l'estimation imprécise, mais n'explique pas une amélioration systématique.<\/p>"}]}, {"id": "C-CM2-004", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Dans une ANOVA pour plan à mesures répétées, la condition de sphéricité porte sur :<\/p>", "question_texte": "Dans une ANOVA pour plan à mesures répétées, la condition de sphéricité porte sur :", "feedback_general_html": "<p>La sphéricité porte sur les variances des différences entre conditions, pas sur les variances des conditions elles-mêmes. CM02, section Formalisation.<\/p>", "options": [{"texte_html": "l'égalité des variances de la VD dans chaque condition.", "score": -20.0, "feedback_html": "<p>C'est l'homogénéité des variances. La sphéricité porte sur les variances des différences entre conditions.<\/p>"}, {"texte_html": "la normalité des résidus.", "score": -30.0, "feedback_html": "<p>La normalité est une autre condition d'application.<\/p>"}, {"texte_html": "l'égalité des variances des différences entre toutes les paires de conditions.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}, {"texte_html": "l'indépendance des mesures prises sur un même participant.", "score": -50.0, "feedback_html": "<p>Les mesures d'un même participant ne sont justement pas indépendantes ; l'indépendance porte sur les participants.<\/p>"}]}, {"id": "C-CM2-005", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 2, "question_html": "<p>Pourquoi un plan à mesures répétées est-il en général plus puissant qu'un plan à groupes indépendants ?<\/p>", "question_texte": "Pourquoi un plan à mesures répétées est-il en général plus puissant qu'un plan à groupes indépendants ?", "feedback_general_html": "<p>Chaque participant sert de point de comparaison à lui-même : les différences individuelles stables sortent du terme d'erreur. CM02, section Équiprobabilité, « A retenir ».<\/p>", "options": [{"texte_html": "Parce que la sphéricité y est toujours vérifiée.", "score": -30.0, "feedback_html": "<p>La sphéricité n'est jamais garantie : c'est pour cela qu'on la teste.<\/p>"}, {"texte_html": "Parce que les participants s'améliorent d'une mesure à l'autre.", "score": -20.0, "feedback_html": "<p>Un effet d'apprentissage n'est pas une source de puissance, mais un biais à contrôler.<\/p>"}, {"texte_html": "Parce que le test de Mauchly corrige les erreurs de mesure.", "score": -50.0, "feedback_html": "<p>Le test de Mauchly teste la sphéricité ; il ne corrige rien.<\/p>"}, {"texte_html": "Parce qu'on retire du terme d'erreur la variabilité due aux différences entre participants.", "score": 100.0, "feedback_html": "<p>Exact. Les différences individuelles stables ne gonflent plus le bruit.<\/p>"}]}, {"id": "C-CM2-008", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Six participants sont mesurés à quatre moments. Le test de Mauchly donne p = 0,41. Que conclure ?<\/p>", "question_texte": "Six participants sont mesurés à quatre moments. Le test de Mauchly donne p = 0,41. Que conclure ?", "feedback_general_html": "<p>Un test non significatif ne prouve pas H0, surtout avec un petit échantillon : on peut choisir d'appliquer quand même une correction. CM02, section Formalisation, « Tester la sphéricité ».<\/p>", "options": [{"texte_html": "La sphéricité est démontrée ; aucune correction n'est utile.", "score": -20.0, "feedback_html": "<p>Un test non significatif ne prouve pas H0, surtout avec un petit échantillon.<\/p>"}, {"texte_html": "Le test ne rejette pas la sphéricité, mais sa puissance est faible : la sphéricité n'est pas garantie pour autant.", "score": 100.0, "feedback_html": "<p>Exact. On peut alors choisir d'appliquer quand même une correction.<\/p>"}, {"texte_html": "La sphéricité est violée ; il faut renoncer à l'ANOVA.", "score": -50.0, "feedback_html": "<p>p = 0,41 : la sphéricité n'est pas rejetée ; et même rejetée, on corrigerait sans renoncer.<\/p>"}, {"texte_html": "Il faut appliquer la correction de Welch.", "score": -30.0, "feedback_html": "<p>Welch concerne l'homogénéité des variances en groupes indépendants.<\/p>"}]}, {"id": "C-CM2-009", "type": "question", "categorie": "comprehension", "cm": [2], "difficulte": 3, "question_html": "<p>Dans une ANOVA pour plan à mesures répétées SANS facteur inter-sujets, pourquoi l'homogénéité des variances entre groupes N'EST-elle PAS une condition à vérifier ?<\/p>", "question_texte": "Dans une ANOVA pour plan à mesures répétées SANS facteur inter-sujets, pourquoi l'homogénéité des variances entre groupes N'EST-elle PAS une condition à vérifier ?", "feedback_general_html": "<p>Tous les participants passent toutes les conditions : il n'y a pas de groupes indépendants. La condition propre au plan intra-sujet est la sphéricité. CM02, section Formalisation, « Conditions d'application ».<\/p>", "options": [{"texte_html": "Parce que l'ANOVA est robuste.", "score": -50.0, "feedback_html": "<p>La robustesse ne dispense jamais de vérifier une condition ; ici, la condition ne se pose simplement pas.<\/p>"}, {"texte_html": "Parce que le test de Mauchly la vérifie déjà.", "score": -20.0, "feedback_html": "<p>Le test de Mauchly teste la sphéricité, pas l'homogénéité des variances.<\/p>"}, {"texte_html": "Parce que des variances mesurées sur les mêmes personnes sont forcément égales.", "score": -30.0, "feedback_html": "<p>Rien n'oblige les variances des conditions à être égales.<\/p>"}, {"texte_html": "Parce qu'il n'y a pas de groupes indépendants à comparer ; c'est la sphéricité qui prend sa place.", "score": 100.0, "feedback_html": "<p>Exact.<\/p>"}]}, {"id": "C-CM3-004", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Une étude croise deux facteurs inter-sujets : la consigne (avec ou sans pression temporelle) et l'expertise (novices ou experts). La VD est le nombre d'erreurs. Parmi les 4 questions de recherche suivantes, laquelle porte sur l'interaction ?<\/p>", "question_texte": "Une étude croise deux facteurs inter-sujets : la consigne (avec ou sans pression temporelle) et l'expertise (novices ou experts). La VD est le nombre d'erreurs. Parmi les 4 questions de recherche suivantes, laquelle porte sur l'interaction ?", "feedback_general_html": "<p>Il y a interaction quand l'effet d'un facteur dépend du niveau de l'autre. Un effet principal moyenne sur l'autre facteur ; un effet simple le fixe. CM03, section Factoriel, « Effets ».<\/p>", "options": [{"texte_html": "Les experts font-ils moins d'erreurs que les novices, quelle que soit la consigne ?", "score": -50.0, "feedback_html": "<p>« Quelle que soit la consigne » : on moyenne sur l'autre facteur. C'est un effet principal.<\/p>"}, {"texte_html": "L'effet de la pression temporelle est-il le même chez les novices et chez les experts ?", "score": 100.0, "feedback_html": "<p>Exact. On demande si l'effet d'un facteur dépend du niveau de l'autre.<\/p>"}, {"texte_html": "Chez les novices, la pression temporelle augmente-t-elle le nombre d'erreurs ?", "score": -20.0, "feedback_html": "<p>On fixe l'expertise (novices) et on regarde la consigne : c'est un effet simple.<\/p>"}, {"texte_html": "La pression temporelle augmente-t-elle le nombre d'erreurs, tous niveaux d'expertise confondus ?", "score": -30.0, "feedback_html": "<p>« Tous niveaux confondus » : c'est l'effet principal de la consigne.<\/p>"}]}, {"id": "C-CM3-005", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 1, "question_html": "<p>Dans une ANOVA pour plan croisé, l'interaction A × B est significative, ainsi que l'effet principal de A. Comment procéder ?<\/p>", "question_texte": "Dans une ANOVA pour plan croisé, l'interaction A × B est significative, ainsi que l'effet principal de A. Comment procéder ?", "feedback_general_html": "<p>Quand l'interaction est significative, l'effet principal peut masquer des effets simples différents, voire opposés (paradoxe de Simpson). CM03, section Compléments.<\/p>", "options": [{"texte_html": "Interpréter d'abord les effets simples, car l'effet principal de A peut être trompeur.", "score": 100.0, "feedback_html": "<p>Exact. L'effet principal fait la moyenne d'effets simples qui peuvent être différents, voire opposés.<\/p>"}, {"texte_html": "Interpréter l'effet principal de A en priorité, puisqu'il résume l'effet de A.", "score": -20.0, "feedback_html": "<p>Justement, avec une interaction, l'effet de A n'est pas le même selon B : une moyenne le résume mal.<\/p>"}, {"texte_html": "Retirer l'interaction du modèle, puis interpréter les effets principaux.", "score": -30.0, "feedback_html": "<p>On ne retire une interaction du modèle que lorsqu'elle n'est pas significative.<\/p>"}, {"texte_html": "Ignorer l'interaction, qui ne répond pas à la question sur A.", "score": -50.0, "feedback_html": "<p>L'interaction dit précisément comment l'effet de A change selon B : c'est la première chose à interpréter.<\/p>"}]}, {"id": "C-CM3-008", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Dans une université, les filles ont de meilleures notes que les garçons dans chacun des deux départements, mais une moins bonne moyenne sur l'ensemble de l'université. Comment l'expliquer ?<\/p>", "question_texte": "Dans une université, les filles ont de meilleures notes que les garçons dans chacun des deux départements, mais une moins bonne moyenne sur l'ensemble de l'université. Comment l'expliquer ?", "feedback_general_html": "<p>Tous les effets simples vont dans un sens, l'effet principal dans l'autre : c'est le paradoxe de Simpson, dû ici à des effectifs déséquilibrés. CM03, section Compléments.<\/p>", "options": [{"texte_html": "C'est un paradoxe de Simpson : les filles sont surreprésentées dans le département où les notes sont basses.", "score": 100.0, "feedback_html": "<p>Exact. Les effectifs déséquilibrés inversent l'effet global.<\/p>"}, {"texte_html": "C'est une interaction synergique entre le sexe et le département.", "score": -20.0, "feedback_html": "<p>L'effet va dans le même sens dans les deux départements : c'est l'agrégation qui l'inverse, pas une interaction.<\/p>"}, {"texte_html": "C'est une violation de l'homogénéité des variances.", "score": -30.0, "feedback_html": "<p>Le phénomène porte sur les moyennes, pas sur les variances.<\/p>"}, {"texte_html": "C'est une erreur de type I due à la multiplication des comparaisons.", "score": -50.0, "feedback_html": "<p>Le phénomène s'explique par la composition des départements, pas par le hasard des tests.<\/p>"}]}, {"id": "C-CM3-009", "type": "question", "categorie": "comprehension", "cm": [3], "difficulte": 2, "question_html": "<p>Le produit A fait baisser la température de 1 °C, le produit B de 2 °C. Donnés ensemble, ils la font baisser de 5 °C. Comment qualifier cette situation ?<\/p>", "question_texte": "Le produit A fait baisser la température de 1 °C, le produit B de 2 °C. Donnés ensemble, ils la font baisser de 5 °C. Comment qualifier cette situation ?", "feedback_general_html": "<p>Sans interaction, la baisse serait de 1 + 2 = 3 °C. Une baisse plus forte que la somme des effets indique une interaction synergique ; plus faible, une interaction antagoniste. CM03, section Factoriel, « Interaction ».<\/p>", "options": [{"texte_html": "Absence d'interaction : les effets s'additionnent.", "score": -20.0, "feedback_html": "<p>Sans interaction, la baisse serait de 1 + 2 = 3 °C, pas de 5 °C.<\/p>"}, {"texte_html": "Interaction synergique.", "score": 100.0, "feedback_html": "<p>Exact. L'effet combiné dépasse la somme des effets.<\/p>"}, {"texte_html": "Interaction antagoniste.", "score": -30.0, "feedback_html": "<p>Une interaction antagoniste donnerait une baisse plus faible que la somme des effets.<\/p>"}, {"texte_html": "Paradoxe de Simpson.", "score": -50.0, "feedback_html": "<p>Le paradoxe de Simpson concerne l'inversion d'un effet à l'agrégation, pas la combinaison de deux effets.<\/p>"}]}, {"id": "C-CM4-002", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Une étude compare quatre groupes de même effectif. Quelle paire de contrastes est orthogonale ?<\/p>", "question_texte": "Une étude compare quatre groupes de même effectif. Quelle paire de contrastes est orthogonale ?", "feedback_general_html": "<p>Avec des effectifs égaux, deux contrastes sont orthogonaux si la somme des produits de leurs coefficients est nulle. CM04, section Contrastes, « Contrastes orthogonaux ».<\/p>", "options": [{"texte_html": "(1, −1, 0, 0) et (1, 0, −1, 0)", "score": -20.0, "feedback_html": "<p>1 × 1 + (−1) × 0 + 0 × (−1) + 0 × 0 = 1 : pas nul.<\/p>"}, {"texte_html": "(1, 0, 0, −1) et (1, 1, 1, −3)", "score": -50.0, "feedback_html": "<p>1 + 0 + 0 + 3 = 4 : pas nul.<\/p>"}, {"texte_html": "(1, 1, −1, −1) et (1, 0, −2, 1)", "score": -30.0, "feedback_html": "<p>1 + 0 + 2 − 1 = 2 : pas nul.<\/p>"}, {"texte_html": "(1, 1, −1, −1) et (1, −1, 0, 0)", "score": 100.0, "feedback_html": "<p>Exact. 1 − 1 + 0 + 0 = 0.<\/p>"}]}, {"id": "C-CM4-003", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Un chercheur examine les moyennes de ses quatre groupes. Il remarque que deux d'entre elles semblent plus élevées et décide alors de tester un contraste opposant ces deux groupes aux deux autres. Que dire de cette démarche ?<\/p>", "question_texte": "Un chercheur examine les moyennes de ses quatre groupes. Il remarque que deux d'entre elles semblent plus élevées et décide alors de tester un contraste opposant ces deux groupes aux deux autres. Que dire de cette démarche ?", "feedback_general_html": "<p>Un contraste traduit une hypothèse formulée avant l'analyse. Choisi après avoir regardé les moyennes, il devient une comparaison post-hoc, qui demande une correction adaptée. CM04, section Contrastes.<\/p>", "options": [{"texte_html": "Elle est correcte : un contraste peut être choisi à tout moment de l'analyse.", "score": -30.0, "feedback_html": "<p>Un contraste traduit une hypothèse formulée avant de voir les données.<\/p>"}, {"texte_html": "Elle est correcte, à condition que le contraste soit orthogonal aux autres.", "score": -20.0, "feedback_html": "<p>L'orthogonalité ne règle pas le problème : le contraste a été choisi en regardant les moyennes.<\/p>"}, {"texte_html": "Il s'agit en réalité d'une comparaison <em>post-hoc<\/em> (qui a été choisie après coup), qui demande une correction adaptée.", "score": 100.0, "feedback_html": "<p>Exact. Choisi après avoir vu les moyennes, le contraste devient une comparaison post-hoc.<\/p>"}, {"texte_html": "Il faut remplacer ce contraste par un contraste polynomial.", "score": -50.0, "feedback_html": "<p>Un contraste polynomial suppose des groupes ordonnés et régulièrement espacés ; il ne répond pas à la question.<\/p>"}]}, {"id": "C-CM4-004", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans quelle situation le choix entre les sommes des carrés de type I, II et III peut-il modifier les résultats ?<\/p>", "question_texte": "Dans quelle situation le choix entre les sommes des carrés de type I, II et III peut-il modifier les résultats ?", "feedback_general_html": "<p>Les trois types sont équivalents pour une ANOVA simple et pour un plan équilibré. Le choix ne compte que pour les plans croisés ou mixtes déséquilibrés. CM04, section Compléments.<\/p>", "options": [{"texte_html": "Une ANOVA simple avec des groupes d'effectifs différents.", "score": -20.0, "feedback_html": "<p>Avec un seul facteur, les trois types sont équivalents, même si les effectifs diffèrent.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé avec des groupes d'effectifs différents.", "score": 100.0, "feedback_html": "<p>Exact. La question ne se pose que pour les plans croisés ou mixtes déséquilibrés.<\/p>"}, {"texte_html": "Une ANOVA pour plan croisé avec des groupes de même effectif.", "score": -30.0, "feedback_html": "<p>Dans un plan équilibré, les trois types donnent les mêmes résultats.<\/p>"}, {"texte_html": "Dans aucune situation : les trois types donnent toujours les mêmes résultats.", "score": -50.0, "feedback_html": "<p>Ils diffèrent dans les plans croisés ou mixtes déséquilibrés.<\/p>"}]}, {"id": "C-CM4-007", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 1, "question_html": "<p>Avec trois groupes, lequel de ces ensembles de coefficients NE DÉFINIT PAS un contraste ?<\/p>", "question_texte": "Avec trois groupes, lequel de ces ensembles de coefficients NE DÉFINIT PAS un contraste ?", "feedback_general_html": "<p>Un contraste est une combinaison de moyennes dont les coefficients ont une somme nulle. CM04, section Contrastes, « Formalisation ».<\/p>", "options": [{"texte_html": "(1, −1, 0)", "score": -30.0, "feedback_html": "<p>1 − 1 + 0 = 0 : c'est un contraste.<\/p>"}, {"texte_html": "(2, −1, −1)", "score": -20.0, "feedback_html": "<p>2 − 1 − 1 = 0 : c'est un contraste.<\/p>"}, {"texte_html": "(1, −2, 1)", "score": -50.0, "feedback_html": "<p>1 − 2 + 1 = 0 : c'est un contraste.<\/p>"}, {"texte_html": "(1, 1, −1)", "score": 100.0, "feedback_html": "<p>Exact. 1 + 1 − 1 = 1 : la somme n'est pas nulle.<\/p>"}]}, {"id": "C-CM4-008", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>On compare quatre types de groupes témoins, dans l'ordre <em>Rien<\/em>, <em>Attente<\/em>, <em>Actif<\/em>, <em>TAU<\/em>. Quels coefficients permettent de comparer le groupe <em>Actif<\/em> à la moyenne des groupes <em>Rien<\/em> et <em>TAU<\/em> ?<\/p>", "question_texte": "On compare quatre types de groupes témoins, dans l'ordre *Rien*, *Attente*, *Actif*, *TAU*. Quels coefficients permettent de comparer le groupe *Actif* à la moyenne des groupes *Rien* et *TAU* ?", "feedback_general_html": "<p>Le groupe <em>Actif<\/em> (3e position) reçoit −2, les groupes <em>Rien<\/em> et <em>TAU<\/em> reçoivent 1, le groupe <em>Attente<\/em> 0 ; la somme est nulle. CM04, section Contrastes.<\/p>", "options": [{"texte_html": "(1, 0, 0, −1)", "score": -50.0, "feedback_html": "<p>Ce contraste compare <em>Rien<\/em> et <em>TAU<\/em> entre eux.<\/p>"}, {"texte_html": "(1, 1, −1, −1)", "score": -30.0, "feedback_html": "<p>Ce contraste oppose les deux premiers groupes aux deux derniers.<\/p>"}, {"texte_html": "(1, 0, −2, 1)", "score": 100.0, "feedback_html": "<p>Exact. <em>Actif<\/em> reçoit −2, <em>Rien<\/em> et <em>TAU<\/em> reçoivent 1, <em>Attente<\/em> 0 ; la somme est nulle.<\/p>"}, {"texte_html": "(0, 1, −2, 1)", "score": -20.0, "feedback_html": "<p>Ce contraste compare <em>Actif<\/em> à la moyenne d'<em>Attente<\/em> et de <em>TAU<\/em>.<\/p>"}]}, {"id": "C-CM4-009", "type": "question", "categorie": "comprehension", "cm": [4], "difficulte": 2, "question_html": "<p>Dans un plan à 5 groupes, combien de contrastes mutuellement orthogonaux peut-on définir au plus ?<\/p>", "question_texte": "Dans un plan à 5 groupes, combien de contrastes m
